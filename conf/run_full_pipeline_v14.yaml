# Base Hydra config for run_full_pipeline_v14.py

# Prevent Hydra from changing working directory (so relative paths work)
defaults:
  - _self_

hydra:
  job:
    chdir: false

# Path to YAML/JSON scenario file.
# Override on the CLI, e.g.:
#   python run_full_pipeline_v14.py config=scenarios/example_a.yaml
config: ""

# Pre-flight schema validation mode.
#   strict : run schema_guard before evaluation
#   off    : skip schema_guard
validation_mode: strict

# Modules to validate in schema_guard.
# You can override as either:
#   validation_modules=cashflow,debt
# or:
#   validation_modules=[cashflow,debt]
validation_modules: null

# Where to write release/smoke artifacts (relative to repo root).
# Override on the CLI, e.g.:
#   python run_full_pipeline_v14.py export_dir=_out/release_run
export_dir: _out/run_full_pipeline_v14

# If true, write summary.json + (optional) annual_rows.csv, kpis.json, debt_result.json
# Set to false for dev/debugging to skip file I/O.
write_artifacts: true

# ---------------------------------------------------------------------------
# #735 slice-2: opt-in run-scoping (OFF by default → byte-identical).
# When run_scoped is true, EVERY artifact of this run — the JSON/CSV dump and
# the four optional report/workbook emitters below — is grouped under a per-run
# subdirectory '<export_dir>/<run_id>' (routed via
# analytics.output_paths.resolve_output_dir), so successive runs do not
# overwrite each other. Default false leaves the export_dir root unchanged, so
# committed-scenario output stays byte-identical. run_id names the subdirectory;
# when null it defaults to analytics.output_paths.default_run_id()
# (v<engine_version>_<git_sha12>, MRM-02 provenance). Ignored when run_scoped
# is false.
# ---------------------------------------------------------------------------
run_scoped: false
run_id: null

# ---------------------------------------------------------------------------
# #683 (a): CLI-overridable wind-resource knobs (OFF by default).
# A mapping deep-merged onto the scenario's `resource` block, so knobs already
# drivable in the scenario YAML — the IEC 61400-15-2 uncertainty budget / P50
# haircut and the air-density corrections — can also be set from the CLI without
# editing the committed scenario. Null (default) is a no-op: the original
# scenario path flows through byte-identically. Example:
#   python run_full_pipeline_v14.py config=scenarios/dutchbay_lendercase_2025Q4.yaml \
#       'resource_overrides={uncertainty:{p50_haircut_pct:0.03},wind:{air_density_site_kgm3:1.12}}'
# ---------------------------------------------------------------------------
resource_overrides: null

# ---------------------------------------------------------------------------
# Sprint 19 W.6: Wind→Finance integration (OFF by default).
# Setting neither wind_assessment_json nor wind_auto_orchestrate preserves
# the pre-Sprint-19 behaviour exactly. See run_full_pipeline_v14.py docstring
# for the full design (two-CLI topology, three adapter modes, frozen-export
# contract).
# ---------------------------------------------------------------------------

# Path to a frozen wind-export JSON (produced by scripts/run_wind_analysis_v14.py).
# When set, the finance run consumes this export via wind_resource.cashflow_adapter.
# Mutually exclusive with wind_auto_orchestrate: an explicit path always wins.
wind_assessment_json: null

# If true AND wind_assessment_json is null, subprocess scripts/run_wind_analysis_v14.py
# to mint a fresh frozen export before the finance run. Requires the [wind] extra.
# Default false — lender-grade runs should consume an audited frozen export.
wind_auto_orchestrate: false

# Adapter merge mode: 'overwrite' | 'fill_if_absent' | 'validate_only'
# See wind_resource.cashflow_adapter module docstring for semantics.
adapter_mode: fill_if_absent

# Acceptable symmetric relative drift (percent) between wind-derived and YAML
# values in fill_if_absent and validate_only modes.
wind_tolerance_pct: 0.5

# P-level selector for the wind export ('P50' | 'P75' | 'P90').
# Must match the scenario field of the export JSON.
wind_export_scenario: P75

# ---------------------------------------------------------------------------
# W4 (#614): Solar→Finance integration (OFF by default).
# Leaving solar_assessment_json null skips solar entirely and preserves
# behaviour exactly. Frozen-export ONLY: there is no solar auto-orchestrate
# analogue and compute_solar_aep is never called at finance time — the finance
# path stays pvlib-free (the offline physics freeze happens once behind the
# [solar] extra). Solar chains AFTER any wind patch, patching the per-tech
# generation.technologies.<tech> block and re-blending project.capacity_factor,
# with semantics matching app/services/pipeline_service.run_integrated_case.
# See run_full_pipeline_v14.py docstring for the full design.
# ---------------------------------------------------------------------------

# Path to a frozen solar-export JSON (the serialized output of
# solar_resource.cashflow_adapter.build_solar_cashflow_export). When set, the
# finance run consumes this export via solar_resource.cashflow_adapter.
solar_assessment_json: null

# Solar adapter merge mode: 'overwrite' | 'fill_if_absent' | 'validate_only'
# See solar_resource.cashflow_adapter module docstring for semantics.
solar_adapter_mode: fill_if_absent

# Acceptable symmetric relative drift (percent) between solar-derived and YAML
# per-tech values in fill_if_absent and validate_only modes.
solar_tolerance_pct: 0.5

# P-level selector for the solar export ('P50' | 'P75' | 'P90').
# Must match the scenario field of the export JSON (producer is deterministic P50).
solar_export_scenario: P50

# The generation.technologies key the solar export targets.
solar_technology: solar

# ---------------------------------------------------------------------------
# #656 (slice 3): single-scenario Executive Workbook emission (OFF by default).
# When true, after a successful finance run this CLI writes a lender-facing
# .xlsx via analytics.executive_workbook.emit_executive_workbook_from_pipeline
# (the genuine live caller of build_executive_workbook). The five finance
# sheets are assembled from the pipeline result; the optional "ResourceTrend"
# sheet is added only when a supplied frozen wind export carries a
# long_term_trend block. No live ERA5 is run (the finance CLI stays cdsapi-free).
# Emission derives no financial value, so leaving this off keeps committed
# scenarios byte-identical.
# ---------------------------------------------------------------------------

# If true, write the single-scenario Executive Workbook after the finance run.
emit_executive_workbook: false

# Target .xlsx path. When null, defaults to
# '<export_dir>/executive_workbook.xlsx'. The written path is echoed back under
# result['executive_workbook_path'].
executive_workbook_path: null

# ---------------------------------------------------------------------------
# #779: capital-risk (Monte-Carlo) report emission (OFF by default).
# When true, after a successful finance run this CLI runs the CANONICAL MC
# (analytics.mc.engine — LHS + Iman-Conover, with monte_carlo.allow_toy_fallback
# forced false so a failed trial raises rather than fabricating a toy metric)
# over a BOUNDED trial count and renders a lender HTML report carrying the
# capital-risk section, via app.reports.capital_risk_emit. It is heavy (each
# trial is a full v14 evaluation), so it lives in this batch path only — never
# the synchronous HTTP report route. Emission derives no committed KPI, so
# leaving this off keeps committed scenarios byte-identical.
# ---------------------------------------------------------------------------

# If true, render the capital-risk lender report after the finance run.
emit_capital_risk_report: false

capital_risk_report:
  # Bounded, report-appropriate trial count (NOT the scenario's 100k
  # monte_carlo.n_scenarios). Each trial is a full evaluation. A lender-grade
  # floor is enforced (app.reports.capital_risk_emit.LENDER_GRADE_MIN_TRIALS =
  # 1000): setting n_trials below it fails loud rather than emitting a VaR/CVaR
  # number off a statistically inadequate tail.
  n_trials: 2000
  # MC seed. When null, defaults to the scenario's monte_carlo.seed.
  seed: null
  # NPV bucket the distribution chart plots ('equity_npv' | 'project_npv').
  npv_metric: equity_npv
  # Target .html path. When null, defaults to
  # '<export_dir>/capital_risk_report.html'. The written path is echoed back
  # under result['capital_risk_report_path'].
  path: null
