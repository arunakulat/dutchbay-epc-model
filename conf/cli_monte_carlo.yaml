# Hydra config for the Monte Carlo analysis CLI.
# Used by: analytics/cli/cli_monte_carlo_hydra.py (the canonical entrypoint).
#
# Only the keys below are read by the CLI. The stochastic distributions are NOT
# defined here — the engine reads them from the scenario's `monte_carlo.parameters`
# block (analytics.mc.engine), so this file deliberately carries no decorative
# stochastic_params / output_metrics / parallel knobs.

defaults:
  - _self_

hydra:
  job:
    chdir: false

# Path to the scenario config file (required).
# Override: config=scenarios/dutchbay_lendercase_2025Q4.yaml
config: ""

# Output directory for Monte Carlo results.
output_dir: _out/monte_carlo

# #735 slice-2: opt-in run-scoping (OFF by default → byte-identical).
# When run_scoped is true, artifacts are grouped under a per-run subdirectory
# '<output_dir>/<run_id>' (routed via analytics.output_paths.resolve_output_dir).
# run_id defaults to analytics.output_paths.default_run_id() when null. Default
# false leaves output_dir unchanged.
run_scoped: false
run_id: null

# Write artifacts to disk.
write_artifacts: true

# Number of Monte Carlo trials (larger = more accurate distribution, slower).
n_trials: 10000

# Random seed for reproducibility (same seed + same config = identical results).
seed: 42
