# Blue Whale Lot 5B: battery options for the SEPARATE 9.5 MW wind project (no solar).
#
# Read by scripts/run_blue_whale_wind_bess_options_v14.py (Hydra, one JSON object on stdout:
# CLI-01, CLI-03) and analytics.wind.wind_bess_options (strict: every key below is required and
# unknown keys are refused; FRAMEWORK-02). Every evaluation goes through
# analytics.evaluation_v14.evaluate_with_overrides on the wind scenario (ARCH-04).
#
# Owner direction, 2026-11-14 (project thread):
#   - "solve for the 9.5 wind (wind+BESS only without solar)";
#   - a battery is needed only for "a ramping, black start function suitable for the turbine"
#     ("it is not mandatory");
#   - the battery is charged by the turbine off-peak, losing the wind income on that energy, and
#     is paid at peak on the solar + BESS terms; the rate is "a whole wind peak rate".
# The 40 MW AC black-start battery the owner reported is UNCONFIRMED: it comes from PUCSL
# discussions only, with no document, and is recorded here as such, not as a requirement.
#
# REGULATORY STANDING. PUCSL's approved BESS feed-in tariff names ground-mounted and floating
# solar PV only (Table 7 below). No wind + BESS tariff exists. Every revenue basis below is a
# WORKING ASSUMPTION built from the solar + BESS formula, for screening only.
#
# The 10 MW limit stays the open legal question of conf/blue_whale_pucsl_fit_2026.yaml.

defaults:
  - _self_
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled

schema_version: blue_whale_wind_bess_options_v1
scenario: scenarios/blue_whale_wind_lot5b_2026.yaml
retrieved: "2026-11-14"

sources:
  PUCSL-FIT-DECISION-2026-08:
    title: "Decision on Feed in Tariffs Effective from August 25, 2026"
    publisher: "Public Utilities Commission of Sri Lanka"
    url: "https://www.pucsl.gov.lk/wp-content/uploads/2026/08/Full-Final-Decision-on-Feed-in-Tariffs-August-2026.pdf"
    pdf_sha256: "1151efd22a797eca174d06c1b1c6af9380193a8ecba121362bbf9a5879f16c45"
    read_with: "markitdown (R26)"
    verbatim:
      - "Table 7: Approved FIT for Power Plants with BESS ... Ground Mounted Solar PV 47.08 3.02 18.00 2.72"
      - "Table 7 ... Floating Solar PV 53.28 4.36 23.58 3.92"
      - "s.3.3: The approved tariffs are applicable for 'Ground Mounted Solar PV' and 'Floating Solar PV' plants combined with BESS."
      - "s.2.2.3.5: The Commission has considered a BESS round trip efficiency of 90% for systems coupled to power plants"
      - "Table 7 note [1]: The non-escalable component is required to be adjusted once after 12 months from the SPPA signing date, in accordance with Clause 3.1 of the Methodology."
      - "Table 7 note [2]: Prioritized Feed in Time tariff above is applicable only for the first 15 years of the SPPA."
      - "s.3.3: This is set as 1730h to 2130h with this tariff review."
    note: "Table 6's higher BESS components (30.27 and 33.51 LKR/kWh) are for PROSUMERS and are not used."
  CEB-WIND-GRID-2000:
    title: "Addendum to the Guide for grid interconnection of embedded generators (December 2000) - Wind"
    publisher: "Ceylon Electricity Board"
    url: "https://www.ceb.lk/front_img/tender_pdf/201118141115Addendum_to_the_Guide_for_grid_interconnection_of_embedded_generators_(December_2000)_Wind.pdf"
    pdf_sha256: "38d018218db2254e82ba6cc7e0cdd91cef2b27e4a3c17c24d16852bdc6af6012"
    read_with: "markitdown (R26)"
    verbatim:
      - "s.3.1: The wind farm shall provide the necessary controlling facility to limit the out put variation of the wind farm by incorporating necessary controls to individual wind turbines."
      - "s.3.1: The ramp rate will be defined for the grid substation and shall not exceed 10 MW/minute. The ramp rates applicable for individual wind farms will be distributed in terms of their installed capacity."
      - "s.3.1 (a): If the wind farm capacity is equal or greater than 5 MW."

tariff:
  # The wind tariff and its components are the scenario's (Annex 2 wind 20.80 + 4.93); the
  # parser checks they agree with scenarios/blue_whale_wind_lot5b_2026.yaml.
  wind_lkr_per_kwh: 25.73
  wind_components: [20.80, 4.93]
  solar_bess_priority_components: [47.08, 3.02]   # PUCSL-FIT-DECISION-2026-08 Table 7, ground mounted
  solar_bess_other_components: [18.00, 2.72]      # the standalone ground-solar rate (R_charging)
  floating_priority_components: [53.28, 4.36]     # Table 7, floating: a cross-check only
  floating_other_components: [23.58, 3.92]
  pucsl_round_trip_efficiency: 0.90               # s.2.2.3.5
  # BESS component = priority - other / RTE, per component (methodology s.5.1.2). The parser
  # derives it from both Table 7 lines and refuses a gap above this tolerance.
  component_check_tolerance_lkr_per_kwh: 0.01
  contract_years: 15                              # Table 7 note [2]
  # Table 7 note [1]: one adjustment after 12 months (70% LKR/USD, 30% CCPI). Applied as a
  # SENSITIVITY with one year of the scenario's own FX and CCPI paths (tariff.om_indexation).
  one_time_adjustment_weights: {lkr_usd: 0.70, ccpi: 0.30}

revenue_bases:
  # The base basis is the owner's "whole wind peak rate" (2026-11-14 22:00Z): the solar + BESS
  # formula with the wind tariff as R_charging. A discharged kWh earns it; a charged kWh forgoes
  # the wind tariff. The others are sensitivities.
  base: whole_wind_peak_rate
  sensitivities: [stacked, whole_wind_peak_rate_on_all_window_exports]

window:
  # The Prioritized Feed-in Time, 17:30-21:30 Asia/Colombo (UTC+05:30) = 12:00-16:00 UTC. The
  # hourly reference is in UTC, so the window is these whole UTC hours.
  utc_hours: [12, 13, 14, 15]

limits:
  # Readings of the 10 MW standardised-PPA limit for a battery on the wind plant.
  standardised_ppa_mw: 10.0
  readings:
    B: {export_cap_mw: 10.0}   # wind + battery discharge at most 10 MW at the connection point
    C: {export_cap_mw: null}   # the battery has its own export allowance (outside the 10 MW)
  # Reading A (turbine + battery power at most 10 MW) is reported per option as a flag.

profile:
  # Hourly turbine output for dispatch only (the engine keeps the scenario's own energy). Public
  # inputs only: the NASA POWER hourly reference at the turbine point (pins and layout from
  # conf/blue_whale_met_mast_transfer.yaml reference.points.turbine), the committed shear and
  # long-term mean of docs/blue_whale/met_mast_transfer_summary.json, and a GENERIC Cp-limited
  # power curve (no OEM curve value) whose Cp is tuned so the gross capacity factor equals the
  # committed gross CF. A shape for charge availability and export headroom, not a yield.
  reference_config: conf/blue_whale_met_mast_transfer.yaml
  reference_point: turbine
  transfer_summary: docs/blue_whale/met_mast_transfer_summary.json
  reference_height_m: 50.0
  hub_height_m: 130.0
  rotor_diameter_m: 206.0
  rated_mw: 9.5
  air_density_kgm3: 1.15
  cut_in_ms: 3.0
  cut_out_ms: 25.0
  # #1530's losses (scenario comment): availability 97% and curtailment 2% are time losses;
  # electrical 2% and other 1% are power losses at the connection point.
  power_loss_fractions: [0.02, 0.01]

battery:
  # PUCSL methodology s.5.1.1 / s.5.2.1: 4 h at nominal capacity. Recorded, not read: revenue is
  # paid per delivered kWh, and an option that keeps the black-start reserve delivers under 4 h at
  # its nameplate power (see the doc's "Tariff duration" note).
  duration_h_for_tariff: 4.0
  usd_per_kwh: {low: 129.13, mode: 140.74, high: 202.51}   # conf/blue_whale_pv_bess_pricing.yaml bess
  om_usd_per_dc_kwh_year: 1.80    # input B20 (#1646 basis), LKR-denominated at the scenario FX
  dc_per_nominal: 1.1             # input B20 placeholder
  round_trip_efficiency: 0.85     # repository value; every loss booked on charge
  # ASSUMPTION (as the held 0.5 MW / 0.5 MWh option): the energy a battery must keep to
  # black-start the turbine. A cycled option never discharges for revenue below it, so it keeps
  # the function after the evening window. The firming unit keeps this plus its down-ramp energy.
  black_start_reserve_mwh: 0.5

options:
  # power_mw / energy_mwh; operation: cycled (daily, 4 h, earns the peak rate) or held (kept for
  # black start only, never cycled for revenue). ASSUMPTION: about 0.5 MW of
  # grid-forming inverter is the floor for black-starting the turbine (auxiliaries and a soft,
  # voltage-ramped transformer energisation); no OEM figure is in the repository.
  - {name: held_0_5_0_5, power_mw: 0.5, energy_mwh: 0.5, operation: held}
  - {name: held_1_1, power_mw: 1.0, energy_mwh: 1.0, operation: held}
  - {name: cycled_0_5_2, power_mw: 0.5, energy_mwh: 2.0, operation: cycled}
  - {name: cycled_1_4, power_mw: 1.0, energy_mwh: 4.0, operation: cycled}
  - {name: cycled_2_5_10, power_mw: 2.5, energy_mwh: 10.0, operation: cycled}
  - {name: cycled_10_40, power_mw: 10.0, energy_mwh: 40.0, operation: cycled}   # the owner's "10/40" reading of the UNCONFIRMED 40 MW figure

down_ramp:
  # CEB-WIND-GRID-2000 s.3.1 shares 10 MW/min per substation by installed capacity. Whether a
  # wind lull counts is not stated. The worst case a battery would have to firm: a full drop
  # from rated at the allocated rate needs rated power and rated^2 / (2 x rate) MW-min. The
  # allocation is the NSO's; these are illustrative, not inputs to any KPI.
  substation_limit_mw_per_min: 10.0
  illustrative_other_wind_mw: [0.0, 90.0]
  # The firming unit for the LARGEST illustrative case: rated power and the worst-case energy
  # above. It would also serve black start, so it replaces the options above rather than adding
  # to them. Priced from a generic battery supplier's budgetary offer (CIF, excluding duty and
  # taxes, priced for many sites; published without naming the supplier on the owner's approval
  # of 2026-11-14 22:16Z). The offer is a flat rate per DC kWh split into lines, so its AC line is
  # an allocation, not a cost.
  supplier:
    offer_usd_per_dc_kwh: 90.0009          # whole offer over DC installed energy
    dc_block_usd_per_dc_kwh: 72.6308       # the offer's battery (DC) line over DC installed energy
    ac_skid_usd: 229072.36                 # one PCS + MV transformer skid
    ac_skid_mw: 10.0                       # about 10 MW per skid (rounded)
    ems_usd: 41126.89                      # SCADA and EMS, per site
    install_transport_share: 0.072450      # installation guidance, commissioning and CIF transport
    # ASSUMPTION (generic, not from any offer): long-term service and maintenance at 2% of CIF a year.
    service_share_of_cif_per_year: 0.02
    usable_per_dc: 0.91                    # usable at the connection point per DC kWh (rounded)
    smallest_block_dc_mwh: 20.0            # the smallest DC block offered with one skid, about 0.5C (rounded)
    # ASSUMPTION: 9.5 MW from under 1 MWh is about 11C, beyond the offered energy cells; a
    # power-cell premium on the DC rate brackets it. No supplier has quoted such a unit.
    power_cell_premium: [1.0, 3.0]
    # Landed all-in = CIF x battery.usd_per_kwh.mode / (offer_usd_per_dc_kwh / usable_per_dc), the
    # offer per usable kWh from the rounded usable fraction (owner decision, 2026-11-15): duties,
    # BoP, EPC margin, augmentation reserve and land as in the repository's mode.

monte_carlo:
  seed: 20261101
  n_trials: 256
  sampler: lhs
  rte: {low: 0.82, high: 0.88}
  residual_fade: {low: 0.0, mode: 0.0, high: 0.02}
  wind_yield_sigma: 0.132          # the scenario's 1-sigma P50 uncertainty (met-mast summary)
  rte_grid: [0.80, 0.82, 0.835, 0.85, 0.865, 0.88, 0.90]

output:
  summary_json: null               # docs/blue_whale/wind_bess_options_summary.json when committing

hydra:
  run:
    dir: .
  sweep:
    dir: .
    subdir: .
  job:
    chdir: false
  output_subdir: null
