    open_questions:
      - "Whether PUCSL would offer any storage tariff to a wind plant. Until it does, every figure on this basis is screening only."
  pucsl_fit_2026_wind_solar_blended_hybrid:
    status: analogy_unpublished
    lkr_per_kwh: 24.97345
    components_lkr_per_kwh: [20.377179, 4.596271]
    instrument: "Energy-weighted blend of PUCSL Decision on Feed in Tariffs, effective from 25 August 2026, Annex 2 s.1 Wind (25.73) and Ground Mounted Solar PV other-period (20.72) rates"
    clause: "Annex 2 s.1 [Power Plants]: Wind 20.80 4.93 and Ground Mounted Solar PV 18.00 2.72, blended on the scenario's 9.5 MW wind (CF 0.487560) and 5.0 MW AC solar + BESS unit export (CF 0.164771)"
    source: PUCSL-ANNEX2-2026-08
