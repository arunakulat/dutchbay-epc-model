    effective_from: "2026-08-25"
    effective_from_source: PUCSL-DECISION-2026-08
    effective_to: null
    review: "until the next tariff revision"
    review_source: PUCSL-DECISION-2026-08
    conditions:
      - "Applies only to an SPPA signed on or after 25 August 2026 (Decision Annex 3 s.7(d)). The effective window governs the SPPA signing date, not the operating period."
      - "The non-escalable component is adjusted once, 12 months after SPPA signing, for LKR/USD (70%) and CCPI (30%) (Annex 2 note; Methodology s.3.1). The model does not apply this adjustment."
