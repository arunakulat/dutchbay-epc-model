      - "Applies the two-part PUCSL Annex 2 component rates as an energy-weighted single generation tariff for the engine, while bess_1 adds the 29.38 LKR/kWh priority-window premium for 15 years."
    open_questions:
      - "Standardised-PPA eligibility: the combined 14.5 MW plant exceeds the 10 MW standardised-PPA threshold under the Electricity Act No. 36 of 2024 s.11(3) and s.52 unless the limit applies separately per technology (conf/blue_whale_pucsl_fit_2026.yaml, standardised_ppa_limit)."
