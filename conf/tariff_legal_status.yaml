      - "Standardised-PPA eligibility: the Electricity Act No. 36 of 2024 s.11(3) caps standardised PPAs at 10 MW on a cumulative basis per contiguous location. Whether other capacity on the same location counts against that cap is open (conf/blue_whale_pucsl_fit_2026.yaml, standardised_ppa_limit)."
