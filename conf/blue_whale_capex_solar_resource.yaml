  EMBER-2025-12-11:
    title: "How cheap is battery storage?"
    publisher: "Ember (Kostantsa Rangelova, Dave Jones)"
    published: "2025-12-11"
    url: "https://ember-energy.org/app/uploads/2025/12/How-cheap-is-battery-storage.pdf"
    pdf_sha256: "9c9b0d12a78c36d4f05bcb49d5c80be91d5411c059114809aa656fa33c2dcfeb"
    read_with: "markitdown (R26)"
    verbatim:
      - "Core equipment - mainly the BESS enclosures, the Power Conversion System (PCS) and the Energy Management System (EMS) - costs around $75/kWh when delivered from China, for countries with low import duties. This cost is per unit of usable battery capacity."
      - "Manufacturers typically oversize the installed capacity by at least 10%"
      - "The enclosures account for close to 90% of the $75/kWh core equipment cost for long duration projects, with PCS and EMS costs making up around 10%."
      - "The EPC services and grid connection required to turn this equipment into an operational project can vary widely, but typically costs around $50 /kWh."
      - "The Tabuk and Hail projects awarded equipment supply contracts in August 2025 of $179-183 million for 2.45 GWh each, or just $73-75/kWh. The EPC contracts added another $116-118 million, or $47-48/kWh."
