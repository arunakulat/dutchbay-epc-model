  SOOCHOW-2026-07-24:
    title: "短期招标承压，看好“十五五”两海成长空间——风电2026年中期策略报告 (Wind power 2026 mid-year strategy report)"
    publisher: "Soochow Securities (东吴证券研究所), analyst 曾朵红; data CWEA, company announcements"
    published: "2026-07-24"
    url: "https://pdf.dfcfw.com/pdf/H3_AP202607241827319006_1.pdf"
    pdf_sha256: "6dec7f6feba6eac27d0d9591178943fea54f433b861cb3bc7bd2136b676feebe"
    read_with: "markitdown (R26)"
    verbatim:
      - "我国风机企业出口至类中国市场价格约2000~3000元/kW（含运费、5年质保，不含长期维护）"
      - "类中国市场主要包括东南亚、中亚、印度、中东及拉美等"
      - "单价 元/kW 3000 2800 2700 2700 2600 2500 2400 2300 [2023, 2024, 2025, 2026E, 2027E, 2028E, 2029E, 2030E]"
      - "陆风机组（含塔筒）单价分别为1822、2128元/kW [25年11、12月份]"
      - "预计26年陆风风机投标价保持稳定"
    note: >-
      Export price to "China-like" markets (South-East Asia, Central Asia, India, the Middle East,
      Latin America), including freight and a 5-year warranty, excluding long-term maintenance.
      Whether the tower is in scope is not stated. The domestic onshore figures (with tower)
      include Chinese VAT and are recorded for comparison only.
