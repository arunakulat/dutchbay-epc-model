# Blue Whale Lot 5B (PR 6): the wind and BESS capex blend, and the solar resource at the site.
#
# Read by scripts/run_blue_whale_capex_solar_resource_v14.py (Hydra, one JSON object on stdout:
# CLI-01, CLI-03) through solar_resource.blue_whale_site_inputs. Every key is required and an
# unknown key is refused (FRAMEWORK-02). DATA-01: every external figure is frozen here with its
# source, date and the figure as the source states it ("verbatim"). A value marked ASSUMPTION has
# no source of its own; its basis is stated.
#
# Work item: https://github.com/arunakulat/dutchbay-epc-model/issues/1353#issuecomment-6556975196
# Owner decisions, quoted verbatim from that record:
#   Request: "in the next step, search for the latest CAPEX figures for Wind and BESS from RAG and
#   EPC corpus (Mannar, Mullikulam, NSO BESS tender, and Kalpitiya) interpolate with China FOB
#   pricing from a deep web search, indicate the solar efficacy and strength at the Blue Whale
#   location (provide references for the pvlab or any other process through which these numbers
#   are obtained) and update all YAML occasions in the Blue Whale Scenario"
#   Private-price handling: "Derived blend may publish"
#
# PRIVATE ANCHORS. Anchors marked `kind: private` come from the private repository
# arunakulat/DutchBay_RAG. Their values are NOT in this file or anywhere in this repository. The
# CLI reads them at run time from a file outside the repository (private_anchors_path) and
# publishes only the blended results. The handling notes that govern them are cited by identifier.

schema_version: blue_whale_capex_solar_resource_v1
retrieved: "2026-11-01"
disclosure_note: >-
  This figure is a blend that includes private commercial inputs, and those inputs can be
  recovered exactly from the published figures (owner accepted on 2026-11-07, #1353 comment
  6702419885). Published on the owner's decision of 2026-11-01 (#1353 comment 6556975196).

