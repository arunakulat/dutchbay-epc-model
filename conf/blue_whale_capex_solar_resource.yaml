fx:
  cny_per_usd: 6.7220          # CFETS-2026-10-16, applied to every CNY figure (ASSUMPTION: one rate for all dates)
  source: CFETS-2026-10-16

# Import levy postures, rates copied from the repository's own configs (LEVIES-REPOSITORY) and
# applied with finance/import_levies.py's cascade: duties = CIF x (CID + PAL + SSCL); VAT on
# (CIF + duties), and on the domestic share too when vat_on_domestic; VAT zero when relieved.
levy_postures:
  bonded:                       # NSO 250 base: PAL relieved by the bonded scheme, SSCL paid, VAT relieved
    cid_pct: 0.0
    pal_pct: 0.0
    sscl_import_pct: 0.025
    vat_pct: 0.18
    vat_relieved: true
    vat_on_domestic: false
    source: scenarios/nso250_ltl_unit_base.yaml
  prudent:                      # DutchBay lender case: PAL and SSCL paid, capex VAT relieved
    cid_pct: 0.0
    pal_pct: 0.05
    sscl_import_pct: 0.025
    vat_pct: 0.18
    vat_relieved: true
    vat_on_domestic: false
    source: scenarios/dutchbay_lendercase_2025Q4.yaml
  full_stack_paid:              # the repository's worst case: no relief, VAT on the whole capex
    cid_pct: 0.0
    pal_pct: 0.05
    sscl_import_pct: 0.025
    vat_pct: 0.18
    vat_relieved: false
    vat_on_domestic: true
    source: scenarios/overrides/import_levies_full_stack_paid.yaml

wind:
  # One Envision EN-206/10.5 de-rated to 9.5 MW. Result: USD per kW of the 9.5 MW rating, all-in
  # for the turbine (supply, freight, insurance, levies, inland transport, erection, foundation,
  # electrical and EPC margin), EXCLUDING the plant-level grid, civils and development line
  # (input B26, USD 2.0M), which the scenarios carry separately.
  rated_kw: 9500.0
  turbine_supply:
    # CIF-equivalent turbine supply, USD/kW: a weighted blend of the web FOB and the internal
    # anchors. Weights sum to 1 (checked).
    web:
      source: SOOCHOW-2026-07-24
      weight: 0.5
      cny_per_kw: {low: 2000.0, mode: 2700.0, high: 3000.0}   # range and the 2026E unit price
      includes_freight: true
    anchors:
      W-KB-TENDER:
        kind: public
        weight: 0.25
        source: KB-WIND-EPC
        date: "2024-2025 (tender; undated in the knowledge base)"
        scope: "wind turbine supply, Chinese OEM, bonded; transport is a separate line"
        currency: USD
        denominator: "per kW installed (56 MW: 10 x 5.6 MW)"
        usd_per_kw: 348.0357142857143   # 389.80 x 50 / 56
        includes_freight: false
      W-DB150-DEV:
        kind: private
        weight: 0.25
        source_repository: "arunakulat/DutchBay_RAG corpus/dutchbay_150mw_2025_developer_package (rough cost estimate)"
        handling_note: DUTCHBAY150MW-PACKAGE-HANDLING-2026-09-21
        date: "2025 (undated; package of February-May 2025)"
        scope: "turbine equipment line of a 15-unit estimate; Incoterm not stated"
        currency: USD
        denominator: "per kW installed (unit rating inferred)"
        includes_freight: true          # ASSUMPTION: treated as delivered (CIF)
    freight_insurance_pct_for_fob: 0.06   # ASSUMPTION: added to anchors quoted without freight
    marine_insurance_pct: 0.005           # ASSUMPTION: on every CIF-equivalent figure
  inland_transport_usd_per_kw: {low: 20.0, mode: 40.0, high: 70.0}   # ASSUMPTION: port to Kalpitiya, one 10 MW-class set
  epc_margin_pct: {low: 0.03, mode: 0.05, high: 0.08}                # ASSUMPTION: EPC wrap on the pass-through turbine and inland transport
  levy_posture: {low: bonded, mode: prudent, high: full_stack_paid}
  bop:
    # Balance of plant within the turbine's scope (foundation, erection, cabling, site works,
    # project management, contingency, EPC margin on that scope), farm scale, USD/kW installed.
    # Excludes turbine supply, freight, the plant substation and the grid line. Each anchor is an
    # EPC-level figure already carrying its contractor's margin. low = smallest anchor; mode =
    # weighted blend; high = largest anchor.
    anchors:
      W-KB-TENDER-BOP:
        kind: public
        weight: 0.3333333333333333
        source: KB-WIND-EPC
        scope: "pre-tax EPC less turbine supply and transport (889.81 - 389.80 - 112.50 per kW on 50 MW), restated per installed kW"
        usd_per_kw: 345.99107142857144  # (889.81 - 389.80 - 112.50) x 50 / 56
      W-DB150-DEV-BOP:
        kind: private
        weight: 0.3333333333333333
        source_repository: "arunakulat/DutchBay_RAG corpus/dutchbay_150mw_2025_developer_package (rough cost estimate)"
        handling_note: DUTCHBAY150MW-PACKAGE-HANDLING-2026-09-21
        scope: "wind generation plant item less turbine equipment (installation, construction, unit transformers, other)"
      W-MULLIKULAM-WBS-BOP:
        kind: public
        weight: 0.3333333333333334
        source: MULLIKULAM-SCENARIO
        scope: "foundation, erection, collection, site preparation and development, project management, contingency; per installed kW (56 MW)"
        usd_per_kw: 197.1875            # 11,042,500 / 56,000
  single_machine:
    # Premium for one machine against the 50 MW reference: the knowledge base's rule that shared
    # infrastructure (mobilisation, engineering, site works, management) scales as MW^0.7, so its
    # per-kW cost scales as (reference / this)^(1 - 0.7). The other BoP scales linearly.
    reference_mw: 50.0
    exponent: 0.7                                         # KB-WIND-EPC
    shared_fraction: {low: 0.3, mode: 0.4, high: 0.5}    # ASSUMPTION: share of BoP that is shared infrastructure

bess:
  # USD per kWh of CONTRACTED energy (the 4 h nameplate), all-in: equipment (DC block, PCS and
  # EMS) landed, BoP, EPC margin, augmentation reserve, then land and auxiliaries as a share of
  # the total, the structure of conf/blue_whale_pv_bess_pricing.yaml (NSO250-PUBLIC).
  equipment:
    web:
      weight: 0.5
      source: TRENDFORCE-2026-09            # mode: September 4 h weighted average
      low_source: CNNC-2026-10-14           # low: CNNC's lowest winning bid
      cny_per_wh: {low: 0.4995, mode: 0.53, high: 0.58}
      vat_in_price_pct: 0.13                # ASSUMPTION: Chinese tender prices include 13% VAT, removed for export
      dc_per_contracted: 1.10               # EMBER-2025-12-11: installed oversized "by at least 10%"
      freight_insurance_pct: 0.04           # ASSUMPTION: FOB China to Colombo, containerised
      dc_block_share: 0.90                  # EMBER-2025-12-11: enclosures "close to 90%"
    anchors:
      B-ENV10:
        kind: public
        weight: 0.125
        source: NSO250-PUBLIC
        date: "2026-08-31 (offer); re-supplied 2026-09-04"
        scope: "CIF Colombo, excluding duty and taxes: DC block, PCS and MV transformers, SCADA and EMS, installation guidance and commissioning, transport"
        currency: USD
        denominator: "per kWh contracted (10 MW / 40 MWh)"
        usd_per_kwh: 99.50
        includes_freight: true
        handling_note: NSO250MW-OFFERS-HANDLING-2026-09-04   # its DC-block share is private
      B-ENV11:
        kind: public
        weight: 0.125
        source: NSO250-PUBLIC
        date: "2026-08-31 (offer); re-supplied 2026-09-04"
        scope: "as B-ENV10, 11 MW / 44 MWh"
        currency: USD
        denominator: "per kWh contracted (11 MW / 44 MWh)"
        usd_per_kwh: 98.68
        includes_freight: true
        handling_note: NSO250MW-OFFERS-HANDLING-2026-09-04
      B-OEMH:
        kind: private
        weight: 0.25
        source_repository: "arunakulat/DutchBay_RAG corpus/nso_bess_250mw_2026_offers (second OEM quotation)"
        handling_note: NSO250MW-OFFERS-HANDLING-2026-09-04
        date: "2026-08-31 (file modified)"
        scope: "DC containers, PCS and MV skid, EMS, commissioning; one site; Incoterm not stated"
        currency: USD
        denominator: "per kWh contracted (ASSUMPTION: 11 MW x 4 h)"
        includes_freight: false
  bop_usd_per_kwh: {low: 14.0, mode: 14.0, high: 30.0}    # NSO250-PUBLIC USD 14 (low, mode); EMBER's low-cost-grid EPC USD 30 (high)
  epc_margin_pct: {low: 0.05, mode: 0.08, high: 0.12}     # ASSUMPTION: EPC wrap on landed equipment and BoP
  augmentation_usd_per_kwh: 8.0                            # NSO250-PUBLIC
  land_and_auxiliaries_share: 0.10                         # NSO250-PUBLIC (the lot is owned: a challenge point)
  levy_posture: {low: bonded, mode: prudent, high: full_stack_paid}

solar_resource:
  # The PR 2 array (conf/blue_whale_solar_bess.yaml: module, tilt, azimuth, losses) at the PR 2
  # layout's 160 tables (docs/blue_whale/pv_bess_layout_lot5b.geojson), the PR 4 size, on the
  # repository's frozen TMY. PR 6's re-sizing commits 107 tables / 3.5 MW AC; the specific yield
  # differs only through clipping (the sizing summary records that size's PV energy).
  site:
    # Area centroid of the 160 PV tables in docs/blue_whale/pv_bess_layout_lot5b.geojson.
    latitude: 8.291526
    longitude: 79.753204
    # The turbine point is read from the siting config, where the turbine is placed (DutchBay
    # T2). This file kept its own copy until #1578 L-16, and it went stale (79.752666, the
    # #1530 setback spot); the runner now refuses a turbine_latitude/turbine_longitude here.
    turbine_siting_config: conf/blue_whale_wind_siting.yaml
    tmy_latitude: 8.27
    tmy_longitude: 79.75
  unit_config: conf/blue_whale_solar_bess.yaml
  dc_mwp: 6.0032                       # 160 tables of 56 x 670 W modules (the PR 2 layout; PR 4's size)
  ac_mw: 5.0
  inverter_eff_nom: 0.988              # Huawei SUN2000-330KTL-H1 European efficiency (conf/blue_whale_pv_bess_pricing.yaml)
  albedo: 0.25                         # pvlib's default, which the repository's producer uses
  cross_checks:
    pvgis:
      source: PVGIS-API-5.3
