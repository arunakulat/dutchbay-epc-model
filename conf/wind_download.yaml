# Hydra config for run_wind_download_v14.py
# Downloads ERA5 wind data and extrapolates to hub height

# Location name from wind_resource/config/locations.yaml
# Override on CLI: location=dutchbay
location: ""

# Date range for ERA5 data
start_date: "2014-12-01"
end_date: "2025-12-31"

# Hub height for extrapolation (meters)
hub_height: 150.0

# Force re-download even if cached data exists
force_download: false

# Directory for ERA5 data cache
cache_dir: "inputs/wind_data"

# Output directory for processed data
output_dir: "outputs/wind_data"
