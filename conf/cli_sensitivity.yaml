# Hydra config for the sensitivity analysis CLI.
# Used by: analytics/cli/cli_sensitivity_hydra.py (the canonical entrypoint).
#
# Only the keys below are read by the CLI. The engine
# (analytics.core.sensitivity_runner.run_sensitivity_analysis) derives the
# parameter ranges itself, so this file carries no decorative shocks/parallel
# knobs that the CLI would silently ignore.

defaults:
  - _self_

hydra:
  job:
    chdir: false

# Path to the scenario config file (required).
# Override: config=scenarios/dutchbay_lendercase_2025Q4.yaml
config: ""

# Output directory for sensitivity results.
output_dir: _out/sensitivity

# Write artifacts to disk (vs stdout only).
write_artifacts: true

# Metrics to analyze; the first is used as the tornado target metric.
metrics:
  - project_irr
