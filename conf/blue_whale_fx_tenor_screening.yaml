# Dual-currency screening assumptions (not lender commitments or executed terms)
# Note: capex_usd, opex_usd_equivalent_year1, tariff_fixed_lkr_per_kwh, tariff_om_lkr_per_kwh,
# fx_close_lkr_per_usd, fx_depreciation_decimal, ppa_years, construction_years, tax_rate_decimal,
# loss_carryforward_years, maximum_gearing_decimal, and generation_degradation_decimal are read
# from governed_scenario_path (scenarios/dutchbay_basecase_2025Q4.yaml) at runtime.
screening_parameters:
  lender_tail_years: 0
  dfi_share: 0.3
  dfi_rate_decimal: 0.084       # Illustrative screening assumption (SOFR 3.90% + 4.50% margin), not a lender term (#1629)
  local_rate_decimal: 0.1276    # Illustrative screening assumption (AWPR 11.01% + 1.75% margin), not a lender term (#1629)
  dfi_tenor_years: 15
  local_tenor_years: 10
  min_p50_dscr: 1.3             # Illustrative screening threshold, not a lender covenant
  min_downside_dscr: 1.1        # Illustrative screening threshold for assumed downside, not a lender covenant
  average_p50_dscr: 1.5         # Illustrative screening threshold, not a lender covenant
  tariff_om_escalation_decimal: 0.0
  opex_usd_share: 0.7           # Illustrative screening assumption; engine path pending BW-5 / L-12 D-2
  usd_opex_escalation_decimal: 0.025
  lkr_opex_escalation_decimal: 0.05
  annual_credit_fee_decimal: 0.0175  # Illustrative screening assumption, not a guarantee quote
  allowance_years: 20
  fx_shock_decimal: 0.0
  shock_operating_year: 5

# DutchBay 14-turbine screening cases (#1587). 15-turbine case dropped.
# There is no measured DutchBay wind data and no measured P90; assumed_downside_gwh is an assumed downside sensitivity.
cases:
