# Blue Whale: Dual-Currency FX, Tenor-Tail, and Evidence-Status Screening Config
#
# Read by scripts/run_blue_whale_fx_tenor_screening_v14.py (Hydra, one JSON object on stdout:
# CLI-01, CLI-03) through analytics.finance.blue_whale_fx_tenor_screening.
# Incorporates the dual-currency loan screening, dated FX observations with evidence status,
# tenor-tail screening, and governed basecase alignment from the owner's private
# research hand-off of 2026-11-14.
#
# Standalone screening tool complementary to analytics.evaluation_v14 and PR #1678.
# Core v14 engine path is PENDING: FX feeding the USD OPEX share is BW-5 (L-12 D-2) work.
# Does NOT modify frozen scenario YAMLs (scenarios/blue_whale_*.yaml) or publish confidential terms.
#
# HOLD (F-5, #1110, v15.6.1): Screening indicators only — not a lender verdict or term sheet (#1629).

schema_version: blue_whale_fx_tenor_screening_v1
retrieved: "2026-11-14"
status: "Standalone screening config aligned to governed DutchBay 14-turbine basecase (#1587)"
governed_scenario_path: "scenarios/dutchbay_basecase_2025Q4.yaml"

f5_hold_caveat: >-
  HOLD (F-5, #1110, v15.6.1): Standalone screening indicator only — not a lender verdict,
  bankability determination, or credit commitment. Lender interest rates and DSCR thresholds
  are illustrative screening assumptions, not executed term-sheet terms (#1629).

engine_path_status: "pending_bw5_l12_d2"
engine_path_note: >-
  Core v14 engine path is pending: FX feeding the USD OPEX share is BW-5 (L-12 D-2) work;
  this module is a standalone screening utility.

disclosure_note: >-
  Basecase capex, tariff, O&M, and FX-at-close are read at runtime from
  scenarios/dutchbay_basecase_2025Q4.yaml. Any divergent case is explicitly labeled as a
  sensitivity. Unverified prior-session FX/OPEX figures are labeled as assumptions.
  No confidential raw price, private quote, or unapproved lender term enters this file.

