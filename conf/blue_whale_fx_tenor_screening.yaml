    case_type: "governed_basecase_screening"
    turbine_count: 14
    p50_gwh: 433.2
    assumed_downside_gwh: 377.3
    generation_basis_note: "Screening reference generation; no measured DutchBay wind data and no measured P90"
    description: "14-turbine DutchBay farm (#1587) using capex, tariff, O&M, and FX-at-close read from scenarios/dutchbay_basecase_2025Q4.yaml"
  "14_handoff_sensitivity":
    case_type: "sensitivity"
    turbine_count: 14
    capex_usd: 159120000
    opex_usd_equivalent_year1: 3359106  # Unverified prior-session assumption (2.8467m * 1.18 VAT factor)
    tariff_fixed_lkr_per_kwh: 20.8
    tariff_om_lkr_per_kwh: 4.93
    fx_close_lkr_per_usd: 333.79
    fx_depreciation_decimal: 0.07
    p50_gwh: 433.2
    assumed_downside_gwh: 377.3
    generation_basis_note: "Screening reference generation; no measured DutchBay wind data and no measured P90"
    description: "EXPLICIT SENSITIVITY (14-turbine DutchBay #1587): diverges from dutchbay_basecase_2025Q4.yaml on capex, PUCSL 20.80+4.93 tariff, assumed O&M, and 333.79 FX-at-close"

