# Base config for scenario analytics v14

# Directory containing scenario YAML/JSON files
scenarios_dir: "scenarios"

# Excel output path
output: "exports/v14_analytics.xlsx"

# Whether to skip Excel export
no_excel: false

# Whether to export charts
charts: false

# Run schema_guard in strict mode?
strict: true

# Toggle parallel processing for large batches
parallel: false

# Optional scenario name filter (substring or glob, depending on how we implement it)
filter: null

# Optional batch-wide default discount rate (overrides None -> use per-scenario)
default_discount_rate: null

# Optional JSON summary output
summary_json: null
