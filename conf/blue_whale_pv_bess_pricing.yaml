# Blue Whale Lot 5B: frozen, cited prices for sizing the solar + BESS unit (PR 3 of 3).
#
# Read by solar_resource.pv_bess_sizing (strict parser: every key is required, unknown keys are
# refused; FRAMEWORK-02). DATA-01: each external figure is frozen here with its source URL,
# its retrieval date and the figure as the source states it ("verbatim"). A value marked
# ASSUMPTION has no source of its own; its basis is stated.
#
# Owner decisions (relayed on #1353, 2026-11-01; see the PR body for the exact record):
# PV module prices for JinkoSolar from web sources; "try huwawei or other reputed
# manufacturer's inverter prices with inverter specs matched to the jinkosolar array specs";
# BESS and turbine from the internal corpus.
#
# CONFIDENTIALITY. Until PR 6 the BESS figures were the repository's PUBLIC derived figures in
# scenarios/nso250_ltl_unit_*.yaml and the turbine capex a public placeholder. From PR 6
# (2026-11-01) the BESS and wind figures are BLENDS that include private commercial inputs
# (handling notes NSO250MW-OFFERS-HANDLING-2026-09-04 and
# DUTCHBAY150MW-PACKAGE-HANDLING-2026-09-21), published as blends only on the owner's decision
# of 2026-11-01 ("Derived blend may publish", #1353 comment 6556975196). No raw private
# figure is in this repository. This figure is a blend that includes private commercial
# inputs; a reader may be able to back out a private input. The PV figures below are
# unchanged from PR 3 and use no private input.
#
# "verbatim" holds each figure as the retrieval tool returned it from the page (bracketed
# words are editorial). The tool extracts rather than mirrors a page, so re-check exact
# wording at the URL before quoting it onward.
#
# Each uncertain price is a triangular distribution (low, mode, high) sampled in the Monte
# Carlo; the deterministic base case (and the scenario) uses the mode.

schema_version: blue_whale_pv_bess_pricing_v1
retrieved: "2026-11-01"
currency: USD

sources:
