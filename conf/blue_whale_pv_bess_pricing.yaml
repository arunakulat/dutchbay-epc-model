fx:
  # ASSUMPTION: EUR to USD for the one EUR-quoted inverter price. Not sourced; the
  # inverter range below is wide enough that a +/-5% FX error stays inside it.
  usd_per_eur: 1.15

pv_module:
  # JinkoSolar Tiger Neo 3.0 JKM670N-66QL6-BDV is a TOPCon module above 650 W, the OPIS
  # "high-efficiency" category. FOB China, USD per Wp.
  fob_usd_per_wp:
    low: 0.104      # OPIS-2026-07-28 spot range, low end
    mode: 0.110     # ASSUMPTION: middle of OPIS-2026-07-28's ">650 W" indication ("high-$0.100/W to mid-$0.110/W")
    high: 0.119     # OPIS-2026-07-28 spot range, high end
  # ASSUMPTION: freight FOB China to Colombo, insurance, port handling and inland transport,
  # added to every draw. No Sri Lankan import duty schedule for PV modules was read.
  delivery_usd_per_wp: 0.010

inverter:
  # Matched to the PR 2 string design (solar_resource.pv_bess_sizing.match_inverter checks it).
  model: "Huawei SUN2000-330KTL-H1"
  source: HUAWEI-SPECS
  max_dc_voltage_v: 1500.0
  mppt_min_v: 500.0
  mppt_max_v: 1500.0
  start_voltage_v: 550.0
  max_current_per_mppt_a: 65.0
  max_short_circuit_current_per_mppt_a: 115.0
  mppt_count: 6
  max_inputs_per_mppt: [4, 5, 5, 4, 5, 5]
  nominal_ac_kw: 300.0
  max_ac_kva: 330.0
  european_efficiency: 0.988
  # USD per W of inverter nominal AC rating. ASSUMPTION range: no utility procurement
  # price was found. Mode: INVERTER-RETAIL-DE, EUR 8,114.84 / 300 kW x 1.15 = 0.0311.
  # Low: WOODMAC-2025-12-15's China-domestic floor (0.02). High: ASSUMPTION, the retail
  # mode plus 19% VAT and a small-lot margin (about 1.45 x the mode).
  usd_per_wac:
    low: 0.020
    mode: 0.0311
    high: 0.045

pv_bop_epc:
  # Structures, piles, DC and AC cabling, combiner and MV station, civils within the fence,
  # installation, commissioning and EPC margin, USD per Wp. Excludes the modules and
  # inverters above and the plant-level grid, civils and development line (input B26,
  # $2.0M in the scenario), which stays as it is.
  # Derived: IRENA total installed cost less the mode module (0.120 delivered) and inverter
  # (0.0311 / 1.2 = 0.026) costs per Wp, reading IRENA's USD/kW as per kW DC (ASSUMPTION;
  # the summary does not say).
  usd_per_wp:
    low: 0.354      # IRENA-RPGC-2024: Asia ~USD 500/kW (projection) - 0.146
    mode: 0.462     # ASSUMPTION: midpoint of India 2024 (525, IRENA-INDIA-2024) and global 2024 (691, IRENA-RPGC-2024), 608 - 0.146: a 5 MW plant lacks India's utility-scale economies
    high: 0.545     # IRENA-RPGC-2024: global 2024 USD 691/kW - 0.146

bess:
  # All-in USD per kWh of contracted (4 h nameplate) energy. PR 6 (2026-11-01): the BLENDED
  # range of conf/blue_whale_capex_solar_resource.yaml (docs/blue_whale/capex_blend_summary.json,
  # source PR6-CAPEX-BLEND): China FOB system prices (TrendForce September 2026, CNNC October
  # 2026, Ember 2025) blended with the Envision offers (public per-kWh figures of
  # scenarios/nso250_ltl_unit_{base,upside}.yaml) and a second OEM quotation (private, blended
  # only), landed with the repository's Sri Lankan levy postures, plus BoP, EPC margin, the
  # NSO 250 augmentation reserve, and land and auxiliaries. Low: bonded levies, low FOB, BoP
  # 14, EPC 5%; mode: prudent levies (PAL 5% + SSCL 2.5%, VAT relieved), BoP 14, EPC 8%; high:
  # every levy paid, high FOB, BoP 30, EPC 12%. Was 78.75 / 135.00 / 143.41 (NSO 250
  # BIDIMPLIED / BASE / STRESS). This figure is a blend that includes private commercial
  # inputs; a reader may be able to back out a private input. Published on the owner's
  # decision of 2026-11-01 (#1353 comment 6556975196).
  # Applied per kWh at every duration (a challenge point: power-related costs scale with MW).
  all_in_usd_per_kwh:
    low: 129.13
    mode: 140.74
    high: 202.51
  # The mode as four lines (the parser checks they reproduce it): equipment = DC block, PCS and
  # EMS landed with duties and its EPC margin; BoP 14.00 with its EPC margin (8%); the NSO 250
  # augmentation reserve; land and auxiliaries at 10% of the total (the lot is owned: a
  # challenge point). Was 99.50 / 14.00 / 8.00 / 0.10.
  equipment_usd_per_kwh_base: 103.55
  bop_usd_per_kwh_base: 15.12
  augmentation_reserve_usd_per_kwh_base: 8.00
  land_and_auxiliaries_share_base: 0.10

wind:
  # FIXED by PR 1; not a sizing variable. PR 6 (2026-11-01): the BLENDED single-turbine
  # all-in (source PR6-CAPEX-BLEND), USD per kW of 9.5 MW, excluding the plant-level grid,
  # civils and development line (input B26). China export FOB (Soochow Securities 2026-07-24)
  # blended with a northwest-coast tender (docs/knowledge_base/01_wind_epc_costs_and_scaling.md)
  # and a developer estimate (private, blended only), landed, with BoP calibrated on three
  # anchors and a single-machine premium. The range is the blend's low and high. Was 1300.0
  # (placeholder B09, public range 977-1,420). This figure is a blend that includes private
  # commercial inputs; a reader may be able to back out a private input. Published on the
  # owner's decision of 2026-11-01 (#1353 comment 6556975196).
  capex_usd_per_kw: 936.84
  source: PR6-CAPEX-BLEND
  public_range_usd_per_kw: [728.16, 1341.16]

opex:
  # PLACEHOLDERS (inputs B16, B20), the scenario's existing per-unit rates scaled with size:
  # solar $0.05M on the 5 MWp basis of v0.1-v0.4 (USD 10/kWp-yr) and BESS $0.10M on the
  # 40 MWh basis (USD 2.5/kWh-yr). Not sourced.
  pv_usd_per_kwp_year: 10.0
  bess_usd_per_kwh_year: 2.5
