# Blue Whale Lot 5B: single-turbine wind yield, coastal placement, tip-height setback and
# shadow flicker.
#
# Read by scripts/run_blue_whale_wind_siting_v14.py (Hydra, one JSON object on stdout:
# CLI-01, CLI-03) and analytics.gis.shadow_flicker. Every key is required (FRAMEWORK-02);
# the strict parsers refuse a missing or unknown key.
#
# EVERYTHING HERE RESTS ON A PLACEHOLDER SITE. No survey of Lot 5B exists (input B03). The
# lot is an assumed square of the deeded area, and the coastline is OpenStreetMap's.
#
# The power curve is CONFIDENTIAL (PMD-004447 Rev A; handling KALPITIYA60MW-WIND-HANDLING-2026-09-21).
# It is read at run time from a path outside this repository and is never written, printed
# or hashed by this tool. Only derived scalars leave it.
#
#   BLUE_WHALE_POWER_CURVE_CSV=/path/outside/the/repo/curve.csv \
#     .venv/bin/python scripts/run_blue_whale_wind_siting_v14.py

defaults:
  - _self_
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled

site:
  # DutchBay turbine T2, WGS84. Source: scripts/process_era5_wind_data.py TURBINE_LOCATIONS,
  # which cites ENVISION_ROAD-DATA.pdf (not in this repository). The local metric frame is
  # centred here, and the Blue Whale turbine stands here (turbine_placement below).
  reference_point_name: T2
  reference_lat_deg: 8.2925
  reference_lon_deg: 79.7547
  # Lot 5B, Plan 3641: 23 A 0 R 0 P = 9.3077 ha (owner's title pack, reviewed outside this
  # repository and not yet ingested; docs/blue_whale/STATUS.md).
  lot_area_m2: 93077.0
  # Placeholder shape (owner, 2026-11-01: "Assumed square, flagged"; then "push the turbine
  # as much as possible westwards towards the shore"). The square's west edge is the
  # straight-line fit of the coastline beside it, with the edge midpoint where the coastline
  # crosses T2's latitude; the lot runs landward from there.
  coastline_sample_step_m: 5.0
  coastline_geojson: docs/blue_whale/osm_coastline_near_t2.geojson
  site_geojson: docs/blue_whale/site_placeholder_lot5b.geojson
  geojson_decimals: 9
  # Where the tower goes. "reference_point": on the reference point above, checked against
  # the coastal setback. "coastal_setback": the westernmost point on the reference latitude
  # that clears the setback (the #1530 position, 224 m west of T2, used until 2026-11-07).
  # Owner decision, 2026-11-07, verbatim: "Blue Whale Turbine is replacing the T2 Dutchbay
  # turbine - its on the exact same location - if not, recalculate location to match T2
  # location. As such wake does not apply". This supersedes the 2026-11-01 direction to
  # "push the turbine as much as possible westwards towards the shore".
  turbine_placement: reference_point
  # East limit of the westward placement search, metres from T2 (coastal_setback only).
  placement_search_east_m: 500.0

coastal_setback:
  # Coastal Zone and Coastal Resource Management Plan 2024-2029 (CC&CRMD; Cabinet approval
  # 12 Aug 2024), Table 6-1, segment 2, "Uchchamunai to Mohoththuwaram (Mohoththuwaram Split
  # Northern Boundary)", 8°23'01.20"N 79°47'14.90"E to 8°15'00.60"N 79°44'20.20"E, level of
  # vulnerability Medium (+): reservation 25 m, restricted 35 m, total 60 m. T2's latitude
  # (8°17'33"N) lies inside the segment. The setback is measured landward from the Seaward
  # Reference Line, which section 6.4.1 defines as the permanent vegetation line, or the
  # landward toe of the back dune in a dune area.
  reservation_m: 25.0
  restricted_m: 35.0
  # The vegetation line and dune toe are not mapped here. OpenStreetMap's coastline is the
  # high-water line, which lies seaward of the vegetation line by the beach width, so the
  # true setback line is farther east by that unknown width. 0.0 is a BOUND, not an
  # estimate: the tower on T2 must clear at least this (the run refuses a point inside it).
  seaward_reference_offset_m: 0.0
  # Clearance from the tower centre to the setback line. A real foundation and hardstand
  # need their radius (not known; input B05). 0.0 is again a bound.
  foundation_clearance_m: 0.0
  source: "CZ&CRMP 2024-2029 (Coast Conservation and Coastal Resource Management Department), Table 6-1 segment 2 and section 6.4.1; https://coastal.gov.lk/images/pdf/CZMP_24-29/SRI_LANKA_REVISED_COASTAL_ZONE_AND_COASTAL_RESOURCE_MANAGEMENT_PLAN_2024.pdf (retrieved 2026-11-01, SHA-256 368c0e75ee757132473e668bc26b40d1ab1a39275c9aac33074ede7349265033)"

turbine:
  model: "Envision EN-206/10.5"
  # Owner decision, 2026-11-01: de-rated to 9.5 MW. Modelled as the curve clipped at this
  # power. That is an assumption; an OEM de-rate mode can reshape the curve below rated.
  derated_power_kw: 9500.0
  hub_height_m: 130.0
  # From the model name. No blade length is in any corpus, so 103 m is the ROTOR radius.
  rotor_diameter_m: 206.0
  # Confidential. Never commit the file, a copy, its values or its hash.
  power_curve_csv: ${oc.env:BLUE_WHALE_POWER_CURVE_CSV,null}
  # The air density the curve is stated at (kg/m3).
  power_curve_air_density_kgm3: 1.148

resource:
  # The wind basis is the DutchBay one, read from this scenario at run time rather than
  # copied: wind_resource.weibull_a / weibull_k (ERA5-fitted, 2020-2024), their reference
  # height resource.era5.hub_height_m, wind_resource.shear_exponent, the site air density
  # wind_resource.air_density_kgm3, and the loss stack resource.losses. The ERA5 point is the
  # DutchBay array centroid (8.27 N, 79.75 E), about 2.5 km from T2 in the same 0.25° ERA5
  # cell, so the basis does not change with a move of a few hundred metres.
  source_scenario: scenarios/dutchbay_hybrid_bess_2025Q4.yaml
  # No wake. The turbine stands alone on the lot, and it REPLACES DutchBay T2 at T2's own
  # position (owner, 2026-11-07: "As such wake does not apply"), so there is no T2 to wake
  # it. DutchBay T1 (624 m, bearing 21 degrees) and T3 (529 m, bearing 202 degrees) are not
  # modelled as wake sources: docs/blue_whale/STATUS.md records that open risk. Every other
  # loss line is taken from the source scenario.
  loss_overrides:
    wake_loss_pct: 0.0
  # Agreement required between the production gross-AEP integrator
  # (analytics.wind.aep_tornado.gross_aep_farm_gwh) and the independent one kept as its
  # oracle (wind_resource.bankable_aep.gross_aep_weibull).
  integrator_tolerance_pct: 0.1

tip_setback:
  tip_height_multiple: 1.0
  source: "1.0 x tip height: the topple distance commonly used as a minimum to a property boundary. No Sri Lankan statutory turbine setback has been ingested into this repository (input B08)."

shadow_flicker:
  year: 2026
  timezone: Asia/Colombo
  time_step_minutes: 1
  min_sun_elevation_deg: 3.0
  max_shadow_distance_rotor_diameters: 10.0
  receptor_height_m: 2.0
  # Out to the 10-diameter cut-off (2,060 m) so the 30 h/yr contour closes inside the grid.
  grid_half_width_m: 2100.0
  grid_spacing_m: 100.0
  worst_case_hours_per_year_limit: 30.0
  worst_case_minutes_per_day_limit: 30.0
  expected_hours_per_year_limit: 8.0
  sunshine_dni_threshold_wm2: 120.0
  # The frozen PVGIS TMY behind the DutchBay solar P50 (8.27 N, 79.75 E; hourly, UTC).
  sunshine_tmy_csv: inputs/solar_tmy/kalpitiya_pvgis_tmy_8.27N_79.75E.csv
  # Cited from the published guidance. None of these documents is ingested into this
  # repository under DATA-01.
  threshold_sources:
    worst_case_hours_per_year_limit: "LAI (Bund/Laender-Arbeitsgemeinschaft fuer Immissionsschutz), Hinweise zur Ermittlung und Beurteilung der optischen Immissionen von Windenergieanlagen (WEA-Schattenwurf-Hinweise), 2002: 30 h/yr astronomical worst case; the same figure appears in the Irish Wind Energy Development Guidelines (2006)"
    worst_case_minutes_per_day_limit: "LAI WEA-Schattenwurf-Hinweise (2002): 30 min/day astronomical worst case; also the Irish Wind Energy Development Guidelines (2006)"
    expected_hours_per_year_limit: "LAI WEA-Schattenwurf-Hinweise (2002): 8 h/yr of real (meteorological) shadow, the usual shutdown-system setting"
    min_sun_elevation_deg: "LAI WEA-Schattenwurf-Hinweise (2002): no shadow counted with the sun below 3 degrees"
    max_shadow_distance_rotor_diameters: "10 rotor diameters: Companion Guide to PPS22 (UK, 2004), repeated in the DECC Update of UK Shadow Flicker Evidence Base (2011)"
    sunshine_dni_threshold_wm2: "WMO Guide to Instruments and Methods of Observation (WMO-No. 8): sunshine is direct irradiance of at least 120 W/m2"
    receptor_height_m: "Assumed ground-floor window height; not taken from a standard"

output:
  # Optional files. Paths are relative to the repository root; null writes nothing.
  # The committed docs/blue_whale copies were written with
  #   output.site_geojson=docs/blue_whale/site_placeholder_lot5b.geojson
  #   output.flicker_grid_csv=docs/blue_whale/shadow_flicker_grid.csv
  site_geojson: null
  flicker_grid_csv: null

hydra:
  run:
    dir: .
  sweep:
    dir: .
    subdir: .
  job:
    chdir: false
  output_subdir: null
