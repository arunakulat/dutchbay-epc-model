# Blue Whale Lot 5B: the solar + BESS unit (PV array, land, PV yield, hourly BESS dispatch).
#
# Read by scripts/run_blue_whale_solar_bess_v14.py (Hydra, one JSON object on stdout:
# CLI-01, CLI-03), analytics.gis.pv_array_layout and solar_resource.pv_bess_dispatch. Every
# key is required (FRAMEWORK-02): the strict parsers refuse a missing or unknown key.
#
# Owner decisions (relayed on #1353, 2026-11-01): a 5 MW solar PV array on the latest
# JinkoSolar panel; a 5 MW x 6 h BESS; "the hybrid scheme is solar+BESS as one unit and
# then the turbine as the second unit"; and for the BESS, "Use the 17:30 - 21:30 window and
# add another 05:30 to 07:30 window for the remaining 2 hours. The priority rate will only
# apply to the evening window".
#
# EVERYTHING HERE RESTS ON THE PLACEHOLDER SITE OF PR 1. No survey of Lot 5B exists
# (input B03). A value marked ASSUMPTION has no source; it is a stated engineering choice.

defaults:
  - _self_
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled

module:
  # JinkoSolar Tiger Neo 3.0, 670 W class (series 650-670 W), bifacial glass-glass TOPCon.
  # Sources: [DS] JinkoSolar datasheet JKM650-670N-66QL6-BDV-F1-EU (c) 2025, retrieved
  # 2026-11-01 from https://solarmagazine.nl/u/webshop/datasheetjkm650-670n-66ql6-bdv-f1.pdf
  # (distributor copy of the manufacturer's sheet; PDF SHA-256
  # 410cfefb6527def1543e325125f30c1a13b6368d8946f103a0a3fac2fdc39040; read with markitdown
  # and pdfplumber, R26; not ingested into docs/source_materials). [PVM] pv magazine,
  # "JinkoSolar launches 670 W TOPCon solar module with 24.8% efficiency", 2025-09-05,
  # https://www.pv-magazine.com/2025/09/05/jinkosolar-launches-670-w-topcon-solar-module-with-24-8-efficiency/
  # Both sources agree on every value they share.
  name: "JinkoSolar Tiger Neo 3.0 JKM670N-66QL6-BDV"
  pmax_w: 670.0                       # [DS] STC, [PVM]
  vmp_v: 43.09                        # [DS] STC
  imp_a: 15.55                        # [DS] STC
  voc_v: 50.98                        # [DS] STC; [PVM] gives the 50.26-50.98 V range
  isc_a: 16.22                        # [DS] STC; [PVM] gives the 15.98-16.22 A range
  efficiency_pct: 24.80               # [DS], [PVM]
  temp_coeff_pmax_pct_per_c: -0.26    # [DS], [PVM]
  temp_coeff_voc_pct_per_c: -0.24     # [DS]
  temp_coeff_isc_pct_per_c: 0.046     # [DS]
  cells: 264                          # [DS] "264 (66x4)"
  length_mm: 2382.0                   # [DS], [PVM]
  width_mm: 1134.0                    # [DS], [PVM]
  thickness_mm: 30.0                  # [DS], [PVM]
  weight_kg: 32.5                     # [DS], [PVM]
  bifaciality_pct: 85.0               # [DS] "85 +/- 5%"; [PVM] "85%". NOT MODELLED (see pv_yield)
  max_system_voltage_v: 1500.0        # [DS] IEC; [PVM]
  max_series_fuse_a: 35.0             # [DS]
  first_year_degradation_pct: 1.0     # [DS], [PVM] warranted
  annual_degradation_pct: 0.35        # [DS], [PVM] warranted, linear, years 2-30
  year_30_power_pct: 88.85            # [DS], [PVM]: 99 - 0.35 x 29 = 88.85, checked by the parser
  product_warranty_years: 12          # [DS], [PVM]
  power_warranty_years: 30            # [DS], [PVM]
  # NOCT/NMOT is not on the datasheet or in [PVM]. The yield chain below uses the Faiman
  # cell-temperature model of the repository's producer, which does not need it.
  nmot_c: null

string_design:
  # String length from the cold-temperature open-circuit voltage against the module's
  # 1500 V system limit. The inverter's own maximum DC voltage and MPPT window decide the
  # final string (PR 3, inverter matching).
  # ASSUMPTION: 15 C design minimum cell temperature, 6.14 C below the 21.14 C minimum
  # ambient of the frozen PVGIS TMY (a typical year, so not a record low). At dawn the cell
  # is at ambient. Reviewers should replace it with a Puttalam record low.
  design_min_cell_temp_c: 15.0
  # Design maximum cell temperature for the low-voltage (Vmp) check. ASSUMPTION: 70 C, the
  # datasheet's upper operating ambient bound [DS], used as a conservative cell figure.
  design_max_cell_temp_c: 70.0

array:
  # "5 MW" is the AC export capacity of the solar + BESS unit at the point of connection:
  # the PV inverters' AC nameplate and the unit's export limit. DC peak is AC x dc_ac_ratio,
  # rounded UP to whole tables.
  ac_capacity_mw: 5.0
  # 1.20 is the inverter loading ratio of the repository's DutchBay solar basis
  # (scenarios/dutchbay_hybrid_bess_2025Q4.yaml resource.solar.dc_ac_ratio, the 0.1685 P50),
  # inside the usual 1.1-1.3 for fixed tilt in the tropics. Inverter clipping is computed,
  # not assumed. A higher ratio would feed the battery more; it is a PR 3 sizing variable.
  dc_ac_ratio: 1.2
  # Fixed tilt near the PR 1 site latitude (8.29 N), equal to the DutchBay basis (8 deg).
  tilt_deg: 8.0
  azimuth_deg: 180.0                  # equator-facing
  # Table: modules in portrait, two high, one string per module row (ASSUMPTION: 2P tables
  # of two strings, a common fixed-tilt format).
  modules_high_portrait: 2
  strings_per_table: 2
  module_gap_m: 0.02                  # ASSUMPTION: clamp gap between modules
  table_gap_ew_m: 1.0                 # ASSUMPTION: gap between tables along a row

shading_rule:
  # No inter-row shading between 09:00 and 15:00 local clock time on the winter solstice
  # (the sun's lowest noon of the year at a northern-hemisphere site), from pvlib solar
  # position at the PR 1 lot centroid. Flat ground is assumed.
  date: "2026-12-21"
  start_local: "09:00"
  end_local: "15:00"
  timezone: Asia/Colombo
  step_minutes: 1
  # ASSUMPTION: a 2.0 m clear aisle between rows for module cleaning and maintenance access.
  # At an 8 deg tilt the shading rule alone leaves only about 0.58 m, too narrow to work in,
  # so this floor governs the pitch. Reported separately so a reviewer sees both.
  min_clear_aisle_m: 2.0

land:
  # ASSUMPTIONS for the fenced area. No layout drawing exists.
  fence_to_array_m: 6.0               # 4 m perimeter road plus 2 m clearance, inside the fence
  internal_road_width_m: 4.0          # north-south access road through the array
  tables_between_internal_roads: 8    # one such road after every 8 tables along a row
  # Medium-voltage stations: one for the PV inverters, one for the BESS (ASSUMPTION).
  mv_station_count: 2
  mv_station_area_m2: 40.0            # ASSUMPTION: a 5 MVA skid with its own clearance
  equipment_clearance_m: 3.0          # ASSUMPTION: around the BESS and MV group

bess_footprint:
  # 5 MW x 6 h = 30 MWh. Footprint sized from containerised LFP units.
  # Unit energy: Sungrow PowerTitan 2.0 B-ST5015UX-6H product page, "5015 kWh Nominal
  # Capacity", "762 kVA Nominal AC power" (a 6-hour product), retrieved 2026-11-01,
  # https://sungrowpower.com/en/products/utility-energy-storage-system/b-st5015ux-6h
  # Unit size: a 20-ft ISO container, ISO 668 external dimensions 6.058 m x 2.438 m. The
  # product page states no dimensions; Sungrow describes PowerTitan 2.0 as a 20-ft unit.
  # Choosing this product is an ASSUMPTION for the footprint only, not a procurement choice.
  unit_energy_kwh: 5015.0
  unit_power_kva: 762.0
  unit_length_m: 6.058
  unit_width_m: 2.438
  units_per_row: 4                    # ASSUMPTION: layout of the container group
  # ASSUMPTION: 3 m between containers and to the pad edge. Separation rules (NFPA 855,
  # OEM manuals) vary by product and test data; none has been ingested.
  unit_spacing_m: 3.0

site_fit:
  # PR 1's placeholder lot and turbine position, and its coastal setback (read from the
  # wind siting config, not copied).
  site_geojson: docs/blue_whale/site_placeholder_lot5b.geojson
  coastline_geojson: docs/blue_whale/osm_coastline_near_t2.geojson
  wind_siting_config: conf/blue_whale_wind_siting.yaml
  # ASSUMPTIONS (input B05 owes the OEM foundation and hardstand): a 30 m gravity
  # foundation, and a 40 m x 80 m crane hardstand with its long side east-west, one end at
  # the foundation edge, centred on the tower's latitude.
  foundation_diameter_m: 30.0
  crane_pad_length_ew_m: 80.0
  crane_pad_width_ns_m: 40.0
  # West of the foundation (ASSUMPTION). The turbine stands on DutchBay T2 (owner,
  # 2026-11-07), 47 m from the lot's east edge, so an east-side hardstand would lie mostly
  # off the lot. It was "east" while the turbine stood at the coastal setback (#1530).
  crane_pad_side: west
  # Placement of the BESS and MV group: as far east as fits (towards the landward side,
  # where the access road and grid connection are expected; ASSUMPTION).
  equipment_search_step_m: 5.0
  geojson_decimals: 9

pv_yield:
  # The repository's producer, solar_resource.pv_producer.compute_solar_aep, on the frozen
  # PVGIS TMY. This block is its resource.solar input. dc_capacity_mw, dc_ac_ratio,
  # tilt_deg and azimuth_deg are inserted from the array above, and gamma_pdc_per_c from
  # the module's -0.26 %/C, so none is stated twice. The coordinates are the TMY's own
  # point (8.27 N, 79.75 E), 2.5 km from the lot, so the solar geometry matches the
  # irradiance record.
  resource_solar:
    latitude: 8.27
    longitude: 79.75
    timezone: "Asia/Colombo"
    altitude_m: 5.0
    annual_ghi_kwh_m2: 1871.0         # informational when tmy_path is set
    # The DutchBay 14% soiling/wiring/mismatch/availability stack behind the 0.1685 P50.
    system_loss_pct: 14.0
    inverter_eff_nom: 0.96            # PVWatts nominal; the inverter is chosen in PR 3
    tmy_path: "inputs/solar_tmy/kalpitiya_pvgis_tmy_8.27N_79.75E.csv"
  # Not modelled, declared:
  # - bifacial rear gain: no measured ground albedo or row-height basis for this site, and
  #   the financed solar chain is monofacial by rule (solar_resource.bifacial_guard, SOLAR-9);
  # - turbine shadow on the PV: belongs to #1520 (solar_resource.turbine_shading), not on
  #   main or on this branch.
  bifacial_modelled: false
  turbine_shading_modelled: false
  degradation_years: 20               # path reported for the PPA term

bess:
  power_mw: 5.0
  energy_mwh: 30.0                    # 5 MW x 6 h (owner)
  # AC-AC round-trip efficiency: the repository value (finance.bess_revenue
  # _DEFAULT_ROUND_TRIP_EFFICIENCY, NREL ATB 2024 basis, #588).
  round_trip_efficiency: 0.85
  # The repository convention (finance.bess_revenue energy_tariff: exported = stored x RTE):
  # energy_mwh is the AC energy a full charge absorbs, and all of the loss is booked on
  # discharge. charge_efficiency 1.0 keeps that convention; discharge efficiency is
  # RTE / charge_efficiency. Setting charge_efficiency to the RTE instead reads 30 MWh as
  # deliverable energy (a reviewer challenge point).
  charge_efficiency: 1.0
  min_soc_fraction: 0.0               # ASSUMPTION: 30 MWh is usable energy
  max_soc_fraction: 1.0
  grid_charging: false                # owner brief: charged only from the co-located PV

dispatch:
  timezone: Asia/Colombo
  # Each TMY row labelled t is the hour [t, t+1h), the convention the producer uses for
  # solar position. Asia/Colombo is UTC+05:30, so the UTC hours fall on local half hours
  # and both windows align with whole rows.
  windows:
    evening:
      # PUCSL "Prioritized Feed-in Time": 17:30-21:30 from the July 2026 consultation. The
      # approved Annex 2 does not state the hours.
      start_local: "17:30"
      end_local: "21:30"
      rate: priority
    morning:
      # Owner, 2026-11-01: "add another 05:30 to 07:30 window for the remaining 2 hours",
      # discharged from energy stored the previous day, at the other-period rate.
      start_local: "05:30"
      end_local: "07:30"
      rate: other
  # The PV + BESS unit's combined export limit at the point of connection (MW): the unit's
  # contracted 5 MW. Read as the FiT's plant capacity; a CEB connection offer decides it
  # (input B27).
  export_limit_mw: 5.0
  # fill: the owner's dispatch. PV charges the battery first, up to full, so both windows
  # are served. evening_need: charge only what the evening window can export (compared
  # in the output, not used for the scenario).
  charge_policy: fill
  # The TMY year is run as a repeating year: the first morning draws on the last evening's
  # residue, iterated to a fixed point within this tolerance.
  cyclic_soc_tolerance_mwh: 1.0e-9
  cyclic_soc_max_iterations: 20

tariff:
  # PUCSL feed-in tariffs effective 25 Aug 2026, plants < 10 MW, Annex 2 ("Summary of
  # Approved Feed-in Tariffs"), as recorded in the repository (scenarios/
  # ceb_solar_bess_nightpeak_10mw.yaml and the v15.9.0 tariff research):
  # ground solar + BESS, energy in the Prioritized Feed-in Time 47.08 + 3.02 = 50.10 LKR/kWh
  # for the first 15 years of the SPPA; all other energy 18.00 + 2.72 = 20.72; wind 25.73.
  # The rate is set by WHEN the unit exports, as the owner's decision reads and a single
  # export meter measures: energy exported in the evening window at the priority rate,
  # every other kWh (direct PV export outside the windows, the morning window) at 20.72.
  priority_lkr_per_kwh: 50.10
  other_lkr_per_kwh: 20.72
  priority_term_years: 15             # then the evening energy is paid the other rate
  wind_lkr_per_kwh: 25.73

engine:
  # How the unit enters the v14 engine without new engine code (see the module docstring
  # of solar_resource.pv_bess_dispatch). The wind block is read from the scenario.
  scenario: scenarios/blue_whale_hybrid_lot5b_2026.yaml
  ppa_term_years: 20
  # Tolerance for the engine-versus-dispatcher revenue check in years 2 to 20, where the
  # engine's geometric degradation and its year-1 tariff blend approximate the dispatcher.
  later_year_revenue_tolerance_pct: 0.5

output:
  # Optional files, relative to the repository root; null writes nothing. The committed
  # docs/blue_whale copies were written with
  #   output.hourly_csv=docs/blue_whale/pv_bess_hourly_tmy.csv
  #   output.layout_geojson=docs/blue_whale/pv_bess_layout_lot5b.geojson
  hourly_csv: null
  layout_geojson: null

hydra:
  run:
    dir: .
  sweep:
    dir: .
    subdir: .
  job:
    chdir: false
  output_subdir: null
