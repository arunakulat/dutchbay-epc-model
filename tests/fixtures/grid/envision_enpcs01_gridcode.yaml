# Redacted grid-code parameter fixture for the Envision ENPCS01 GFL PCS.
#
# REFERENCED, NEVER EXECUTED. This file carries ONLY the grid-code CONstants parsed
# from the OEM dynamic model. The ENPCS01 binaries this fixture was derived from
# (.dyr / .dll / .pfd) are NOT committed and are not required to run any test — the
# grid study (D1, analytics.grid.*) consumes these redacted values as reference data
# only.
#
# Scope note, 27 August 2026: a LATER and DIFFERENT model set — the ENPCS2520 / VSG
# series (ENVSG01, ENPPC, PCSControllerInterface, ENVSG_PPC_2520_260416_LKA.dyr,
# PCS2520x4_UPPC_x64_260605aBB.pscx) — IS now committed, at
# docs/source_materials/nso_bess_250mw_2026/oem/envision/dynamic_models/, on the
# project owner's explicit authority. That does not change the handling of the
# ENPCS01 set above, and none of it is executed by any test either. See
# docs/source_materials/nso_bess_250mw_2026/source_packages/README.md.
#
# Units: rating in kW; per-unit (pu) on machine base unless noted; frequency in Hz;
# time thresholds in seconds. Trip tables are ordered (setpoint @ clearing-time) pairs.
provenance: "Envision ENPCS01 GFL PCS — PSS/E UDM V2 (2025-03-17) + DigSILENT V1.2a (2025-05-06); grid-code CONs parsed 2026-07-06; OEM .dyr/.dll/.pfd proprietary, referenced-not-executed."

pcs:
  model: "Envision ENPCS01"
  topology: "GFL"  # grid-following
  rating_kw: 2750

  # Reactive-capability envelope
  pf_range: [-0.95, 0.95]
  q_range_pu: [-0.5, 0.5]

  # Ride-through entry thresholds (pu)
  lvrt_enter_pu: 0.89
  hvrt_enter_pu: 1.10

  # Fault-current injection gains (dimensionless k-factor)
  lvrt_k_factor: 2.0
  hvrt_k_factor: 1.9

  # Frequency trip tables (Hz @ seconds)
  freq_trip_hz:
    underfrequency:
      - [47.5, 1800.0]
      - [47.0, 0.1]
    overfrequency:
      - [51.5, 1800.0]
      - [52.0, 0.1]

  # Voltage trip tables (pu @ seconds)
  volt_trip_pu:
    undervoltage:
      - [0.85, 21.0]
      - [0.50, 11.0]
    overvoltage:
      - [1.1, 20.0]
      - [1.2, 1.0]
      - [1.3, 0.1]

  # Harmonic current-emission spectrum (D7, #883): per-order emission as a percentage of
  # the plant maximum-demand (rated) current IL. REFERENCED, not executed — the redacted
  # OEM current-emission table. Order 1 is the fundamental (100 %); the rest are the
  # characteristic converter harmonics the D7 screen refers to Zbus(h) to get the POC
  # harmonic VOLTAGE, compared to the SCR-indexed IEEE 519:2022 limits.
  harmonic_spectrum:
    - [1, 100.0]
    - [5, 2.4]
    - [7, 1.5]
    - [11, 0.9]
    - [13, 0.7]
    - [17, 0.4]
    - [19, 0.3]
    - [23, 0.2]
    - [25, 0.2]

  # IEC 61400-21 short-term flicker coefficient c(psi_k, va) for the PCS at continuous
  # operation (dimensionless) — the D7 flicker Pst = c * S_rated / Ssc term.
  flicker_coefficient: 3.4

  # Frequency ride-through / primary-frequency-response band (D7 headroom sizing). The
  # continuous-operation window (Hz) and the governor droop the de-load headroom is sized
  # from. continuous_hz mirrors the longest-clearing setpoints of freq_trip_hz above.
  freq_ride_through:
    continuous_hz: [47.5, 51.5]
    droop: 0.04
