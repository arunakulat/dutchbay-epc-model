# Scenarios whose statutory values differ from the Sri Lanka pack 1.0.0 (#1842).
#
# tests/jurisdiction_packs/test_jurisdiction_pack_schema.py recomputes this list from
# scenarios/ on every run and fails if it differs. A new disagreement, or a corrected
# one, must therefore be classified here in the same change.
#
# Classifications:
#   synthetic_fixture      a test or example scenario that is not meant to carry Sri Lanka law
#   project_override       a project-specific choice (relief, exemption) recorded as a rate
#   discrepancy_for_owner  a value that may be wrong for the project; for the owner to rule.
#                          Not corrected here: this change moves no value.
#
# Values are as the scenario files state them on main 4cfed491.

