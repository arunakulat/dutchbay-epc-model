# GitHub Actions CI/CD Workflow for FX Integration Testing
# Triggered on:
#  - Pushes to main/feature/fx-* branches
#  - PRs targeting main
#  - Changes to FX files, pipeline_v14, or FX tests

name: FX Integration Tests

on:
  push:
    branches:
      - main
      - feature/fx-*
    paths:
      - 'analytics/fx/**'
      - 'analytics/fx_integration.py'
      - 'analytics/pipeline_v14.py'
      - 'analytics/contracts_v14.py'
      - 'tests/test_fx_pipeline_integration.py'
      - '.github/workflows/fx-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'analytics/fx/**'
      - 'analytics/fx_integration.py'
      - 'analytics/pipeline_v14.py'
      - 'analytics/contracts_v14.py'
      - 'tests/test_fx_pipeline_integration.py'

jobs:
  # ===========================================================================
  # FX Integration Tests
  # ===========================================================================
  fx-tests:
    name: FX Integration Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install pytest pytest-cov pytest-xdist pytest-timeout

      - name: Run FX integration tests
        run: |
          pytest tests/test_fx_pipeline_integration.py -v \
            --cov=analytics.fx \
            --cov=analytics.fx_integration \
            --cov=analytics.pipeline_v14 \
            --cov-report=xml \
            --cov-report=term-missing \
            --tb=short \
            --maxfail=3
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: fx-integration
          name: fx-coverage-py${{ matrix.python-version }}
          fail_ci_if_error: false

  # ===========================================================================
  # Code Quality Checks
  # ===========================================================================
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort mypy flake8 pylint
          pip install -e .[dev]

      - name: Check formatting with Black
        run: black --check analytics/fx/ tests/test_fx_pipeline_integration.py
        continue-on-error: true

      - name: Check import order with isort
        run: isort --check-only analytics/fx/ tests/test_fx_pipeline_integration.py
        continue-on-error: true

      - name: Type check with mypy
        run: mypy analytics/fx/ --ignore-missing-imports
        continue-on-error: true

      - name: Lint with flake8
        run: flake8 analytics/fx/ tests/test_fx_pipeline_integration.py --max-line-length=88
        continue-on-error: true

  # ===========================================================================
  # Full Pipeline Tests (Quick Smoke Test)
  # ===========================================================================
  smoke-test:
    name: Smoke Test - Full Pipeline with FX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install pytest

      - name: Run smoke test - pipeline with FX
        run: |
          python -c "
          import logging
          logging.basicConfig(level=logging.DEBUG)
          from analytics.pipeline_v14 import run_v14_pipeline
          
          config = {
              'scenario_name': 'smoke_test_with_fx',
              'Project': {
                  'name': 'SmokeTestProject',
                  'capex_usd': 100_000_000,
                  'opex_usd_yr': 5_000_000,
                  'project_life_years': 10,
                  'construction_years': 2,
              },
              'Financing_Terms': {
                  'total_debt_usd': 70_000_000,
                  'debt_tenor_years': 8,
                  'rates': {'usd_commercial_min': 0.08},
              },
              'FX': {
                  'strategy': 'blended',
                  'curve': {'lkr_usd': [300] * 10},
              },
          }
          
          result = run_v14_pipeline(config=config, validation_mode='off')
          assert result['scenario_result']['fx_block'] is not None, 'FX block missing!'
          print('✓ Smoke test passed: FX block populated')
          "
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Run smoke test - pipeline without FX
        run: |
          python -c "
          from analytics.pipeline_v14 import run_v14_pipeline
          
          config = {
              'scenario_name': 'smoke_test_without_fx',
              'Project': {
                  'name': 'SmokeTestProject',
                  'capex_usd': 100_000_000,
                  'opex_usd_yr': 5_000_000,
                  'project_life_years': 10,
                  'construction_years': 2,
              },
              'Financing_Terms': {
                  'total_debt_usd': 70_000_000,
                  'debt_tenor_years': 8,
                  'rates': {'usd_commercial_min': 0.08},
              },
          }
          
          result = run_v14_pipeline(config=config, validation_mode='off')
          assert result['scenario_result']['fx_block'] is None, 'FX block should be None'
          print('✓ Smoke test passed: Backward compatibility maintained')
          "
        env:
          PYTHONPATH: ${{ github.workspace }}

  # ===========================================================================
  # Summary
  # ===========================================================================
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [fx-tests, code-quality, smoke-test]
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.fx-tests.result }}" == "failure" ]; then
            echo "❌ FX Integration Tests failed"
            exit 1
          fi
          if [ "${{ needs.smoke-test.result }}" == "failure" ]; then
            echo "❌ Smoke Tests failed"
            exit 1
          fi
          echo "✅ All tests passed!"
      - name: Post to GitHub
        if: always()
        run: |
          echo "### FX Integration Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **FX Tests:** ${{ needs.fx-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Code Quality:** ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Smoke Tests:** ${{ needs.smoke-test.result }}" >> $GITHUB_STEP_SUMMARY
