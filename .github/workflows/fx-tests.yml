# GitHub Actions CI/CD Workflow for FX Integration Testing
# Triggered on:
#  - Pushes to main/feature/fx-* branches
#  - PRs targeting main
#  - Changes to FX files, pipeline_v14, or FX tests

name: FX Integration Tests

on:
  push:
    branches:
      - main
      - feature/fx-*
    paths:
      - 'analytics/fx/**'
      - 'analytics/pipeline_v14.py'
      - 'analytics/contracts_v14.py'
      - 'tests/analytics_layer/test_fx_sensitivity_real.py'
      - '.github/workflows/fx-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'analytics/fx/**'
      - 'analytics/pipeline_v14.py'
      - 'analytics/contracts_v14.py'
      - 'tests/analytics_layer/test_fx_sensitivity_real.py'
      - '.github/workflows/fx-tests.yml'

jobs:
  fx-tests:
    name: FX Integration Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .[dev]
          pip install pytest pytest-cov pytest-xdist pytest-timeout

      - name: Run FX integration tests
        run: |
          pytest tests/analytics_layer/test_fx_sensitivity_real.py -v \
            --cov=analytics.fx \
            --cov=analytics.pipeline_v14 \
            --cov-report=xml \
            --cov-report=term-missing \
            --tb=short \
            --maxfail=3
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: fx-integration
          name: fx-coverage-py${{ matrix.python-version }}
          fail_ci_if_error: false

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black isort mypy flake8 pylint
          pip install -e .[dev]

      - name: Check formatting with Black
        run: black --check analytics/fx/ tests/analytics_layer/test_fx_sensitivity_real.py
        continue-on-error: true

      - name: Check import order with isort
        run: isort --check-only analytics/fx/ tests/analytics_layer/test_fx_sensitivity_real.py
        continue-on-error: true

      - name: Type check with mypy
        run: mypy analytics/fx/ --ignore-missing-imports
        continue-on-error: true

      - name: Lint with flake8
        run: flake8 analytics/fx/ tests/analytics_layer/test_fx_sensitivity_real.py --max-line-length=88
        continue-on-error: true

  smoke-test:
    name: Smoke Test - Full Pipeline with FX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .[dev]
          pip install pytest

      - name: Run smoke test - pipeline with FX
        run: |
          python -c "from pathlib import Path; from unittest.mock import patch; from analytics.pipeline_v14 import run_v14_pipeline; p = Path('scenarios/dutchbay_lendercase_2025Q4.yaml'); assert p.exists(), p; wr = {'wind_data': {'mean_ws': 7.85}, 'energy_production': {'gross_aep': {'capacity_factor_gross': 45.0}, 'net_aep': {'net_aep_p50_mwh': 563000.0, 'net_aep_p75_mwh': 540000.0, 'net_aep_p90_mwh': 500000.0, 'capacity_factor_net_p75': 41.1}}, 'statistical_analysis': {'weibull': {'shape_k': 2.1, 'scale_c': 8.32}}}; cf = {'revenue_annual_usd': 36540000.0}; StubWindPipeline = type('StubWindPipeline', (), {'__init__': lambda self, *a, **k: None, 'run_complete_assessment': lambda self, *a, **k: wr, 'export_for_cashflow_model': lambda self, *a, **k: cf}); ctx = patch('analytics.pipeline_v14.WindPipeline', StubWindPipeline); ctx.start(); result = run_v14_pipeline(config=str(p), validation_mode='off'); ctx.stop(); assert result['status'] == 'success'; assert result['config']['project_name'] == 'DutchBay Wind Farm'; assert result['aep_p75_mwh'] == 540000.0; print('Smoke test passed: path-based FX scenario pipeline invocation works')"
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Run smoke test - pipeline without FX
        run: |
          python -c "from pathlib import Path; from tempfile import NamedTemporaryFile; from unittest.mock import patch; import yaml; from analytics.pipeline_v14 import run_v14_pipeline; src = Path('scenarios/dutchbay_lendercase_2025Q4.yaml'); assert src.exists(), src; cfg = yaml.safe_load(src.read_text()); cfg.pop('fx', None); tmp = NamedTemporaryFile('w', suffix='.yaml', delete=False); yaml.safe_dump(cfg, tmp); tmp.close(); wr = {'wind_data': {'mean_ws': 7.85}, 'energy_production': {'gross_aep': {'capacity_factor_gross': 45.0}, 'net_aep': {'net_aep_p50_mwh': 563000.0, 'net_aep_p75_mwh': 540000.0, 'net_aep_p90_mwh': 500000.0, 'capacity_factor_net_p75': 41.1}}, 'statistical_analysis': {'weibull': {'shape_k': 2.1, 'scale_c': 8.32}}}; cf = {'revenue_annual_usd': 36540000.0}; StubWindPipeline = type('StubWindPipeline', (), {'__init__': lambda self, *a, **k: None, 'run_complete_assessment': lambda self, *a, **k: wr, 'export_for_cashflow_model': lambda self, *a, **k: cf}); ctx = patch('analytics.pipeline_v14.WindPipeline', StubWindPipeline); ctx.start(); result = run_v14_pipeline(config=tmp.name, validation_mode='off'); ctx.stop(); assert result['status'] == 'success'; assert result['config']['project_name'] == 'DutchBay Wind Farm'; assert result['aep_p75_mwh'] == 540000.0; print('Smoke test passed: path-based non-FX scenario pipeline invocation works')"
        env:
          PYTHONPATH: ${{ github.workspace }}

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [fx-tests, code-quality, smoke-test]
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.fx-tests.result }}" == "failure" ]; then
            echo "FX Integration Tests failed"
            exit 1
          fi
          if [ "${{ needs.smoke-test.result }}" == "failure" ]; then
            echo "Smoke Tests failed"
            exit 1
          fi
          echo "All tests passed"
      - name: Post to GitHub
        if: always()
        run: |
          echo "### FX Integration Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **FX Tests:** ${{ needs.fx-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Code Quality:** ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Smoke Tests:** ${{ needs.smoke-test.result }}" >> $GITHUB_STEP_SUMMARY
