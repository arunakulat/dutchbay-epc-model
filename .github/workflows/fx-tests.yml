# GitHub Actions CI/CD Workflow for FX Integration Testing
# Triggered on:
#  - Pushes to main/feature/fx-* branches
#  - PRs targeting main
#  - Changes to FX files, the canonical pipeline_v14_enhanced, or FX tests

name: FX Integration Tests

on:
  push:
    branches:
      - main
    paths:
      - 'analytics/fx/**'
      - 'analytics/pipeline_v14_enhanced.py'
      - 'analytics/contracts_v14.py'
      - 'tests/analytics_layer/test_fx_sensitivity_real.py'
      - '.github/workflows/fx-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'analytics/fx/**'
      - 'analytics/pipeline_v14_enhanced.py'
      - 'analytics/contracts_v14.py'
      - 'tests/analytics_layer/test_fx_sensitivity_real.py'
      - '.github/workflows/fx-tests.yml'

# Cancel a superseded PR run when a new commit is pushed; main runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fx-tests:
    name: FX Integration Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .[dev]
          pip install pytest pytest-cov pytest-xdist pytest-timeout

      - name: Run FX integration tests
        run: |
          pytest tests/analytics_layer/test_fx_sensitivity_real.py -v \
            --cov=analytics.fx \
            --cov-report=xml \
            --cov-report=term-missing \
            --tb=short \
            --maxfail=3
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          flags: fx-integration
          name: fx-coverage-py${{ matrix.python-version }}
          fail_ci_if_error: false

  code-quality:
    name: FX Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy flake8 pylint
          pip install -e .[dev]

      # Advisory black/isort steps removed: formatting and import order are
      # enforced repo-wide by the MANDATORY lint gate in test-suite.yml (#545),
      # which supersedes the FX-scoped advisory checks that used to run here.

      - name: Type check with mypy
        run: mypy analytics/fx/ --ignore-missing-imports
        continue-on-error: true

      - name: Lint with flake8
        run: flake8 analytics/fx/ tests/analytics_layer/test_fx_sensitivity_real.py --max-line-length=88
        continue-on-error: true

  smoke-test:
    name: Smoke Test - Full Pipeline with FX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .[dev]
          pip install pytest

      - name: Run smoke test - canonical pipeline on the FX lender scenario
        # #456: the legacy wind-only analytics.pipeline_v14 was retired (folded onto
        # pipeline_v14_enhanced). This smokes the canonical pipeline on the FX-bearing
        # lender scenario end-to-end (strict validation incl. the FX mapping) and
        # asserts it returns finance KPIs + the debt result.
        run: |
          python -c "from pathlib import Path; from analytics.pipeline_v14_enhanced import run_v14_pipeline; p = Path('scenarios/dutchbay_lendercase_2025Q4.yaml'); assert p.exists(), p; result = run_v14_pipeline(config=str(p), validation_mode='strict'); assert result.get('kpis'), 'pipeline returned no KPIs'; assert 'project_irr' in result['kpis']; assert 'debt_result' in result; print('Smoke test passed: canonical FX scenario pipeline invocation works')"
        env:
          PYTHONPATH: ${{ github.workspace }}

  test-summary:
    name: FX Test Summary
    runs-on: ubuntu-latest
    needs: [fx-tests, code-quality, smoke-test]
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.fx-tests.result }}" == "failure" ]; then
            echo "FX Integration Tests failed"
            exit 1
          fi
          if [ "${{ needs.smoke-test.result }}" == "failure" ]; then
            echo "Smoke Tests failed"
            exit 1
          fi
          echo "All tests passed"
      - name: Post to GitHub
        if: always()
        run: |
          echo "### FX Integration Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **FX Tests:** ${{ needs.fx-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Code Quality:** ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Smoke Tests:** ${{ needs.smoke-test.result }}" >> $GITHUB_STEP_SUMMARY
