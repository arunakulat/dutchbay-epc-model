name: Test Suite

on:
  push:
    branches: [ main, develop, feature/*, resolution/* ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Nightly full-matrix run (03:17 UTC) so the 3.11 leg that PRs skip is still
    # exercised every day against main.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write
  issues: write

jobs:
  test:
    name: Run Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # On a PR, test only 3.12 (the dominant dev/runtime version) to halve the
        # gate's wall time; on push-to-main, the nightly schedule, and manual
        # dispatch, run the FULL 3.11+3.12 matrix so cross-version breaks still
        # surface before a release. The required 'Test Summary' check aggregates
        # whatever legs ran (needs.test), so PR merges are unaffected; a 3.11-only
        # regression would surface at merge-to-main / nightly rather than on the PR.
        python-version: ${{ (github.event_name == 'pull_request') && fromJSON('["3.12"]') || fromJSON('["3.11", "3.12"]') }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        # ".[wind]" pulls the xarray/netcdf4/cdsapi toolchain so the wind
        # adapter + NetCDF/GIS xarray tests run in the gate (was opt-in only).
        python -m pip install -e ".[wind,gis]"
        python -m pip install pytest pytest-cov pytest-xdist pytest-html

    - name: Display environment info
      run: |
        python --version
        pip --version
        pytest --version

    - name: Run test suite
      run: |
        # Run the FULL tests/ tree (no test paths are excluded; the _quarantine dir is gone).
        # Previously this listed explicit sub-paths, which silently hid failures in any
        # UNLISTED file (e.g. tests/analytics/test_oem_parser / test_tax_sensitivity /
        # test_casper_payload_equity_contract / test_aep_loader). Those are now triaged
        # (migrated or xfailed), so the whole tree is green and the gate can no longer be
        # dodged by omission — the same class of hole as the #149 Test Summary rubber-stamp.
        # -n auto runs the suite across all runner cores via pytest-xdist (a
        # pinned, already-installed dependency that was never being invoked, so
        # the suite ran serially). The full ~2,625-test tree is xdist-safe and drops
        # from minutes to seconds. pytest-cov combines per-worker coverage
        # automatically, so the Codecov upload below is unaffected. --verbose is
        # dropped: under xdist it interleaves worker output into noise, and the
        # junit/html artifacts already carry per-test detail.
        pytest \
          tests/ \
          -n auto \
          --tb=short \
          --maxfail=10 \
          --junit-xml=test-results-${{ matrix.python-version }}.xml \
          --html=test-report-${{ matrix.python-version }}.html \
          --self-contained-html \
          --cov=finance \
          --cov=analytics \
          --cov=wind_resource \
          --cov=api \
          --cov=app \
          --cov-report=term-missing \
          --cov-report=xml \
          --cov-report=html

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.python-version }}
        path: |
          test-results-*.xml
          test-report-*.html
          htmlcov/
          coverage.xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      if: matrix.python-version == '3.11'
      with:
        files: ./coverage.xml
        flags: unittests
        name: dutchbay-epc-coverage
        fail_ci_if_error: false

    - name: Comment test results on PR
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always() && github.event_name == 'pull_request'
      with:
        files: test-results-*.xml
        check_name: Test Results (Python ${{ matrix.python-version }})
        compare_to_earlier_commit: false

  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install linting tools
      run: |
        # The mypy gate must run against a FAITHFUL environment. With only
        # ruff/black/mypy installed (no project deps), mypy reported ~36 spurious
        # "Class cannot subclass BaseModel (has type Any)" errors because pydantic
        # was absent. Mirror the test job's install so pydantic/omegaconf/numpy/
        # xarray are present, and pin mypy to the version the v14 surface was
        # cleared against (1.19.0) — newer mypy emits different unused-ignore
        # diagnostics. Without this, the gate would be both noisy and unstable.
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m pip install -e ".[wind,gis]"
        pip install ruff black mypy==1.19.0

    - name: Run ruff (mandatory gate)
      # MANDATORY: no '|| true'. A lint regression now fails the 'lint' job and,
      # via the Test Summary gate below, blocks the merge. The repo is ruff-clean.
      run: ruff check . --output-format=github

    - name: Run black (check only)
      run: black --check --diff . || true

    - name: Run mypy (library + engine surface — strict, fail-loud)
      # Strict, COMPLETE-annotation gate over EVERY typed package + entrypoint, not just
      # finance/analytics. wind_resource, solar_resource, api, app and analysis_tools plus
      # the root entrypoints were previously UNCHECKED, so real type bugs (float(str|None),
      # DatetimeIndex.year on a plain Index, Series-vs-DataFrame in the wind AEP path) sat
      # undetected. No --ignore-missing-imports: every untyped third-party dep is declared
      # per-module in mypy.ini, so a NEW unstubbed import fails LOUDLY instead of being
      # silently swallowed. (monte_carlo/ is a YAML config dir with no .py; scripts/ has its
      # own relaxed real-error gate below.)
      run: >-
        mypy finance/ analytics/ wind_resource/ solar_resource/ api/ app/ analysis_tools/
        run_full_pipeline_v14.py run_scenario_analytics_v14.py
        dutchbay_bootstrap.py dutchbay_bootstrap_rules.py constants.py

    - name: Run mypy (scripts/ — real-error gate)
      # scripts/ are operational/reporting utilities, not the typed public API, so the
      # annotation-COMPLETENESS mandates are relaxed (--allow-untyped-*), but mypy's
      # REAL bug-detection stays on: attr-defined, arg-type, bad index/operator, wrong
      # assignment, call-arg/overload and return-type errors all fail CI. A separate
      # invocation (not a [mypy-scripts.*] section) is required because scripts/ has no
      # __init__.py, so mypy names those modules by basename and a section never matches.
      run: >-
        mypy scripts/ --ignore-missing-imports
        --allow-untyped-defs --allow-untyped-calls --allow-any-generics

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install security tooling
      # Bandit does static analysis (no import) and pip-audit audits the
      # requirements.txt FILE (resolves from PyPI), so neither needs the project
      # deps installed — keep this job fast.
      run: |
        python -m pip install --upgrade pip
        pip install bandit pip-audit

    - name: Run security gate (bandit SAST + pip-audit dependency CVEs)
      # MANDATORY. `make security` is the single source of truth for BOTH the bandit
      # invocation (fail on MEDIUM+ severity/confidence over the engine surface; known-
      # safe findings carry inline `# nosec` justifications) AND the pip-audit dependency
      # scan with the reviewed, documented allowlist of version-capped advisories. Running
      # it here keeps local `make security` and CI byte-identical. Any NEW vulnerability
      # (or a new bandit MEDIUM+) fails this job and — via Test Summary — blocks the merge.
      run: make security

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test, lint, security]
    if: always()

    steps:
    - name: Check test status
      run: |
        echo "Test suite completed (test=${{ needs.test.result }}, lint=${{ needs.lint.result }})"
        echo "View detailed results in artifacts"
        # Gate the required 'Test Summary' check on the ACTUAL pytest-matrix
        # result. Without this the job only echoes and passes even when 'test'
        # is RED — i.e. the required check was a rubber-stamp. 'needs.test.result'
        # aggregates the matrix: 'success' only if every leg (3.11 + 3.12) passed;
        # any failure/cancel/skip is non-success and blocks the merge.
        # The 'lint' job is a ruff + mypy gate: ruff (whole repo) is now MANDATORY
        # (no '|| true'), mypy runs strict over finance/ + analytics/ and a relaxed
        # real-error pass over scripts/, and only black stays advisory ('|| true').
        # Any ruff or mypy regression fails 'lint' and — via the second check below —
        # blocks the merge. (PR4: fix-first mypy gate; ruff promoted to mandatory and
        # scripts/ added to the mypy gate once both reached zero errors.)
        if [ "${{ needs.test.result }}" != "success" ]; then
          echo "::error::Test job did not succeed (result=${{ needs.test.result }}) — blocking Test Summary"
          exit 1
        fi
        if [ "${{ needs.lint.result }}" != "success" ]; then
          echo "::error::Lint job did not succeed (result=${{ needs.lint.result }}) — mypy gate failed; blocking Test Summary"
          exit 1
        fi
        if [ "${{ needs.security.result }}" != "success" ]; then
          echo "::error::Security job did not succeed (result=${{ needs.security.result }}) — bandit/pip-audit gate failed; blocking Test Summary"
          exit 1
        fi
