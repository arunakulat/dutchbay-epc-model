name: Test Suite

on:
  push:
    branches: [ main, develop, feature/*, resolution/* ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write
  issues: write

jobs:
  test:
    name: Run Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        # ".[wind]" pulls the xarray/netcdf4/cdsapi toolchain so the wind
        # adapter + NetCDF/GIS xarray tests run in the gate (was opt-in only).
        python -m pip install -e ".[wind]"
        python -m pip install pytest pytest-cov pytest-xdist pytest-html

    - name: Display environment info
      run: |
        python --version
        pip --version
        pytest --version

    - name: Run test suite
      run: |
        # Run the FULL tests/ tree (pytest.ini norecursedirs excludes tests/_quarantine).
        # Previously this listed explicit sub-paths, which silently hid failures in any
        # UNLISTED file (e.g. tests/analytics/test_oem_parser / test_tax_sensitivity /
        # test_casper_payload_equity_contract / test_aep_loader). Those are now triaged
        # (migrated or xfailed), so the whole tree is green and the gate can no longer be
        # dodged by omission — the same class of hole as the #149 Test Summary rubber-stamp.
        pytest \
          tests/ \
          --verbose \
          --tb=short \
          --maxfail=10 \
          --junit-xml=test-results-${{ matrix.python-version }}.xml \
          --html=test-report-${{ matrix.python-version }}.html \
          --self-contained-html \
          --cov=finance \
          --cov=analytics \
          --cov-report=term-missing \
          --cov-report=xml \
          --cov-report=html

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.python-version }}
        path: |
          test-results-*.xml
          test-report-*.html
          htmlcov/
          coverage.xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      if: matrix.python-version == '3.11'
      with:
        files: ./coverage.xml
        flags: unittests
        name: dutchbay-epc-coverage
        fail_ci_if_error: false

    - name: Comment test results on PR
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always() && github.event_name == 'pull_request'
      with:
        files: test-results-*.xml
        check_name: Test Results (Python ${{ matrix.python-version }})
        compare_to_earlier_commit: false

  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install linting tools
      run: |
        pip install ruff black mypy

    - name: Run ruff
      run: ruff check . --output-format=github || true

    - name: Run black (check only)
      run: black --check --diff . || true

    - name: Run mypy
      run: mypy finance/ analytics/ --ignore-missing-imports || true

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: always()

    steps:
    - name: Check test status
      run: |
        echo "Test suite completed (test=${{ needs.test.result }}, lint=${{ needs.lint.result }})"
        echo "View detailed results in artifacts"
        # Gate the required 'Test Summary' check on the ACTUAL pytest-matrix
        # result. Without this the job only echoes and passes even when 'test'
        # is RED — i.e. the required check was a rubber-stamp. 'needs.test.result'
        # aggregates the matrix: 'success' only if every leg (3.11 + 3.12) passed;
        # any failure/cancel/skip is non-success and blocks the merge.
        # 'lint' stays advisory by design — the Code Quality Checks job runs
        # ruff/black/mypy with '|| true', so it is not a meaningful gate.
        if [ "${{ needs.test.result }}" != "success" ]; then
          echo "::error::Test job did not succeed (result=${{ needs.test.result }}) — blocking Test Summary"
          exit 1
        fi
