name: Test Suite

on:
  push:
    branches: [ main, develop, feature/*, resolution/* ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write
  issues: write

jobs:
  test:
    name: Run Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m pip install -e .
        python -m pip install pytest pytest-cov pytest-xdist pytest-html

    - name: Display environment info
      run: |
        python --version
        pip --version
        pytest --version

    - name: Run test suite
      run: |
        # Default CI tracks the supported v14 surface plus the green suites
        # promoted in #136 (finance + integration + root contract/refinancing
        # tests). Still parked until their feature contracts/deps are restored:
        # NetCDF/GIS xarray tests, dual-DSCR sizing, legacy Phase-3 sensitivity.
        pytest \
          tests/api \
          tests/analytics_layer \
          tests/contracts \
          tests/lint \
          tests/integration \
          tests/finance \
          tests/test_contracts_v14_validators.py \
          tests/test_refinancing_v14_hardened.py \
          --verbose \
          --tb=short \
          --maxfail=10 \
          --junit-xml=test-results-${{ matrix.python-version }}.xml \
          --html=test-report-${{ matrix.python-version }}.html \
          --self-contained-html \
          --cov=finance \
          --cov=analytics \
          --cov-report=term-missing \
          --cov-report=xml \
          --cov-report=html

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.python-version }}
        path: |
          test-results-*.xml
          test-report-*.html
          htmlcov/
          coverage.xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      if: matrix.python-version == '3.11'
      with:
        files: ./coverage.xml
        flags: unittests
        name: dutchbay-epc-coverage
        fail_ci_if_error: false

    - name: Comment test results on PR
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always() && github.event_name == 'pull_request'
      with:
        files: test-results-*.xml
        check_name: Test Results (Python ${{ matrix.python-version }})
        compare_to_earlier_commit: false

  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install linting tools
      run: |
        pip install ruff black mypy

    - name: Run ruff
      run: ruff check . --output-format=github || true

    - name: Run black (check only)
      run: black --check --diff . || true

    - name: Run mypy
      run: mypy finance/ analytics/ --ignore-missing-imports || true

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: always()

    steps:
    - name: Check test status
      run: |
        echo "Test suite completed"
        echo "View detailed results in artifacts"
