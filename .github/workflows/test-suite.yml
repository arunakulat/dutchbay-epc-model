name: Test Suite

on:
  # Work reaches main only through PRs (GWTF GOV-01) and the ruleset requires branches to be
  # up to date before merge, so the tree a PR validates is byte-identical to the tree that
  # lands. The post-merge `push: main` run therefore re-tested an identical tree — pure
  # duplication, and this is the most expensive workflow in the repo (~89% of billed
  # minutes, ~63 per run across a 6-shard matrix). It is dropped here.
  #
  # Post-merge health on main is still covered, cheaply: "CI - v14 fastlane" (~2 min) and
  # "Regression Smoke" (~3 min) both still run on push to main, so a bad merge or a direct
  # push still raises a signal — at ~5 minutes instead of ~63.
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Weekly run (Mondays 03:17 UTC): the backstop that runs regardless of PR activity,
    # catching dependency drift and flakes on an otherwise unchanged tree. Reduced from
    # nightly — seven full-suite runs a week on an unchanged tree cost ~1,900 billed
    # minutes a month, which is itself most of a private-repo monthly allowance.
    - cron: '17 3 * * 1'
  workflow_dispatch:

# Cancel superseded runs for the same PR (a new push aborts the in-flight run instead of
# piling up). cancel-in-progress is scoped to pull_request events, so main/schedule runs are
# never cancelled — every merged commit is still fully validated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write
  pull-requests: write
  issues: write

# TEST-03: every ordinary pytest job is the bounded regression/coverage gate.
# The separately named stochastic-qualification job overrides this explicitly.
#
# TOTAL_SHARDS is WORKFLOW-level, not job-level, because two jobs must agree on it: the
# `test` job splits the tree into that many pytest-split groups, and the `coverage` job
# checks it received that many shard artifacts before enforcing the floor. A second
# hard-coded count in the coverage job could drift from the matrix and silently weaken the
# completeness check, so there is exactly one number here. The `shard:` matrix list must
# still be written out literally — GitHub does not expose the `env` context to
# `strategy` — so tests/lint/test_coverage_gate_policy.py pins the list against this
# value, which is the only place the two can be held together.
env:
  DUTCHBAY_TEST_MODE: full
  TOTAL_SHARDS: 6

jobs:
  changes:
    # Docs-only fast path (CI cost diet): classify the PR diff ONCE; when every changed
    # file is documentation (markdown anywhere, changelog.d/ fragments, docs/), the
    # expensive pytest shards + coverage combine SKIP THEIR STEPS while the jobs (and the
    # required 'Test Summary' check) still report success — a changelog flush or docs PR
    # costs ~2 runner-minutes instead of ~35. Fail-safe direction: ANY file outside the
    # allowlist (or an empty/undeterminable diff) classifies as code and the full gate
    # runs; a false negative can only ever run MORE tests, never fewer. Non-PR events
    # (push-to-main, nightly, dispatch) always classify as code.
    name: Classify changed paths
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.classify.outputs.code_changed }}
      qsts_execution_changed: ${{ steps.classify.outputs.qsts_execution_changed }}
    steps:
    - name: Checkout repository (full history for the base diff)
      if: github.event_name == 'pull_request'
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        # Classify the immutable PR head rather than GitHub's synthetic merge ref.
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Classify diff against the PR base
      id: classify
      run: |
        if [ "${{ github.event_name }}" != "pull_request" ]; then
          echo "code_changed=true" >> "$GITHUB_OUTPUT"
          echo "qsts_execution_changed=false" >> "$GITHUB_OUTPUT"
          echo "non-PR event: full gate"
          exit 0
        fi
        changed_files="$RUNNER_TEMP/changed-files.z"
        git diff --name-only -z "${{ github.event.pull_request.base.sha }}...HEAD" > "$changed_files"
        files=$(tr '\0' '\n' < "$changed_files")
        echo "changed files:"; echo "$files"
        code=false
        [ -z "$files" ] && code=true  # undeterminable diff -> run everything
        while IFS= read -r f; do
          [ -z "$f" ] && continue
          case "$f" in
            *.md) ;;            # markdown anywhere (README, CHANGELOG, memory docs)
            changelog.d/*) ;;   # changelog fragments (incl. deletions on flush)
            docs/*) ;;          # docs tree
            *) code=true; break ;;
          esac
        done <<< "$files"
        # TEST-05: the strict classifier writes qsts_execution_changed directly to
        # GITHUB_OUTPUT. Empty/unsafe/indeterminate input requires Grid Study.
        python scripts/ci/classify_grid_study_paths.py < "$changed_files"
        echo "code_changed=$code" >> "$GITHUB_OUTPUT"
        echo "classification: code_changed=$code"

  test:
    # Sharded matrix: the ~3,600-test tree is split into TOTAL_SHARDS balanced slices
    # (pytest-split --splits/--group) that run as parallel jobs, so the gate's wall-clock
    # is the slowest single shard instead of the full serial-ish suite. Each shard still
    # runs its slice across the runner cores via -n auto, so the two parallelisms
    # compound. Coverage is measured per shard (DATA FILE ONLY — NO --cov-fail-under
    # here, one shard cannot reach the 95% floor alone); the combined 95% gate lives in
    # the `coverage` job below, preserving R8/TEST-02.
    name: Run Tests (Python ${{ matrix.python-version }}, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: changes

    # TOTAL_SHARDS is inherited from the workflow-level env above — it is shared with the
    # `coverage` job, which must know how many shard artifacts to expect.

    strategy:
      fail-fast: false
      matrix:
        # SINGLE-VERSION matrix since the 3.12 baseline migration (#923 unblock):
        # requires-python is now >=3.12, so 3.11 is no longer a supported target and
        # the old per-event 3.11/3.12 split (#959) has nothing left to discriminate.
        # The migration was forced by pandapower — the self-curtailment finance wiring
        # makes it a runtime dependency of the canonical path once
        # grid.qsts.finance_wiring.enabled is flipped, and its scipy pin is
        # irreconcilable with the lock on 3.11.
        # Restore a second leg here (and in the coverage job below) if a future
        # floor/ceiling pair needs gating again — e.g. adding 3.13 forward-compat.
        # The required 'Test Summary' check aggregates whatever legs ran (needs.test),
        # so 'success' requires every leg that ran to pass.
        python-version: ${{ fromJSON('["3.12"]') }}
        shard: [1, 2, 3, 4, 5, 6]

    steps:
    - name: Checkout repository
      if: needs.changes.outputs.code_changed == 'true'
      uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      if: needs.changes.outputs.code_changed == 'true'
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      if: needs.changes.outputs.code_changed == 'true'
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        # ".[wind]" pulls the xarray/netcdf4/cdsapi toolchain so the wind
        # adapter + NetCDF/GIS xarray tests run in the gate (was opt-in only).
        python -m pip install -e ".[wind,gis]"
        python -m pip install pytest pytest-cov pytest-xdist pytest-split pytest-html

    - name: Display environment info
      if: needs.changes.outputs.code_changed == 'true'
      run: |
        python --version
        pip --version
        pytest --version

    - name: Skip note (docs-only PR)
      if: needs.changes.outputs.code_changed != 'true'
      run: echo "Docs-only PR — pytest shard skipped (see the 'Classify changed paths' job)."

    - name: Run test shard ${{ matrix.shard }}/${{ env.TOTAL_SHARDS }}
      if: needs.changes.outputs.code_changed == 'true'
      env:
        # Distinct per-shard coverage data file so the combine job merges cleanly.
        COVERAGE_FILE: .coverage.${{ matrix.python-version }}.${{ matrix.shard }}
      run: |
        # Full tests/ tree, split into TOTAL_SHARDS TIME-balanced groups by pytest-split
        # using the committed `.test_durations` (passed explicitly via --durations-path;
        # it is pytest-split's default, but being explicit documents the dependency and
        # survives a rootdir change). Balancing is by duration SUM, so groups carry unequal
        # test COUNTS by design; a test absent from the durations file is assigned the mean.
        # Regenerate periodically with `pytest tests/ --store-durations` so new tests are
        # timed (see #760). --splitting-algorithm least_duration bin-packs tests into
        # shards by duration (greedy LPT) instead of the default CONTIGUOUS chunking,
        # which stranded whole heavy files in one shard (measured 426s vs 129s spread
        # on the first 6-shard run). Non-contiguous grouping is safe here: -n auto
        # already distributes tests across workers arbitrarily WITHIN a shard, so
        # inter-test order was never guaranteed anyway. The whole tree is still exercised — every test runs in exactly
        # one shard, so the gate can't be dodged by omission (the #149 Test Summary hole).
        # -n auto parallelises WITHIN each shard; the two parallelisms compound.
        # Coverage writes DATA ONLY (--cov-report=) — the `coverage` job runs
        # coverage combine + report --fail-under=95 over all shards (R8/TEST-02).
        pytest \
          tests/ \
          --splits "$TOTAL_SHARDS" \
          --group ${{ matrix.shard }} \
          --splitting-algorithm least_duration \
          --durations-path .test_durations \
          -n auto \
          --tb=short \
          --maxfail=10 \
          --junit-xml=test-results-${{ matrix.python-version }}-${{ matrix.shard }}.xml \
          --cov=finance \
          --cov=analytics \
          --cov=wind_resource \
          --cov=api \
          --cov=app \
          --cov=solar_resource \
          --cov-report=

    - name: Upload shard artifacts (coverage data + junit)
      uses: actions/upload-artifact@v7
      if: always() && needs.changes.outputs.code_changed == 'true'
      with:
        name: shard-${{ matrix.python-version }}-${{ matrix.shard }}
        include-hidden-files: true   # .coverage.* are dotfiles
        path: |
          .coverage.${{ matrix.python-version }}.${{ matrix.shard }}
          test-results-${{ matrix.python-version }}-${{ matrix.shard }}.xml

  coverage:
    # Combined coverage gate (R8/TEST-02): merges every shard's per-shard coverage data
    # for a given Python version and enforces the 95% floor over the UNION — the exact
    # gate the old single-job `--cov-fail-under=95` provided, now downstream of sharding.
    name: Coverage Gate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: always()

    outputs:
      # 'true' only once every shard's coverage data was present AND the floor was
      # actually evaluated over the union. The `summary` job reads this to tell a real
      # floor breach apart from a gate that never had a complete tree to measure — the
      # two look identical from `needs.coverage.result` alone, and naming the wrong one
      # is the #1121 misattribution in the form it left behind. The matrix is
      # single-legged (3.12), so this job output is unambiguous; restoring a second
      # version leg means revisiting this (matrix legs overwrite each other's outputs).
      enforced: ${{ steps.floor.outputs.enforced }}

    strategy:
      fail-fast: false
      matrix:
        # Mirrors the test job's version selection (3.12 only since the baseline
        # migration) so the gate combines exactly the shards that ran.
        python-version: ${{ fromJSON('["3.12"]') }}

    steps:
    - name: Checkout repository
      if: needs.changes.outputs.code_changed == 'true'
      uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      if: needs.changes.outputs.code_changed == 'true'
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install project (for coverage source resolution) + coverage
      if: needs.changes.outputs.code_changed == 'true'
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m pip install -e ".[wind,gis]"
        python -m pip install "coverage>=7"

    - name: Download this version's shard artifacts
      if: needs.changes.outputs.code_changed == 'true'
      uses: actions/download-artifact@v8
      with:
        pattern: shard-${{ matrix.python-version }}-*
        path: shard-artifacts
        merge-multiple: true

    - name: Skip note (docs-only PR)
      if: needs.changes.outputs.code_changed != 'true'
      run: echo "Docs-only PR — no shard coverage produced; the 95% floor gate is not applicable."

    - name: Combine coverage + enforce 95% floor
      id: floor
      if: needs.changes.outputs.code_changed == 'true'
      run: |
        # Gather the per-shard data files and merge. `coverage combine` auto-discovers
        # .coverage.* in the working dir, so move them out of the artifact dir first.
        mv shard-artifacts/.coverage.${{ matrix.python-version }}.* . 2>/dev/null || true

        # COMPLETENESS BEFORE ENFORCEMENT. Cancellation is routine here: the workflow's
        # `concurrency` group cancels in-flight PR runs when a newer commit is pushed. A
        # cancelled shard STILL runs its `Upload shard artifacts` step (always()), and
        # that step succeeds while uploading no coverage data — so the download below
        # succeeds too, carrying only the shards that actually finished. Combining that
        # subset produces a REAL percentage over an INCOMPLETE tree, and the floor then
        # reports it as a coverage regression. Observed on run 33960436162 (PR #1233):
        # shards 2, 3 and 5 cancelled, three of six artifacts combined, 'TOTAL 89.72%',
        # 'Coverage failure: total of 89.72 is less than fail-under=95.00'. Nothing was
        # wrong with coverage; half the suite never reported.
        #
        # That is the #1121 defect in the form it left behind — attributing a cause to a
        # non-success result that was really a cancellation — so count the input first
        # and, when it is short, say THAT instead of printing a floor breach. This still
        # BLOCKS: a shard that never reported means the floor was never measured, which
        # is not a pass. The floor itself is untouched at 95%.
        echo "enforced=false" >> "$GITHUB_OUTPUT"
        present=$(ls -1 .coverage.${{ matrix.python-version }}.* 2>/dev/null | wc -l | tr -d '[:space:]')
        if [ "$present" -ne "$TOTAL_SHARDS" ]; then
          echo "shard coverage data actually present:"
          ls -la .coverage.${{ matrix.python-version }}.* 2>/dev/null || echo "  (none)"
          echo "::error::coverage not enforced: $present of $TOTAL_SHARDS shard artifacts present; shards were cancelled or did not complete, so this number is not a coverage measurement. This is NOT a coverage regression — re-run the suite on the current head."
          exit 1
        fi
        echo "$present of $TOTAL_SHARDS shard artifacts present — enforcing the 95% floor over the union."

        coverage combine
        # Set BEFORE the floor runs. 'enforced' means "the floor was applied to a complete
        # union", NOT "the floor passed" — the default shell is `bash -e`, so a genuine
        # breach exits here and anything written after it would never run, collapsing a
        # real regression into the same output as a cancelled run. That inversion is
        # exactly the ambiguity this output exists to remove.
        echo "enforced=true" >> "$GITHUB_OUTPUT"
        coverage report --fail-under=95
        coverage xml
        coverage html

    - name: Upload combined coverage
      uses: actions/upload-artifact@v7
      if: always() && needs.changes.outputs.code_changed == 'true'
      with:
        name: coverage-${{ matrix.python-version }}
        path: |
          coverage.xml
          htmlcov/

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      if: matrix.python-version == '3.12' && needs.changes.outputs.code_changed == 'true'
      with:
        files: ./coverage.xml
        flags: unittests
        name: dutchbay-epc-coverage
        fail_ci_if_error: false

    - name: Publish combined test results on PR
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always() && github.event_name == 'pull_request' && needs.changes.outputs.code_changed == 'true'
      with:
        files: shard-artifacts/test-results-${{ matrix.python-version }}-*.xml
        check_name: Test Results (Python ${{ matrix.python-version }})
        compare_to_earlier_commit: false

  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install linting tools
      run: |
        # The mypy gate must run against a FAITHFUL environment. With only
        # ruff/black/mypy installed (no project deps), mypy reported ~36 spurious
        # "Class cannot subclass BaseModel (has type Any)" errors because pydantic
        # was absent. Mirror the test job's install so pydantic/omegaconf/numpy/
        # xarray are present, and pin mypy to the version the v14 surface was
        # cleared against (1.19.0) — newer mypy emits different unused-ignore
        # diagnostics. Without this, the gate would be both noisy and unstable.
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m pip install -e ".[wind,gis]"
        pip install ruff black isort mypy==1.19.0

    - name: Run ruff (mandatory gate)
      # MANDATORY: no '|| true'. A lint regression now fails the 'lint' job and,
      # via the Test Summary gate below, blocks the merge. The repo is ruff-clean.
      run: ruff check . --output-format=github

    - name: Run black (mandatory gate)
      # MANDATORY (no '|| true' since the repo-wide reformat cleared the 210-file backlog):
      # black --check now blocks the merge on any un-black'd file, matching ruff/mypy.
      run: black --check --diff .

    - name: Run isort (mandatory gate)
      # MANDATORY: import ordering enforced repo-wide. isort uses profile=black (pyproject),
      # so it converges with black instead of fighting it; any misordered import blocks merge.
      run: isort --check-only --diff .

    - name: Run mypy (library + engine surface — strict, fail-loud)
      # Strict, COMPLETE-annotation gate over EVERY typed package + entrypoint, not just
      # finance/analytics. wind_resource, solar_resource, api, app and analysis_tools plus
      # the root entrypoints were previously UNCHECKED, so real type bugs (float(str|None),
      # DatetimeIndex.year on a plain Index, Series-vs-DataFrame in the wind AEP path) sat
      # undetected. No --ignore-missing-imports: every untyped third-party dep is declared
      # per-module in mypy.ini, so a NEW unstubbed import fails LOUDLY instead of being
      # silently swallowed. (monte_carlo/ is a YAML config dir with no .py; scripts/ has its
      # own relaxed real-error gate below.)
      run: >-
        mypy finance/ analytics/ wind_resource/ solar_resource/ api/ app/ analysis_tools/
        run_full_pipeline_v14.py run_scenario_analytics_v14.py
        dutchbay_bootstrap.py dutchbay_bootstrap_rules.py constants.py

    - name: Run mypy (scripts/ — real-error gate)
      # scripts/ are operational/reporting utilities, not the typed public API, so the
      # annotation-COMPLETENESS mandates are relaxed (--allow-untyped-*), but mypy's
      # REAL bug-detection stays on: attr-defined, arg-type, bad index/operator, wrong
      # assignment, call-arg/overload and return-type errors all fail CI. A separate
      # invocation (not a [mypy-scripts.*] section) is required because scripts/ has no
      # __init__.py, so mypy names those modules by basename and a section never matches.
      run: >-
        mypy scripts/ --ignore-missing-imports
        --allow-untyped-defs --allow-untyped-calls --allow-any-generics

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install security tooling
      # Bandit does static analysis (no import) and pip-audit audits the
      # requirements.txt FILE (resolves from PyPI), so neither needs the project
      # deps installed — keep this job fast.
      run: |
        python -m pip install --upgrade pip
        pip install bandit pip-audit

    - name: Run security gate (bandit SAST + pip-audit dependency CVEs)
      # MANDATORY. `make security` is the single source of truth for BOTH the bandit
      # invocation (fail on MEDIUM+ severity/confidence over the engine surface; known-
      # safe findings carry inline `# nosec` justifications) AND the pip-audit dependency
      # scan with the reviewed, documented allowlist of version-capped advisories. Running
      # it here keeps local `make security` and CI byte-identical. Any NEW vulnerability
      # (or a new bandit MEDIUM+) fails this job and — via Test Summary — blocks the merge.
      run: make security

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [changes, test, lint, security, coverage, grid-study]
    if: always()

    steps:
    - name: Check test status
      run: |
        echo "Test suite completed (test=${{ needs.test.result }}, lint=${{ needs.lint.result }}, coverage=${{ needs.coverage.result }}, grid-study=${{ needs.grid-study.result }})"
        echo "View detailed results in artifacts"
        # Gate the required 'Test Summary' check on the ACTUAL pytest-matrix
        # result. Without this the job only echoes and passes even when 'test'
        # is RED — i.e. the required check was a rubber-stamp. 'needs.test.result'
        # aggregates the matrix: 'success' only if every leg that ran passed;
        # any failure/cancel/skip is non-success and blocks the merge.
        # The 'lint' job is a ruff + black + isort + mypy gate, ALL MANDATORY (no '|| true'):
        # ruff (whole repo), black --check + isort --check (whole repo, after the repo-wide
        # reformat cleared the backlog; profile=black so they converge), and mypy strict over
        # the typed surface + a relaxed real-error pass over scripts/. Any regression fails
        # 'lint' and — via the second check below — blocks the merge. (PR4: fix-first mypy gate;
        # scripts/ added to the mypy gate once both reached zero errors.)
        # Attribute a CAUSE only when the job actually FAILED. A non-success result
        # is just as often 'cancelled' (a newer push supersedes the run and cancels
        # in-flight jobs) or 'skipped' (an upstream dependency did not run). Naming
        # the gate's failure mode unconditionally sends the reader hunting a
        # regression that does not exist — a cancelled lint job reported itself as
        # "mypy gate failed". Blocking behaviour is unchanged: any non-success on a
        # required job still exits 1.
        gate() {
          # $1 human-readable job name, $2 needs.<job>.result, $3 what a real failure means
          if [ "$2" = "success" ]; then
            return 0
          fi
          if [ "$2" = "failure" ]; then
            echo "::error::$1 job failed (result=$2) — $3; blocking Test Summary"
          else
            echo "::error::$1 job did not complete (result=$2) — this is not a $1 regression; a run superseded by a newer push reports 'cancelled', an unrun dependency reports 'skipped'. Blocking Test Summary because the gate could not be confirmed; re-run on the current head."
          fi
          exit 1
        }
        gate "Test" "${{ needs.test.result }}" "the pytest matrix did not pass"
        gate "Lint" "${{ needs.lint.result }}" "the ruff/black/isort/mypy gate failed"
        gate "Security" "${{ needs.security.result }}" "the bandit/pip-audit gate failed"
        # The 'coverage' job runs `coverage combine` over every shard's data and enforces
        # the R8/TEST-02 95% floor over the UNION (the gate the old single-job
        # --cov-fail-under provided, now downstream of sharding). A coverage regression
        # below 95% fails that job and — here — blocks the merge.
        #
        # But TWO different causes both surface as coverage=failure, and they are not
        # distinguishable from `needs.coverage.result` alone: a real breach, and a gate
        # that never had every shard's data to combine because shards were cancelled by a
        # superseding push. The job publishes `enforced` for exactly this — 'true' once
        # the floor was applied to a complete union. Naming a coverage regression in the
        # second case sends the reader hunting one that does not exist, and (worse) makes
        # a genuine regression easy to wave away as "probably just cancelled shards".
        # Blocking behaviour is identical either way.
        if [ "${{ needs.coverage.outputs.enforced }}" = "true" ]; then
          coverage_cause="combined coverage fell below the 95% R8/TEST-02 floor"
        else
          coverage_cause="the gate never applied the floor to a complete tree — it did not receive all ${TOTAL_SHARDS} shards' coverage data (shards cancelled or incomplete), or it failed before the floor ran; its own log names which. Any percentage printed there is NOT a coverage measurement and NOT evidence of a coverage regression; re-run on the current head"
        fi
        gate "Coverage" "${{ needs.coverage.result }}" "$coverage_cause"
        grid_required=false
        if [ "${{ needs.changes.outputs.qsts_execution_changed }}" = "true" ] || \
           [ "${{ github.event_name }}" = "schedule" ] || \
           [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          grid_required=true
        fi
        if [ "$grid_required" = "true" ] && [ "${{ needs.grid-study.result }}" != "success" ]; then
          echo "::error::Grid Study is required but did not succeed (result=${{ needs.grid-study.result }}) — blocking Test Summary"
          exit 1
        fi

  # TEST-03 scale lane: intentionally separate from the required PR gate and from
  # bankability/release evidence. It runs only on the nightly/manual triggers, on
  # Python 3.12, and selects only explicitly marked qualification tests.
  stochastic-qualification:
    name: Stochastic Qualification (Python 3.12, scheduled/manual)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    env:
      DUTCHBAY_TEST_MODE: qualification
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: pip
    - name: Install governed qualification environment
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m pip install -e ".[dev,wind,gis]"
    - name: Run explicitly marked stochastic qualification tests
      run: >-
        python -m pytest -n auto -m stochastic_qualification --tb=short
        --junit-xml=stochastic-qualification-results.xml
    - name: Upload qualification test result
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: stochastic-qualification-python-3.12
        path: stochastic-qualification-results.xml

  # TEST-04 live report lane: the complete supplemental-sensitivity builder and
  # real PDF backend remain covered without making transport-only tests repeat
  # finance, tornado, Morris and PAWN on every PR. Like the stochastic lane, this
  # is scheduled/manual and does not manufacture a release or bankability claim.
  report-qualification:
    name: Report Qualification (Python 3.12, scheduled/manual)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    env:
      DUTCHBAY_TEST_MODE: qualification
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: pip
    - name: Install governed report qualification environment
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m pip install -e ".[dev,wind,gis,report]"
    - name: Run explicitly marked report qualification tests
      run: >-
        python -m pytest -n 2 tests/integration/test_lender_report_e2e.py
        tests/integration/test_synthetic_qsts_finance_report.py
        -m report_qualification --tb=short
        --junit-xml=report-qualification-results.xml
    - name: Upload qualification test result
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: report-qualification-python-3.12
        path: report-qualification-results.xml

  # TEST-05 / #1107 independent Grid Study. QSTS/grid execution-path PRs are
  # classified fail closed and must run this job on the immutable PR head. Nightly
  # and manual qualification retain the same lane. The required Test Summary waits
  # for and enforces success whenever this job is applicable; unrelated PRs receive
  # a governed skip. This job is execution evidence only, never bankability,
  # convergence, lender, finance, or real-feeder evidence.
  grid-study:
    name: Grid Study (QSTS-required or scheduled)
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      needs.changes.outputs.qsts_execution_changed == 'true')
    env:
      DUTCHBAY_GRID_CI_EXECUTION: independent
      EXPECTED_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      PULL_REQUEST_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'not-applicable' }}
    steps:
    - name: Checkout exact pull-request head
      uses: actions/checkout@v7
      with:
        fetch-depth: 1
        persist-credentials: false
        ref: ${{ env.EXPECTED_HEAD_SHA }}
    - name: Verify and record immutable execution identity
      run: |
        actual_head_sha="$(git rev-parse HEAD)"
        if [[ ! "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::Expected head SHA is not an exact 40-character Git SHA: $EXPECTED_HEAD_SHA"
          exit 1
        fi
        if [ "$actual_head_sha" != "$EXPECTED_HEAD_SHA" ]; then
          echo "::error::Checkout SHA mismatch: expected=$EXPECTED_HEAD_SHA actual=$actual_head_sha"
          exit 1
        fi
        {
          echo "### Independent Grid Study identity"
          echo "- Event: ${{ github.event_name }}"
          echo "- Pull request: $PULL_REQUEST_NUMBER"
          echo "- Expected head SHA: $EXPECTED_HEAD_SHA"
          echo "- Checked-out head SHA: $actual_head_sha"
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: pip
    - name: Install with [grid] extra (core pins constrained)
      # requirements.txt (installed first) holds the frozen core lock (numpy==2.4.6/
      # scipy==1.17.1/pandas==2.3.3); the exact pandapower==3.3.0 pin accepts those and
      # cannot pull 3.4.x/3.3.3 (which cap scipy<1.17). PIP_CONSTRAINT adds pandas<3.
      env:
        PIP_CONSTRAINT: constraints.txt
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m pip install -e ".[grid]"
        python -m pip install pytest pytest-xdist
    - name: Verify OpenDSSDirect is installed
      run: |
        python -c "import opendssdirect"
        python - <<'PY'
        import os
        import platform

        import opendssdirect

        with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
            stream.write(f"- Python: {platform.python_version()}\n")
            stream.write(f"- OpenDSSDirect: {opendssdirect.Basic.Version()}\n")
        PY
    - name: Run grid-marked tests
      env:
        PYTHONDONTWRITEBYTECODE: "1"
      run: >-
        python -m pytest tests/ -m grid -n auto --tb=short
        --junit-xml=grid-study-results.xml
    - name: Upload concise Grid Study result
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: grid-study-python-3.12-${{ github.run_id }}-${{ github.run_attempt }}
        path: grid-study-results.xml
