name: "CI - v14 fastlane"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  fastlane:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Ruff - lint focused v14 surface
        run: |
          ruff check \
            analytics/contracts_v14.py \
            analytics/contracts/__init__.py \
            analytics/scenario_loader.py \
            analytics/fx_sensitivity_real.py \
            finance/refinancing_v14_hardened.py \
            run_full_pipeline_v14.py

      - name: Mypy - focused v14 surface
        run: |
          python -m mypy --follow-imports=skip \
            analytics/contracts_v14.py \
            analytics/contracts/__init__.py \
            analytics/scenario_loader.py \
            analytics/fx_sensitivity_real.py \
            finance/refinancing_v14_hardened.py \
            run_full_pipeline_v14.py

      - name: Pytest - fast lane (including Sprint 11 compliance tests)
        run: |
          # + green suites promoted in #136: finance + integration + root contract/refinancing tests
          pytest \
            tests/api \
            tests/analytics_layer \
            tests/contracts \
            tests/lint \
            tests/integration \
            tests/finance \
            tests/test_contracts_v14_validators.py \
            tests/test_refinancing_v14_hardened.py \
            --maxfail=1 \
            --disable-warnings \
            --tb=short
