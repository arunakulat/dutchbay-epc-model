# CI - v14 fastlane
#
# Genuinely FAST early-fail lane: a focused ruff + mypy pass over the v14 entrypoint
# surface on Python 3.11, so an obvious break fails in ~a couple of minutes without
# waiting on the sharded suite. It deliberately does NOT run the test tree anymore
# (#760): the full ~3,500-test suite is the `test` job in test-suite.yml — sharded +
# `-n auto` on 3.12 for every PR, and the FULL 3.11+3.12 matrix on push-to-main and the
# nightly schedule. Running the whole suite here too (single-process, ~9m) made this the
# merge-critical long pole AND executed the tree twice per PR; removing it lets the gate's
# wall-clock be the slowest shard. `fastlane` remains a required status check (name
# preserved — no ruleset change); the 3.11 leg PRs skip is still covered post-merge/nightly.
name: "CI - v14 fastlane"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel a superseded PR run when a new commit is pushed; main runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fastlane:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Dev tooling now comes from the [dev] extra (pyproject is the source of truth);
          # the former `requirements-dev.txt` conditional was a dead hyphen-typo no-op
          # (the file is requirements_dev.txt) and that file has been retired.
          # wind extra (xarray/netcdf4/cdsapi) for the gated wind + NetCDF tests;
          # gis extra (rasterio) for the #20 GeoTIFF-export tests
          pip install -e ".[dev,wind,gis]"

      - name: Ruff - lint focused v14 surface
        run: |
          ruff check \
            analytics/contracts_v14.py \
            analytics/contracts/__init__.py \
            analytics/scenario_loader.py \
            analytics/fx_sensitivity_real.py \
            run_full_pipeline_v14.py

      - name: Mypy - focused v14 surface
        run: |
          python -m mypy --follow-imports=skip \
            analytics/contracts_v14.py \
            analytics/contracts/__init__.py \
            analytics/scenario_loader.py \
            analytics/fx_sensitivity_real.py \
            run_full_pipeline_v14.py

      # The full tests/ tree runs in test-suite.yml's sharded `test` job (gated by the
      # required `Test Summary` check), NOT here — see the header note (#760). This lane is
      # lint-only so it cannot be the merge long pole or a redundant second full-suite run.
