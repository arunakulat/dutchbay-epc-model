# CI - v14 fastlane
#
# Genuinely FAST early-fail lane: a focused ruff + mypy pass over the v14 entrypoint
# surface on Python 3.12, so an obvious break fails in ~a couple of minutes without
# waiting on the sharded suite. It deliberately does NOT run the test tree anymore
# (#760): the full ~3,500-test suite is the `test` job in test-suite.yml — sharded +
# `-n auto` across the 3.12 baseline on every PR, plus the nightly
# full-matrix schedule against main. Running the whole suite here too (single-process,
# ~9m) made this the merge-critical long pole AND executed the tree twice per PR;
# removing it lets the gate's wall-clock be the slowest shard. `fastlane` remains a
# required status check (name preserved — no ruleset change).
name: "CI - v14 fastlane"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel a superseded PR run when a new commit is pushed; main runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fastlane:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Dev tooling now comes from the [dev] extra (pyproject is the source of truth);
          # the former `requirements-dev.txt` conditional was a dead hyphen-typo no-op
          # (the file is requirements_dev.txt) and that file has been retired.
          # wind extra (xarray/netcdf4/cdsapi) for the gated wind + NetCDF tests;
          # gis extra (rasterio) for the #20 GeoTIFF-export tests
          pip install -e ".[dev,wind,gis]"

      - name: Ruff - lint focused v14 surface
        run: |
          ruff check \
            analytics/contracts_v14.py \
            analytics/contracts/__init__.py \
            analytics/scenario_loader.py \
            analytics/fx_sensitivity_real.py \
            run_full_pipeline_v14.py

      - name: Mypy - focused v14 surface
        run: |
          python -m mypy --follow-imports=skip \
            analytics/contracts_v14.py \
            analytics/contracts/__init__.py \
            analytics/scenario_loader.py \
            analytics/fx_sensitivity_real.py \
            run_full_pipeline_v14.py

      # CESSPIT gate on the NSO evidence corpus: manifest <-> tree agreement in BOTH
      # directions, nested-manifest parent pins, and the single-source handling note.
      # It lives HERE, in the one lane that runs unconditionally on every PR, rather than
      # in the sharded suite: test-suite.yml skips its pytest shard for docs-only PRs, and
      # every corpus-manifest defect that has reached main arrived on a docs-only PR. A
      # guard that skips on exactly the changes it exists to catch is not a guard. Costs
      # ~1s and needs only stdlib + git.
      - name: Evidence corpus - manifest and single-source handling gate
        run: python -m pytest tests/lint/test_nso_corpus_manifest_integrity.py -q

      # The full tests/ tree runs in test-suite.yml's sharded `test` job (gated by the
      # required `Test Summary` check), NOT here — see the header note (#760). This lane is
      # lint-only so it cannot be the merge long pole or a redundant second full-suite run.
