name: "CI - v14 fastlane"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel a superseded PR run when a new commit is pushed; main runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fastlane:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Dev tooling now comes from the [dev] extra (pyproject is the source of truth);
          # the former `requirements-dev.txt` conditional was a dead hyphen-typo no-op
          # (the file is requirements_dev.txt) and that file has been retired.
          # wind extra (xarray/netcdf4/cdsapi) for the gated wind + NetCDF tests;
          # gis extra (rasterio) for the #20 GeoTIFF-export tests
          pip install -e ".[dev,wind,gis]"

      - name: Ruff - lint focused v14 surface
        run: |
          ruff check \
            analytics/contracts_v14.py \
            analytics/contracts/__init__.py \
            analytics/scenario_loader.py \
            analytics/fx_sensitivity_real.py \
            run_full_pipeline_v14.py

      - name: Mypy - focused v14 surface
        run: |
          python -m mypy --follow-imports=skip \
            analytics/contracts_v14.py \
            analytics/contracts/__init__.py \
            analytics/scenario_loader.py \
            analytics/fx_sensitivity_real.py \
            run_full_pipeline_v14.py

      - name: Pytest - fast lane (including Sprint 11 compliance tests)
        run: |
          # Run the FULL tests/ tree (no test paths are excluded) so the fast lane
          # cannot hide failures in unlisted files either; --maxfail=1 keeps it fail-fast.
          pytest \
            tests/ \
            --maxfail=1 \
            --disable-warnings \
            --tb=short
