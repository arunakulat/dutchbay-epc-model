# Build the deployment image and prove it boots (issue #845).
#
# This is the REAL build+boot proof for the container scaffolding: the image is built
# with the same two-step install strategy the Dockerfile uses, then run, and the
# unversioned /health liveness route is polled. /health needs no auth and DUTCHBAY_ENV
# is left unset (permissive development posture), so no secrets are required for the
# smoke test — a throwaway DUTCHBAY_JWT_SECRET is supplied only so the app imports
# cleanly.
#
# It also gates one thing /health cannot reach: that WeasyPrint's HarfBuzz-Subset path is
# live INSIDE the image. WeasyPrint 70.0 dlopens libharfbuzz-subset0 by name with
# allow_fail=True, so a missing runtime library degrades silently onto a deprecated
# fontTools path rather than failing, on the lender-facing PDF surface. /health renders no
# PDF, so only a real render inside the image can see it.
name: docker-build

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - requirements.txt
      - constraints.txt
      - app/**
      - scripts/check_image_harfbuzz_subset.py
      - .github/workflows/docker-build.yml
  # `push` removed: the same paths-scoped build already ran on the PR against an
  # up-to-date branch, so the post-merge rebuild duplicated it. Use workflow_dispatch
  # to rebuild main on demand.
  workflow_dispatch:

jobs:
  build-and-smoke:
    name: build image and smoke /health
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (load into the local docker daemon)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: dutchbay-epc-model:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prove WeasyPrint takes the HarfBuzz-Subset path inside the image
        # The build above proves libharfbuzz-subset0 RESOLVES AND INSTALLS on bookworm --
        # a fact about the build host's package index. It does not prove the LOADER FINDS
        # IT AT RUN TIME, from the runtime stage, under the non-root account, with the
        # venv's interpreter, and WeasyPrint 70.0 dlopens it with allow_fail=True: absent,
        # it does not fail, it silently subsets every face with fontTools on its own
        # deprecated path. The /health boot check below cannot see that either, because
        # /health renders no PDF. This is the gap PR #1266 deferred; the script closes it.
        #
        # Piped over stdin rather than executed from the image, so the gate keeps working
        # if .dockerignore ever stops shipping scripts/ into the runtime layer.
        run: |
          set -euo pipefail
          docker run --rm -i dutchbay-epc-model:ci python - \
            < scripts/check_image_harfbuzz_subset.py

      - name: Boot the web process and poll /health
        run: |
          set -euo pipefail

          # DUTCHBAY_ENV unset => permissive development posture; /health needs no auth.
          # DUTCHBAY_JOBS_BACKEND=memory keeps the in-process job path (no Redis needed).
          docker run -d --name dbtest -p 8080:8080 \
            -e DUTCHBAY_JWT_SECRET=ci-not-a-real-secret \
            -e DUTCHBAY_JOBS_BACKEND=memory \
            dutchbay-epc-model:ci

          echo "Waiting for GET /health to return 200 (up to ~40s)..."
          ok=""
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8080/health; then
              echo
              echo "Health check passed on attempt ${i}."
              ok="yes"
              break
            fi
            sleep 1
          done

          if [ -z "${ok}" ]; then
            echo "::error::/health did not become ready within ~40s"
            echo "----- docker logs dbtest -----"
            docker logs dbtest || true
            exit 1
          fi

      - name: Dump container logs on failure
        if: failure()
        run: docker logs dbtest || true

      - name: Stop and remove the smoke container
        if: always()
        run: |
          docker stop dbtest || true
          docker rm dbtest || true
