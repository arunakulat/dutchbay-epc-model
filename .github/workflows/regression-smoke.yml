name: Regression Smoke

on:
  # NOT paths-scoped: `smoke` is a REQUIRED status check (ruleset "main branch protection"), so it
  # must run on every PR — paths-scoping it would leave non-matching PRs waiting forever on a check
  # that never reports. We only drop the stale v14chat-upgrade branch and add run-cancellation.
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Type check focused smoke surface
        run: |
          python -m mypy --follow-imports=skip \
            analytics/contracts_v14.py \
            analytics/contracts/__init__.py \
            analytics/scenario_loader.py \
            run_full_pipeline_v14.py

      - name: Smoke tests
        run: |
          pytest tests/api/test_cashflow_v14_rows.py -m smoke -q --tb=short --override-ini=addopts=

      - name: Full suite + coverage
        run: |
          pytest tests/api/test_cashflow_v14_rows.py -q --tb=short --override-ini=addopts=
