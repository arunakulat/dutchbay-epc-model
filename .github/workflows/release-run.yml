name: Release Run

on:
  push:
    tags:
      - "v*"

env:
  DUTCHBAY_TEST_MODE: full

jobs:
  release:
    runs-on: ubuntu-latest
    # Needed for the gh CLI to create/update the GitHub Release on the pushed tag.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          # Faithful release env — mirrors test-suite.yml (#454). The pinned lock carries
          # the full surface (fastapi/uvicorn, pvlib, reportlab, …); the prior ".[dev]"-only
          # install omitted fastapi, so the unguarded api/app test imports errored at
          # collection (exit 2) and the release artifact never built. api/app are
          # coverage-surface packages, so their tests must RUN here, not skip.
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev,wind,gis]"

      - name: Run full tests
        run: |
          python -m pytest

      - name: Run stochastic qualification tests
        env:
          DUTCHBAY_TEST_MODE: qualification
        run: |
          # Separate from the bounded regression suite. A green test result is a
          # scale gate, not by itself a convergence/bankability evidence receipt.
          python -m pytest -n auto -m stochastic_qualification --tb=short

      - name: Run report qualification tests
        env:
          DUTCHBAY_TEST_MODE: qualification
        run: |
          # Preserve live supplemental-sensitivity + real PDF coverage outside
          # the bounded transport/renderer regression suite.
          python -m pytest -n 2 tests/integration/test_lender_report_e2e.py \
            -m report_qualification --tb=short

      - name: Run v14 lender pipeline smoke
        run: |
          # Targeted smoke over the canonical lender pipeline (MC) + sensitivity CLI.
          # The previous targets were dead — tests/test_v14_pipeline_smoke.py is a
          # quarantine tombstone (0 tests) and tests/test_cli_v14_smoke.py never existed
          # (pytest would exit 4 on the missing path), so this step gave no real signal.
          python -m pytest \
            tests/integration/test_mc_canonical_scenario.py \
            tests/integration/test_sensitivity_cli_smoke.py

      - name: Build lendercase artifacts
        run: |
          python run_full_pipeline_v14.py \
            config=scenarios/dutchbay_lendercase_2025Q4.yaml \
            validation_mode=strict \
            validation_modules=[cashflow,debt] \
            export_dir=_out/release_run \
            write_artifacts=true

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dutchbay-v14-release-artifacts
          path: _out/release_run/

      - name: Package the release zip
        run: |
          # Name the zip from the VERSION file (single source of truth, RELEASING.md §7):
          # DutchBay_Model_V<version>.zip — independent of how the tag is spelled.
          VERSION="$(cat VERSION)"
          mkdir -p _out/release_zip
          ZIP="_out/release_zip/DutchBay_Model_V${VERSION}.zip"
          (cd _out/release_run && zip -r "${GITHUB_WORKSPACE}/${ZIP}" .)
          echo "RELEASE_ZIP=${ZIP}" >> "$GITHUB_ENV"

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Idempotent (re-tagging a release re-uploads the asset rather than failing).
          # Pre-release tags (a hyphen, e.g. v15.1.0-rc1) are marked as such.
          PRERELEASE=""
          case "$TAG" in *-*) PRERELEASE="--prerelease" ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RELEASE_ZIP" --clobber
          else
            gh release create "$TAG" "$RELEASE_ZIP" \
              --title "$TAG" \
              --notes "Automated release for $TAG (artifacts built from scenarios/dutchbay_lendercase_2025Q4.yaml; see CHANGELOG.md)." \
              $PRERELEASE
          fi
