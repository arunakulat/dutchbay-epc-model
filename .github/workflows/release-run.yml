name: Release Run

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          # Faithful release env — mirrors test-suite.yml (#454). The pinned lock carries
          # the full surface (fastapi/uvicorn, pvlib, reportlab, …); the prior ".[dev]"-only
          # install omitted fastapi, so the unguarded api/app test imports errored at
          # collection (exit 2) and the release artifact never built. api/app are
          # coverage-surface packages, so their tests must RUN here, not skip.
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev,wind,gis]"

      - name: Run full tests
        run: |
          pytest

      - name: Run v14 lender pipeline smoke
        run: |
          # Targeted smoke over the canonical lender pipeline (MC) + sensitivity CLI.
          # The previous targets were dead — tests/test_v14_pipeline_smoke.py is a
          # quarantine tombstone (0 tests) and tests/test_cli_v14_smoke.py never existed
          # (pytest would exit 4 on the missing path), so this step gave no real signal.
          python -m pytest \
            tests/integration/test_mc_canonical_scenario.py \
            tests/integration/test_sensitivity_cli_smoke.py

      - name: Build lendercase artifacts
        run: |
          python run_full_pipeline_v14.py \
            config=scenarios/dutchbay_lendercase_2025Q4.yaml \
            validation_mode=strict \
            validation_modules=[cashflow,debt] \
            export_dir=_out/release_run \
            write_artifacts=true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dutchbay-v14-release-artifacts
          path: _out/release_run/
