name: Release Run

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run full tests
        run: |
          pytest

      - name: Run v14 lender pipeline smoke
        run: |
          python -m pytest \
            tests/test_v14_pipeline_smoke.py \
            tests/test_cli_v14_smoke.py

      - name: Build lendercase artifacts
        run: |
          python run_full_pipeline_v14.py \
            --config scenarios/dutchbay_lendercase_2025Q4.yaml \
            --output-dir _out/release_run

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dutchbay-v14-release-artifacts
          path: _out/release_run/
