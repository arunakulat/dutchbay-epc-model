# Dependabot version updates. (The previous file was the unconfigured GitHub scaffold —
# `package-ecosystem: ""` is invalid, so version updates were a silent no-op; #C2.)
#
# NB: Dependabot SECURITY alerts/updates are settings-driven and were unaffected by the
# broken file — this only restores PROACTIVE version + action-pin updates.
#
# Grouping: one PR per ecosystem (patterns "*") so updates land as a single reviewable,
# resolution-checked bump rather than a flood — and so a leaf bump arrives WITH the pinned
# consumers it constrains (the repo's hard-won grouped-bump lesson; see #262 and
# [[engineering-workflow-lessons]] — always `pip install --dry-run` a Dependabot PR before merge).
version: 2
updates:
  # Python deps: pyproject.toml (abstract) + the requirements.txt lock.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns:
          - "*"
    # MAJOR-version updates on the load-bearing set are POLICY DECISIONS, not bot
    # chores (#756 post-mortem: the weekly group bumped pandas 2->3 and rewrote our
    # own pyproject `<3.0` cap to make it fit, desynced mypy/isort/ruff from the
    # versions the mandatory gates were cleared against, and shipped an internally
    # inconsistent freeze — ResolutionImpossible at pip install).
    #  - Engine numerics (pandas/numpy/scipy/pydantic + their stubs): majors land only
    #    via a deliberate, KPI-oracle-verified migration (pandas 3.0 = #593).
    #  - Gate toolchain: mypy diagnostics change on MINORS (the lint job pins the
    #    cleared 1.19.0); ruff is 0.x-versioned, so minors are its breaking level;
    #    black is CalVer (every yearly bump is a "major").
    # Minor/patch updates keep flowing weekly for everything else, and Dependabot
    # SECURITY updates are settings-driven — unaffected by these ignores.
    ignore:
      - dependency-name: "pandas"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pandas-stubs"
        update-types: ["version-update:semver-major"]
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "scipy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "scipy-stubs"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pydantic"
        update-types: ["version-update:semver-major"]
      # pydantic-core is EXACT-pinned by pydantic (pydantic 2.13.4 requires
      # pydantic-core==2.46.4), so it must NEVER be bumped independently — a standalone
      # bump makes the lock internally contradictory and un-installable (#978 post-mortem:
      # the weekly group bumped pydantic_core 2.46.4->2.47.0 while holding pydantic 2.13.4,
      # a ResolutionImpossible at pip install). Block ALL standalone bumps; pydantic-core
      # moves only WITH pydantic (a pydantic bump drags the matching core). Mirrors the
      # pydantic major cap above.
      - dependency-name: "pydantic-core"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      # mypy diagnostics can shift on any release (even patches), and the freeze must stay
      # in lockstep with BOTH constraints.txt AND the hardcoded workflow pin
      # (.github/workflows/test-suite.yml). A bot patch bump desyncs them (#978: the lock
      # went to 1.19.1 while test-suite.yml still installed 1.19.0 -> split-brain gates).
      # Freeze ALL bot bumps; mypy moves only in a deliberate typed-surface dolphin that
      # updates the lock, constraints.txt, and the workflow pin together.
      - dependency-name: "mypy"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "isort"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ruff"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "black"
        update-types: ["version-update:semver-major"]
      # antlr4-python3-runtime is hard-pinned to 4.9.* by the Hydra stack: hydra-core
      # 1.3.4 and omegaconf 2.3.1 both require ==4.9.* (ResolutionImpossible above that
      # — #939, where the weekly group bumped it to 4.13.2 and broke the lock). 4.9->4.13
      # is a semver-MINOR bump, so block minors too; patches within 4.9.* stay welcome.
      # Lift only in lockstep with a hydra-core/omegaconf upgrade (mirrors constraints.txt).
      - dependency-name: "antlr4-python3-runtime"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # pandapower is EXACT-pinned to ==3.3.0 in the pyproject [grid] extra: pandapower
      # 3.3.3 and 3.4.0 both declare scipy<1.17, conflicting with the canon-critical
      # scipy==1.17.1 (a [grid] install would ResolutionImpossible or force-downgrade
      # scipy, our core numerics). #978 bumped it to 3.5.4 blindly. Freeze ALL bot bumps
      # (even patches cap scipy); lift only in a deliberate grid dolphin that first
      # verifies the target pandapower's scipy requirement.
      - dependency-name: "pandapower"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      # pyarrow is capped <25 by streamlit (streamlit 1.60.0 requires pyarrow<25,>=7.0), so a
      # bot bump to pyarrow 25 desyncs the lock. #983 post-mortem: the weekly group bumped
      # pyarrow 24->25 WHILE bumping streamlit to 1.60 -> internally contradictory, un-installable
      # (ResolutionImpossible: pyarrow==25.0.0 vs streamlit's pyarrow<25). pyarrow 24->25 is a
      # semver-MAJOR bump; block majors so pyarrow stays within streamlit's ceiling (24.x patches
      # stay welcome). Lift only in lockstep with a streamlit release that raises the ceiling.
      - dependency-name: "pyarrow"
        update-types: ["version-update:semver-major"]

  # GitHub Actions: keeps the workflow action pins current (the repo had checkout@v3/@v4,
  # setup-python@v4/@v5, codecov@v3/@v4 drift).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
