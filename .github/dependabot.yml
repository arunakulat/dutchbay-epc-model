# Dependabot version updates. (The previous file was the unconfigured GitHub scaffold —
# `package-ecosystem: ""` is invalid, so version updates were a silent no-op; #C2.)
#
# NB: Dependabot SECURITY alerts/updates are settings-driven and were unaffected by the
# broken file — this only restores PROACTIVE version + action-pin updates.
#
# Grouping: one PR per ecosystem (patterns "*") so updates land as a single reviewable,
# resolution-checked bump rather than a flood — and so a leaf bump arrives WITH the pinned
# consumers it constrains (the repo's hard-won grouped-bump lesson; see #262 and
# [[engineering-workflow-lessons]] — always `pip install --dry-run` a Dependabot PR before merge).
version: 2
updates:
  # Python deps: pyproject.toml (abstract) + the requirements.txt lock.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns:
          - "*"

  # GitHub Actions: keeps the workflow action pins current (the repo had checkout@v3/@v4,
  # setup-python@v4/@v5, codecov@v3/@v4 drift).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
