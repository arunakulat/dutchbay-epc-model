# Dependabot version updates. (The previous file was the unconfigured GitHub scaffold —
# `package-ecosystem: ""` is invalid, so version updates were a silent no-op; #C2.)
#
# NB: Dependabot SECURITY alerts/updates are settings-driven and were unaffected by the
# broken file — this only restores PROACTIVE version + action-pin updates.
#
# Grouping follows the repository's Dolphin boundaries. Related packages may move together,
# but ingestion, jobs, numerics, API, and optimizer changes must not be combined into one
# unreviewable migration. Unmatched dependencies use Dependabot's default one-PR-per-package
# behaviour. Always `pip install --dry-run` a Dependabot PR before merge.
version: 2
updates:
  # Python deps: pyproject.toml (abstract) + the requirements.txt lock.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      ingestion:
        patterns:
          - "markitdown"
          - "pdfplumber"
          - "pymupdf"
          - "magika"
      jobs:
        patterns:
          - "arq"
          - "redis"
          - "hiredis"
      numerics:
        patterns:
          - "numpy"
          - "numpy-typing-compat"
          - "mpmath"
      micrositing:
        patterns:
          - "openmdao"
      api-runtime:
        patterns:
          - "starlette"
          - "websockets"
    # MAJOR-version updates on the load-bearing set are POLICY DECISIONS, not bot
    # chores (#756 post-mortem: the weekly group bumped pandas 2->3 and rewrote our
    # own pyproject `<3.0` cap to make it fit, desynced mypy/isort/ruff from the
    # versions the mandatory gates were cleared against, and shipped an internally
    # inconsistent freeze — ResolutionImpossible at pip install).
    #  - Engine numerics (pandas/numpy/scipy/pydantic + their stubs): majors land only
    #    via a deliberate, KPI-oracle-verified migration (pandas 3.0 = #593).
    #  - Gate toolchain: mypy diagnostics change on MINORS (the lint job pins the
    #    cleared 1.19.0); ruff is 0.x-versioned, so minors are its breaking level;
    #    black is CalVer (every yearly bump is a "major").
    # Minor/patch updates keep flowing weekly for everything else, and Dependabot
    # SECURITY updates are settings-driven — unaffected by these ignores.
    ignore:
      - dependency-name: "pandas"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pandas-stubs"
        update-types: ["version-update:semver-major"]
      # numpy is capped <2.5 by pandapower (pandapower 3.5.4 requires numpy<2.5,>=1.26), and
      # 2.4->2.5 is a semver-MINOR bump, so a major-only rule could never catch it. #1066/#1169
      # post-mortem: the weekly numerics group proposed numpy 2.4.6->2.5.2 -> ResolutionImpossible
      # against pandapower. Block minors too so numpy stays within the grid stack's ceiling
      # (2.4.x patches stay welcome). Lift only in lockstep with a pandapower release that raises
      # it. The engine-numerics major cap is unchanged and still applies (pandas 3.0 = #593).
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "scipy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "scipy-stubs"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pydantic"
        update-types: ["version-update:semver-major"]
      # #1047/#1060/#1062: cachebox 6 is unresolvable while deepdiff 9.1.0 requires
      # cachebox>=5.2,<6. Lift only with a compatible DeepDiff migration.
      - dependency-name: "cachebox"
        update-types: ["version-update:semver-major"]
      # #1060/#1062: arq 0.28.0 requires redis>=4.2,<6. Dependabot rewrote our own
      # redis[hiredis]<6 ceiling to <9 and produced an impossible redis 8 lock. Redis
      # majors move only with an ARQ/backend migration; security updates remain unaffected.
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]
      # The governed micrositing stack pulls OR-Tools, which caps protobuf below the 7.x
      # candidate. Lift only in a resolver-clean micrositing/OR-Tools migration.
      - dependency-name: "protobuf"
        update-types: ["version-update:semver-major"]
      # pydantic-core is EXACT-pinned by pydantic (pydantic 2.13.4 requires
      # pydantic-core==2.46.4), so it must NEVER be bumped independently — a standalone
      # bump makes the lock internally contradictory and un-installable (#978 post-mortem:
      # the weekly group bumped pydantic_core 2.46.4->2.47.0 while holding pydantic 2.13.4,
      # a ResolutionImpossible at pip install). Block ALL standalone bumps; pydantic-core
      # moves only WITH pydantic (a pydantic bump drags the matching core). Mirrors the
      # pydantic major cap above.
      - dependency-name: "pydantic-core"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      # mypy diagnostics can shift on any release (even patches), and the freeze must stay
      # in lockstep with BOTH constraints.txt AND the hardcoded workflow pin
      # (.github/workflows/test-suite.yml). A bot patch bump desyncs them (#978: the lock
      # went to 1.19.1 while test-suite.yml still installed 1.19.0 -> split-brain gates).
      # Freeze ALL bot bumps; mypy moves only in a deliberate typed-surface dolphin that
      # updates the lock, constraints.txt, and the workflow pin together.
      - dependency-name: "mypy"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "isort"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ruff"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "black"
        update-types: ["version-update:semver-major"]
      # antlr4-python3-runtime is hard-pinned to 4.9.* by the Hydra stack: hydra-core
      # 1.3.4 and omegaconf 2.3.1 both require ==4.9.* (ResolutionImpossible above that
      # — #939, where the weekly group bumped it to 4.13.2 and broke the lock). 4.9->4.13
      # is a semver-MINOR bump, so block minors too; patches within 4.9.* stay welcome.
      # Lift only in lockstep with a hydra-core/omegaconf upgrade (mirrors constraints.txt).
      - dependency-name: "antlr4-python3-runtime"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # pandapower is range-pinned ">=3.5,<4" in the pyproject [grid] extra and the lock
      # carries 3.5.4 against scipy 1.18.1 (the Python 3.12 rebaseline; this rationale
      # previously described the retired 3.3.0 / scipy 1.17.1 state and was corrected in
      # #1174). Every pandapower release constrains BOTH scipy and numpy -- 3.5.4 declares
      # numpy<2.5, which is what blocks #1169 -- so even a patch bump can move a ceiling
      # the core numerics sit under. Freeze ALL bot bumps; lift only in a deliberate grid
      # dolphin that first verifies the target release's scipy AND numpy requirements.
      - dependency-name: "pandapower"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      # pyarrow is capped <25 by streamlit (streamlit 1.60.0 requires pyarrow<25,>=7.0), so a
      # bot bump to pyarrow 25 desyncs the lock. #983 post-mortem: the weekly group bumped
      # pyarrow 24->25 WHILE bumping streamlit to 1.60 -> internally contradictory, un-installable
      # (ResolutionImpossible: pyarrow==25.0.0 vs streamlit's pyarrow<25). pyarrow 24->25 is a
      # semver-MAJOR bump; block majors so pyarrow stays within streamlit's ceiling (24.x patches
      # stay welcome). Lift only in lockstep with a streamlit release that raises the ceiling.
      - dependency-name: "pyarrow"
        update-types: ["version-update:semver-major"]
      # numpy-typing-compat is capped <20251207 by optype[numpy] (optype[numpy] 0.17.1 requires
      # numpy-typing-compat<20251207,>=20250818.1.25), so a bot bump to the 2026 datestamp desyncs
      # the lock. #986/#988 post-mortem: the weekly group bumped numpy-typing-compat
      # 20251206->20260602 -> ResolutionImpossible (numpy-typing-compat==20260602.2.4 vs
      # optype[numpy]'s <20251207). Its YYYYMMDD datestamp is the semver-MAJOR segment; block
      # majors so it stays within optype's ceiling (patches within 20251206 stay welcome). Lift
      # only in lockstep with an optype[numpy] release that raises the ceiling.
      - dependency-name: "numpy-typing-compat"
        update-types: ["version-update:semver-major"]
      # magika is capped ~=0.6.1 by markitdown -- EVERY published markitdown release, 0.1.2
      # through the current latest 0.1.7, declares it -- so magika 1.x cannot enter the lock at
      # any markitdown version. #1064/#1167: the weekly ingestion group proposed magika
      # 0.6.3->1.0.3 alongside markitdown 0.1.7, a group internally contradictory at pip install
      # (markitdown 0.1.7 requires magika~=0.6.1). "~=0.6.1" admits only 0.6.x, so a 0.7 MINOR
      # breaches it too; block majors and minors (0.6.x patches stay welcome). Lift only with a
      # markitdown release that raises the cap.
      - dependency-name: "magika"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # openmdao is EXACT-series pinned ==3.39.* by topfarm (topfarm 2.6.2), so ANY move off
      # 3.39.x is unresolvable while topfarm is in the lock -- and topfarm cannot simply be
      # dropped: requirements.txt records that without it all 9 tests/wind/test_layout_optimizer.py
      # cases SKIP on every CI run. #1067: the weekly micrositing group proposed 3.39.0->3.45.0,
      # a semver-MINOR bump, so a major-only rule would not have caught it. Block majors and
      # minors (3.39.x patches stay welcome). Lift only in lockstep with a topfarm release that
      # accepts a newer openmdao.
      - dependency-name: "openmdao"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # websockets is capped <17 by streamlit (streamlit 1.62.0 requires websockets<17,>=12.0.0).
      # #1068/#1166: the api-runtime group proposed 16.1.1->17.0.1 -> ResolutionImpossible. That
      # is a semver-MAJOR bump and 16.x minors remain inside the ceiling, so majors alone are
      # blocked here. Lift only with a streamlit release that raises it.
      - dependency-name: "websockets"
        update-types: ["version-update:semver-major"]
      # starlette is capped <2 by streamlit (streamlit 1.62.0 requires starlette<2,>=0.46.0).
      # No post-mortem yet -- recorded pre-emptively because the same group already produced an
      # unmergeable starlette bump once (#1068, blocked by the THEN-current streamlit 1.61.1
      # cap of <1.4.0, which #1128 lifted by moving streamlit and starlette in lockstep). 1.x
      # minors stay inside the ceiling, so only majors are blocked. Lift only with a streamlit
      # release that raises it.
      - dependency-name: "starlette"
        update-types: ["version-update:semver-major"]

  # GitHub Actions: keeps the workflow action pins current (the repo had checkout@v3/@v4,
  # setup-python@v4/@v5, codecov@v3/@v4 drift).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
