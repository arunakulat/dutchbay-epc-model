# Dependabot version updates. (The previous file was the unconfigured GitHub scaffold —
# `package-ecosystem: ""` is invalid, so version updates were a silent no-op; #C2.)
#
# NB: Dependabot SECURITY alerts/updates are settings-driven and were unaffected by the
# broken file — this only restores PROACTIVE version + action-pin updates.
#
# Grouping: one PR per ecosystem (patterns "*") so updates land as a single reviewable,
# resolution-checked bump rather than a flood — and so a leaf bump arrives WITH the pinned
# consumers it constrains (the repo's hard-won grouped-bump lesson; see #262 and
# [[engineering-workflow-lessons]] — always `pip install --dry-run` a Dependabot PR before merge).
version: 2
updates:
  # Python deps: pyproject.toml (abstract) + the requirements.txt lock.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns:
          - "*"
    # MAJOR-version updates on the load-bearing set are POLICY DECISIONS, not bot
    # chores (#756 post-mortem: the weekly group bumped pandas 2->3 and rewrote our
    # own pyproject `<3.0` cap to make it fit, desynced mypy/isort/ruff from the
    # versions the mandatory gates were cleared against, and shipped an internally
    # inconsistent freeze — ResolutionImpossible at pip install).
    #  - Engine numerics (pandas/numpy/scipy/pydantic + their stubs): majors land only
    #    via a deliberate, KPI-oracle-verified migration (pandas 3.0 = #593).
    #  - Gate toolchain: mypy diagnostics change on MINORS (the lint job pins the
    #    cleared 1.19.0); ruff is 0.x-versioned, so minors are its breaking level;
    #    black is CalVer (every yearly bump is a "major").
    # Minor/patch updates keep flowing weekly for everything else, and Dependabot
    # SECURITY updates are settings-driven — unaffected by these ignores.
    ignore:
      - dependency-name: "pandas"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pandas-stubs"
        update-types: ["version-update:semver-major"]
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "scipy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "scipy-stubs"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pydantic"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pydantic-core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mypy"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "isort"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ruff"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "black"
        update-types: ["version-update:semver-major"]

  # GitHub Actions: keeps the workflow action pins current (the repo had checkout@v3/@v4,
  # setup-python@v4/@v5, codecov@v3/@v4 drift).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
