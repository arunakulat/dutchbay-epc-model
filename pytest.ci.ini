[pytest]
# CI-optimized pytest configuration
minversion = 6.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# CI-specific options
addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short
    --maxfail=20
    --durations=10

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    smoke: marks tests as smoke tests
    edge_case: Edge case and boundary condition tests
    stress: Stress tests and failure scenarios
    critical_error: Critical error handling tests
    regression: Regression tests with frozen output
    monte_carlo: Monte Carlo simulation tests
    sensitivity: Sensitivity analysis tests
    casper: CASPER payload tests
    frozen: Tests with frozen assertions
    production: Production-scale validation tests
    debug: Debug tests with verbose output

norecursedirs = .git __pycache__ .pytest_cache .venv* venv* build dist *.egg-info

# CI warning filters
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestUnknownMarkWarning
