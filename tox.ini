[tox]
# Tox configuration for DutchBay EPC Financial Model
# Tests across Python 3.8, 3.9, 3.10, 3.11, 3.12, 3.13
# Run locally: tox
# Run specific version: tox -e py311
# Run in parallel: tox -p auto

envlist = py38,py39,py310,py311,py312,py313
skip_missing_interpreters = True
minversion = 4.0

[testenv]
description = Run Go-With-The-Flow CI pipeline

# Install dependencies
deps =
    black>=24.1.1
    isort>=5.13.2
    pytest>=7.4.0
    pytest-xdist>=3.5.0
    mypy>=1.8.0
    coverage>=7.4.0
    flake8>=7.0.0
    pylint>=3.0.0
    bandit>=1.7.5

# Commands to run in each environment
commands =
    # Code formatting check
    black --check --line-length=100 analytics finance run_full_pipeline_v14.py scripts
    # Import sorting check
    isort --check-only --profile=black analytics finance run_full_pipeline_v14.py scripts
    # Syntax validation
    python -m compileall analytics finance
    # Unit tests with coverage
    pytest tests/ -v --tb=short --cov=analytics --cov=finance --cov-report=term-missing
    # Type checking
    mypy analytics finance run_full_pipeline_v14.py
    # Code quality analysis
    flake8 analytics finance run_full_pipeline_v14.py scripts --max-line-length=100
    # Security scanning
    bandit -r analytics finance -ll

[testenv:py{38,39,310}]
# Python 3.8-3.10 might have compatibility issues
# Mark these for investigation
description = Testing on older Python versions - watch for compatibility issues

[testenv:py{311,312}]
# Primary test environments
description = Primary test environments (3.11, 3.12)

[testenv:py313]
# Bleeding edge
description = Bleeding edge Python 3.13 - may have new features/deprecations

[testenv:coverage]
description = Generate coverage report with detailed breakdown
commands =
    coverage erase
    pytest tests/ --cov=analytics --cov=finance --cov-report=html --cov-report=term-missing
    coverage report -m

[testenv:lint]
description = Run linting checks (flake8, pylint, bandit, black, isort)
commands =
    black --check --line-length=100 analytics finance run_full_pipeline_v14.py scripts
    isort --check-only --profile=black analytics finance run_full_pipeline_v14.py scripts
    flake8 analytics finance run_full_pipeline_v14.py scripts --max-line-length=100
    pylint analytics finance run_full_pipeline_v14.py --exit-zero
    bandit -r analytics finance -ll

[testenv:typecheck]
description = Run mypy type checking
commands =
    mypy analytics finance run_full_pipeline_v14.py

[testenv:security]
description = Run security checks (bandit)
commands =
    bandit -r analytics finance -ll -i

[testenv:fix]
description = Auto-fix formatting issues (black, isort)
commands =
    black --line-length=100 analytics finance run_full_pipeline_v14.py scripts
    isort --profile=black analytics finance run_full_pipeline_v14.py scripts

# Pytest configuration
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short

# Coverage configuration
[coverage:run]
source = analytics, finance
branch = True
omit =
    */tests/*
    */test_*.py
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod
