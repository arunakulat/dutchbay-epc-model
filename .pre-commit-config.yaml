# Pre-commit hooks configuration (Go-With-The-Flow CI)

repos:
  - repo: https://github.com/psf/black
    rev: "26.5.1"
    hooks:
      - id: black
        language_version: python3.12
        args: ["--line-length=88"]
        exclude: ^legacy/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.14.14"
    hooks:
      - id: ruff
        # Ruff will read configuration from ruff.toml
        args: ["--fix"]
        # Let ruff.toml handle which files/rules we care about.

  - repo: https://github.com/pycqa/isort
    rev: "7.0.0"
    hooks:
      - id: isort
        args: ["--profile=black"]
        exclude: ^legacy/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v5.0.0"
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: ^legacy/
      - id: trailing-whitespace
        exclude: ^legacy/
      - id: check-merge-conflict
      - id: debug-statements
        exclude: ^legacy/
      # GWTF GOV-02: never commit directly to a protected branch. Blocks the commit
      # LOCALLY (before the confusing push-time ruleset rejection). Branch -> PR ->
      # merge; releases tag the merged commit (see RELEASING.md), never commit on main.
      - id: no-commit-to-branch
        args: ["--branch", "main", "--branch", "master"]

  # Mypy disabled for Sprint Day N – runs in CI instead.
