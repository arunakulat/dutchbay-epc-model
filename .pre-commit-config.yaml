# Pre-commit hooks configuration (Go-With-The-Flow CI)
# Install: pre-commit install
# Run: pre-commit run --all-files

repos:
  - repo: https://github.com/psf/black
    rev: '24.1.1'
    hooks:
      - id: black
        language_version: python3
        exclude: ^legacy/

  - repo: https://github.com/pycqa/isort
    rev: '5.13.2'
    hooks:
      - id: isort
        args: ['--profile=black']
        exclude: ^legacy/

  - repo: https://github.com/PyCQA/flake8
    rev: '7.0.0'
    hooks:
      - id: flake8
        args: ['--max-line-length=100', '--extend-ignore=F401,W503']
        exclude: |
          (?x)^(
            legacy/.*|
            analytics/sensitivity/dashboard_demo\.py|
            analytics/sensitivity_visualization\.py|
            scripts/diagnose_capacity_factor\.py|
            scripts/test_markdown_report\.py|
            scripts/test_llcr_plcr_real_debt\.py|
            tests/contracts/test_sensitivity_edgecases\.py|
            constants\.py|
            fix_parameter_range_config\.py|
            go_with_the_flow_ci_enhanced\.py|
            go_with_the_flow_ci_v2_final\.py|
            quarantine_v14chat\.py|
            scan_v14chat_imports\.py
          )$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
        exclude: |
          (?x)^(
            legacy/.*|
            scenarios/edge_extreme_stress\.yaml|
            scenarios/_scrtch/zz_bad\.yaml|
            config/sensitivity_defaults\.yaml|
            full_model_variables_updated\.yaml|
            \.github/workflows/release\.yml
          )$
      - id: check-json
        exclude: ^legacy/
      - id: check-toml
        exclude: ^legacy/
      - id: end-of-file-fixer
        exclude: ^legacy/
      - id: trailing-whitespace
        exclude: ^legacy/
      - id: check-added-large-files
        args: ['--maxkb=100']
        exclude: ^legacy/
      - id: check-merge-conflict
      - id: debug-statements
        exclude: ^legacy/
# EOF
