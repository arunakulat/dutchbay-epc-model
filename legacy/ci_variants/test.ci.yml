name: CI
true:
  pull_request: null
  push:
    branches: [main, v14chat-upgrade]
jobs:
  fast-tests:
    name: Fast analytics_layer tests
    runs-on: ubuntu-latest
    steps:
    - {name: Checkout, uses: actions/checkout@v4}
    - name: Set up Python
      uses: actions/setup-python@v5
      with: {python-version: '3.11'}
    - {name: Install dependencies, run: 'python -m pip install --upgrade pip

        pip install -r requirements-dev.txt

        '}
    - {name: Run fast analytics_layer tests (not slow), run: 'pytest tests/analytics_layer/
        --disable-warnings -m "not slow"

        '}
  golden-regression:
    env: {GOLDEN_DIR: golden}
    name: Golden regression (CSV checks)
    needs: fast-tests
    runs-on: ubuntu-latest
    steps:
    - {name: Checkout, uses: actions/checkout@v4}
    - name: Set up Python
      uses: actions/setup-python@v5
      with: {python-version: '3.11'}
    - {name: Install dependencies, run: 'python -m pip install --upgrade pip

        pip install -r requirements-dev.txt

        '}
    - {name: Run golden regression tests, run: pytest tests/golden_regression/ --disable-warnings}
