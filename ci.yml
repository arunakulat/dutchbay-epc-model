name: Go-With-The-Flow CI/CD Pipeline
# Automated CI/CD that runs on every push and pull request
# Tests across Python 3.8, 3.9, 3.10, 3.11, 3.12, 3.13
# Runs in parallel for speed

on:
  push:
    branches: [ main, develop, "feature/**" ]
    paths:
      - "analytics/**"
      - "finance/**"
      - "tests/**"
      - "scripts/**"
      - "*.py"
      - "pyproject.toml"
      - "requirements.txt"
      - "tox.ini"
      - ".github/workflows/**"
  pull_request:
    branches: [ main, develop ]
    paths:
      - "analytics/**"
      - "finance/**"
      - "tests/**"
      - "scripts/**"
      - "*.py"
      - "pyproject.toml"
      - "requirements.txt"
      - "tox.ini"

jobs:
  # Matrix testing across Python versions
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better analysis
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox tox-gh-actions
      
      - name: Run tox (Go-With-The-Flow CI Pipeline)
        run: tox
        timeout-minutes: 30
      
      - name: Upload coverage reports
        if: matrix.python-version == '3.11'  # Only for primary version
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
  
  # Code quality checks (run once)
  quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8 pylint bandit
      
      - name: Run code formatting checks
        run: |
          black --check --line-length=100 analytics finance run_full_pipeline_v14.py scripts
          isort --check-only --profile=black analytics finance run_full_pipeline_v14.py scripts
      
      - name: Run linting (flake8)
        run: flake8 analytics finance run_full_pipeline_v14.py scripts --max-line-length=100
        continue-on-error: true
      
      - name: Run security scan (bandit)
        run: bandit -r analytics finance -ll
        continue-on-error: true
  
  # Type checking (run once)
  types:
    name: Type Checking
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy
      
      - name: Run mypy type checker
        run: mypy analytics finance run_full_pipeline_v14.py
        continue-on-error: true
  
  # Overall status
  status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [test, quality, types]
    if: always()
    
    steps:
      - name: Check test results
        run: |
          if [[ "${{ needs.test.result }}" == "failure" ]]; then
            echo "❌ Tests failed"
            exit 1
          fi
          echo "✅ All checks passed!"
      
      - name: Report status
        run: |
          echo "CI Pipeline Status: SUCCESS ✅"
          echo "Tests: ${{ needs.test.result }}"
          echo "Code Quality: ${{ needs.quality.result }}"
          echo "Type Checking: ${{ needs.types.result }}"
