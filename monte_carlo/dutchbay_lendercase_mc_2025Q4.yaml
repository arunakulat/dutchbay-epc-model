# ══════════════════════════════════════════════════════════════════════════════
# Dutch Bay EPC - Lender Case Monte Carlo Configuration (2025Q4)
# CESSPIT v14 / CASPER-GWTF Compliant
# ══════════════════════════════════════════════════════════════════════════════

simulation:
  iterations: 1000
  random_seed: 42
  parallel_workers: 4
  sampler: lhs

standard_parameters:
  # Capacity factor: project.capacity_factor (not generation.capacity_factor_pct!)
  - variable_name: project.capacity_factor
    dist_type: normal
    mean: 0.40
    std: 0.05
    min_val: 0.28
    max_val: 0.50
    description: "Net capacity factor (0-1 scale, not percentage)"

  # CAPEX: capex.usd_total (absolute USD, not per kW)
  - variable_name: capex.usd_total
    dist_type: triangular
    min_val: 130000000
    mode: 150000000
    max_val: 170000000
    description: "Total project CAPEX in USD"

  # OPEX: opex.usd_per_year (annual USD)
  - variable_name: opex.usd_per_year
    dist_type: uniform
    min_val: 2500000
    max_val: 3500000
    description: "Annual fixed O&M cost in USD"

derived_parameters: []

scenarios:
  - name: dutchbay_lendercase_2025Q4
    description: "Dutch Bay 150MW - Lender base case with conservative assumptions"
    enabled: true
