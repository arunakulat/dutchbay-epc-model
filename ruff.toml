line-length = 88
target-version = "py311"

# We rely on tests and runtime to guard these; Ruff is for library/core sanity.
extend-exclude = [
  "legacy",
  "scripts",
  "tests",
  "analytics/fx",
  "api",
  "analytics/sensitivity/dashboard_demo.py",
  "analytics/sensitivity_visualization.py",
  "constants.py",
  "fix_parameter_range_config.py",
  "go_with_the_flow_ci_enhanced.py",
  "go_with_the_flow_ci_v2_final.py",
]

[lint]
# Error/fatal rules (E, F) plus flake8-bugbear (B): likely-bug patterns the
# retired flake8 stack enforced via `select = C,E,F,W,B,B950` (#610) but which
# ruff did not yet cover. B904 (raise ... from) is clean and gated repo-wide.
select = ["E", "F", "B"]

# Ignore only long lines and the Black/E203 mismatch. Every flake8-bugbear family
# surfaced when B was enabled (#758) is now resolved and gated: B904 raise-from
# (#758), B905 zip strict= (#752), B008 call-in-arg-default (#753).
ignore = [
  "E203",
  "E501",
]

# Per-file exceptions for intentional patterns
[lint.per-file-ignores]
# analytics/__init__.py: Public API gateway - re-exports are intentional
# F401: Module imported but unused (allowed for public API surface)
"analytics/__init__.py" = ["F401"]
