# sensitivity_defaults.yaml
# Default parameter ranges for tornado sensitivity analysis
# Based on CFA/DFI industry standards for renewable energy projects
#
# Each parameter is validated by ParameterRangeConfig (Pydantic v2)
# Hard validation failure if any entry is invalid (no "best-effort")

# =============================================================================
# BASE VALUES (typical DutchBay 150MW wind farm configuration)
# =============================================================================
# These are fallback values when parameters aren't explicitly configured
# Should match your most common/representative scenario configs

base_values:
  capex_usd_per_kw: 850.0              # Typical all-in capital cost
  tariff_lkr_per_kwh: 65.0             # CEB standard tariff
  capacity_factor_pct: 45.0            # P50 wind resource estimate
  discount_rate_pct: 8.0               # WACC for utility-scale renewables
  debt_interest_rate_pct: 9.0          # Senior debt pricing
  construction_months: 24.0            # 2-year construction schedule
  opex_pct_revenue: 2.5                # O&M as % of revenue
  grid_loss_pct: 3.0                   # Transmission/distribution losses

# =============================================================================
# SENSITIVITY PARAMETERS (validated by ParameterRangeConfig)
# =============================================================================
# Each parameter is validated by Pydantic v2
# Hard validation failure if any entry is invalid (no "best-effort")

parameters:
  # ===== COST PARAMETERS (±20% typical range) =====

  - variable_name: "project.capex_usd_per_kw"
    base_value: 850.0
    low_pct: -20.0
    high_pct: 20.0
    steps: 5
    # Range: $680-1020/kW
    # Comment: Capital expenditure is typically the highest impact driver

  # ===== REVENUE PARAMETERS (±15% typical range) =====

  - variable_name: "financial.tariff_lkr_per_kwh"
    base_value: 65.0
    low_pct: -15.0
    high_pct: 15.0
    steps: 5
    # Range: LKR 55.25-74.75/kWh
    # Comment: Tariff is second-highest impact driver for merchant projects

  # ===== GENERATION PARAMETERS (±10% typical range) =====

  - variable_name: "generation.capacity_factor_pct"
    base_value: 45.0
    low_pct: -10.0
    high_pct: 10.0
    steps: 5
    # Range: 40.5%-49.5%
    # Comment: Wind resource uncertainty (P50, P75, P90 scenarios)

  # ===== FINANCIAL PARAMETERS (±2–3 percentage points) =====

  - variable_name: "financial.discount_rate_pct"
    base_value: 8.0
    low_pct: -3.0
    high_pct: 3.0
    steps: 5
    # Range: 5.0%-11.0%
    # Comment: WACC sensitivity for different capital structures

  - variable_name: "financial.debt_interest_rate_pct"
    base_value: 9.0
    low_pct: -2.0
    high_pct: 2.0
    steps: 5
    # Range: 7.0%-11.0%
    # Comment: Senior debt pricing sensitivity

  # ===== SCHEDULE PARAMETERS (±6 months typical) =====

  - variable_name: "project.construction_months"
    base_value: 24.0
    low_pct: -6.0
    high_pct: 6.0
    steps: 5
    # Range: 22.56-25.44 months
    # Comment: Construction delay risk (IDC impact)

  # ===== OPERATING PARAMETERS (±5% typical) =====

  - variable_name: "operating.opex_pct_revenue"
    base_value: 2.5
    low_pct: -5.0
    high_pct: 5.0
    steps: 5
    # Range: 2.375%-2.625% of revenue
    # Comment: O&M cost efficiency

  # ===== TECHNICAL PARAMETERS (±2% typical) =====

  - variable_name: "technical.grid_loss_pct"
    base_value: 3.0
    low_pct: -2.0
    high_pct: 2.0
    steps: 5
    # Range: 2.94%-3.06%
    # Comment: Transmission/distribution losses
