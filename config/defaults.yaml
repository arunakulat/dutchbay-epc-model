# Project-wide default values and validation thresholds
# All modules should load from this file instead of hardcoding values
#
# GWTF Compliance: CCCDIR - Configuration in Config DIRectory
# Author: Dutch Bay EPC Model Team
# Date: December 2025
# Version: 1.1.0

# =============================================================================
# Currency and FX
# =============================================================================
fx:
  # Default FX rate (overridden by scenarios/*.yaml)
  start_lkr_per_usd: 375.0
  # Annual depreciation assumptions
  annual_depr_pct:
    - 0.0  # Year 1 (no depr)
    - 1.0  # Year 2 onwards
    - 1.5
    - 2.0
    - 2.0

# =============================================================================
# Project Defaults
# =============================================================================
project:
  life_years: 20
  # Default capacity (overridden by scenarios)
  capacity_mw: 97.5
  # Wind farm specific
  turbine_count: 15
  turbine_rated_power_mw: 6.5

# =============================================================================
# Performance Degradation
# =============================================================================
degradation:
  # Annual degradation rate (typical for wind farms)
  annual_rate: 0.005  # 0.5% per year
  method: "linear"  # or "exponential"

# =============================================================================
# Wind Turbine Performance Degradation (P0 - CRITICAL)
# =============================================================================
# Industry research shows wind turbines experience performance degradation
# due to mechanical wear, blade erosion, and component aging.
#
# Research References:
# - Staffell & Green (2014): UK wind farms, 1.6%/year (older turbines)
# - NREL (2019): US modern turbines, 0.53%/year  
# - Kim et al. (2025): South Korea study, 0.72%/year
# - IEC 61400-12-1:2022 Annex C: Performance monitoring standards
#
# Financial Impact:
# - Year 1: 100.0% capacity
# - Year 10: 93.5% capacity (0.65%/year)
# - Year 20: 87.0% capacity
# - Year 25: 83.8% capacity
# - Cumulative AEP loss over 25 years: ~12-15%
# - Revenue impact (150 MW @ $68/MWh): $8-10M NPV
wind_degradation:
  enabled: true
  # Annual performance degradation rate (0.65% is industry median)
  annual_rate_pct: 0.65
  # Year to start applying degradation (typically Year 1 or Year 2)
  start_year: 1
  # Degradation model: "linear" (conservative) or "exponential" (front-loaded)
  method: "linear"
  # Reference for methodology
  reference: "IEC 61400-12-1:2022 Annex C, Staffell & Green (2014)"
  # Optional: Commissioning period with no degradation
  commissioning_years: 0
  # Degradation causes (for documentation)
  causes:
    - "Mechanical wear on gearbox and drivetrain"
    - "Blade leading edge erosion from rain/particles"
    - "Bearing degradation over operating cycles"
    - "Control system calibration drift"
    - "Yaw system performance decline"

# =============================================================================
# Availability Profiles (Time-Varying)
# =============================================================================
# Wind farm availability varies by project phase:
# - Commissioning: Lower availability due to testing/optimization
# - Operations: Peak availability during stable operations  
# - Late Life: Slight decline due to aging equipment
availability:
  # Commissioning phase (first N years)
  commissioning_years: 2
  commissioning_factor: 0.94  # 94% availability
  # Operational phase (stable operations)
  operational_factor: 0.975  # 97.5% availability (industry standard)
  # Late life phase (aging equipment)
  late_life_start_year: 15
  late_life_factor: 0.96  # 96% availability
  # Reference
  reference: "IRENA (2019) - Renewable Energy Project Operations"

# =============================================================================
# Financial Defaults (Typical ranges - override in scenarios)
# =============================================================================
financial:
  discount_rate_pct: 8.0  # WACC
  equity_irr_target_pct: 12.0
  
# =============================================================================
# Debt Defaults
# =============================================================================
debt:
  # Minimum debt service coverage ratio
  min_dscr: 1.25
  # Typical debt ratio for wind projects
  ratio: 0.70  # 70% debt, 30% equity
  # Typical tenor
  tenor_years: 15
  # Grace period
  grace_period_months: 18
  # Interest rate (override in scenarios)
  interest_rate_pct: 7.5
  # Dual DSCR constraints (lender standard)
  dscr_constraints:
    use_dual_sizing: false  # Enable for lender-grade sizing
    p50_target: 1.30  # Expected case DSCR
    p99_target: 1.00  # Downside case DSCR (must still service debt)
    description: "Dual DSCR sizing per DNV GL (2019) project finance standards"

# =============================================================================
# Validation Thresholds
# =============================================================================
validation:
  capacity_mw:
    min: 10.0
    max: 1000.0
  capacity_factor:
    min: 0.10  # 10%
    max: 0.50  # 50%
  wind_speed_ms:
    min: 0.0
    max: 35.0
  tariff_lkr_per_kwh:
    min: 10.0
    max: 50.0

# =============================================================================
# Sensitivity Analysis Ranges (Industry Standard)
# =============================================================================
sensitivity:
  # Format: {parameter: [low_pct, high_pct]}
  ranges:
    capex_usd_per_kw: [-20.0, +20.0]  # ±20% typical for Capex
    tariff_lkr_per_kwh: [-15.0, +15.0]  # ±15% for revenue/tariff
    capacity_factor_pct: [-10.0, +10.0]  # ±10% for generation
    discount_rate_pct: [-3.0, +3.0]  # ±3 percentage points for WACC
    debt_interest_rate_pct: [-2.0, +2.0]  # ±2 percentage points
    construction_months: [-6.0, +6.0]  # ±6 months schedule risk
    opex_pct_revenue: [-5.0, +5.0]  # ±5% for O&M costs
    grid_loss_pct: [-2.0, +2.0]  # ±2% transmission losses
  # Industry standard: 5 data points per sweep
  default_steps: 5

# =============================================================================
# Monte Carlo Defaults (CFA Level III Standard)
# =============================================================================
monte_carlo:
  iterations: 10000
  seed: 42  # For reproducibility
  confidence_levels:
    - 0.50  # P50
    - 0.75  # P75
    - 0.90  # P90
    - 0.99  # P99
  
# =============================================================================
# Wind Resource Defaults (Reference values)
# =============================================================================
wind_resource:
  # Default capacity factor (overridden by ERA5 data)
  default_capacity_factor: 0.40
  # Reference air density at sea level, 15°C
  air_density_kgm3: 1.225
  # Default Weibull parameters (if ERA5 unavailable)
  default_weibull:
    shape_k: 2.0
    scale_c: 7.5

# =============================================================================
# Reporting Defaults
# =============================================================================
reporting:
  # Number of decimal places
  decimals:
    currency: 2
    percentage: 1
    energy: 2
    ratio: 3
  # Export formats
  formats:
    - json
    - csv
    - excel
