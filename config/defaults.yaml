# DutchBay EPC Model — config-sourced fallback defaults
#
# Purpose:
#   The small set of CONFIG-SOURCED FALLBACK values the engine reads when a scenario
#   omits them — so the fallback is config, never a Python literal (CESSPIT / ARCH-01).
#
#   This file is NOT a whole-file override base. Scenarios do not merge it wholesale;
#   each block below is read by exactly ONE resolver (named inline) which pulls only its
#   own sub-block via its own `config/defaults.yaml` load.
#
#   ⚠️ Only add a block here once a Python resolver actually consumes it. The former
#   `financial`, `debt_sizing`, `monte_carlo`, `sensitivity`, `stress_tests`,
#   `optimization`, `reporting` and `wind_resource.losses` blocks were REMOVED (#72):
#   they had zero readers yet the header claimed they were the authoritative defaults,
#   and several were stale/WRONG (withholding_tax 14% vs the SL 10%/15% split; a single
#   straight-line depreciation_years 20 vs the Fourth-Schedule plant-5yr/civil-20yr
#   split; bare wacc/equity/debt-rate literals). The numbers that move KPIs live in
#   scenarios/*.yaml, the single source of truth for per-project assumptions.
#
# Consumed blocks (-> resolver):
#   api.allowed_path_roots        -> api.path_safety.confined_path
#   fx_reference                  -> analytics.fx.fx_fetch.default_fx_lkr_per_usd
#   cost_reference                -> analytics.cost.{cost_basis,estimate_class,benchmark}
#   aep_reconciliation            -> analytics.aep_reconciliation
#   aep_provenance                -> analytics.aep_provenance
#   evidence_register             -> analytics.evidence_register
#   development_readiness         -> analytics.development_readiness
#   wind_resource.loss_taxonomy   -> analytics.wind.losses_model

defaults:
  # ═══════════════════════════════════════════════════════════════════
  # API path-safety — roots the HTTP API may read caller-supplied files under
  # ═══════════════════════════════════════════════════════════════════
  # CESSPIT: the path-traversal policy for /run-pipeline and /run-tornado lives
  # in config, not a Python literal. Any caller-supplied config_path /
  # aep_summary_path that resolves outside these repo-relative roots is rejected
  # (see api/path_safety.confined_path). tests/mocks is included because the
  # canonical lender scenario references scenarios/aep_summary_dutchbay_10mw.json.
  api:
    allowed_path_roots:
      - scenarios
      - inputs
      - config
      - conf
      - exports
      - tests/mocks

  # ═══════════════════════════════════════════════════════════════════
  # FX REFERENCE (USD/LKR) — single fallback source of truth
  # ═══════════════════════════════════════════════════════════════════
  # CESSPIT: legacy code paths that lack an explicit scenario `fx` block resolve
  # their fallback rate HERE (via analytics.fx.fx_fetch.default_fx_lkr_per_usd),
  # never from a Python literal. Production scenarios MUST declare their own
  # `fx.start_lkr_per_usd` + `fx.source` pinned vintage; this is only a safety net
  # for lightweight/hand-authored configs. Replaces the divergent stale literals
  # (300 / 305 / 320 / 375 / 396) that had accreted across the codebase.
  # Pinned 2026-Q2 vintage (open.er-api.com; CBSL authoritative reference). The
  # stale 300 understated the rate by ~11.3% vs the ~333.8 spot.
  fx_reference:
    start_lkr_per_usd: 333.79          # 2026-Q2 pinned USD/LKR
    pinned_as_of: "2026-06-20T00:02:31Z"
    provider: "open_er_api"

  # ═══════════════════════════════════════════════════════════════════
  # COST REFERENCE — single anchored cost-basis year
  # ═══════════════════════════════════════════════════════════════════
  # CESSPIT/CCCDIR: the USD vintage all CAPEX/OPEX figures are expressed in. Anchoring
  # ONE basis year (the way NREL ATB fixes everything in 2022$) prevents silent vintage-
  # mixing across benchmarks (IRENA 2024, Lazard 2025, the 2026-Q2 FX). Scenarios may
  # override via capex.cost_basis_year; this is the single fallback default, resolved by
  # analytics.cost.cost_basis.resolve_cost_basis_year (never a Python literal).
  cost_reference:
    basis_year: 2026                   # USD vintage for the cost stack
    # IRENA 2024 global weighted-average onshore-wind total installed cost (USD/kW), the
    # top-down anchor a bottom-up cost stack is sanity-checked against (range 727-2110).
    irena_benchmark_per_kw: 1041
    irena_benchmark_year: 2024
    # BESS LCOS advisory sanity band (USD per MWh discharged) — the external
    # plausibility comparator for the read-only finance.bess_lcos view (#605), checked
    # by analytics.cost.benchmark.lcos_benchmark. NON-ITC band, because Sri Lanka has
    # no US Investment Tax Credit: Lazard LCOS v10.0 (nested in the June-2025 LCOE+
    # report) reports USD 115-254/MWh unsubsidised (vs 83-192 with ITC) for 100MW/4hr
    # utility-scale storage; the LCOS = PV(costs)/PV(discharge) methodology is
    # cross-anchored to PNNL ESGC 2024. ADVISORY ONLY: an out-of-band LCOS logs a
    # WARNING citing these sources and is flagged in the report pack — nothing raises
    # and no computed value changes. NB the model's LCOS is a fixed-dispatch basis
    # (see the finance.bess_lcos limitation notes, #596), so a divergence from the
    # dispatch-optimised literature band is a prompt to review, not an error.
    lcos_band_low_usd_per_mwh: 115
    lcos_band_high_usd_per_mwh: 254
    lcos_band_year: 2025               # Lazard LCOS v10.0 publication vintage (June 2025)
    lcos_band_sources:
      - "PNNL ESGC 2024"
      - "Lazard LCOS v10.0 (June 2025 LCOE+, non-ITC)"
    # AACE estimate class — the default maturity of an unlabelled estimate. A real
    # bottom-up WBS sanity-checked against a benchmark is ~Class 3 (budget authorization).
    estimate_class: 3
    # AACE RP 17R-97/18R-97 expected accuracy range per class (asymmetric low/high % of
    # the point estimate). Used to (a) report the estimate's accuracy band and (b) provide
    # a sanity-FLOOR for the probabilistic-CAPEX 1-sigma (a tighter configured spread than
    # the class implies is flagged). Implied 1-sigma ~= (|low|+high)/2/2 (band ~= +/-2-sigma).
    estimate_class_bands:
      "5": {low_pct: -35.0, high_pct: 65.0}   # concept screening
      "4": {low_pct: -22.0, high_pct: 35.0}   # study / feasibility
      "3": {low_pct: -15.0, high_pct: 22.0}   # budget authorization
      "2": {low_pct: -10.0, high_pct: 13.0}   # control / bid
      "1": {low_pct: -6.0,  high_pct: 9.0}    # check estimate

  # ═══════════════════════════════════════════════════════════════════
  # AEP ↔ CAPACITY-FACTOR RECONCILIATION
  # ═══════════════════════════════════════════════════════════════════
  # CESSPIT: the finance engine bills revenue off capacity_mw × capacity_factor × 8760,
  # while a scenario may ALSO carry a bankable net AEP (expected_results.net_aep_p50_gwh
  # and/or the resource.aep_summary_path JSON net_site_aep_gwh). These are two views of
  # the same quantity and MUST agree. analytics.aep_reconciliation fails loud when
  # capacity_mw × CF × 8.760 diverges from a bankable reference beyond this tolerance —
  # catching the class of stale-copy-paste error (#263 Mullikulam 3× capacity; red-flag
  # #175). Scenarios override via aep_reconciliation.tolerance_pct; this is the fallback.
  aep_reconciliation:
    tolerance_pct: 2.0   # all canonical scenarios reconcile within ~0.04%; 2% catches
                         # any material divergence while tolerating capacity_factor rounding

  # AEP SOURCE PROVENANCE (#18 — lender-grade). The bankable AEP backing a financed run
  # derives from a turbine power curve; a lender requires that curve to come from an
  # APPROVED, traceable source (a certified OEM curve or a vetted reference), never an
  # un-vetted / placeholder curve when a certified one exists. analytics.aep_provenance
  # enforces analytics.loader.aep_loader.validate_config_aep_provenance at scenario load /
  # API boundary. It is a no-op for a scenario that declares no resource.power_curve.
  # source_id (simplified base cases, test fixtures) unless require_source_id is set.
  # Scenarios override any key via an aep_provenance.{...} block; these are the fallbacks.
  aep_provenance:
    enforce: true            # run the provenance guard on authored scenarios
    require_source_id: false # if true, a scenario MUST name resource.power_curve.source_id
    allow_placeholder: false # if true, permit a placeholder source even when a certified
                             # OEM curve exists (early-stage escape hatch; off for lenders)

  # ═══════════════════════════════════════════════════════════════════
  # ASSUMPTION EVIDENCE REGISTER (#C5 — lender/DFI assumption provenance)
  # ═══════════════════════════════════════════════════════════════════
  # Generalizes the AEP-curve provenance control (aep_provenance, #18) to EVERY material
  # assumption. A scenario may declare an `evidence_register.entries` block mapping each
  # economics-moving assumption (tariff, capex, CF, fx, debt_terms, ...) to a provenance
  # record {source, as_of, tier}; analytics.evidence_register validates it against the
  # taxonomy in config/evidence_register.yaml at scenario load / API boundary.
  #
  # SOFT BY DESIGN (the deliberate difference from aep_provenance): the house policy WARNS
  # rather than rejects, so a scenario with no register — or a partial one — is reported on,
  # never broken. A lender-grade scenario opts in to hard enforcement by overriding these
  # in its own evidence_register block: enforce: true, require_complete: true,
  # min_tier: benchmark. Pure detector — changes no computed number. Scenarios override any
  # key; these are the fallbacks (resolved by analytics.evidence_register, never a literal).
  evidence_register:
    enforce: false           # warn on findings (default); true => raise (block the run)
    require_complete: false  # if true, EVERY material_assumption must have an entry
    min_tier: null           # if set (e.g. "benchmark"), entries weaker than it are flagged

  # ═══════════════════════════════════════════════════════════════════
  # DEVELOPMENT-READINESS / E&S STATUS REGISTER (#C11 — financial-close tracker)
  # ═══════════════════════════════════════════════════════════════════
  # A scenario may declare a `development_readiness.items` block mapping each development /
  # E&S workstream (land, permits, environmental_social, grid_connection, ppa, epc,
  # financing) to a Red/Amber/Green status; analytics.development_readiness validates it
  # against the taxonomy in config/development_readiness.yaml at scenario load and rolls the
  # statuses up to one overall RAG (the worst declared status). SOFT by design — a scenario
  # with no/partial register is reported on, never broken (mirrors evidence_register, #C5).
  # A lender-grade scenario opts in to hard enforcement via its own development_readiness
  # block: enforce: true, require_complete: true. Pure detector — changes no computed number.
  development_readiness:
    enforce: false           # warn on findings (default); true => raise (block the run)
    require_complete: false  # if true, EVERY workstream must have a declared status

  # ═══════════════════════════════════════════════════════════════════
  # CONDITIONS-PRECEDENT (CP) CHECKLIST (#616 — first-drawdown / financial-close gate)
  # ═══════════════════════════════════════════════════════════════════
  # A scenario may declare a `conditions_precedent.items` block mapping each named condition
  # precedent (e.g. ppa_executed, esia_approved, epc_contract_signed — see
  # config/conditions_precedent.yaml) to a satisfied/waived/pending status;
  # analytics.conditions_precedent validates it against that taxonomy and rolls the items up
  # per workstream and overall, reporting how many CPs remain outstanding (pending) and so gate
  # first drawdown. SOFT by design — a scenario with no/partial checklist is reported on, never
  # broken (mirrors development_readiness #C11 and evidence_register #C5). A lender-grade
  # scenario opts in to hard enforcement via its own conditions_precedent block: enforce: true,
  # require_complete: true. Pure detector — changes no computed number.
  conditions_precedent:
    enforce: false           # warn on findings (default); true => raise (block the run)
    require_complete: false  # if true, EVERY canonical cp_item must have a declared status

  # ═══════════════════════════════════════════════════════════════════
  # FEASIBILITY-REPORT SECTION SCHEMA (#616 slice 1 — the 20-section skeleton)
  # ═══════════════════════════════════════════════════════════════════
  # A scenario may declare a `feasibility_sections.sections` block mapping each canonical
  # feasibility-report section (e.g. executive_investment_thesis, resource_and_energy_yield,
  # risk_register_and_mitigations — see config/feasibility_sections.yaml) to a
  # complete/draft/not_applicable declaration with an optional authored narrative;
  # analytics.feasibility_sections validates it against that taxonomy and rolls coverage up
  # per group and overall, reporting which canonical sections are still MISSING from the IC
  # pack. SOFT by design — a scenario with no authored sections is reported on, never broken
  # (render-when-present; mirrors conditions_precedent above). An IC-grade scenario opts in
  # to hard enforcement via its own feasibility_sections block: enforce: true,
  # require_complete: true. Pure presentation schema — changes no computed number.
  feasibility_sections:
    enforce: false           # warn on findings (default); true => raise (block the run)
    require_complete: false  # if true, EVERY canonical section must have a declared status

  # ═══════════════════════════════════════════════════════════════════
  # DEGRADATION MODELING (reference defaults — inert)
  # ═══════════════════════════════════════════════════════════════════
  # Documented house-default degradation rate + MC shape, retained for reference.
  # The live single-tech cashflow bills off an explicit per-scenario
  # degradation_pct (project.degradation / per-tech degradation_pct); the Monte-Carlo
  # degradation driver reads monte_carlo.degradation, not this block. No resolver
  # currently consumes defaults.degradation.

  degradation:
    # Annual performance degradation rate
    annual_rate_pct: 0.6  # 0.6%/year (industry standard for modern turbines)

    # Degradation calculation method
    method: "compound"  # Options: "compound", "linear"
    # - compound: Output_t = Base * (1 - rate)^t (recommended)
    # - linear: Output_t = Base * (1 - rate*t) (more conservative)

    # Uncertainty for Monte Carlo
    uncertainty_std_pct: 0.1  # ±0.1%/year (1-sigma)

    # Distribution type
    distribution: "normal"  # Options: "normal", "lognormal", "uniform"

    # Industry benchmarks (for reference)
    benchmarks:
      nrel_2019_us: 0.53  # NREL study on US wind farms
      staffell_green_2014_uk: 1.6  # UK data (older turbines)
      kim_2025_global: 0.72  # Recent quantification study
      offshore_typical: 0.7  # Offshore wind farms
      onshore_typical: 0.55  # Onshore wind farms

  # ═══════════════════════════════════════════════════════════════════
  # WIND RESOURCE — loss taxonomy (only consumed wind_resource sub-block)
  # ═══════════════════════════════════════════════════════════════════

  wind_resource:
    # Loss taxonomy (IEC 61400-15-2 aligned). Classifies every *_pct key a scenario
    # may put in `resource.losses` as a `reduction` (retention = 1 - pct/100) or an
    # `uptime` (retention = pct/100). Consumed by analytics.wind.losses_model — a
    # loss-shaped key NOT listed here fails loud rather than being silently dropped.
    loss_taxonomy:
      wake_loss_pct: reduction
      electrical_loss_pct: reduction
      transmission_loss_pct: reduction
      turbine_performance_pct: reduction
      high_wind_hysteresis_pct: reduction
      icing_pct: reduction
      soiling_pct: reduction
      blade_degradation_pct: reduction
      environmental_pct: reduction
      curtailment_pct: reduction
      other_pct: reduction
      availability_pct: uptime
      grid_availability_pct: uptime

  # ═══════════════════════════════════════════════════════════════════
  # SOLAR RESOURCE — loss taxonomy (only consumed solar_resource sub-block)
  # ═══════════════════════════════════════════════════════════════════

  solar_resource:
    # Loss taxonomy (IEC 61724-1 / PVsyst DC->AC categories). Classifies every *_pct key
    # a scenario may put in `resource.solar.losses` as a `reduction` (retention = 1 - pct/100)
    # or an `uptime` (retention = pct/100). Consumed by solar_resource.loss_model — a
    # loss-shaped key NOT listed here fails loud rather than being silently dropped. This
    # itemises the flat `resource.solar.system_loss_pct` derate into named components; it
    # deliberately EXCLUDES what the pvlib chain already models (inverter efficiency/clipping,
    # cell-temperature) and recurring module degradation (the finance degradation schedule),
    # to avoid double-counting (light-induced degradation `lid_pct` is the one-time year-1
    # term and is fine here).
    loss_taxonomy:
      soiling_pct: reduction
      dc_wiring_loss_pct: reduction
      ac_wiring_loss_pct: reduction
      mismatch_loss_pct: reduction
      connection_loss_pct: reduction
      nameplate_loss_pct: reduction
      lid_pct: reduction
      transformer_loss_pct: reduction
      transmission_loss_pct: reduction
      curtailment_pct: reduction
      other_pct: reduction
      availability_pct: uptime
      grid_availability_pct: uptime

# ═══════════════════════════════════════════════════════════════════
# VERSION CONTROL
# ═══════════════════════════════════════════════════════════════════

