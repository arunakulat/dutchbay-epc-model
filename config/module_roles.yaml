# DutchBay EPC Model — Config-first Module Role Registry (W1-1, CCCDIR / CESSPIT)
#
# Single source of truth mapping every mapped model, analytics, resource, finance,
# and delivery module (plus app.reports.module_ledger and run_full_pipeline_v14)
# to its pipeline stage, architectural role, Excel workbook representation kind,
# declared optional dependency extras, and extra availability mode.
#
# Validated strictly by app.reports.module_ledger.load_module_role_registry().

schema_version: "1.0"

stages:
  - governance
  - site_gis
  - resource_yield
  - tech_hybrid_bess
  - grid_qsts
  - cost_levies_epc
  - core_finance
  - risk_sensitivity_opt
  - reporting_delivery

modules:
  - module_path: analytics.aep_provenance
    pipeline_stage: governance
    role_description: Enforces AEP source-provenance verification for financed pipeline runs.
    excel_representation: governance_metadata

  - module_path: analytics.aep_reconciliation
    pipeline_stage: governance
    role_description: Reconciles declared annual energy production against scenario capacity factor.
    excel_representation: governance_metadata

  - module_path: analytics.capital_risk_layer_v14
    pipeline_stage: risk_sensitivity_opt
    role_description: Facade orchestrating lender-grade Monte Carlo capital-risk analytics and refusal checks.
    excel_representation: engine_table_plus_rollup

  - module_path: analytics.capital_structure_optimizer_v14
    pipeline_stage: risk_sensitivity_opt
    role_description: Optimizes debt-tranche mix and capex-contingency allocations under covenant constraints.
    excel_representation: engine_table_plus_rollup

  - module_path: analytics.casper.casper_payload
    pipeline_stage: reporting_delivery
    role_description: Translates scenario, Monte Carlo, and sensitivity outputs into versioned CASPER JSON payloads.
    excel_representation: non_model_adapter

  - module_path: analytics.casper.casper_v14
    pipeline_stage: reporting_delivery
    role_description: Thin CASPER orchestrator wrapping evaluation_v14 and serializing CasperResult payloads.
    excel_representation: non_model_adapter

  - module_path: analytics.cli.cli_capital_structure_optimize_hydra
    pipeline_stage: risk_sensitivity_opt
    role_description: Hydra CLI entrypoint for opt-in capital-structure and contingency optimization runs.
    excel_representation: non_model_adapter

  - module_path: analytics.cli.cli_monte_carlo_hydra
    pipeline_stage: risk_sensitivity_opt
    role_description: Hydra CLI entrypoint for standalone Monte Carlo uncertainty analysis runs.
    excel_representation: non_model_adapter

  - module_path: analytics.cli.cli_sensitivity
    pipeline_stage: risk_sensitivity_opt
    role_description: Deprecated legacy sensitivity CLI wrapper superseded by cli_sensitivity_hydra.
    excel_representation: non_model_adapter
    notes: Deprecated entrypoint kept for backward compatibility.

  - module_path: analytics.cli.cli_sensitivity_hydra
    pipeline_stage: risk_sensitivity_opt
    role_description: Hydra CLI entrypoint for standalone sensitivity analysis runs.
    excel_representation: non_model_adapter

  - module_path: analytics.conditions_precedent
    pipeline_stage: governance
    role_description: Validates first-drawdown and financial-close conditions-precedent checklists against config taxonomy.
    excel_representation: governance_metadata

  - module_path: analytics.config_schema
    pipeline_stage: governance
    role_description: Central registry of RequiredFieldSpec definitions and config schema metadata.
    excel_representation: governance_metadata

  - module_path: analytics.contracts_v14
    pipeline_stage: governance
    role_description: Canonical frozen result contracts for scenarios, Monte Carlo, sensitivity, CASPER, and grid studies.
    excel_representation: governance_metadata

  - module_path: analytics.core.covenant_breach
    pipeline_stage: risk_sensitivity_opt
    role_description: Computes noise-tolerant DSCR covenant-breach probability primitives across trial arrays.
    excel_representation: engine_table_plus_rollup

  - module_path: analytics.core.epc_helper
    pipeline_stage: cost_levies_epc
    role_description: Compatibility shim re-exporting EPC breakdown helpers from finance.epc_helper_v14.
    excel_representation: non_model_adapter

  - module_path: analytics.core.exceedance
    pipeline_stage: resource_yield
    role_description: Dependency-free normal exceedance z-score table and P50/P75/P90 calculation primitives.
    excel_representation: formula

  - module_path: analytics.core.metrics
    pipeline_stage: core_finance
    role_description: Computes canonical scenario KPI summaries and delegates NPV/IRR math to finance.irr.
    excel_representation: formula

  - module_path: analytics.core.parameter_solvers
    pipeline_stage: risk_sensitivity_opt
    role_description: Root-finding solvers for tariff breakeven and target financial KPI thresholds.
    excel_representation: engine_table_plus_rollup

  - module_path: analytics.core.returns
    pipeline_stage: core_finance
    role_description: Computes project and equity NPV, IRR, and MIRR return metrics over cashflow series.
    excel_representation: formula

  - module_path: analytics.core.risk_metrics
    pipeline_stage: risk_sensitivity_opt
    role_description: Calculates VaR, CVaR, percentile bands, downside risk, and covenant breach summaries.
    excel_representation: engine_table_plus_rollup

  - module_path: analytics.core.sensitivity_runner
    pipeline_stage: risk_sensitivity_opt
    role_description: Runs configured one-way sensitivity sweeps from scenario paths via the evaluation gateway.
    excel_representation: non_model_adapter

  - module_path: analytics.cost.benchmark
    pipeline_stage: cost_levies_epc
    role_description: Compares project CAPEX and OPEX unit costs against external published benchmarks.
    excel_representation: governance_metadata

  - module_path: analytics.cost.contingency
    pipeline_stage: cost_levies_epc
    role_description: Evaluates quantitative CAPEX contingency requirements aligned with AACE RP 119R-21.
    excel_representation: engine_table_plus_rollup

  - module_path: analytics.cost.cost_basis
    pipeline_stage: cost_levies_epc
    role_description: Resolves and validates the single anchored USD cost-basis vintage for CAPEX and OPEX.
    excel_representation: governance_metadata

  - module_path: analytics.cost.estimate_class
    pipeline_stage: cost_levies_epc
    role_description: Classifies CAPEX estimate maturity and accuracy bands under AACE estimate classes.
    excel_representation: governance_metadata

  - module_path: analytics.cost.mc_capex
    pipeline_stage: cost_levies_epc
    role_description: Propagates probabilistic CAPEX cost-component distributions through the finance engine.
    excel_representation: engine_table_plus_rollup

  - module_path: analytics.dashboard.streamlit_app
    pipeline_stage: reporting_delivery
    role_description: Interactive Streamlit sensitivity and scenario exploration dashboard interface.
    excel_representation: non_model_adapter
    optional_extras:
      - dashboard
    extra_mode: required

  - module_path: analytics.development_readiness
    pipeline_stage: governance
    role_description: Evaluates development-readiness and E&S permit status registers for financial close.
    excel_representation: governance_metadata

  - module_path: analytics.dfi_workbook.foundation
    pipeline_stage: reporting_delivery
    role_description: Builds a macro-free reproducible workbook foundation with provenance, scalar inputs, and execution-status rollup formulas.
    excel_representation: non_model_adapter
    notes: Preparatory workbook surface; canonical execution-record projection and financial formula qualification remain separate integration gates.

  - module_path: analytics.dfi_workbook.registry
    pipeline_stage: reporting_delivery
    role_description: Allocates validated workbook cell coordinates and resolves formula references without computing financial outcomes.
    excel_representation: non_model_adapter

  - module_path: analytics.dscr_sensitivity
    pipeline_stage: risk_sensitivity_opt
    role_description: Runs dual-DSCR sensitivity sweeps across tariff, capacity factor, and financing levers.
    excel_representation: engine_table_plus_rollup

  - module_path: analytics.emit_selection
    pipeline_stage: reporting_delivery
    role_description: Resolves CLI emitter selection flags controlling optional pipeline report and workbook outputs.
    excel_representation: non_model_adapter

  - module_path: analytics.evaluate_scenario
    pipeline_stage: core_finance
    role_description: Coordinator entry point loading a scenario config, applying overrides, and running v14 pipeline.
    excel_representation: non_model_adapter

  - module_path: analytics.evaluation_v14
    pipeline_stage: core_finance
    role_description: Canonical evaluate_with_overrides gateway routing analytics callers into the v14 finance pipeline.
    excel_representation: non_model_adapter

  - module_path: analytics.evidence_register
    pipeline_stage: governance
    role_description: Validates lender/DFI assumption evidence registers and source-provenance coverage.
    excel_representation: governance_metadata

  - module_path: analytics.evidence_score
    pipeline_stage: governance
    role_description: Scores bankability evidence completeness across declared feasibility evidence dimensions.
    excel_representation: governance_metadata

  - module_path: analytics.executive_workbook
    pipeline_stage: reporting_delivery
    role_description: Builds the multi-sheet Excel executive summary workbook and non-reliance banner from pipeline outputs.
    excel_representation: non_model_adapter

  - module_path: analytics.export_helpers
    pipeline_stage: reporting_delivery
    role_description: Formatting and tabular serialization helpers for v14 scenario analytics exports.
    excel_representation: non_model_adapter

  - module_path: analytics.feasibility_execution
    pipeline_stage: governance
    role_description: Held ProjectCase-to-v14 execution boundary translating global input contracts to v14 runs.
    excel_representation: non_model_adapter

  - module_path: analytics.feasibility_report_contract.assembly_authority
    pipeline_stage: governance
    role_description: Governed D3C-0 assembly-authority selection contract for feasibility-report packages.
    excel_representation: governance_metadata

  - module_path: analytics.feasibility_report_contract.assessment_scope
    pipeline_stage: governance
    role_description: Pure assessment-scope and v14 scenario-binding request contracts for feasibility packages.
    excel_representation: governance_metadata

  - module_path: analytics.feasibility_report_contract.context_binding
    pipeline_stage: governance
    role_description: Binds D3A, D3B, and D3C facts into non-authoritative report context candidates.
    excel_representation: governance_metadata

  - module_path: analytics.feasibility_report_contract.engine_identity
    pipeline_stage: governance
    role_description: Import-safe engine and manifest identity projection for feasibility-report provenance.
    excel_representation: governance_metadata

  - module_path: analytics.feasibility_report_contract.package
    pipeline_stage: governance
    role_description: Immutable DBAY-FRC-001 feasibility-report package root enforcing reference and authority checks.
    excel_representation: governance_metadata

  - module_path: analytics.feasibility_report_contract.project_case
    pipeline_stage: governance
    role_description: Pure global ProjectCase v1 input contract covering assets, topology, costs, and provenance.
    excel_representation: governance_metadata

  - module_path: analytics.feasibility_report_contract.records
    pipeline_stage: governance
    role_description: Typed immutable evidence, claim, review, decision, and reconciliation records for DBAY-FRC-001.
    excel_representation: governance_metadata

  - module_path: analytics.feasibility_report_contract.result_facade
    pipeline_stage: governance
    role_description: Strict non-authoritative D3C-1a result-projection facade contracts for feasibility outputs.
    excel_representation: governance_metadata

  - module_path: analytics.feasibility_report_contract.taxonomy_identity
    pipeline_stage: governance
    role_description: Import-safe identity and hash projection of the canonical feasibility-section taxonomy.
    excel_representation: governance_metadata

  - module_path: analytics.feasibility_report_contract.vocabulary
    pipeline_stage: governance
    role_description: Strict frozen vocabulary enums and constrained types for the feasibility-report contract.
    excel_representation: governance_metadata

  - module_path: analytics.feasibility_result_projection
    pipeline_stage: governance
    role_description: Projects accepted D3B execution results into non-authoritative D3C-1a feasibility views.
    excel_representation: governance_metadata

  - module_path: analytics.feasibility_sections
    pipeline_stage: governance
    role_description: Loads the 20-section feasibility report taxonomy and evaluates scenario coverage compliance.
    excel_representation: governance_metadata

  - module_path: analytics.finance.blue_whale_fx_tenor_screening
    pipeline_stage: core_finance
    role_description: Site-specific configuration adapter delegating to analytics.finance.fx_tenor_screening.
    excel_representation: non_model_adapter

  - module_path: analytics.finance.p90_recomputed_downside
    pipeline_stage: core_finance
    role_description: Reports a P90 case recomputed through the engine and taxed on the committed loan's interest, beside the scenario's own sizing downside factor and the P90/P50 CFADS ratio, on the committed debt; no sizing change.
    excel_representation: engine_table_plus_rollup

  - module_path: analytics.finance.fx_tenor_screening
    pipeline_stage: core_finance
    role_description: Evaluates dual-currency financing, FX depreciation shocks, and debt tenor-tail screening.
    excel_representation: engine_table_plus_rollup

  - module_path: analytics.fx.fx_builder
    pipeline_stage: core_finance
    role_description: Constructs structured USD/LKR FX curves and volatility blocks for pipeline and Monte Carlo runs.
    excel_representation: engine_table_plus_rollup

  - module_path: analytics.fx.fx_calibration
    pipeline_stage: core_finance
    role_description: Calibrates USD/LKR FX drift and volatility parameters from historical market observations.
    excel_representation: engine_table_plus_rollup

  - module_path: analytics.fx.fx_contracts
    pipeline_stage: core_finance
    role_description: Typed contracts defining FX curves, risk profiles, and structured FX scenario blocks.
    excel_representation: governance_metadata

  - module_path: analytics.fx.fx_fetch
    pipeline_stage: core_finance
    role_description: Config-driven USD/LKR FX-rate fetcher, pin resolver, and spot drift validator.
    excel_representation: non_model_adapter

  - module_path: analytics.fx.fx_history
    pipeline_stage: core_finance
    role_description: Provenance-tracked historical USD/LKR exchange-rate series loader for FX calibration.
    excel_representation: non_model_adapter

  - module_path: analytics.fx.fx_integration
    pipeline_stage: core_finance
    role_description: Integrates structured FX curves and calibration blocks into v14 pipeline execution configs.
    excel_representation: non_model_adapter

  - module_path: analytics.fx_sensitivity_real
    pipeline_stage: risk_sensitivity_opt
    role_description: Runs real FX depreciation and rate-shock sensitivity sweeps across scenario KPIs.
    excel_representation: engine_table_plus_rollup

  - module_path: analytics.gis.boundary_clip
    pipeline_stage: site_gis
    role_description: Clips wind-speed and AEP GeoTIFF rasters to a project site boundary polygon.
    excel_representation: non_model_adapter
    optional_extras:
      - gis
    extra_mode: required

  - module_path: analytics.gis.dem_ingest
    pipeline_stage: site_gis
    role_description: Ingests digital elevation model rasters and derives slope and aspect terrain layers.
    excel_representation: engine_table_plus_rollup
    optional_extras:
      - gis
    extra_mode: required
    notes: load_dem and run_dem_ingest require [gis] (rasterio); slope_aspect_hillshade and derive_terrain_layers run on base NumPy.

  - module_path: analytics.gis.exclusion_mask
    pipeline_stage: site_gis
    role_description: Buffers setback constraints and rasterizes buildable-area exclusion masks for siting.
    excel_representation: engine_table_plus_rollup
    optional_extras:
      - gis
    extra_mode: required

  - module_path: analytics.gis.geotiff_export
    pipeline_stage: site_gis
    role_description: Exports geospatial wind, capacity-factor, and AEP raster grids as GeoTIFFs with manifest.
    excel_representation: non_model_adapter
    optional_extras:
      - gis
    extra_mode: required

  - module_path: analytics.gis.gis_export
    pipeline_stage: site_gis
    role_description: Orchestrates coarse and fine geospatial wind and AEP GeoTIFF generation for QGIS export.
    excel_representation: non_model_adapter
    optional_extras:
      - gis
      - wind
    extra_mode: required
    notes: GeoTIFF export always requires [gis] (rasterio); default_era5_source requires [wind] unless an explicit CellSource is injected.

  - module_path: analytics.gis.gwa_ingest
    pipeline_stage: site_gis
    role_description: Ingests Global Wind Atlas 250 m GeoTIFF layers as an external wind reference surface.
    excel_representation: engine_table_plus_rollup
    optional_extras:
      - gis
    extra_mode: required

  - module_path: analytics.gis.landcover_roughness
    pipeline_stage: site_gis
    role_description: Maps ESA WorldCover land-cover rasters to aerodynamic roughness-length z0 grids.
    excel_representation: engine_table_plus_rollup
    optional_extras:
      - gis
    extra_mode: required
    notes: export_roughness_raster requires [gis] (rasterio); reclass_landcover_to_z0 runs on base NumPy.

  - module_path: analytics.gis.mcdm_suitability
    pipeline_stage: site_gis
    role_description: Builds GIS multi-criteria wind-siting suitability surfaces using AHP weighted linear combination.
    excel_representation: engine_table_plus_rollup
    optional_extras:
      - gis
    extra_mode: casper_fallback
    notes: Core AHP, normalisation, and WLC surface math runs on base NumPy; GeoTIFF export uses [gis] (rasterio).

  - module_path: analytics.gis.pv_array_layout
    pipeline_stage: site_gis
    role_description: Sizes fixed-tilt PV tables, row pitch, BESS pad, and site polygon packing geometry.
    excel_representation: engine_table_plus_rollup
    optional_extras:
      - gis
      - solar
    extra_mode: required
    notes: Uses [gis] (shapely, pyproj) for site geometry/setbacks and [solar] (pvlib) for solar-position row-pitch calculations.

  - module_path: analytics.gis.rix
    pipeline_stage: site_gis
    role_description: Computes ruggedness index (RIX and delta-RIX) terrain complexity diagnostics from DEM grids.
    excel_representation: engine_table_plus_rollup
    optional_extras:
      - gis
    extra_mode: casper_fallback
    notes: Core point and array RIX diagnostics run on base NumPy; optional GeoTIFF export uses [gis] (rasterio).

  - module_path: analytics.gis.shadow_flicker
    pipeline_stage: site_gis
    role_description: Evaluates coastal turbine setback placement, tip-height setbacks, and receptor shadow-flicker hours.
    excel_representation: engine_table_plus_rollup
    optional_extras:
      - gis
      - solar
    extra_mode: required
    notes: Uses [gis] (pyproj, shapely) for local TM projection/setbacks and [solar] (pvlib) for sun-position calculations.

  - module_path: analytics.grid._pandapower_worker
    pipeline_stage: grid_qsts
    role_description: Isolated subprocess worker running single-request pandapower short-circuit and load-flow screens.
    excel_representation: non_model_adapter
    optional_extras:
      - grid
    extra_mode: required

  - module_path: analytics.grid.capabilities.bess
    pipeline_stage: grid_qsts
    role_description: Design-stage BESS PCS fault-current and SoH-degraded reactive capability screen at POC.
    excel_representation: engine_table_plus_rollup

  - module_path: analytics.grid.capabilities.bess_soc
    pipeline_stage: grid_qsts
    role_description: Shared BESS state-of-charge tracking and frequency/arbitrage reserve-split accounting model.
    excel_representation: engine_table_plus_rollup

  - module_path: analytics.grid.capabilities.solar
    pipeline_stage: grid_qsts
    role_description: Design-stage solar PV inverter fault-current, reactive PQ, and ride-through capability screen.
    excel_representation: engine_table_plus_rollup
    optional_extras: []
    extra_mode: none

  - module_path: analytics.grid.capabilities.wind
    pipeline_stage: grid_qsts
    role_description: Design-stage wind turbine converter fault-current, reactive PQ, and ride-through capability screen.
    excel_representation: engine_table_plus_rollup
    optional_extras:
      - grid
    extra_mode: casper_fallback
    notes: Static PQ envelope and default run_dynamics=False run on base dependencies; run_dynamics=True uses [grid] (andes) via analytics.grid.ride_through.

  - module_path: analytics.grid.curtailment_qsts
    pipeline_stage: grid_qsts
    role_description: OpenDSSDirect QSTS annual feeder curtailment engine splitting deemed and self curtailment.
    excel_representation: engine_table_plus_rollup
    optional_extras:
      - grid
    extra_mode: required

  - module_path: analytics.grid.evaluate_grid
    pipeline_stage: grid_qsts
    role_description: Single evaluation gateway orchestrating design-stage grid SCR and reactive screening studies.
    excel_representation: non_model_adapter
    optional_extras:
      - grid
    extra_mode: casper_fallback
    notes: Invokes [grid] pandapower screens when available and falls back to closed-form screens under CASPER.

  - module_path: analytics.grid.frequency_response
    pipeline_stage: grid_qsts
    role_description: Computes design-stage primary frequency-response de-load and droop headroom sizing.
    excel_representation: engine_table_plus_rollup

  - module_path: analytics.grid.grid_interface_schema
    pipeline_stage: grid_qsts
    role_description: Validates grid interconnection study configuration schemas and registers required grid fields.
    excel_representation: governance_metadata

  - module_path: analytics.grid.harmonics
    pipeline_stage: grid_qsts
    role_description: Performs SCR-coupled harmonic distortion and flicker power-quality screening at the POC.
    excel_representation: engine_table_plus_rollup
    optional_extras:
      - grid
    extra_mode: casper_fallback
    notes: Uses [grid] (pandapower) Zbus scan when available and falls back to closed-form inductive impedance under CASPER.

  - module_path: analytics.grid.hybrid.frequency_response
    pipeline_stage: grid_qsts
    role_description: Models combined multi-technology hybrid plant frequency-droop coordination at the POC.
    excel_representation: engine_table_plus_rollup
    optional_extras:
      - grid
    extra_mode: casper_fallback
    notes: Closed-form group droop split and SOC accounting run on base dependencies; opt-in run_dynamics=True degrades gracefully when [grid] (andes) is absent.

  - module_path: analytics.grid.hybrid.poc_aggregation
    pipeline_stage: grid_qsts
    role_description: Aggregates wind, solar, and BESS electrical capability ratings onto a shared POC bus.
    excel_representation: engine_table_plus_rollup

  - module_path: analytics.grid.pandapower_screening
    pipeline_stage: grid_qsts
    role_description: Process-isolated launcher managing pandapower grid screen execution and version policy checks.
    excel_representation: non_model_adapter
    optional_extras:
      - grid
    extra_mode: required

  - module_path: analytics.grid.qsts_evidence
    pipeline_stage: grid_qsts
    role_description: Fail-closed verifier for real/site QSTS evidence packages, checksums, and telemetry hashes.
    excel_representation: governance_metadata

  - module_path: analytics.grid.reactive_screen
    pipeline_stage: grid_qsts
    role_description: Evaluates steady-state reactive power capability and voltage compliance at the POC.
    excel_representation: engine_table_plus_rollup
    optional_extras:
      - grid
    extra_mode: casper_fallback
    notes: Uses [grid] (pandapower) AC load-flow when available and falls back to closed-form reactive gap screening under CASPER.

  - module_path: analytics.grid.ride_through
    pipeline_stage: grid_qsts
    role_description: Shared ANDES RMS dynamic LVRT/HVRT and frequency ride-through simulation core.
    excel_representation: engine_table_plus_rollup
    optional_extras:
      - grid
    extra_mode: casper_fallback
    notes: Envelope parsing and default run_dynamics=False run on base dependencies; dynamic RMS solve requires [grid] (andes).

  - module_path: analytics.grid.ride_through_poc
    pipeline_stage: grid_qsts
    role_description: Compatibility shim forwarding legacy LVRT ride-through calls to analytics.grid.ride_through.
    excel_representation: non_model_adapter
    optional_extras:
      - grid
    extra_mode: required

  - module_path: analytics.grid.short_circuit
    pipeline_stage: grid_qsts
    role_description: Evaluates short-circuit ratio (SCR) and fault levels at the point of connection.
    excel_representation: engine_table_plus_rollup
    optional_extras:
      - grid
    extra_mode: casper_fallback
    notes: Uses [grid] (pandapower) IEC 60909 when available and falls back to closed-form Thevenin screening under CASPER.

  - module_path: analytics.grid.synthetic_aep_qsts_output_records
    pipeline_stage: grid_qsts
    role_description: Executes and validates governed synthetic AEP and QSTS output-record handoff packages.
    excel_representation: governance_metadata

  - module_path: analytics.grid.synthetic_feeder_placeholder
    pipeline_stage: grid_qsts
    role_description: Deterministic synthetic OpenDSS feeder model package for counterfactual QSTS study testing.
    excel_representation: engine_table_plus_rollup
    optional_extras:
      - grid
    extra_mode: required
    notes: Production compile verification requires [grid] (opendssdirect); test-only compile-disabled mode runs on base dependencies.

  - module_path: analytics.grid.synthetic_feeder_qsts_adapter
    pipeline_stage: grid_qsts
    role_description: Adapts a verified synthetic feeder QSTS package into a finance-safe curtailment overlay.
    excel_representation: non_model_adapter
    optional_extras:
      - grid
    extra_mode: required
    notes: Runtime verification requires a detached OpenDSS compile check via verify_synthetic_feeder_package ([grid]).

  - module_path: analytics.grid.synthetic_input_records
    pipeline_stage: grid_qsts
    role_description: Generates and validates deterministic synthetic input-record packages for QSTS workflows.
    excel_representation: governance_metadata

  - module_path: analytics.infeasibility_diagnostics
    pipeline_stage: risk_sensitivity_opt
    role_description: Captures structured constraint infeasibility diagnostics and optimization audit logs.
    excel_representation: governance_metadata

  - module_path: analytics.irr_bridge
    pipeline_stage: core_finance
    role_description: Decomposes project IRR to equity IRR across tax, interest, leverage, and timing drivers.
    excel_representation: formula

  - module_path: analytics.jurisdiction_packs.resolver
    pipeline_stage: cost_levies_epc
    role_description: Resolves jurisdiction pack values by governed subject and valuation date; fails closed and reports conflicts.
    excel_representation: governance_metadata
    notes: Not wired (#1843); no engine path calls the resolver until later #1841 slices.

  - module_path: analytics.jurisdiction_packs.schema
    pipeline_stage: cost_levies_epc
