# config/scenarios/stress_tests/stress_capex_plus_20.yaml
# Sprint 12 Phase 3: CAPEX Overrun Stress Test (+20%)
#
# Scenario: Construction cost inflation / project overruns
# Impact: Increased debt service burden, reduced equity returns
# Use: Downside risk analysis, sensitivity to cost overruns

inherit_from: scenarios/dutchbay_lendercase_2025Q4.yaml

capital_structure:
  capex_total_usd: null  # Will be calculated as base * 1.20 multiplier
  capex_inflation_multiplier: 1.20  # 20% overrun

debt:
  enabled: true
  # Debt increases proportionally to CAPEX increase
  adjustment_for_capex_overrun: 1.20

refinancing:
  enabled: false

scenario:
  name: "Stress Test: CAPEX +20%"
  description: "Construction cost inflation scenario - CAPEX 20% above budget"
  category: "construction_risk"
  severity: "high"
  likelihood: "medium"

expected_outcomes:
  irr_reduction_pct_range: [5, 15]
  min_dscr_reduction_range: [0.10, 0.20]
  covenant_breach_probability_pct_range: [10, 30]
