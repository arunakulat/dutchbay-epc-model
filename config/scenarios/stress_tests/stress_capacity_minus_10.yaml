# config/scenarios/stress_tests/stress_capacity_minus_10.yaml
# Sprint 12 Phase 3: Generation Performance Stress Test
#
# Scenario: Underperformance - capacity factor 10% below design
# Impact: Reduced energy production, lower revenue
# Use: Plant performance risk, wind/solar resource uncertainty

inherit_from: scenarios/dutchbay_lendercase_2025Q4.yaml

project:
  # Capacity factor reduction: 10% below baseline
  capacity_factor_adjustment: -0.10
  # Alternative: capacity_factor_absolute: 0.35  # If baseline is 0.38

revenue:
  # Energy production tied to capacity factor
  # Lower production = lower PPA revenue
  
debt:
  enabled: true

refinancing:
  enabled: false

scenario:
  name: "Stress Test: Capacity Factor -10%"
  description: "Plant underperformance - capacity factor 10% below design/forecast"
  category: "performance_risk"
  severity: "medium"
  likelihood: "medium"
  # Resource: Wind/solar forecast error, equipment degradation, forced downtime

expected_outcomes:
  irr_reduction_pct_range: [8, 20]
  min_dscr_reduction_range: [0.08, 0.15]
  covenant_breach_probability_pct_range: [5, 20]
