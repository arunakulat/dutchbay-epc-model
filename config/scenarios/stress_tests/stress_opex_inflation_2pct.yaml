# config/scenarios/stress_tests/stress_opex_inflation_2pct.yaml
# Sprint 12 Phase 3: Operating Cost Inflation Stress
#
# Scenario: Higher-than-expected operating cost inflation
# Impact: Reduced available cash for debt service and distributions
# Use: Sensitivity to labor/spare parts cost escalation

inherit_from: scenarios/dutchbay_lendercase_2025Q4.yaml

operating_expenses:
  opex_base_annual_usd: null  # Use base case
  opex_inflation_annual_pct: 0.05  # 5% annual inflation (vs 2% base case)
  # Alternatively: opex_multiplier: 1.02  # 2% increase first year

debt:
  enabled: true

refinancing:
  enabled: false

scenario:
  name: "Stress Test: OPEX Inflation +2%"
  description: "Operating cost inflation - annual escalation 2% higher than base"
  category: "operational_risk"
  severity: "medium"
  likelihood: "high"

expected_outcomes:
  irr_reduction_pct_range: [2, 8]
  min_dscr_reduction_range: [0.02, 0.08]
  covenant_breach_probability_pct_range: [1, 10]
