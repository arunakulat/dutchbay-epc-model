# config/scenarios/stress_tests/stress_combined_worst.yaml
# Sprint 12 Phase 3: Worst-Case Combined Stress Test
#
# Scenario: Perfect storm - multiple adverse conditions simultaneously
# Impact: Severe project stress, highest covenant breach risk
# Use: Tail risk analysis, extreme scenario planning, board presentations

inherit_from: scenarios/dutchbay_lendercase_2025Q4.yaml

revenue:
  # Tariff falls 15% AND capacity factor drops 8%
  base_tariff_adjustment_pct: -0.15

project:
  capacity_factor_adjustment: -0.08

operating_expenses:
  opex_inflation_annual_pct: 0.05  # Higher inflation

capital_structure:
  capex_inflation_multiplier: 1.10  # 10% CAPEX overrun

fx:
  # Moderate FX stress
  usd_per_lkr_stress_multiplier: 0.70  # 30% depreciation

debt:
  enabled: true
  adjustment_for_capex_overrun: 1.10

refinancing:
  enabled: false

scenario:
  name: "Stress Test: Combined Worst-Case"
  description: "
    Multiple adverse stressors:
    - Tariff -15%, Capacity -8%, OPEX inflation +5%, CAPEX +10%, FX -30%
    
    Purpose: Tail risk analysis, high-impact low-probability event
    Use: Board presentations, covenant stress-testing, risk committee brief
  "
  category: "tail_risk"
  severity: "critical"
  likelihood: "very_low"  # <1% but not impossible
  combined_probability_pct: 0.5  # Rough estimate of joint occurrence

expected_outcomes:
  irr_reduction_pct_range: [40, 80]
  min_dscr_reduction_range: [0.30, 0.60]
  covenant_breach_probability_pct_range: [50, 95]
  # This scenario often triggers covenant violations
