# config/scenarios/stress_tests/stress_fx_depr_50pct.yaml
# Sprint 12 Phase 3: Foreign Exchange Risk Stress Test
#
# Scenario: Local currency (LKR) depreciation vs USD
# Impact: Increased debt servicing cost, reduced equity returns in hard currency
# Use: FX risk analysis, currency mismatch exposure

inherit_from: scenarios/dutchbay_lendercase_2025Q4.yaml

fx:
  # LKR/USD depreciation: 50% weaker LKR
  # E.g., if baseline is 300 LKR/USD, stress is 450 LKR/USD
  usd_per_lkr_stress_multiplier: 0.50  # 1 USD = more LKR (currency weakens)
  # Or absolute: usd_per_lkr: 450  # Specify exact rate

debt:
  enabled: true
  # Debt in USD currency (or portion in USD) gets harder to repay
  # Interest/principal in LKR increases in nominal terms

equity:
  # Equity returns in USD decline due to FX headwind
  distribution_policy: passive

scenario:
  name: "Stress Test: FX Depreciation 50%"
  description: "Currency stress - LKR depreciation 50% vs USD (e.g., 300→450 LKR/USD)"
  category: "currency_risk"
  severity: "high"
  likelihood: "low"  # Tail event

expected_outcomes:
  irr_reduction_pct_range: [15, 40]
  min_dscr_reduction_range: [0.15, 0.35]
  covenant_breach_probability_pct_range: [20, 50]
