# Lender-grade report presentation defaults.
#
# CCCDIR: every constant the report layer needs — branding, covenant thresholds,
# and the KPI display spec — lives here, not hardcoded in Python. The cost-of-
# capital hurdle is deliberately NOT listed: the verdict reads it from the run's
# own `discount_rate_used` KPI, so it always reflects the scenario's actual WACC.

report:
  title: "Lender Information Memorandum"
  subtitle: "Utility-Scale Wind — Project-Finance Summary"
  organization: "DutchBay Capital"
  version: "1.0"
  confidentiality: "Strictly Private & Confidential"
  disclaimer: >
    This document is a model-generated summary prepared for discussion purposes
    only. Figures are derived from the DutchBay v14 project-finance engine on the
    stated assumptions and do not constitute investment advice, an offer, or a
    commitment to lend. Recipients must form their own independent assessment.

# Covenant thresholds the report flags KPIs against. These are lender policy
# inputs (not engine outputs), so they belong in config.
covenants:
  min_dscr_floor: 1.20      # hard lender floor on the minimum DSCR
  min_dscr_target: 1.30     # sculpt / structuring target
  max_balloon_pct: 0.40     # refinance-risk ceiling on the bullet/balloon share

# KPI display table: order, human label, and formatting `kind`:
#   pct       -> value * 100, two decimals, "%"   (returns, rates, shares)
#   multiple  -> value, two decimals, "x"          (DSCR, LLCR, PLCR, MOIC)
#   usd       -> value, thousands separator, "$"    (NPV, CFADS)
kpi_table:
  - {key: project_irr,        label: "Project IRR (nominal)",   kind: pct}
  - {key: equity_irr,         label: "Equity IRR",              kind: pct}
  - {key: project_npv,        label: "Project NPV",             kind: usd}
  - {key: equity_npv,         label: "Equity NPV",              kind: usd}
  - {key: min_dscr,           label: "Minimum DSCR",            kind: multiple}
  - {key: avg_dscr,           label: "Average DSCR",            kind: multiple}
  - {key: llcr,               label: "LLCR",                    kind: multiple}
  - {key: plcr,               label: "PLCR",                    kind: multiple}
  - {key: equity_moic,        label: "Equity MOIC",             kind: multiple}
  - {key: discount_rate_used, label: "WACC (project hurdle)",   kind: pct}
  - {key: balloon_pct,        label: "Balloon / bullet share",  kind: pct}

# Risk register — the lender IM's qualitative project-risk matrix (#C8). CCCDIR: the risks
# are config-authored (per-project analyst content), not hardcoded in Python; the report
# layer only renders them. `severity` is the RESIDUAL rating after mitigation
# (low | medium | high) and drives the badge colour. Seeded with the real DutchBay risk
# profile of a flat-nominal-LKR tariff financed with hard-currency debt.
risk_register:
  - category: "Revenue / FX"
    risk: >
      The PPA tariff is fixed in nominal LKR with no escalation or FX indexation, while
      debt and sponsor returns are measured in USD — LKR depreciation erodes the hard-
      currency value of every future rupee of revenue.
    mitigation: >
      FX path stressed to CBSL/IMF projections; debt sized off the LKR-denominated DSCR;
      the resulting negative equity IRR is disclosed to sponsors rather than masked.
    severity: "high"
  - category: "Resource"
    risk: >
      Energy-yield uncertainty — the realised net capacity factor may fall below the P50
      used to size the debt. The headline P50/P90 is screening-grade: fitted from single-
      cell ERA5 reanalysis with no on-site mast and the MCP long-term correction unwired
      (#961).
    mitigation: >
      Modelled/indicative AEP from an ERA5->Weibull->certified-power-curve chain with
      enforced source provenance; debt sculpted with DSCR headroom; P90 sensitivity
      reported. A bankable yield requires an on-site measurement campaign (>=12 months,
      met mast or IEC-accepted LiDAR/SoDAR) long-term-adjusted via MCP before financial
      close.
    severity: "high"
    # TCFD physical: wind-resource variability is a chronic climate/weather hazard to output.
    climate_risk_category: "physical"
  - category: "Curtailment"
    risk: >
      Grid constraints may curtail dispatch below the modeled net availability.
    mitigation: >
      The CEB standardized PPA pays curtailed output as deemed energy, so economic
      curtailment is not haircut from revenue.
    severity: "medium"
    # TCFD physical: curtailment tracks physical dispatch/grid conditions, not a policy shift.
    climate_risk_category: "physical"
  - category: "Refinancing"
    risk: >
      A balloon / bullet repayment at debt maturity exposes the project to refinancing
      risk if credit conditions tighten.
    mitigation: >
      Balloon share is covenant-capped and tested against the refinance-risk ceiling in
      the covenant table.
    severity: "medium"
  - category: "Construction / EPC"
    risk: >
      Cost or schedule overrun during construction raises capex and interest-during-
      construction.
    mitigation: >
      Fixed-price EPC on a SINOHYDRO bottom-up basis; an AACE estimate-class accuracy band
      is carried and contingency is held in the cost stack.
    severity: "medium"
  - category: "Regulatory / Tariff"
    risk: >
      Changes to the renewable tax regime or the PPA framework could alter after-tax
      returns over the 20-year term.
    mitigation: >
      The tax block is reconciled to the current IMF-reformed Sri Lankan regime with no
      reliance on the removed renewable-energy tax holiday.
    severity: "medium"
    # TCFD transition: policy / tax-regime / tariff-framework shifts are transition risk.
    climate_risk_category: "transition"

# Model limitations & assumptions (#734): the report-wide scope caveats surfaced in every
# generated report, so no output is read without them. These consolidate caveats that were
# otherwise documented only in module docstrings/result-notes (verified in-code, not invented):
#   - BESS dispatch  -> finance/bess_lcos.py "LIMITATIONS (stated for lender DD, DOC-03)"
#   - Tax shield / 100% sweep / equity-balancing -> analytics/three_statement.py "Documented limitations"
#   - Construction draw/phasing placeholders -> finance/debt_v14.py A1/#91 placeholder WARNs (#683)
model_limitations:
  - topic: "BESS dispatch"
    detail: >
      Battery revenue and LCOS use a fixed, overridable cycles-per-year at the rated
      depth-of-discharge; intra-day charge/discharge is not dispatch-optimised or simulated
      (actual dispatch is set by the offtaker). A deliberate simplification versus
      MILP/stochastic dispatch-optimisation.
  - topic: "Tax shield"
    detail: >
      The tax line is the engine's computed tax; because the model sequences cash-flow then
      debt sizing, it does not re-credit the full debt-interest shield.
  - topic: "Equity distributions"
    detail: >
      Distributions assume a 100% cash sweep, and equity is the balancing item of the
      three-statement build (which therefore articulates by construction).
  - topic: "Deterministic base case"
    detail: >
      Headline KPIs are a deterministic P50 case; distributional and tail risk (VaR/CVaR,
      covenant-breach probabilities) are a separate, opt-in Monte-Carlo surface, not the
      base figures.
  - topic: "Construction draw and capex phasing"
    detail: >
      Where a scenario does not supply Financing_Terms.debt_drawdown_pct or
      construction_schedule, the debt engine substitutes documented placeholders (an even
      [50, 50] draw and a [40, 60] capex phasing) and logs a warning. IDC (capitalised
      construction interest) is draw-timing-sensitive, so figures derived under these
      placeholders are indicative until the EPC milestone payment schedule is supplied.
      The committed DutchBay lender case currently uses both placeholders.
  - topic: "Wind resource measurement basis (screening-grade)"
    detail: >
      The headline wind P50/P90 AEP is fitted from a single-cell ERA5 reanalysis timeseries
      (Weibull A=8.199 / k=2.665, 2020-2024) with NO on-site met mast or IEC-accepted
      LiDAR/SoDAR, and the measure-correlate-predict module (wind_resource/mcp.py) is present
      but UNWIRED (#961). Under MEASNET v3.1 and IEC 61400-15-1:2025 a bankable yield requires
      >=12 concurrent months of on-site measurement long-term-adjusted against the reanalysis
      reference via MCP; reanalysis reproduces wind over time but not space and can over-state
      coastal yield. The committed P50/P90 and every AEP-driven KPI are therefore
      PRE-MEASUREMENT / indicative until an on-site campaign is commissioned and wired through
      MCP, at which point the AEP re-freeze is a governed, KPI-moving change.
