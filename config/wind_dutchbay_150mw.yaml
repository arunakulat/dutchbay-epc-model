# DutchBay 150 MW Wind Farm - Hydra Configuration
# Sprint 17 - Complete Wind-to-Finance Pipeline
#
# Usage:
#   python analytics/pipeline_v14.py config=wind_dutchbay_150mw

project:
  name: "DutchBay Wind Farm"
  location: "Dutch Bay, Kalpitiya, Puttalam District, Sri Lanka"
  capacity_mw: 149.5
  cod_year: 2027
  developer: "DutchBay Wind Power Pvt Ltd"
  grid_poi: "Puttalam 220kV Substation"

turbine:
  model: "Envision EN-171/6.5"
  n_turbines: 23
  rated_power_kw: 6500
  rotor_diameter_m: 171
  hub_height_m: 150
  cut_in_ms: 3.0
  cut_out_ms: 25.0
  rated_wind_speed_ms: 12.0
  certification_status: "OEM_CERTIFIED"
  notes: "Canonical Envision EN-171/6.5 OEM power curve (wind_resource/config/power_curves.yaml). 23 x 6.5 MW = 149.5 MW. Supersedes the prior 10 MW x 15 extrapolation."

wind_resource:
  weibull_a: 8.32  # Weibull scale parameter (m/s) - canonical lender baseline (aligned with lender scenario)
  weibull_k: 2.1  # Weibull shape parameter
  mean_wind_speed_ms: 7.85
  shear_exponent: 0.14
  air_density_kgm3: 1.15  # kg/m³ at ~15°C, sea level
  data_source: "ECMWF ERA5 Reanalysis"
  data_years: "2020-2024"

losses:
  # ERA5 canonical loss stack (wind_resource/config/era5_config.yaml): multiplicative total 12.4%.
  # TODO(layout): 5% wake is the ERA5 baseline; a 23-turbine wake study is pending and will lower P50.
  wake_loss_pct: 5.0
  availability_pct: 97.0
  electrical_loss_pct: 2.0
  curtailment_pct: 2.0
  environmental_pct: 1.0
  total_loss_pct: 12.4

layout:
  turbine_spacing_avg_m: 650
  turbine_spacing_avg_D: 3.0
  iec_compliant_pairs: 6
  iec_marginal_pairs: 3
  iec_violation_pairs: 6
  layout_orientation: "linear_north_south_coastal"
  coordinates_reference: "WGS84_EPSG4326"
  utm_zone: "44N"

financial:
  ppa_price_eur_mwh: 72.5
  ppa_term_years: 25
  cpi_annual_pct: 2.0
  degradation_pct_yr: 0.5
  capex_m_usd: 260.0
  capex_per_kw_usd: 1733
  opex_annual_m_usd: 3.2
  opex_per_kw_yr_usd: 21.3

monte_carlo:
  n_scenarios: 100000  # Use 1000 for testing, 100000 for production
  weibull_uncertainty_pct: 10.0  # ±10% on A and k
  wake_loss_std_pct: 2.0  # ±2% on wake loss
  availability_std_pct: 1.0  # ±1% on availability
  electrical_loss_std_pct: 0.5  # ±0.5% on electrical loss

pipeline:
  output_dir: "outputs/dutchbay_150mw"
  seed: 42  # For reproducibility
  export_scenarios: true
  export_provenance: true

# Expected Results (for validation)
expected_results:
  # Computed from the canonical EN-171/6.5 curve via wind_resource.EnergyCalculator
  # (23 x 6.5 MW, DECLARED config Weibull A=8.32/k=2.1 -- pending live ERA5 fetch #18/#24, 12.4% losses, P50=1.0). Supersedes 563/612/0.428.
  net_aep_p50_gwh: 402.6
  net_aep_p90_gwh: 322.1
  capacity_factor: 0.307
  annual_revenue_p50_m_eur: 29.2
  annual_revenue_p90_m_eur: 23.3
  revenue_25yr_undiscounted_m_eur: 729.4
