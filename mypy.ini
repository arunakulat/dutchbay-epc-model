[mypy]
python_version = 3.11
warn_unused_configs = True
disallow_any_generics = True
disallow_subclassing_any = True
disallow_untyped_calls = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_return_any = True
warn_unused_ignores = True
strict_equality = True

# ---- Third‑party web / infra layers ----
[mypy-fastapi.*]
ignore_missing_imports = True

[mypy-uvicorn.*]
ignore_missing_imports = True

[mypy-weasyprint.*]
ignore_missing_imports = True

[mypy-reportlab.*]
ignore_missing_imports = True

[mypy-yaml.*]
ignore_missing_imports = True

# ---- Numeric / data libraries ----
[mypy-pandas]
ignore_missing_imports = True

[mypy-numpy_financial]
ignore_missing_imports = True

[mypy-openpyxl]
ignore_missing_imports = True

[mypy-matplotlib.*]
ignore_missing_imports = True

[mypy-scipy.stats]
ignore_missing_imports = True

# ---- v14 infra dependencies (config / orchestration) ----
[mypy-pydantic.*]
ignore_missing_imports = True

[mypy-hydra.*]
ignore_missing_imports = True

[mypy-omegaconf.*]
ignore_missing_imports = True

[mypy-multiprocess.*]
ignore_missing_imports = True

[mypy-SALib.*]
ignore_missing_imports = True

[mypy-streamlit.*]
ignore_missing_imports = True

[mypy-PySAM.*]
 ignore_missing_imports = True

# ---- Legacy / glue that shouldn't block CI ----
[mypy-legacy.*]
ignore_errors = True

# Export / workbook glue: keep logically tested but untyped
[mypy-analytics.export_helpers]
ignore_errors = True

[mypy-analytics.executive_workbook]
ignore_errors = True

# Optional: relax noisy demo/dashboard modules
[mypy-analytics.sensitivity.dashboard_demo]
ignore_errors = True

[mypy-analytics.dashboard.streamlit_app]
ignore_errors = True
