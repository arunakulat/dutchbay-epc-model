[mypy]
python_version = 3.11
# pydantic.mypy (#594): type-check the CASPER-family frozen-contract boundary —
# model field types, constructor signatures and validators in the pydantic v2
# models (analytics contracts, fx_contracts, equity distribution, api/app layers)
# instead of treating BaseModel subclasses as dynamically-typed. Requires
# pydantic importable in the mypy env; the CI lint job installs requirements.txt
# precisely so this holds (see test-suite.yml "Install linting tools").
plugins = pydantic.mypy
warn_unused_configs = True
disallow_any_generics = True
disallow_subclassing_any = True
disallow_untyped_calls = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_return_any = True
warn_unused_ignores = True
strict_equality = True

# Plugin settings for pydantic.mypy (registered above). Strictest profile:
#   init_forbid_extra          — reject unknown keyword args to model __init__
#   init_typed                 — synthesize precisely-typed __init__ signatures
#   warn_required_dynamic_aliases — flag required fields whose alias is dynamic
# Dry-verified against the CI-pinned mypy 1.19.0 + pydantic 2.13.4: zero new
# errors on both CI gates (library surface and scripts/).
[pydantic-mypy]
init_forbid_extra = True
init_typed = True
warn_required_dynamic_aliases = True

# ---- Third‑party web / infra layers ----
[mypy-fastapi.*]
ignore_missing_imports = True

[mypy-uvicorn.*]
ignore_missing_imports = True

[mypy-weasyprint.*]
ignore_missing_imports = True

[mypy-reportlab.*]
ignore_missing_imports = True

[mypy-yaml.*]
ignore_missing_imports = True

# ---- Numeric / data libraries ----
[mypy-pandas]
ignore_missing_imports = True

[mypy-numpy_financial]
ignore_missing_imports = True

[mypy-openpyxl]
ignore_missing_imports = True

[mypy-matplotlib.*]
ignore_missing_imports = True

[mypy-scipy.stats]
ignore_missing_imports = True

# ---- v14 infra dependencies (config / orchestration) ----
# NOTE (#594): this pydantic block is now inert — pydantic v2 ships py.typed, so
# its types are always found and ignore_missing_imports never fires. Kept
# deliberately (removal is a user-gated cleanup, not part of the plugin dolphin).
[mypy-pydantic.*]
ignore_missing_imports = True

[mypy-hydra.*]
ignore_missing_imports = True

[mypy-omegaconf.*]
ignore_missing_imports = True

[mypy-multiprocess.*]
ignore_missing_imports = True

[mypy-SALib.*]
ignore_missing_imports = True

# pymoo is the OPT-IN [pareto] extra (analytics.sensitivity.optimizer #603);
# untyped upstream and absent from the type-check env by design.
[mypy-pymoo.*]
ignore_missing_imports = True

[mypy-streamlit.*]
ignore_missing_imports = True

[mypy-PySAM.*]
 ignore_missing_imports = True

# ---- Untyped third-party libraries (no stubs / no py.typed marker) ----
# Declared explicitly (per-module) rather than relying on a blanket
# --ignore-missing-imports, so the strict gate stays fail-loud: a NEW unstubbed
# import surfaces as an error until it is deliberately added here. These are the
# scientific / infra deps the wind, solar, ERA5 and web/job layers import that ship
# without type information.
[mypy-py_wake.*]
ignore_missing_imports = True

[mypy-cdsapi.*]
ignore_missing_imports = True

[mypy-rasterio.*]
ignore_missing_imports = True

# shapely (#833 exclusion mask) is an optional [gis] geometry dep with no type stubs,
# guarded at call time via analytics.gis.exclusion_mask._require_shapely (CASPER). Both
# the bare header (for a top-level `import shapely`) and the `.*` header (for
# `from shapely.geometry import ...`) are required, same as the redis/arq pattern above —
# a single `.*` header would not cover the bare import.
[mypy-shapely]
ignore_missing_imports = True

[mypy-shapely.*]
ignore_missing_imports = True

[mypy-windpowerlib.*]
ignore_missing_imports = True

[mypy-turbine_models.*]
ignore_missing_imports = True

[mypy-pvlib.*]
ignore_missing_imports = True

# redis/arq are OPTIONAL async-job infra (app/jobs) often absent from the type-check
# env; the bare-module headers (no .*) are required so a top-level `import redis` /
# `from arq.connections import ...` is covered, not just submodules.
[mypy-redis]
ignore_missing_imports = True

[mypy-redis.*]
ignore_missing_imports = True

[mypy-arq]
ignore_missing_imports = True

[mypy-arq.*]
ignore_missing_imports = True

# ---- Legacy / glue that shouldn't block CI ----
[mypy-legacy.*]
ignore_errors = True

# Export / workbook glue: keep logically tested but untyped
[mypy-analytics.export_helpers]
ignore_errors = True

[mypy-analytics.executive_workbook]
ignore_errors = True

# Optional: relax noisy demo/dashboard modules
[mypy-analytics.sensitivity.dashboard_demo]
ignore_errors = True

[mypy-analytics.dashboard.streamlit_app]
ignore_errors = True

# ---- Operational / reporting scripts (scripts/) ----
# scripts/ is in the mypy gate via a SEPARATE CI invocation (see test-suite.yml):
#     mypy scripts/ --ignore-missing-imports \
#          --allow-untyped-defs --allow-untyped-calls --allow-any-generics
# A per-module [mypy-scripts.*] section cannot express this because scripts/ has no
# __init__.py, so mypy names those modules by basename (not scripts.<name>) and the
# section would never match. The dedicated invocation keeps mypy's REAL bug-detection
# on scripts — attr-defined, arg-type, bad indexing/operators, wrong assignments,
# call-arg/overload and return-type errors all fail CI — while relaxing the
# annotation-*completeness* mandates that suit the typed library surface but not
# end-of-pipeline utilities and report generators. check_untyped_defs stays on, so
# the bodies of unannotated script functions are still type-checked for real bugs.
