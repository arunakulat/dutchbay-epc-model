# fly.toml app configuration file generated for dutchbay-epc-model on 2026-07-07T18:16:30Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'dutchbay-epc-model'
primary_region = 'sin'

[build]

[env]
  DUTCHBAY_ENV = 'production'
  DUTCHBAY_JOBS_BACKEND = 'redis'
  DUTCHBAY_JOBS_MAX_RETAINED = '1000'
  DUTCHBAY_JOBS_QUEUE = 'dutchbay:wind_jobs'
  DUTCHBAY_JOBS_TTL_SECONDS = '86400'
  DUTCHBAY_JWT_AUDIENCE = 'dutchbay-web'
  DUTCHBAY_JWT_ISSUER = 'dutchbay-epc-model'
  DUTCHBAY_SSE_MAX_POLLS = '600'
  DUTCHBAY_SSE_POLL_INTERVAL = '0.5'
  DUTCHBAY_SYNC_ROUTE_MAX_CONCURRENCY = '8'
  DUTCHBAY_SYNC_ROUTE_TIMEOUT = '120'

[processes]
  web = 'uvicorn app.api.main:app --host 0.0.0.0 --port 8080'
  worker = 'arq app.jobs.worker.WorkerSettings'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['web']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
