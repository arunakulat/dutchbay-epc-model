# ERA5 retrieval request -- DutchBay / Kalpitiya (issues #177, #178).
#
# Credentials are NOT stored here. The Copernicus CDS key lives only in ~/.cdsapirc
# (the cdsapi default), or is provided via CDSAPI_URL / CDSAPI_KEY env vars and written
# by wind_resource.era5_retrieval.ensure_cdsapirc(). NEVER commit the key.
#
# This config is generic: change project.name + latitude/longitude to retrieve + compute
# AEP for ANY RE project site.
project:
  name: "DutchBay Kalpitiya"
  latitude: 8.27        # turbine-array centroid (T1-T15), Kalpitiya, Puttalam, Sri Lanka
  longitude: 79.75
download:
  reference:
    mode: fixed         # FIXED = reproducible: a pinned window can't drift between runs.
    start: 2005         # the 20-yr long-term P50 window backing the lender baseline.
    end: 2024
    # 'mode: latest' (n_years + end_year_lag) resolves end = current_year - lag at LOAD
    # time, so it moves every run -- use it for exploratory re-baselining ONLY, never for
    # a reproducible lender assessment.
  output_dir: "outputs/era5_cache"   # project-relative (not machine-local /tmp)
  alpha_min: 0.05       # wind-shear bounds for the 100m -> hub power-law extrapolation
  alpha_max: 0.40
  strict_coverage: true # raise if the retrieved series doesn't fully cover the window (no silent partials)
turbine:
  model: "iea_reference_10mw"   # IEA Reference 10MW curve (wind_resource/config/power_curves.yaml)
  num_turbines: 15              # 15 x 10.638 MW = 159.6 MW
  hub_height_m: 150
credentials:
  # CDS key is NEVER stored in the repo. Provide it in ~/.cdsapirc:
  #   url: https://cds.climate.copernicus.eu/api
  #   key: <your-token>
  # (or export CDSAPI_URL / CDSAPI_KEY and call ensure_cdsapirc()).
  cdsapirc: "~/.cdsapirc"
