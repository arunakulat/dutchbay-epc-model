[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    edge_case: Edge case and boundary condition tests that stress error handling
    stress: Stress tests, failure scenarios, and load/performance edge cases
    critical_error: Critical error handling and recovery tests
    integration: Integration tests that span multiple modules
    unit: Unit tests for individual functions and classes
    slow: Slow running tests (deselect with '-m "not slow"')
    regression: Regression tests with frozen/expected output
    monte_carlo: Monte Carlo simulation tests
    sensitivity: Sensitivity analysis tests
    casper: CASPER payload and tail-risk evaluation tests
    smoke: Smoke tests for basic functionality
    frozen: Tests with frozen/regression assertions (not absolute bounds)

addopts =
    --strict-markers
    --tb=short
    -ra

filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
