[pytest]
# =============================================================================
# Test Discovery
# =============================================================================
testpaths =
    tests

python_files = test_*.py

# =============================================================================
# Pytest Execution Options
# =============================================================================
addopts =
    -ra
    --strict-markers
    --strict-config
    --maxfail=2
    --disable-warnings

    # Coverage focus: v14 surfaces + public API/config glue
    --cov=analytics
    --cov=finance
    --cov=api
    --cov=config
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=55

# =============================================================================
# Directory Exclusions
# =============================================================================
norecursedirs =
    .git
    .venv
    venv
    dist
    build
    legacy_v13
    __pycache__
    *.egg-info
    .pytest_cache
    .mypy_cache
    .ruff_cache

# =============================================================================
# Custom Test Markers
# =============================================================================
# Usage:
#   Run only smoke tests:     pytest -m smoke
#   Skip slow tests:          pytest -m "not slow"
#   Skip integration tests:   pytest -m "not integration"
#   Run integration only:     pytest -m integration
# =============================================================================
markers =
    smoke: fast, high-signal checks for CI (deselect with '-m "not smoke"')
    slow: opt-in heavy tests requiring significant resources (deselect with '-m "not slow"')
    integration: integration tests requiring full pipeline execution (deselect with '-m "not integration"')

# =============================================================================
# Test Output Formatting
# =============================================================================
# Uncomment these for more verbose output during development:
# addopts =
#     -vv
#     --tb=short
#     --showlocals

# =============================================================================
# Coverage Configuration Notes
# =============================================================================
# Current coverage: ~52%
# Target threshold: 55%
# Gap to close: ~3%
#
# To run tests WITHOUT coverage gate (useful during development):
#   pytest --override-ini="addopts=" -v
#
# To generate HTML coverage report:
#   pytest --cov-report=html
#   open htmlcov/index.html
#
# Coverage focus areas (Sprint 7+):
#   - analytics.sensitivity_v14 (newly refactored)
#   - finance.cashflow_v14 (core engine)
#   - finance.debt_v14 (DSCR calculations)
#   - analytics.core.metrics (KPI aggregation)
# =============================================================================
