[pytest]
pythonpath = .

testpaths = tests
python_files = test_*.py

addopts =
    --ignore=legacy
    --ignore=tests/analytics_layer/test_sensitivity_v14.py
    --ignore=tests/analytics_layer/test_sensitivity_regression.py
    --cov=analytics
    --cov=finance
    --cov-report=term-missing
    --cov-fail-under=0
    --tb=short
    --maxfail=2

markers =
    slow: run slower, full-matrix/heatmap/montecarlo tests
    ci: default to only fast/smoke tests in CI builds

filterwarnings =
    ignore::UserWarning