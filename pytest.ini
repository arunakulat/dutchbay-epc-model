[pytest]
# Where to look for tests
testpaths =
    tests

python_files = test_*.py

addopts =
    -ra
    --strict-markers
    --strict-config
    --maxfail=2
    --disable-warnings

    # Coverage focus: v14 surfaces + public API/config glue
    --cov=analytics
    --cov=finance
    --cov=api
    --cov=config
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=55

norecursedirs =
    .git
    .venv
    venv
    dist
    build
    legacy_v13

markers =
    smoke: fast, high-signal checks for CI
    slow: opt-in heavy tests
