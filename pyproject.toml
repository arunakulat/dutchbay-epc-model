[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dutchbay-epc-model"
version = "15.2.0"
description = "Lender/DFI-grade project-finance model for utility-scale wind: CFADS, multi-tranche debt with DSCR covenants, tax with TLCF, Monte Carlo, and an ERA5 to Weibull to AEP to finance pipeline."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  # Cap <3.0: pandas 3.0 (Jan 2026) makes Copy-on-Write mandatory and infers a default
  # str dtype — unconditional breaking changes. Lift only after a deliberate,
  # KPI-oracle-verified 3.0 migration (#593).
  "pandas>=2.0,<3.0",
  "numpy-financial>=1.0.0",
  "openpyxl>=3.1",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
  "scipy>=1.10",
  "omegaconf>=2.3",
  # Canonical CLI framework (GWTF CLI-01/R1). A real runtime dep: the packaged
  # analytics.cli.*_hydra modules import hydra at module scope, so regenerating the
  # requirements.txt lock from pyproject alone must not drop it. Maintenance-risk
  # ADR (stalled upstream cadence + OmegaConf fallback): docs/HYDRA_MAINTENANCE_DECISION.md (#609).
  "hydra-core>=1.3.3",
  "pydantic>=2.0",
  "jinja2>=3.1",          # drives the base HTML report (app.reports.renderer); PDF (weasyprint) is the [report] extra
]

[project.optional-dependencies]
# The single dev/CI toolchain. `pip install -e ".[dev]"` provides every gate CI runs
# (ruff/black/isort/flake8/pylint, mypy + the type stubs, bandit + pip-audit, pytest +
# xdist/cov/html/timeout, hypothesis, httpx TestClient, libcst, build). Supersedes the
# retired requirements_dev.txt — pyproject is the single abstract source of truth.
dev = [
  "ruff>=0.5",
  "black>=24.0",
  "isort>=5.13",
  "flake8>=7.0",
  "pylint>=3.0",
  "mypy>=1.18",
  "mypy-extensions>=1.1",
  "pandas-stubs",        # the mypy gate is only faithful WITH these stubs (else falsely clean)
  "scipy-stubs",
  "types-PyYAML",
  "types-openpyxl",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "pytest-xdist>=3.5",
  "pytest-html>=4.0",
  "pytest-timeout>=2.2",
  "hypothesis>=6.100",
  "httpx>=0.27",         # FastAPI TestClient (tests/api, tests/app)
  "libcst>=1.1",         # LibCST lint/codemod tests under tests/lint
  "SALib>=1.5",          # global (Morris/Sobol) sensitivity — analytics.sensitivity.global_sa (#C6)
  "build>=1.2",
]
test = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "pytest-xdist>=3.5",
]
# HTTP API surface (api/ + app/services): FastAPI app served by uvicorn. Opt-in —
# the finance engine + CLI do not need a web server.
api = [
  "fastapi>=0.110",
  "uvicorn>=0.30",
]
# Streamlit sensitivity dashboard (app/). Opt-in; peripheral to the finance engine.
dashboard = [
  "streamlit>=1.40",
]
# Wind-resource ingestion path (ERA5 / Copernicus CDS). Kept as an opt-in
# extra so lender-grade finance runs that consume a *frozen* wind export JSON
# do not require Copernicus credentials or the netCDF toolchain. Install with:
#     pip install -e ".[wind]"
# Producers of the frozen export (scripts/run_wind_analysis_v14.py) require
# this extra; consumers (run_full_pipeline_v14.py + wind_resource.cashflow_adapter)
# do not. Disclosed as Defect W1 in Sprint 19 (CHANGELOG v14.15.0).
wind = [
  # >=0.7.2: the CDS-Beta platform is the sole live Copernicus endpoint since 26 Sep 2024
  # and requires cdsapi>=0.7.0 (0.7.2+ recommended); a pre-CDS-Beta version resolves but
  # silently fails against the live endpoint (#592).
  "cdsapi>=0.7.2",
  "xarray>=2023.6",
  "netcdf4>=1.6",
  "windpowerlib>=0.2",  # open turbine library (oedb) for power-curve sourcing (#181)
  "turbine-models>=0.2",  # NREL reference power curves (5-18 MW) for sourcing fallback (#181)
  "py-wake>=2.6",  # DTU PyWake — granular per-turbine wake model (Bastankhah/TurbOPark) for the bankable AEP engine
]
# Solar-resource producer (multi-tech hybrid). pvlib turns a PV-system spec + a measured
# site GHI into a bankable solar AEP / capacity factor — the photovoltaic analogue of the
# [wind] bankable-AEP engine. Opt-in like [wind]: a hybrid's declared P50 solar CF
# (generation.technologies.solar.capacity_factor) runs the finance stack with no extra,
# and solar_resource.pv_producer guards the import via _require_pvlib (CASPER), so the base
# install never needs pvlib. Solar tests are gated behind pytest.importorskip('pvlib').
solar = [
  "pvlib>=0.11",
]
# Multi-objective Pareto search backend (issue #603). pymoo's NSGA-II drives the
# opt-in plan_kind="pymoo" adaptive search in analytics.sensitivity.optimizer for
# >=2-parameter trade-offs (e.g. tariff vs gearing) where the Cartesian grid plan
# explodes past max_points. Opt-in like [wind]/[solar]: the default 'grid'/'lhs'
# plans never import pymoo, the backend guards the import via _require_pymoo()
# (CASPER), and the pymoo tests are gated behind pytest.importorskip('pymoo'),
# so the base finance install never needs it.
pareto = [
  "pymoo>=0.6",
]
# GeoTIFF / raster export for QGIS (issue #20). rasterio wheels bundle their own GDAL,
# so no system GDAL/apt is needed on the CI runner or macOS. Opt-in like [wind]; the
# export code (analytics.gis.geotiff_export) guards the import via _require_rasterio
# (CASPER), so the base finance install never needs the GIS toolchain.
gis = [
  "rasterio>=1.3",
]
# PDF report rendering (Sprint 2). Jinja2 (in core deps) drives the HTML report;
# WeasyPrint is opt-in because it needs the pango/cairo system libraries that a
# bare CI runner lacks. The renderer guards the import (app.reports.renderer ->
# ReportDependencyError) so the base install always serves the HTML report, and
# the PDF tests are gated behind ``pytest.importorskip('weasyprint')`` (CASPER).
report = [
  "weasyprint>=60",
  # reportlab powers the standalone assessment-report generator
  # (scripts/generate_solar_assessment_report.py); gated behind importorskip in its test.
  "reportlab>=4.0",
  # geopandas clips the national GHI choropleth to the country land polygon and
  # contextily composites the Esri World Imagery satellite tile for the site
  # close-up. Both are optional: make_location_map degrades to a coastline outline
  # and make_site_context_map returns False (figure omitted) when they are absent.
  "geopandas>=1.0",
  "contextily>=1.6",
]
# Async live-ERA5 job path (Sprint 2). The default in-process path
# (app.api.jobs_router + BackgroundTasks) needs none of these; arq + Redis is the
# durable, cross-process upgrade driven by app.jobs.worker (loaded only by the arq
# CLI). CI does not install this extra, so the Redis/arq code is never imported in
# tests; RedisJobStore is unit-tested against a fake client instead.
jobs = [
  "arq>=0.25",
  "redis>=5.0",
]

[tool.ruff]
src = ["analytics", "finance", "dutchbay_v14chat", "scripts", "tests", "run_full_pipeline_v14.py"]
exclude = [".venv*", "venv*", "env*", ".tox", ".git", ".mypy_cache", ".pytest_cache"]

[tool.setuptools.packages.find]
# wind_resource* added Sprint 19 (W.2) — the package existed in the repo
# tree but was excluded from wheel discovery, so `pip install` produced an
# artifact without the wind-ingestion modules. Disclosed as Defect W2.
include = ["analytics*", "finance*", "dutchbay_v14chat*", "api*", "config*", "wind_resource*", "solar_resource*"]

[tool.black]
line-length = 88
target-version = ['py311']
exclude = '''
/(
    \.git
  | \.venv
  | \.venv311
  | legacy
  | __pycache__
)/
'''

[tool.isort]
# profile=black makes isort's import wrapping byte-compatible with black, so the two
# formatters converge instead of fighting (a hard prerequisite for enforcing both). This
# is now the single source of truth for isort — the CLI no longer needs --profile black.
profile = "black"
line_length = 88
# Match black's exclusions. isort's built-in skip already covers .venv/build/dist; these
# repo-specific frozen/local trees (top-level legacy/ + tests/legacy/, and .venv311) are not
# in the defaults, so add them explicitly to keep frozen code untouched.
extend_skip = ["legacy", ".venv311"]
extend_skip_glob = ["legacy/*", "*/legacy/*"]

[tool.mypy]
python_version = "3.11"
# Run mypy primarily over the typed application surface
files = ["analytics", "finance"]
config_file = "mypy.ini"

[tool.pytest.ini_options]
# Single source of truth for pytest configuration (CCCDIR, #439). pytest.ini,
# pytest.ci.ini and the tox.ini [pytest] section were retired: pytest resolved
# pytest.ini FIRST and silently ignored this block ("WARNING: ignoring pytest config
# in pyproject.toml"), so the --cov-fail-under floor declared here used to be dead.
# Coverage is deliberately NOT in addopts — a partial dev run (`pytest tests/foo.py`)
# must not spuriously trip the floor. The --cov-fail-under=95 gate lives where the FULL
# suite runs: `make test` and the CI test step (.github/workflows/test-suite.yml). The
# coverage surface/omissions are configured once in .coveragerc.
minversion = "6.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers --strict-config --showlocals"
norecursedirs = [".git", "__pycache__", ".pytest_cache", ".venv*", "venv*", "build", "dist", "*.egg-info"]
markers = [
    "slow: tests with long runtime (>5s; deselect with -m 'not slow')",
    "integration: integration tests spanning multiple modules",
    "unit: unit tests for individual functions and classes",
    "smoke: fast smoke tests (core import/CLI/analytics sanity)",
    "performance: performance/throughput benchmark tests (subset of slow)",
    "edge_case: edge-case and boundary-condition tests",
    "stress: stress/failure/load-scenario tests",
    "critical_error: critical error-handling and recovery tests",
    "regression: regression tests with frozen/expected output",
    "monte_carlo: Monte Carlo simulation tests",
    "sensitivity: sensitivity-analysis tests",
    "lint: static-analysis and linting tests",
    "analytics_layer: functional/integration tests for the analytics layer",
    "casper: CASPER payload/contract tests",
    "frozen: tests with frozen assertions",
    "production: production-scale validation tests",
    "debug: debug tests with verbose output",
]

[tool.bandit]
# SAST over the engine/application surface only (tests/scripts/legacy are not the
# shipped surface). The CI gate fails on MEDIUM+ severity at MEDIUM+ confidence; the
# handful of known-safe findings carry inline `# nosec <ID>` with a justification (the
# FX fetchers enforce an https-only scheme before urlopen; the .wtg parser reads a
# local operator-supplied turbine file, not untrusted network input).
exclude_dirs = ["tests", "scripts", "legacy", "legacy_scenarios", ".venv", "build", "dist"]
