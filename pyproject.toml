[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dutchbay-epc-model"
version = "15.6.0"
description = "Lender/DFI-grade project-finance model for utility-scale wind: CFADS, multi-tranche debt with DSCR covenants, tax with TLCF, Monte Carlo, and an ERA5 to Weibull to AEP to finance pipeline."
readme = "README.md"
license = "LicenseRef-DutchBay-Proprietary-Eval-1.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0,<3.0",
  "numpy-financial>=1.0.0",
  "openpyxl>=3.1",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
  "scipy>=1.10",
  "omegaconf>=2.3",
  "hydra-core>=1.3.3",
  "pydantic>=2.0",
  "jinja2>=3.1",
  "packaging>=24,<27",
]

[project.optional-dependencies]
dev = [
  "typer>=0.12",
  "ruff>=0.5",
  "black>=24.0",
  "isort>=5.13",
  "pre-commit>=4.6,<5",
  "mypy>=1.18",
  "mypy-extensions>=1.1",
  "pandas-stubs",
  "scipy-stubs",
  "types-PyYAML",
  "types-openpyxl",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "pytest-xdist>=3.5",
  "pytest-split>=0.8",
  "pytest-html>=4.0",
  "pytest-timeout>=2.2",
  "hypothesis>=6.100",
  "httpx>=0.27",
  "libcst>=1.1",
  "SALib>=1.5",
  "build>=1.2",
]
test = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "pytest-xdist>=3.5",
  "pytest-split>=0.8",
]
api = [
  "fastapi>=0.110",
  "uvicorn>=0.30",
]
dashboard = [
  "streamlit>=1.40",
]
wind = [
  "cdsapi>=0.7.2",
  "xarray>=2023.6",
  "netcdf4>=1.6",
  "windpowerlib>=0.2",
  "turbine-models>=0.2",
  "py-wake>=2.6",
]
micrositing = [
  "topfarm>=2.6",
]
solar = [
  "pvlib>=0.11",
]
pareto = [
  "pymoo>=0.6",
]
gis = [
  "rasterio>=1.3",
  "shapely>=2.0",
  "pyproj>=3.6",
]
ingestion = [
  "markitdown[pdf]>=0.1.6,<0.2",
  "pdfplumber>=0.11.10,<0.12",
  "pymupdf>=1.28,<1.29",
]
report = [
  "weasyprint>=70,<71",
  "reportlab>=4.0",
  "geopandas>=1.0",
  "contextily>=1.6",
]
jobs = [
  "arq>=0.28,<0.29",
  "redis[hiredis]>=5,<6",
]
grid = [
  "pandapower>=3.5,<4",
  "andes>=2.0",
  "opendssdirect.py>=0.9.4",
]
feasibility = [
  "dutchbay-epc-model[wind,micrositing,gis,report,grid]",
  "mistune>=3.0",
  "SALib>=1.5",
]

[tool.ruff]
src = ["analytics", "finance", "dutchbay_v14chat", "scripts", "tests", "run_full_pipeline_v14.py"]
exclude = [".venv*", "venv*", "env*", ".tox", ".git", ".mypy_cache", ".pytest_cache"]

[tool.setuptools.packages.find]
include = ["analytics*", "finance*", "dutchbay_v14chat*", "api*", "config*", "wind_resource*", "solar_resource*"]

[tool.black]
line-length = 88
target-version = ['py312']
exclude = '''
/(
    \.git
  | \.venv
  | \.venv311
  | legacy
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 88
extend_skip = ["legacy", ".venv311"]
extend_skip_glob = ["legacy/*", "*/legacy/*"]

[tool.mypy]
python_version = "3.12"
files = ["analytics", "finance"]
config_file = "mypy.ini"

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers --strict-config --showlocals"
norecursedirs = [".git", "__pycache__", ".pytest_cache", ".hypothesis", ".venv*", "venv*", "build", "dist", "*.egg-info"]
markers = [
    "slow: tests with long runtime (>5s; deselect with -m 'not slow')",
    "integration: integration tests spanning multiple modules",
    "unit: unit tests for individual functions and classes",
    "smoke: fast smoke tests (core import/CLI/analytics sanity)",
    "performance: performance/throughput benchmark tests (subset of slow)",
    "edge_case: edge-case and boundary-condition tests",
    "stress: stress/failure/load-scenario tests",
    "critical_error: critical error-handling and recovery tests",
    "regression: regression tests with frozen/expected output",
    "monte_carlo: Monte Carlo simulation tests",
    "stochastic_qualification: explicit stochastic scale/qualification tests isolated from the ordinary 200-evaluation full suite",
    "report_qualification: live supplemental-sensitivity and PDF backend report tests isolated from the ordinary full suite",
    "sensitivity: sensitivity-analysis tests",
    "lint: static-analysis and linting tests",
    "grid: grid-study tests requiring the [grid] optional deps (deselect with -m 'not grid')",
    "analytics_layer: functional/integration tests for the analytics layer",
    "casper: CASPER payload/contract tests",
    "frozen: tests with frozen assertions",
    "production: production-scale validation tests",
    "debug: debug tests with verbose output",
]

[tool.bandit]
exclude_dirs = ["tests", "scripts", "legacy", "legacy_scenarios", ".venv", "build", "dist"]
