[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dutchbay-epc-model"
version = "14.0.1"
description = "DutchBay EPC Model - Sprint 10 Release: Monte Carlo Performance & Test Infrastructure"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "numpy-financial>=1.0.0",
  "openpyxl>=3.1",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5",
  "black>=24.0",
  "mypy>=1.18",
  "mypy-extensions>=1.1",
  "bandit>=1.7",
  "pytest>=7.0",
  "pytest-cov>=4.0",
]
test = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
]

[tool.ruff]
src = ["analytics", "finance", "dutchbay_v14chat", "scripts", "tests", "run_full_pipeline_v14.py"]
exclude = [".venv*", "venv*", "env*", ".tox", ".git", ".mypy_cache", ".pytest_cache"]

# Dolphin #10e: Suppress E402 (import not at top) for docstring-first modules
# These modules intentionally place docstrings before imports for better readability
# Rationale documented in docs/LINT_WARNINGS_E402_DEFERRED.md
[tool.ruff.lint.per-file-ignores]
"analytics/mc/*.py" = ["E402"]  # Monte Carlo modules: docstring-first pattern
"analytics/sensitivity/*.py" = ["E402"]  # Sensitivity modules: docstring-first pattern
"analytics/*_v14.py" = ["E402", "F405"]  # Legacy shim files: deprecation warnings before imports
"finance/irr/__init__.py" = ["E402"]  # Circular import workaround

[tool.setuptools.packages.find]
include = ["analytics*", "finance*", "dutchbay_v14chat*", "api*", "config*"]

[tool.black]
line-length = 88
target-version = ['py311']
exclude = '''
/(
    \.git
  | \.venv
  | \.venv311
  | legacy
  | __pycache__
)/
'''

[tool.mypy]
python_version = "3.11"
# Run mypy primarily over the typed application surface
files = ["analytics", "finance"]
config_file = "mypy.ini"

[tool.pytest.ini_options]
addopts = "--cov=. --cov-report=term-missing --cov-fail-under=20"
testpaths = ["tests"]
