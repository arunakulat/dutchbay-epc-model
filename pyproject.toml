[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dutchbay-epc-model"
version = "15.6.0"
description = "Lender/DFI-grade project-finance model for utility-scale wind: CFADS, multi-tranche debt with DSCR covenants, tax with TLCF, Monte Carlo, and an ERA5 to Weibull to AEP to finance pipeline."
readme = "README.md"
# Proprietary, with an explicit evaluation/audit grant (see LICENSE). Declared so
# packaging metadata and repository scanners stop reporting the licence as unknown.
# PEP 639 SPDX-expression form (a string, not a TOML table): setuptools >= 77
# deprecates `license = {text = ...}` and will remove it. LicenseRef-* is the SPDX
# syntax for a custom, non-OSI licence.
license = "LicenseRef-DutchBay-Proprietary-Eval-1.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.24",
  # Cap <3.0: pandas 3.0 (Jan 2026) makes Copy-on-Write mandatory and infers a default
  # str dtype — unconditional breaking changes. Lift only after a deliberate,
  # KPI-oracle-verified 3.0 migration (#593).
  "pandas>=2.0,<3.0",
  "numpy-financial>=1.0.0",
  "openpyxl>=3.1",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
  "scipy>=1.10",
  "omegaconf>=2.3",
  # Canonical CLI framework (GWTF CLI-01/R1). A real runtime dep: the packaged
  # analytics.cli.*_hydra modules import hydra at module scope, so regenerating the
  # requirements.txt lock from pyproject alone must not drop it. Maintenance-risk
  # ADR (stalled upstream cadence + OmegaConf fallback): docs/HYDRA_MAINTENANCE_DECISION.md (#609).
  "hydra-core>=1.3.3",
  "pydantic>=2.0",
  "jinja2>=3.1",          # drives the base HTML report (app.reports.renderer); PDF (weasyprint) is the [report] extra
  # Direct runtime dependency: lender-facing dependency provenance parses PEP 508 declarations
  # with packaging.Requirement; requirements.txt carries the exact reproducibility pin.
  "packaging>=24,<27",
]
