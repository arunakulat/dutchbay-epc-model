[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dutchbay-epc-model"
version = "15.4.0"
description = "Lender/DFI-grade project-finance model for utility-scale wind: CFADS, multi-tranche debt with DSCR covenants, tax with TLCF, Monte Carlo, and an ERA5 to Weibull to AEP to finance pipeline."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.24",
  # Cap <3.0: pandas 3.0 (Jan 2026) makes Copy-on-Write mandatory and infers a default
  # str dtype — unconditional breaking changes. Lift only after a deliberate,
  # KPI-oracle-verified 3.0 migration (#593).
  "pandas>=2.0,<3.0",
  "numpy-financial>=1.0.0",
  "openpyxl>=3.1",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
  "scipy>=1.10",
  "omegaconf>=2.3",
  # Canonical CLI framework (GWTF CLI-01/R1). A real runtime dep: the packaged
  # analytics.cli.*_hydra modules import hydra at module scope, so regenerating the
  # requirements.txt lock from pyproject alone must not drop it. Maintenance-risk
  # ADR (stalled upstream cadence + OmegaConf fallback): docs/HYDRA_MAINTENANCE_DECISION.md (#609).
  "hydra-core>=1.3.3",
  "pydantic>=2.0",
  "jinja2>=3.1",          # drives the base HTML report (app.reports.renderer); PDF (weasyprint) is the [report] extra
]

[project.optional-dependencies]
# The single dev/CI toolchain. `pip install -e ".[dev]"` provides every gate CI runs
# (ruff/black/isort, mypy + the type stubs, bandit + pip-audit, pytest +
# xdist/cov/html/timeout, hypothesis, httpx TestClient, libcst, build). Supersedes the
# retired requirements_dev.txt — pyproject is the single abstract source of truth.
#
# Lint-stack consolidation (#610): flake8 was RETIRED — its rule families are all in
# ruff (E/W pycodestyle, F pyflakes, B flake8-bugbear, C90 mccabe) and it was only ever
# an ADVISORY (continue-on-error) FX-scoped step, never a mandatory gate, so dropping it
# loses no enforced check. black (format) and isort (import order) are KEPT: ruff's own
# isort (I) cannot reproduce isort profile=black byte-for-byte on this tree (isort keeps
# an aliased `from X import a as b` on its own line while merging non-aliased siblings —
# 3 files diverge irreducibly; force-single-line/force-sort-within-sections are far worse
# at 433/163 diffs), so per the #610 guardrail isort-the-tool stays. pylint stays OUT of
# every gate too: `pylint --errors-only` over the engine is a wall of false positives on
# the CASPER optional-dependency (`_require_*` guarded imports) and dynamic-`__all__`
# re-export patterns (E0603/E0611/E0401/E1133), so a scoped pylint pass is not viable here.
# Enabling ruff's B (flake8-bugbear) rule set as a mandatory gate is a separate follow-up:
# the tree is not yet B-clean (~18 B904 `raise ... from` findings that need code fixes).
dev = [
  # typer backs the LEGACY (frozen, CLI-01-tolerated) scripts/go_with_the_flow_ci.py
  # driver, which tests/lint/test_ci_driver_targets_exist.py IMPORTS to assert its
  # targets exist. It was an UNDECLARED dependency riding the requirements.txt freeze
  # by accident until the 2026-07-04 freeze refresh purged undeclared strays and the
  # suite caught it (#756 post-mortem). Remove together with the legacy driver.
  "typer>=0.12",
  "ruff>=0.5",
  "black>=24.0",
  "isort>=5.13",
  "pre-commit>=4.6,<5",
  "mypy>=1.18",
  "mypy-extensions>=1.1",
  "pandas-stubs",        # the mypy gate is only faithful WITH these stubs (else falsely clean)
  "scipy-stubs",
  "types-PyYAML",
  "types-openpyxl",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "pytest-xdist>=3.5",
  "pytest-split>=0.8",   # timing-balanced CI test sharding (test-suite.yml matrix)
  "pytest-html>=4.0",
  "pytest-timeout>=2.2",
  "hypothesis>=6.100",
  "httpx>=0.27",         # FastAPI TestClient (tests/api, tests/app)
  "libcst>=1.1",         # LibCST lint/codemod tests under tests/lint
  "SALib>=1.5",          # global (Morris/Sobol) sensitivity — analytics.sensitivity.global_sa (#C6)
  "build>=1.2",
]
test = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "pytest-xdist>=3.5",
  "pytest-split>=0.8",
]
# HTTP API surface (api/ + app/services): FastAPI app served by uvicorn. Opt-in —
# the finance engine + CLI do not need a web server.
api = [
  "fastapi>=0.110",
  "uvicorn>=0.30",
]
# Streamlit sensitivity dashboard (app/). Opt-in; peripheral to the finance engine.
dashboard = [
  "streamlit>=1.40",
]
# Wind-resource ingestion path (ERA5 / Copernicus CDS). Kept as an opt-in
# extra so lender-grade finance runs that consume a *frozen* wind export JSON
# do not require Copernicus credentials or the netCDF toolchain. Install with:
#     pip install -e ".[wind]"
# Producers of the frozen export (scripts/run_wind_analysis_v14.py) require
# this extra; consumers (run_full_pipeline_v14.py + wind_resource.cashflow_adapter)
# do not. Disclosed as Defect W1 in Sprint 19 (CHANGELOG v14.15.0).
wind = [
  # >=0.7.2: the CDS-Beta platform is the sole live Copernicus endpoint since 26 Sep 2024
  # and requires cdsapi>=0.7.0 (0.7.2+ recommended); a pre-CDS-Beta version resolves but
  # silently fails against the live endpoint (#592).
  "cdsapi>=0.7.2",
  "xarray>=2023.6",
  "netcdf4>=1.6",
  "windpowerlib>=0.2",  # open turbine library (oedb) for power-curve sourcing (#181)
  "turbine-models>=0.2",  # NREL reference power curves (5-18 MW) for sourcing fallback (#181)
  "py-wake>=2.6",  # DTU PyWake — granular per-turbine wake model (Bastankhah/TurbOPark) for the bankable AEP engine
]
# Micro-siting layout optimizer (issue #835, Deliverable A). DTU TopFarm is built
# directly on the [wind] PyWake and drives the area->optimized-layout tool in
# wind_resource.layout_optimizer: boundary + exclusion + wind-rose + PyWake wake
# model -> an AEP-maximising candidate layout. Kept as a SEPARATE opt-in extra (NOT
# folded into [wind] or the CI toolchain) because TopFarm pulls OpenMDAO + a scipy
# optimizer stack that the base finance/CI runs never need — the optimizer only ever
# PROPOSES a candidate (KPI-neutral), so no headline path depends on it. The import
# is CASPER-guarded via wind_resource.layout_optimizer._require_topfarm, and its
# tests are gated behind ``pytest.importorskip('topfarm')``. Install with:
#     pip install -e ".[micrositing]"
micrositing = [
  "topfarm>=2.6",  # DTU TopFarm — layout optimizer on PyWake (OpenMDAO/SLSQP)
]
# Solar-resource producer (multi-tech hybrid). pvlib turns a PV-system spec + a measured
# site GHI into a bankable solar AEP / capacity factor — the photovoltaic analogue of the
# [wind] bankable-AEP engine. Opt-in like [wind]: a hybrid's declared P50 solar CF
# (generation.technologies.solar.capacity_factor) runs the finance stack with no extra,
# and solar_resource.pv_producer guards the import via _require_pvlib (CASPER), so the base
# install never needs pvlib. Solar tests are gated behind pytest.importorskip('pvlib').
solar = [
  "pvlib>=0.11",
]
# Multi-objective Pareto search backend (issue #603). pymoo's NSGA-II drives the
# opt-in plan_kind="pymoo" adaptive search in analytics.sensitivity.optimizer for
# >=2-parameter trade-offs (e.g. tariff vs gearing) where the Cartesian grid plan
# explodes past max_points. Opt-in like [wind]/[solar]: the default 'grid'/'lhs'
# plans never import pymoo, the backend guards the import via _require_pymoo()
# (CASPER), and the pymoo tests are gated behind pytest.importorskip('pymoo'),
# so the base finance install never needs it.
pareto = [
  "pymoo>=0.6",
]
# GeoTIFF / raster export for QGIS (issue #20). rasterio wheels bundle their own GDAL,
# so no system GDAL/apt is needed on the CI runner or macOS. Opt-in like [wind]; the
# export code (analytics.gis.geotiff_export) guards the import via _require_rasterio
# (CASPER), so the base finance install never needs the GIS toolchain. shapely (#833)
# joins here because the constraint/exclusion mask (analytics.gis.exclusion_mask) buffers
# setback features and rasterises exclusion polygons with it — the vector half of the same
# GIS siting toolchain; it is guarded via _require_shapely (CASPER) exactly like rasterio,
# so the base finance install still needs neither. (Shapely also rides transitively
# via geopandas in the governed lock, but remains a direct GIS capability dependency.)
gis = [
  "rasterio>=1.3",
  "shapely>=2.0",
  # Coordinate projection (lat/lon -> UTM). Previously arrived only as a transitive
  # dependency of topfarm via [micrositing], so a lock built without micrositing —
  # which is every CI install — had no pyproj and any projection call failed at
  # runtime. Declared explicitly: rasterio/shapely work is projection work.
  "pyproj>=3.6",
]
# Governed document-ingestion toolchain (GWTF R26 / DATA-01). MarkItDown is the
# canonical PDF-to-Markdown entry point, pdfplumber makes its PDF backend explicit,
# and PyMuPDF supplies independent PDF inspection and raster rendering. These are
# tooling dependencies rather than finance-engine runtime dependencies, so they stay
# in a dedicated extra while requirements.txt pins the cleared versions.
ingestion = [
  "markitdown[pdf]>=0.1.6,<0.2",
  "pdfplumber>=0.11.10,<0.12",
  "pymupdf>=1.28,<1.29",
]
# PDF report rendering (Sprint 2). Jinja2 (in core deps) drives the HTML report;
# WeasyPrint remains optional at application call time because minimal deployments
# may omit its pango/cairo system libraries. The governed Python 3.12 lock includes
# the complete report dependency closure and CI exercises positive PDF rendering.
# The guarded import (app.reports.renderer -> ReportDependencyError) preserves a
# fail-loud boundary for deliberately minimal installs (CASPER).
report = [
  "weasyprint>=69,<70",
  # reportlab powers the standalone assessment-report generator
  # (scripts/generate_solar_assessment_report.py) and is exercised when pvlib is present.
  "reportlab>=4.0",
  # geopandas clips the national GHI choropleth to the country land polygon and
  # contextily composites the Esri World Imagery satellite tile for the site
  # close-up. Both are optional: make_location_map degrades to a coastline outline
  # and make_site_context_map returns False (figure omitted) when they are absent.
  "geopandas>=1.0",
  "contextily>=1.6",
]
# Async live-ERA5 job path (Sprint 2). The default in-process path
# (app.api.jobs_router + BackgroundTasks) needs none of these; arq + Redis is the
# durable, cross-process upgrade driven by app.jobs.worker (loaded only by the arq
# CLI). The governed lock includes this dependency closure and CI imports/tests the
# worker plus RedisJobStore against a fake client; a live Redis broker remains an
# explicit deployment requirement rather than a test-lock input.
jobs = [
  "arq>=0.28,<0.29",
  # arq 0.28 requires redis[hiredis]<6. Declare the accelerated parser explicitly
  # so the worker capability and its performance dependency reconstruct together.
  "redis[hiredis]>=5,<6",
]
# Grid interconnection / hosting-capacity study (issue #871). Opt-in like [gis]/[pareto];
# the finance engine + CLI never import it, so the default install and CI lanes stay
# grid-free. The study code (D1, analytics.grid.*) guards its imports via
# _require_pandapower / _require_andes / _require_opendss (CASPER), so the base finance
# install never needs the grid toolchain, and the grid tests are gated behind
# ``pytest.importorskip('pandapower')``. Install with:
#     PIP_CONSTRAINT=constraints.txt pip install -e ".[grid]"
# PIN NOTE (verified empirically against PyPI metadata + the frozen core pins, which live
# in requirements.txt: numpy==2.4.6 / scipy==1.17.1 / pandas==2.3.3): pandapower is pinned
# EXACTLY to ==3.3.0. Both pandapower 3.4.0 and 3.3.3 declare scipy<1.17 (3.4.0 also
# numpy<2.4) — they EXCLUDE the core pins and would force a silent scipy/numpy downgrade
# with KPI-drift risk. 3.3.0 declares numpy~=2.2 / scipy~=1.15 / pandas~=2.3, which the core
# pins satisfy, so the exact ==3.3.0 pin (NOT a version range) is what deterministically
# prevents the downgrade — it holds on its own, independent of constraints.txt (which pins
# only pandas<3). andes and opendssdirect.py impose no core caps. The OpenDSS wheel
# dist name is ``opendssdirect.py`` (imports as ``opendssdirect``); the bare name
# ``opendssdirect`` does NOT exist on PyPI. PyWake / windpowerlib are not needed here —
# they already ride in via [wind]; add them as a follow-up only if a grid path requires them.
# pandapower 3.3.0 required scipy~=1.15 — irreconcilable with the pinned lock on
# ANY interpreter, which is why [grid] could not be composed into [feasibility].
# 3.5.x resolves it on Python 3.12 (it requires scipy~=1.18 there, and the lock now
# pins 1.18.0). This is an ABSTRACT floor; requirements.txt carries the exact pin.
grid = [
  "pandapower>=3.5,<4",
  "andes>=2.0",
  "opendssdirect.py>=0.9.4",
]

# Everything `feasibility_reproduce/run_all.sh` needs, in ONE install, so the
# offline reproduce kit stops depending on a hand-typed list in HOWTO.md §0:
#
#   pip install -r requirements.txt && pip install -e ".[dev,feasibility]"
#
# Composes wind (ERA5 -> Weibull -> PyWake AEP), micrositing (TopFarm layout),
# gis (rasterio/shapely for the GeoTIFF steps), report (WeasyPrint PDF) and adds
# the two the kit needs directly: mistune for the Markdown -> HTML step of the PDF
# builders, and SALib for the global-sensitivity step (SALib otherwise only
# arrives via [dev], which a report-only install would not have).
#
# `grid` IS composed in as of the 3.12 baseline migration. It previously could not
# be: pandapower's scipy pin was irreconcilable with the lock on 3.11
# (pandapower==3.3.0 -> scipy~=1.15; 3.5.4 -> scipy<1.17 on 3.11), so installing it
# alongside [dev] silently downgraded scipy off the lock and broke the mypy gate's
# scipy-stubs. On 3.12 pandapower 3.5.x wants scipy~=1.18, the lock now pins
# scipy==1.18.0 + scipy-stubs==1.18.0.1, and the three resolve together cleanly.
# This is what unblocks #923: once `grid.qsts.finance_wiring.enabled` is flipped,
# pandapower becomes a RUNTIME dependency of the canonical path, so it has to be
# installable alongside the gate toolchain rather than quarantined in its own venv.
# Effect on the suite: tests/grid/ goes 576 passed/19 skipped -> 595 passed/0 skipped.
feasibility = [
  "dutchbay-epc-model[wind,micrositing,gis,report,grid]",
  "mistune>=3.0",
  "SALib>=1.5",
]

[tool.ruff]
src = ["analytics", "finance", "dutchbay_v14chat", "scripts", "tests", "run_full_pipeline_v14.py"]
exclude = [".venv*", "venv*", "env*", ".tox", ".git", ".mypy_cache", ".pytest_cache"]

[tool.setuptools.packages.find]
# wind_resource* added Sprint 19 (W.2) — the package existed in the repo
# tree but was excluded from wheel discovery, so `pip install` produced an
# artifact without the wind-ingestion modules. Disclosed as Defect W2.
include = ["analytics*", "finance*", "dutchbay_v14chat*", "api*", "config*", "wind_resource*", "solar_resource*"]

[tool.black]
line-length = 88
target-version = ['py312']
exclude = '''
/(
    \.git
  | \.venv
  | \.venv311
  | legacy
  | __pycache__
)/
'''

[tool.isort]
# profile=black makes isort's import wrapping byte-compatible with black, so the two
# formatters converge instead of fighting (a hard prerequisite for enforcing both). This
# is now the single source of truth for isort — the CLI no longer needs --profile black.
profile = "black"
line_length = 88
# Match black's exclusions. isort's built-in skip already covers .venv/build/dist; these
# repo-specific frozen/local trees (top-level legacy/ + tests/legacy/, and .venv311) are not
# in the defaults, so add them explicitly to keep frozen code untouched.
extend_skip = ["legacy", ".venv311"]
extend_skip_glob = ["legacy/*", "*/legacy/*"]

[tool.mypy]
python_version = "3.12"
# Run mypy primarily over the typed application surface
files = ["analytics", "finance"]
config_file = "mypy.ini"

[tool.pytest.ini_options]
# Single source of truth for pytest configuration (CCCDIR, #439). pytest.ini,
# pytest.ci.ini and the tox.ini [pytest] section were retired: pytest resolved
# pytest.ini FIRST and silently ignored this block ("WARNING: ignoring pytest config
# in pyproject.toml"), so the --cov-fail-under floor declared here used to be dead.
# Coverage is deliberately NOT in addopts — a partial dev run (`pytest tests/foo.py`)
# must not spuriously trip the floor. The --cov-fail-under=95 gate lives where the FULL
# suite runs: `make test` and the CI test step (.github/workflows/test-suite.yml). The
# coverage surface/omissions are configured once in .coveragerc.
minversion = "6.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers --strict-config --showlocals"
norecursedirs = [".git", "__pycache__", ".pytest_cache", ".venv*", "venv*", "build", "dist", "*.egg-info"]
markers = [
    "slow: tests with long runtime (>5s; deselect with -m 'not slow')",
    "integration: integration tests spanning multiple modules",
    "unit: unit tests for individual functions and classes",
    "smoke: fast smoke tests (core import/CLI/analytics sanity)",
    "performance: performance/throughput benchmark tests (subset of slow)",
    "edge_case: edge-case and boundary-condition tests",
    "stress: stress/failure/load-scenario tests",
    "critical_error: critical error-handling and recovery tests",
    "regression: regression tests with frozen/expected output",
    "monte_carlo: Monte Carlo simulation tests",
    "stochastic_qualification: explicit stochastic scale/qualification tests isolated from the ordinary 200-evaluation full suite",
    "sensitivity: sensitivity-analysis tests",
    "lint: static-analysis and linting tests",
    "grid: grid-study tests requiring the [grid] optional deps (deselect with -m 'not grid')",
    "analytics_layer: functional/integration tests for the analytics layer",
    "casper: CASPER payload/contract tests",
    "frozen: tests with frozen assertions",
    "production: production-scale validation tests",
    "debug: debug tests with verbose output",
]

[tool.bandit]
# SAST over the engine/application surface only (tests/scripts/legacy are not the
# shipped surface). The CI gate fails on MEDIUM+ severity at MEDIUM+ confidence; the
# handful of known-safe findings carry inline `# nosec <ID>` with a justification (the
# FX fetchers enforce an https-only scheme before urlopen; the .wtg parser reads a
# local operator-supplied turbine file, not untrusted network input).
exclude_dirs = ["tests", "scripts", "legacy", "legacy_scenarios", ".venv", "build", "dist"]
