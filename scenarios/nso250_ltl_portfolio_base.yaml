# ═══════════════════════════════════════════════════════════════════════════════
# NSO 250 MW BESS — LTL consolidated award, 24-project portfolio
# capex variant: BASE (USD 95/kWh all-in)
# ═══════════════════════════════════════════════════════════════════════════════
# Tender TR/REP&PM/ICB/2026/001/C — 250 MW / 1,000 MWh standalone BESS, BOO, 15-year term.
#
# WHAT THIS MODELS. On the project owner's premise of 6 September 2026 that Ceylex
# Engineering and Lakdhanavi are one entity under LTL Holdings, that entity won 24 of the
# 25 projects (Aitken Spence took Kosgama). Nineteen substations carry 25 projects because
# Volume I cl. 1.3 permits two proposals at six named substations. This file models the
# 24-project portfolio.
#
# REVENUE. A flat Capacity Charge Rate in LKR/MW/month — "the procurement shall be in power
# (MW) terms" (Volume I cl. 2.8) — paid for 15 years with NO indexation and NO energy
# payment anywhere in the ESA. R = 1,752,500 is the capacity-weighted average of the 24
# LTL-controlled winning bids (range 1,695,000 to 1,850,000).
#
# FX. One-off: LTL funds the imported equipment from USD its overseas operations already
# earn, so there is no rolling exposure. `annual_depr` is 0.0 deliberately — the tender's
# 0.15*Y + 0.85*Y*(P2/P1) adjustment covers roughly one MONTH between bid closing and ESA
# signing, not the term. The Monte Carlo varies the spot over that window only.
#
# CAPEX. USD 95/kWh all-in decomposes as equipment USD 63.50/kWh CIF, balance of
# plant USD 14.00/kWh, augmentation reserve USD 8.00/kWh, and land plus auxiliaries at
# 10% of total capex per the owner's direction of 5 September 2026. The level the winning bids support at roughly a 15% equity return. The central case.
#
# MDSC. The ESA pays the full charge whenever ADSC >= MDSC, so a project augmented to hold
# the floor earns a FLAT charge: `mdsc_fade_pct_annual` is 0.0 and the cost of holding the
# floor sits in the augmentation reserve inside capex. `mdsc_floor_soh` records the tender's
# own year-15 floor of 68%. Setting a fade here as well would double-count.
# ═══════════════════════════════════════════════════════════════════════════════

