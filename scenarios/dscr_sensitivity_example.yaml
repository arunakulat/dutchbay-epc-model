# ═══════════════════════════════════════════════════════════════════════════

# Dual DSCR Methodology:
# - Bolinger (2017): "Bookending Opportunity to Lower LCOE Through Reductions
#   in Soft Cost Spreads Between P50 and P99 Wind Resource Estimates"
# - DNV GL (2019): "Project Finance Debt Sizing Practices for Renewable Energy"
# - Standard & Poor's: "Project Finance Criteria" - dual constraint requirement
#
# Degradation Rates:
# - NREL (2020): "Wind Turbine Performance Trends: Focus on Degradation"
# - IEA Wind (2021): "Long-term Performance of Wind Turbines"
# - Vestas warranty assumptions: 0.5%/year baseline
#
# DSCR Targets:
# - Moody's: "Rating Methodology for Project Finance Transactions"
# - Fitch Ratings: "Wind and Solar Power Rating Criteria"
# - Industry practice: P50 DSCR 1.25-1.35x, P99 DSCR 1.00-1.05x

