# ══════════════════════════════════════════════════════════════════════════════
# DutchBay Wind Project - PESSIMISTIC SCENARIO (2025Q4)
# ══════════════════════════════════════════════════════════════════════════════
#
# CESSPIT v14 / CASPER-GWTF Compliant
# This scenario represents the PESSIMISTIC/STRESS case with:
#   - Lower capacity factor (35% vs 40% base)
#   - Higher CAPEX ($1,600/kW vs $1,500/kW base)
#   - P90 wind resource assumption
#   - Higher grid curtailment risk
#   - Same DFI financing structure as lender case
#
# Expected P50 IRR: ~14.2% (vs ~17.9% lender base)
#
# Author: CESSPIT Integration Team
# Date: 2025-12-10
# Version: 14.2
# ══════════════════════════════════════════════════════════════════════════════

scenario_result:
  scenario_name: "dutchbay_pessimistic_2025Q4"
  description: "Pessimistic/stress scenario - P90 wind resource, higher CAPEX, grid curtailment"
  project_type: "wind"
  financing_type: "DFI-led with commercial co-financing"
  resource_assumption: "P90 wind resource (35% CF), 0.8% annual degradation, 5% grid curtailment"

# ──────────────────────────────────────────────────────────────────────────────
# Project Configuration (PESSIMISTIC CASE)
# ──────────────────────────────────────────────────────────────────────────────

project:
  name: "Dutch Bay Wind Project - Pessimistic Case"
  capacity_mw: 150
  capacity_factor: 0.35                    # ← PESSIMISTIC: 35% vs 40% base
  curtailment_pct: 0.05                    # ← PESSIMISTIC: 5% grid curtailment, now LIVE
                                           #   via the financed lever (was a dead
                                           #   regulatory.grid_loss_pct that never applied)
  degradation: 0.008                       # ← WORSE: 0.8% annual degradation
  life_years: 20
  boi_approved: true
  boi_agreement_date: "2025-01-15"
  location: "Puttlam District, North Western Province"
  jurisdiction: "Sri Lanka"

# ──────────────────────────────────────────────────────────────────────────────
# Returns & Discount Rates
# ──────────────────────────────────────────────────────────────────────────────

returns:
  project_life_years: 20
  project_discount_rate: 0.10              # 10% WACC
  equity_discount_rate: 0.12               # 12% equity hurdle

discount_rate: 0.12

# ──────────────────────────────────────────────────────────────────────────────
# Timeline
# ──────────────────────────────────────────────────────────────────────────────

timeline:
  ppa_to_fc_years: 0
  construction_years: 2
  ops_years: 20
  lifetime_years: 22

# ──────────────────────────────────────────────────────────────────────────────
# Tariff Configuration (Same as lender case)
# ──────────────────────────────────────────────────────────────────────────────

tariff:
  lkr_per_kwh: 20.3
  tariff_type: "fixed"
  ppa_term_years: 20

# ──────────────────────────────────────────────────────────────────────────────
# Foreign Exchange
# ──────────────────────────────────────────────────────────────────────────────

fx:
  start_lkr_per_usd: 300.0
  annual_depr: 0.03                        # 3% annual LKR depreciation

# ──────────────────────────────────────────────────────────────────────────────
# CAPEX Configuration (PESSIMISTIC: Higher costs)
# ──────────────────────────────────────────────────────────────────────────────

capex:
  usd_total: 160000000                     # ← PESSIMISTIC: $160M vs $150M base
  breakdown:
    epc_usd: 148000000                     # Higher EPC costs
    development_usd: 5500000               # Higher development costs
    financing_fees_usd: 3500000            # Higher financing fees
    contingency_usd: 3000000               # Higher contingency (20% vs 13%)

# ──────────────────────────────────────────────────────────────────────────────
# OPEX Configuration (PESSIMISTIC: Higher O&M costs)
# ──────────────────────────────────────────────────────────────────────────────

opex:
  usd_per_year: 3300000                    # ← 10% higher than base
  breakdown:
    om_contract_usd: 2200000               # Higher O&M contract
    insurance_usd: 550000                  # Higher insurance
    land_lease_usd: 330000                 # Higher land lease
    admin_usd: 220000                      # Higher admin

# ──────────────────────────────────────────────────────────────────────────────
# Tax Configuration
# ──────────────────────────────────────────────────────────────────────────────

tax:
  corporate_tax_rate: 0.30                 # 30% corporate tax
  tax_holiday_years: 0
  tax_holiday_route: none
  tax_holiday_start_year: 1
  depreciation_method: "straight_line"
  depreciation_years: 5
  plant_capex_share: 0.80
  plant_depreciation_years: 5
  civil_depreciation_years: 20
  depreciation_start_year: 1
  enhanced_capital_allowance_pct: 1.5
  enhanced_allowance_applies: true
  loss_carryforward_years: 6
  wht_on_interest_to_nonresidents: 0.10    # 10% WHT
  wht_on_interest_enabled: false
  wht_gross_up: false

# ──────────────────────────────────────────────────────────────────────────────
# Statutory Charges (PESSIMISTIC: Higher grid losses)
# ──────────────────────────────────────────────────────────────────────────────

regulatory:
  success_fee_pct: 0.01                    # 1% success fee
  env_surcharge_pct: 0.005                 # 0.5% environmental surcharge
  social_services_levy_pct: 0.025          # 2.5% social services levy

# ──────────────────────────────────────────────────────────────────────────────
# Risk Adjustments
# ──────────────────────────────────────────────────────────────────────────────

risk_adjustment:
  cfads_haircut_pct: 0.10                  # 10% CFADS haircut for sizing

# ──────────────────────────────────────────────────────────────────────────────
# Financing Terms (Same DFI structure as lender case)
# ──────────────────────────────────────────────────────────────────────────────

Financing_Terms:
  debt_ratio: 0.70                         # 70% debt
  tenor_years: 15
  interest_only_years: 2
  amortization_style: "auto"
  interest_rate_nominal: 0.08              # 8% blended rate

  mix:
    lkr_max: 0.45
    dfi_max: 0.10
    usd_commercial_min: 0.45

  rates:
    lkr_nominal: 0.08
    lkr_min: 0.08
    dfi_nominal: 0.065
    dfi_min: 0.065
    usd_nominal: 0.075
    usd_commercial_min: 0.075

  target_dscr: 1.30
  min_dscr: 1.20
  min_dscr_covenant: 1.20

  reserves:
    dsra_months: 6
    receivables_guarantee_months: 9

  use_revenue_guarantee: false
  guarantee_revenue_pct: 0.0075

  fees:
    upfront_pct: 0.01
    commitment_pct: 0.01

  enforce_hard_covenants: false

# ──────────────────────────────────────────────────────────────────────────────
# Metrics & Covenants
# ──────────────────────────────────────────────────────────────────────────────

metrics:
  llcr_min_covenant: 1.20
  llcr_warn_threshold: 1.25
  llcr_discount_rate: 0.10
  plcr_min_covenant: 1.40
  plcr_target: 1.60
  plcr_discount_rate: 0.10
  dscr_min_covenant: 1.30

# ──────────────────────────────────────────────────────────────────────────────
# Constraints
# ──────────────────────────────────────────────────────────────────────────────

constraints:
  max_debt_ratio: 0.80
  warn_debt_ratio: 0.75
  min_dscr_covenant: 1.30
  target_dscr: 1.35
  warn_dscr: 1.25
  max_balloon_pct: 0.10
  warn_balloon_pct: 0.05

  refinancing:
    enabled: true
    max_refinance_pct: 0.10
    refinance_rate_premium: 0.02
    refinance_tenor_years: 3
    requires_documentation: true

  max_tenor_years: 20
  warn_tenor_years: 18
  max_interest_rate: 0.25
  min_interest_rate: 0.00
  lender_type: "DFI"
  jurisdiction: "Sri Lanka"
  fail_on_covenant_breach: false
  fail_on_large_balloon: false

# ──────────────────────────────────────────────────────────────────────────────
# IRR Validation Bounds (Pessimistic Case)
# ──────────────────────────────────────────────────────────────────────────────

irr_validation:
  irr_lower_bound: -0.9                    # Much lower bound for stress case
  irr_upper_bound: 0.20                    # Lower upper bound
  irr_lower_bound_rationale: "Pessimistic P90 wind resource with 30% grid curtailment"
  irr_upper_bound_rationale: "Upper bound capped at 20% for stress scenario"

  equity_irr_lower_bound: -0.7
  equity_irr_upper_bound: 0.30
  equity_bounds_rationale: "Lower equity returns expected with P90 wind resource"

  debt_irr_lower_bound: -0.3
  debt_irr_upper_bound: 0.10
  debt_bounds_rationale: "Debt returns under stress conditions"

  xirr_lower_bound: -0.9
  xirr_upper_bound: 0.15

# ──────────────────────────────────────────────────────────────────────────────
# Monte Carlo Configuration (Pessimistic Parameters)
# ──────────────────────────────────────────────────────────────────────────────

monte_carlo:
  n_scenarios: 100000
  seed: 42

  parameters:
    capacity_factor_std: 0.07              # ← Higher variance (7% vs 5% base)
    tariff_lkr_std: 0.12                   # ← Higher tariff uncertainty
    opex_usd_std: 0.18                     # ← Higher OPEX variance
    capex_usd_std: 0.10                    # ← Higher CAPEX variance

  var_confidence: 0.95
  cvar_confidence: 0.95

  percentiles:
    - 10
    - 25
    - 50
    - 75
    - 90

  min_dscr_covenant: 1.20
  min_llcr_covenant: 1.25

# ──────────────────────────────────────────────────────────────────────────────
# Sensitivity Analysis Configuration
# ──────────────────────────────────────────────────────────────────────────────

sensitivity:
  ranges:
    capacity_factor:
      low_pct: -0.07                       # Wider range (±7% vs ±5% base)
      high_pct: 0.07

    tariff_lkr_per_kwh:
      low_pct: -0.12
      high_pct: 0.12

    opex_usd_per_year:
      low_pct: -0.18
      high_pct: 0.18

    capex_usd_total:
      low_pct: -0.10
      high_pct: 0.10

    grid_loss_pct:
      low_pct: -0.02
      high_pct: 0.05

  analysis:
    tornado_chart_title: "DutchBay 150MW - Pessimistic Scenario Sensitivity"
    dpi: 300

# ──────────────────────────────────────────────────────────────────────────────
# Metadata
# ──────────────────────────────────────────────────────────────────────────────

metadata:
  version: "14.2"
  last_updated: "2025-12-10"
  author: "CESSPIT Integration Team"
  review_status: "CCCDIR - Ready for Monte Carlo Analysis"
  assumptions_source: "P90 Wind Resource Assessment + Higher EPC Costs + Grid Curtailment Risk"
  changelog:
    - version: "14.2"
      date: "2025-12-10"
      changes: "Created pessimistic scenario with 35% CF, $160M CAPEX, 5% grid curtailment"
