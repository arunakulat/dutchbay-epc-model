expected_results:
  # Regenerated from THIS scenario (15x IEA-10MW @160m, fitted Weibull A=8.259/k=2.664,
  # net AEP 480.9 GWh per its own aep_summary) — was a copy-paste of the 483.6 lender block.
  net_aep_p50_gwh: 480.9
  net_aep_p90_gwh: 418.9   # P90/P50 ~0.871
  capacity_factor: 0.344
  annual_revenue_p50_m_lkr: 9762.3  # 480.9 GWh x 20.3 LKR/kWh (LKR-native tariff)
  annual_revenue_p50_m_eur: 29.6    # reference: 9762.3 M LKR / 330 LKR/EUR
  revenue_20yr_undiscounted_m_lkr: 186261.1  # with 0.5%/yr degradation (M3e) + CPI
  # Financials at the corrected FX 333.79 (LKR-native tariff -> full FX drag on USD returns).
  # Re-baselined by (a) the 2026-06 project-discounting fix (audit finding 2.0: construction
  # lag + operating-year-1 off-by-one) and (b) the M3e degradation re-baseline (0.005 -> 0.5,
  # honest 0.5%/yr aging): project IRR 8.73% -> 5.22% (below the ~8.18% WACC) and equity IRR
  # +0.3% -> -2.19% (the 0.5%/yr aging tips marginal equity below zero). NPV -$33.12M.
  project_irr: 0.0522
  equity_irr: 0.0280   # now POSITIVE — round-5 #5 interest-tax-shield re-baseline lifts the
                       # marginal equity from -0.0048 to +0.0280 (+328bps). Still below cost of equity.
  project_npv_m_usd: -33.12
  min_dscr: 1.30
  avg_dscr: 1.387
  llcr: 1.086
  plcr: 1.146  # lower coverage after the 0.5%/yr degradation re-baseline (M3e)
metadata:
  version: '3.0'
  last_updated: '2025-12-23'
  author: DutchBay V14 Financial Modeling Team
  review_status: Draft - Pending Board Approval
  assumptions_source: 'BOI Agreement Ref: BOI/2025/REN/001234'
  sprint: Sprint 17 - Multi-Currency PPA + Wind Resource Integration
  gwtf_compliance: All 51 rules audited + wind energy calculator integration
  changes:
  - 'v3.0: Added multi-currency PPA structure (LKR/USD/EUR/CNY)'
  - 'v3.0: Integrated wind resource parameters (Weibull, air density, ERA5)'
  - 'v3.0: Added turbine technical specs for energy calculator'
  - 'v3.0: Added layout parameters for wake loss validation'
  - 'v3.0: Unified losses structure across resource + statutory'
  - 'v3.0: Added expected_results for end-to-end validation'
  - 'v2.7: Enabled FX integration for multi-currency debt'
  - 'v2.7: Added debt_tranches structure'
  - 'v3.1: Removed decorative Financing_Terms.debt_tranches (never an engine input);
    mix + rates are canonical (plan_debt warns if re-added)'
wacc:
  mode: build_up
  drives_discount_rate: true
  cost_of_equity: 0.12
  prudential_spread_bps: 100
  description: Build-up WACC drives the discount rate (replaces a decorative fixed
    12%).
meta:
  source_path: scenarios/dutchbay_lendercase_2025Q4.yaml
