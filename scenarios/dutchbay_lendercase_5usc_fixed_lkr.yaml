  annual_revenue_p50_m_eur: 24.0    # Reference: 7907.7 M LKR / 330 LKR/EUR
  revenue_20yr_undiscounted_m_lkr: 150912.0  # with 0.5%/yr degradation (M3e); 16.69 LKR/kWh

  # Financial metrics — HONEST live-engine output. Bound by
  # tests/integration/test_kalpitiya_5usc_smoke.py. TWO changes vs the canonical: (1) tariff
  # 16.69 LKR/kWh (5.0 US cents fixed LKR) vs 20.3 (6.1c); (2) GRANULAR costs — CAPEX
