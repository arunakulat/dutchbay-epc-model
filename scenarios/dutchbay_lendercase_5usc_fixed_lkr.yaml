  # 2.5%/yr O&M escalation vs flat $3M. Realistic costs at 5c/kWh leave the deal DEEPLY
  # UNECONOMIC: project IRR is NEGATIVE (-0.27%) — lifetime CFADS fall short of capex even
  # undiscounted, far below the ~9.72% WACC; equity IRR -9.05%, project NPV -$118.8M. Debt
  # deleverages to $77.8M (DSCR-bound). Deepened by the 2026-06 project-discounting fix
