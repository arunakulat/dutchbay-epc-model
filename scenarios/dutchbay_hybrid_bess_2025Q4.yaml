# ═══════════════════════════════════════════════════════════════════════════════
# DutchBay 209.6 MW Hybrid + 50 MW / 200 MWh BESS — Lender Case (tech-comparison, #821)
# ═══════════════════════════════════════════════════════════════════════════════
# Version: 1.0 (a hybrid+BESS lender column for the #745/#821 cross-technology table)
# Path: scenarios/dutchbay_hybrid_bess_2025Q4.yaml
#
# The wind+solar hybrid case (dutchbay_hybrid_windsolar_2025Q4.yaml) with a co-located
# 50 MW / 200 MWh (4-hour) BESS folded onto the SAME PPA/debt facility. The BESS is a
# `type: bess` technology in the `generation:` block earning a CEB distributed
# capacity-charge (LKR/MW/month availability tolling — NOT a per-kWh energy tariff, and
# NOT double-counted as generation), and its turnkey capex is rolled into
# `capex.usd_total` so the battery is actually financed (BESS-3), not free revenue.
# Everything else inherits the hybrid/lendercase debt/tax/FX/WACC stack. This is a
# COMPARISON scenario (a bankable-input column for the #821 4-way table), NOT the
# committed 5th-gen canon — it does not touch the wind lendercase pins.
#
# BESS SIZING & REVENUE (bankable inputs, agreed for the comparison column):
#   50 MW / 200 MWh (4-hour, 0.25C); capacity-charge 5,000,000 LKR/MW/month flat for the
#   15-year contract term; turnkey capex $25M (200 MWh x ~$125/kWh SL proxy; see BESS
#   research). Round-trip efficiency / cycling do not enter the capacity-charge revenue
#   (availability tolling is power-based, LKR/MW/month) — they matter for the energy-tariff
#   model, which this column does not use.
#
# Usage:
#   python run_full_pipeline_v14.py config=scenarios/dutchbay_hybrid_bess_2025Q4
# ═══════════════════════════════════════════════════════════════════════════════

project:
  name: "DutchBay Hybrid Wind+Solar+BESS"
  location: "Dutch Bay, Kalpitiya, Puttalam District, North Western Province, Sri Lanka"
  # Combined plant: 159.6 MW wind + 50 MW solar. Per-technology generation (each
  # tech's own capacity factor AND degradation) is declared in the `generation:`
  # block below, which the cashflow sums (M3 true per-tech finance). capacity_mw /
  # capacity_factor are the reconciling headline (the engine cross-checks them vs
  # the per-tech sum within 1%): 0.292997 = (159.6*0.332 + 50*0.1685) / 209.6.
  capacity_mw: 209.6  # 159.6 MW wind + 50 MW solar
  capacity_factor: 0.292997  # capacity-weighted blended P50 net CF (reconciles per-tech; #529 solar re-baseline)
  # INCREMENTAL financed grid-curtailment haircut (default 0.0 -> byte-identical). The
  # ~2% PHYSICAL curtailment is at resource.losses.curtailment_pct, already embedded in
  # the bankable net AEP and the 0.339 net CF above. This separate finance lever models
  # ADDITIONAL constrained-CEB-grid curtailment risk and is a first-class tornado +
  # Monte-Carlo variable (stress band 0-13% incremental = 2-15% total). The flat 2% is an
  # UNVALIDATED placeholder pending a CEB interconnection study (see docs red-flag note).
  curtailment_pct: 0.0
  degradation: 0.5  # Annual production degradation (0.5%/year for turbine aging)
  life_years: 20  # Project operational life
  cod_year: 2027  # Commercial Operation Date
  developer: "DutchBay Wind Power Pvt Ltd"
  grid_poi: "Puttalam 220kV Substation"
  
  # Tax & regulatory (Sri Lanka BOI)
  boi_approved: false
  boi_agreement_date: '2025-01-15'
  jurisdiction: Sri Lanka
  # Tax inputs are the single source of truth in the `tax:` block (CESSPIT).

# ═════════════════════════════════════════════════════════════════════════════
# MULTI-TECHNOLOGY GENERATION (M3 — true per-tech finance)
# ═════════════════════════════════════════════════════════════════════════════
# The cashflow sums per-tech generation, each with its OWN capacity factor and
# degradation (wind ~0.6%/yr, solar ~0.4%/yr — different decay shapes the lifetime
# CFADS). aep_gwh / capex_usd / availability_pct drive the lender per-tech reporting
# split (analytics.portfolio + casper_payload). The per-tech year-1 generation
# reconciles with project.capacity_mw * capacity_factor (engine-enforced, ±1%):
#   wind  159.6 MW * 0.332 = 52.987 ; solar 50 MW * 0.1685 = 8.425 ; sum 61.412
#   project 209.6 MW * 0.292997 = 61.412  ✓ (#529 solar TMY re-baseline)
generation:
  technologies:
    wind:
      capacity_mw: 159.6
      capacity_factor: 0.332      # net P50 (15 x IEA-10MW, ERA5-fitted Weibull)
      degradation_pct: 0.6        # 0.6%/yr turbine aging (percent, /100 by the engine)
      aep_gwh: 464.3              # net P50 AEP (reporting)
      capex_usd: 159600000        # $1,000/kW x 159.6 MW
      availability_pct: 97.0
    solar:
      capacity_mw: 50.0
      capacity_factor: 0.1685     # net P50 fixed-tilt, Kalpitiya — the pvlib-MODELLED P50 on a
                                  # FROZEN PVGIS TMY (resource.solar.tmy_path below): hourly
                                  # GHI/DNI/DHI + hourly Faiman ambient temp/wind. #529 SOLAR-6/12
                                  # re-baseline from 0.179 (-5.9%): real GHI 1871 (vs declared 2000)
                                  # + hot-hour thermal. Prior chain: #469 0.20->0.179 (clear-sky+scalar).
      degradation_pct: 0.4        # 0.4%/yr module aging (percent, /100 by the engine)
      aep_gwh: 73.8              # 50 MW * 8760 * 0.1685
      capex_usd: 40000000         # $800/kW x 50 MW (SL utility-scale PV)
      availability_pct: 99.0
    # Co-located BESS (type: bess) — a CEB distributed capacity-charge tolling stream,
    # NOT generation. `type` is authoritative: this block is EXCLUDED from the generation
    # reconciliation (no capacity_factor / tariff revenue) and earns ONLY the capacity
    # charge, so it is never double-counted. Its turnkey capex ($25M) is rolled into
    # capex.usd_total below so the battery is financed (BESS-3), not free.
    bess_1:
      type: bess                 # explicit class discriminator (storage, not generation)
      power_mw: 50.0             # contracted power rating (MW)
      energy_mwh: 200.0          # 4-hour duration (200 MWh / 50 MW = 0.25C); reconciles power*duration
      duration_h: 4.0
      capex_usd: 25000000        # 200 MWh x ~$125/kWh turnkey (SL proxy; see BESS research). Rolled
                                 # into capex.usd_total so the battery cost is actually financed.
      availability_pct: 97.0     # contractual availability target (reporting)
      revenue:
        model: capacity_charge
        # R = bid Capacity Charge Rate (LKR/MW/month). ILLUSTRATIVE bankable value for the
        # comparison column (the real R is the competitive bid variable; the CEB Addendum-A
        # worked example used 20,000,000). Paid flat for the 15-year contract term, no escalation.
        capacity_charge_lkr_per_mw_month: 5000000
        contract_years: 15
        availability_factor: 1.0   # 1.0 = meets the >=97% monthly availability guarantee
        dispatchable_ratio: 1.0    # ADSC/MDSC (<=1); 1.0 = BESS sized to hold MDSC

# ═════════════════════════════════════════════════════════════════════════════
# TURBINE & WIND RESOURCE (Wind Energy Calculator Inputs)
# ═════════════════════════════════════════════════════════════════════════════
turbine:
  model: "IEA Reference 10MW (198m)"
  n_turbines: 15
  rated_power_mw: 10.6383
  rated_power_kw: 10638
  total_capacity_mw: 159.6
  rotor_diameter_m: 198
  hub_height_m: 150
  cut_in_ms: 3.0
  cut_out_ms: 25.0
  rated_wind_speed_ms: 11.0
  certification_status: "OPEN_REFERENCE"  # IEA Wind Task 37 reference design (not OEM-certified)
  notes: "IEA Wind Task 37 10 MW reference (198 m, 345 W/m2), low-specific-power machine for the 7.85 m/s site. 15 x 10.638 MW = 159.6 MW. Representative open reference (Ct curve), substitutes for a future low-wind 10 MW OEM machine. Supersedes the 23 x EN-171/6.5 (149.5 MW) base; EN-171 kept as a characterization/sensitivity case."

wind_resource:
  # Weibull distribution parameters (for AEP calculation). ERA5-FITTED (3-method
  # consensus MLE/MoM/scipy on the 2020-2024 ARCO single-point timeseries at 150 m,
  # r2=0.998) — re-baselined from the prior DECLARED A=8.32/k=2.1/mean 7.85, which
  # overstated the resource (net AEP 483.6 -> 473.8 GWh, -2.0%).
  weibull_a: 8.199  # Scale parameter (m/s) - ERA5-fitted
  weibull_k: 2.665  # Shape parameter - ERA5-fitted (declared 2.1 was too broad)
  mean_wind_speed_ms: 7.29  # At hub height (150m), ERA5-fitted
  shear_exponent: 0.14
  air_density_kgm3: 1.15  # kg/m³ at ~15°C, sea level (tropical)
  air_density_ref_kgm3: 1.225  # Standard air density for power curve
  
  # Data provenance
  data_source: "ECMWF ERA5 Reanalysis"
  data_years: "2020-2024"
  data_confidence: "Medium (5-year ERA5 validated against 1-year met mast)"

layout:
  turbine_spacing_avg_m: 650
  turbine_spacing_avg_D: 3.28  # In rotor diameters (650m / 198m); doc-only, no code reads it
  iec_compliant_pairs: 6
  iec_marginal_pairs: 3
  iec_violation_pairs: 6
  layout_orientation: "linear_north_south_coastal"
  coordinates_reference: "WGS84_EPSG4326"
  utm_zone: "44N"

# ═════════════════════════════════════════════════════════════════════════════
# RESOURCE ASSESSMENT & LOSSES
# ═════════════════════════════════════════════════════════════════════════════
resource:
  # Turbine specifications (for backward compatibility)
  turbines:
    count: 15
    rated_power_mw: 10.6383
    total_capacity_mw: 159.6
    model: "IEA Reference 10MW (198m)"
    rotor_diameter_m: 198
    hub_height_m: 150

  # Power curve & AEP calculation
  power_curve:
    source_id: "IEA_REFERENCE_10MW_198_PC"
    source_type: "REFERENCE"
    curve_key: "iea_reference_10mw"   # power_curves.yaml store slug; must match the manifest's curve_key (asserted)
    iec_standard: "IEC 61400-12-1:2022"
    certificate_ref: "IEA Wind Task 37 reference design (open, not OEM-certified)"
    air_density_site_kgm3: 1.15
    air_density_ref_kgm3: 1.225
    alt_curve_key: "dtu_reference_10mw"  # comparable 10 MW machine for the AEP-tornado power-curve sensitivity driver

  aep_summary_path: "scenarios/aep_summary_dutchbay_hybrid.json"  # combined wind+solar bankable AEP (538.1 GWh net P50; #529)

  uncertainty:

    p50_haircut_pct: 2.0  # 2% pre-construction P50 over-prediction haircut on the WIND component (EIA EN220 P50 corroboration)

  # Technical losses (pre-grid). Wake is now MODELLED (PyWake Bastankhah 7.28%),
  # not the old flat placeholder; the stack totals 14.48% (see the AEP summary).
  losses:
    wake_loss_pct: 7.28  # PyWake Bastankhah-Porte-Agel granular wake (15-turbine layout); TurbOPark bound 8.93%
    availability_pct: 97.0  # Contractual availability target
    electrical_loss_pct: 2.0  # Cable + transformer + auxiliary consumption
    curtailment_pct: 2.0  # Grid curtailment (ERA5 stack)
    other_pct: 1.0  # Environmental / icing / blade degradation
  
  # Wind resource (for backward compatibility). ERA5-FITTED (see top-level block).
  wind_resource:
    mean_wind_speed_ms: 7.29
    weibull_a: 8.199
    weibull_k: 2.665
    shear_exponent: 0.14
    data_years: "2020-2024"
    data_source: "ECMWF_ERA5_2020_2024_DUTCHBAY"

  # Normalized GIS -> EPC wind interface (#22). Stable handoff contract validated
  # by analytics.wind.wind_interface_schema; consumed by cashflow/metrics.
  wind:
    ws150_mean_ms: 7.29       # Mean hub-height (150 m) wind speed (ERA5-fitted)
    ws150_std_ms: 2.95        # Weibull-derived (A=8.199, k=2.665)
    capacity_factor: 0.332    # Net P50 CF (canonical; matches aep_summary)
    aep_gwh: 464.3            # Net P50 AEP, GWh (canonical; matches aep_summary)
    source_id: "IEA_REFERENCE_10MW_198_PC"
    source_type: "REFERENCE"

  # ARCO single-point ERA5 retrieval (validated by analytics.wind.era5_interface_schema;
  # consumed by wind_resource.arco_assessment). Co-located so ONE scenario drives both the
  # finance pipeline and the ERA5 fit. FIXED vintage = reproducible: the frozen 2005-2024
  # 20-yr window backs the ERA5-FITTED wind_resource.weibull_a/k (8.199/2.665). VALIDATE mode:
  # the ARCO fit reports drift vs the declared baseline; it never overwrites it.
  era5:
    latitude: 8.27            # turbine-array centroid (T1-T15), Kalpitiya, Puttalam
    longitude: 79.75
    hub_height_m: 150         # MUST equal turbine.hub_height_m (cross-asserted)
    reference:
      mode: fixed             # reproducible (NEVER 'latest' for the lender case)
      start_year: 2005
      end_year: 2024          # the 20-yr window backing the declared Weibull
    strict_coverage: true     # fail (not warn) on a latency-truncated series
    output_dir: "outputs/era5_cache"
    weibull_fit:
      drift_tolerance_pct: 5.0  # warn/flag if |A_fit-A_declared| or |k_fit-k_declared| exceeds this

  # OPTIONAL pvlib solar producer (the [solar] extra). The financed run uses the declared
  # P50 generation.technologies.solar.capacity_factor (0.1685); this block lets the
  # solar_resource.pv_producer compute a physics-grounded CF to VALIDATE that P50 (never
  # overwrite it) — the photovoltaic analogue of resource.era5 / wind_resource for wind.
  # On the FROZEN PVGIS TMY (tmy_path) the pvlib model yields CF 0.1685 — the declared P50
  # (#529 SOLAR-6/12 re-baseline). annual_ghi_kwh_m2 is informational when a TMY is supplied
  # (the TMY's measured hourly GHI sets the resource; the TMY's annual GHI is ~1871).
  solar:
    latitude: 8.27               # PV array centroid, Kalpitiya (co-located with wind)
    longitude: 79.75
    timezone: "Asia/Colombo"
    altitude_m: 5.0
    annual_ghi_kwh_m2: 2000.0    # informational when tmy_path is set (TMY GHI ~1871 governs)
    dc_capacity_mw: 50.0         # DC nameplate (MWp); matches the solar tech block
    tilt_deg: 8.0                # fixed tilt near site latitude (low-latitude tropics)
    azimuth_deg: 180.0           # equator-facing (N hemisphere)
    dc_ac_ratio: 1.2             # inverter loading ratio
    system_loss_pct: 14.0        # soiling/wiring/mismatch/availability stack
    # SOLAR-6/12 (#529): FROZEN PVGIS TMY (lat 8.27, lon 79.75) — hourly GHI/DNI/DHI +
    # hourly ambient temp/wind for Faiman. Drives the re-baselined 0.1685 P50.
    tmy_path: "inputs/solar_tmy/kalpitiya_pvgis_tmy_8.27N_79.75E.csv"

# ═════════════════════════════════════════════════════════════════════════════
# MULTI-CURRENCY PPA STRUCTURE (NEW: Sprint 17)
# ═════════════════════════════════════════════════════════════════════════════
ppa:
  # INFORMATIONAL ONLY (not read by code). The model is structurally LKR-primary: the
  # engine reads the LKR tariff (tariff.lkr_per_kwh below), computes LKR revenue -> LKR
  # CFADS -> LKR tax, and reports USD only as a post-hoc division by the FX curve. NO
  # Python reads primary_currency to choose the revenue numeraire. A USD-primary flip
  # would touch the whole cashflow/debt/tax stack; until then this field MUST be "LKR"
  # (locked by tests/finance/test_currency_lkr_primary.py). The former ppa.tariff_per_kwh
  # / tariff_per_mwh were unread duplicates of tariff.lkr_per_kwh (a manual-sync footgun)
  # and have been removed — the tariff lives ONLY in the `tariff:` block.
  primary_currency: "LKR"  # informational only; must equal "LKR" (see note above)

  # PPA terms
  ppa_term_years: 20
  tariff_type: "fixed"  # vs "indexed" (CPI-linked) or "merchant"
  indexation_start_year: 2  # Year when CPI indexation begins (if indexed)
  cpi_annual_pct: 2.0  # Annual CPI escalation (if tariff_type=indexed)
  
  # Multi-currency reporting equivalents (REFERENCE ONLY - not used in calculations)
  # FX at 2026-Q2 pinned vintage: 1 USD = 333.79 LKR (was a stale 300). EUR/CNY cross
  # rates not refreshed (USD/LKR is the only fetched vintage); recompute when needed.
  equivalent_tariffs_reference:
    usd_per_mwh: 60.82  # 20300 ÷ 333.79 (for lender reports)
    eur_per_mwh: 61.5   # 20300 ÷ 330 (EUR/LKR not refreshed)
    cny_per_mwh: 487.0  # 20300 ÷ 41.7 (CNY/LKR not refreshed)
  
  # Off-taker details
  offtaker: "Ceylon Electricity Board (CEB)"
  offtaker_credit_rating: "B+ (S&P)"
  payment_terms_days: 30
  
  # Revenue guarantee (optional)
  revenue_guarantee:
    enabled: false
    guarantee_pct: 0.75  # % of P50 AEP guaranteed
    penalty_rate_same_currency: 5.0  # Penalty in same currency as tariff

# Legacy tariff field (for backward compatibility with old pipeline code)
tariff:
  lkr_per_kwh: 20.3
  tariff_type: fixed
  ppa_term_years: 20

# ═════════════════════════════════════════════════════════════════════════════
# FX INTEGRATION (Multi-Currency Debt + LKR Revenue)
# ═════════════════════════════════════════════════════════════════════════════
fx:
  enabled: true
  mode: "deterministic"  # Base case (vs "monte_carlo")
  base_currency: "USD"
  quote_currency: "LKR"

  # FX rates (2026-Q2 pinned vintage; USD/LKR refreshed from 300 -> 333.79)
  rates:
    lkr_per_usd: 333.79
    lkr_per_eur: 330.0    # EUR/LKR not refreshed (USD/LKR is the fetched vintage)
    lkr_per_cny: 41.7     # CNY/LKR not refreshed
    usd_per_eur: 1.10

  # Config-driven FX source (analytics.fx.fx_fetch). FIXED vintage = reproducible:
  # CI/lender runs read the pinned rate, ZERO network. VALIDATE mode reports drift vs
  # the live provider but never mutates the pinned rate (re-baseline is a dated edit).
  # CBSL daily indicative is the authoritative reference (documented, never fetched).
  source:
    mode: "fixed"                  # fixed (reproducible/lender) | latest (exploratory)
    provider: "open_er_api"
    endpoint: "https://open.er-api.com/v6/latest/USD"
    reference_url: "https://www.cbsl.gov.lk/en/rates-and-indicators/exchange-rates/daily-indicative-usd-spot-exchange-rates"
    pinned_rate: 333.79            # 2026-Q2; MUST equal start_lkr_per_usd (cross-asserted)
    pinned_as_of: "2026-06-20T00:02:31Z"
    drift_tolerance_pct: 5.0

  # FX curve parameters
  start_lkr_per_usd: 333.79  # 2026-Q2 pinned (was a stale 300.0, ~11.3% understatement)
  annual_depr: 0.0589  # data-derived LKR depreciation (BIS 2005-2026 long-run, analytics.fx.fx_calibration; was hand-set 3%)
  uncertainty_pct: 0.05  # ±5% FX volatility (for Monte Carlo)
  
  # FX exposure analysis
  exposure_summary:
    usd_debt_principal: 82500000  # USD DFI + Commercial
    lkr_revenue_pct: 100.0  # All revenue in LKR
    fx_mismatch: "Material - requires hedging or sculpted debt service"

# ═════════════════════════════════════════════════════════════════════════════
# CAPEX & OPEX
# ═════════════════════════════════════════════════════════════════════════════
capex:
  cost_basis_year: 2026  # USD vintage of the whole cost stack (anchored, ATB-style)
  estimate_class: 3  # AACE Class 3 (budget authorization); $/kW sanity-checked vs
  #                    the IRENA 2024 benchmark (wind ~$1,041/kW, SL utility PV ~$800/kW)
  # Combined cost stack: wind $159.6M + solar $40M + BESS $25M. The engine reads
  # usd_total; the per-technology capex split is in the `generation:` block above (the
  # BESS capex_usd MUST roll up into this total so the battery is financed — BESS-3).
  usd_total: 224600000  # combined: wind $159.6M + solar $40M + BESS $25M (200 MWh x ~$125/kWh)
  capex_per_kw_usd: 1072  # 224.6M / 209.6 MW generation nameplate (BESS power not in the denom)

opex:
  usd_per_year: 3500000  # combined: wind $3.0M (fixed O&M) + solar $0.5M (~$10/kW-yr x 50 MW)
  opex_per_kw_yr_usd: 16.7  # 3.5M / 209.6 MW combined
  
  breakdown:
    om_contract_usd: 2000000  # Full-service O&M
    insurance_usd: 500000  # Property + BI
    land_lease_usd: 300000  # 15 turbine sites
    admin_usd: 200000  # SPV overhead

# ═════════════════════════════════════════════════════════════════════════════
# TAX & STATUTORY
# ═════════════════════════════════════════════════════════════════════════════
tax:
  # Single source of truth for tax inputs (CESSPIT). Current SL regime (post-2025):
  # CIT 30%, no renewable holiday for new IPPs, TLCF 6yr, split straight-line
  # depreciation (plant&machinery 5yr / civils 20yr), interest WHT 10%.
  corporate_tax_rate: 0.30
  tax_holiday_route: none
  tax_holiday_years: 0
  tax_holiday_start_year: 1
  depreciation_method: straight_line
  depreciation_years: 5  # placeholder; the split fields below drive the calc
  depreciation_start_year: 1
  plant_capex_share: 0.80
  plant_depreciation_years: 5  # SL Fourth Sched Class 2 (plant & machinery)
  civil_depreciation_years: 20  # SL Fourth Sched Class 4 (buildings/civils)
  enhanced_capital_allowance_multiple: 1.5
  enhanced_allowance_applies: false
  loss_carryforward_years: 6
  wht_on_interest_to_nonresidents: 0.1
  wht_on_interest_enabled: true
  wht_gross_up: false
  # SL statutory dividend WHT 15% (#81) + capitalize debt IDC into the
  # depreciable tax base (#36/#75). Both bite the equity path only.
  wht_on_dividends: 0.15
  wht_on_dividends_enabled: true
  capitalize_idc_in_depreciable_base: true
  interest_deductibility: true

statutory:
  success_fee_pct: 0.0  # non-statutory levy — not in the SL regime; zeroed (#43)
  env_surcharge_pct: 0.0  # non-statutory levy — not in the SL regime; zeroed (#43)
  social_services_levy_pct: 0.025  # SSL on revenue

risk_adjustment:
  cfads_haircut_pct: 0.1

# ═════════════════════════════════════════════════════════════════════════════
# MULTI-CURRENCY DEBT STRUCTURE
# ═════════════════════════════════════════════════════════════════════════════
Financing_Terms:
  debt_ratio: 0.7                  # MAX gearing cap; actual gearing auto-solved to target_dscr
  debt_sizing: dual_dscr           # auto-size debt on the real schedule to target_dscr (capped at debt_ratio); robust to AEP (#180)
  dscr_p99_downside_factor: 0.80   # P99 CFADS = 80% of P50 (~P90 AEP) for the dual-DSCR (P50/P99) capacity detail
  # Bind the bankable P90 downside to the gearing (D4.6): the engine sizes a SECOND gearing
  # against a P90 cashflow (annual CFADS rescaled by the real net P90/P50 AEP ratio,
  # 471.0/538.1 = 0.8753, from expected_results; #529) and uses min(P50, P90) gearing — so the
  # structure must clear the DSCR floor even at P90 production, not only at P50. This makes
  # the MODELLED P90 (#469 dolphin 4c) actually bind debt rather than be reporting-only.
  # downside_aep_source: p90 reads the real P90/P50 ratio (vs the legacy flat 0.80 proxy);
  # target_dscr_p90 defaults to target_dscr (1.30) — the conservative choice: the same DSCR
  # floor is required in the downside case. KPI-MOVING: smaller (P90-bound) debt re-levers
  # the structure; see CHANGELOG.
  bind_downside: true
  downside_aep_source: p90
  # The dual-DSCR sculpt over a fixed tenor leaves an unamortised BALLOON at
  # maturity. balloon_treatment governs how the equity waterfall resolves it
  # (cash_sweep | refinance | bullet | amortize | legacy_ignore). cash_sweep is
  # the prudent-lender default: post-maturity CFADS is trapped to retire any
  # balloon before any equity distribution. NB: with bind_downside (D4.6) the
  # smaller P90-bound debt now FULLY AMORTISES over the tenor — balloon_pct is 0%
  # (it was ~40-57% with the unconstrained P50 gearing, breaching
  # constraints.max_balloon_pct 10%; the P90 sizing resolved it). cash_sweep is
  # retained for robustness, but no balloon remains in the base case.
  balloon_treatment: cash_sweep
  tenor_years: 15
  interest_only_years: 2
  amortization_style: auto
  interest_rate_nominal: 0.08
  
  # ── Multi-currency debt structure (CANONICAL) ───────────────────────────
  # The engine (finance/debt_v14._solve_mix) sizes total debt via dual_dscr,
  # then splits it by these mix PROPORTIONS at the per-currency rates below.
  # Proportions (not absolute principals) are required because the debt amount
  # is AUTO-SIZED, not fixed. The realised per-tranche principal + IDC are
  # reported in debt_result.principal_by_tranche / idc_by_tranche.
  # NB: a `debt_tranches:` list (absolute principals/per-tranche tenors) is NOT
  # an engine input — plan_debt warns if one is present. Edit mix + rates here.
  mix:
    lkr_max: 0.45              # LKR_Local share (45%)
    dfi_max: 0.1               # USD_DFI concessional share (10%)
    usd_commercial_min: 0.45   # USD_Commercial share (45%)
  rates:
    lkr_nominal: 0.1339  # UIP-implied: USD 7.5% + 5.89% LKR drift (#3, PR B)
    lkr_min: 0.1339
    dfi_nominal: 0.065         # USD_DFI rate (6.5%)
    dfi_min: 0.065
    usd_nominal: 0.075         # USD_Commercial rate (7.5%)
    usd_commercial_min: 0.075
  
  # DSCR targets
  target_dscr: 1.3
  min_dscr: 1.2
  
  # Reserves
  reserves:
    dsra_months: 6  # Debt Service Reserve Account
    receivables_guarantee_months: 9  # CEB payment risk
  
  use_revenue_guarantee: false
  guarantee_revenue_pct: 0.0075
  
  fees:
    upfront_pct: 0.01
  
  enforce_hard_covenants: false

# ═════════════════════════════════════════════════════════════════════════════
# LENDER COVENANTS & METRICS
# ═════════════════════════════════════════════════════════════════════════════
returns:
  project_life_years: 20
  project_discount_rate: 0.1
  equity_discount_rate: 0.12

constraints:
  max_debt_ratio: 0.8
  warn_debt_ratio: 0.75
  min_dscr_covenant: 1.3
  target_dscr: 1.35
  warn_dscr: 1.25
  max_balloon_pct: 0.1
  warn_balloon_pct: 0.05
  refinancing:
    enabled: true
    max_refinance_pct: 0.1
    refinance_rate_premium: 0.02
    refinance_tenor_years: 3
    requires_documentation: true
  max_tenor_years: 20
  warn_tenor_years: 18
  max_interest_rate: 0.25
  min_interest_rate: 0.0
  lender_type: DFI
  jurisdiction: Sri Lanka
  fail_on_covenant_breach: false
  fail_on_large_balloon: false

# ═════════════════════════════════════════════════════════════════════════════
# MONTE CARLO & SENSITIVITY
# ═════════════════════════════════════════════════════════════════════════════
monte_carlo:
  enabled: true
  n_scenarios: 100000
  sampler: lhs  # Latin Hypercube Sampling
  seed: 42
  
  # Wind resource uncertainty (dominant risk driver)
  weibull_uncertainty_pct: 10.0  # ±10% on A and k
  wake_loss_std_pct: 2.0
  availability_std_pct: 1.0
  electrical_loss_std_pct: 0.5
  
  # (Retired #doc-drift: the old "toy model - TO BE DEPRECATED" scalar block — an
  #  obsolete pre-pipeline MC format (discount_rate_pct / capex_total_usd / revenue_* /
  #  cost_* / fx_* / project_life_years) with ZERO Python readers. The live MC engine
  #  consumes only the `parameters:` LIST below.)
  
  # Distribution parameters (for pipeline-backed MC).
  # Canonical engine contract (analytics.mc.engine): an explicit LIST of
  # {name, low, high, distribution} where `name` is a dotted config path the
  # pipeline understands. Bounds are the uniform LHS support, derived as
  # base * (1 +/- 2 * relative_std) from the per-driver spreads documented inline
  # (so the wider the declared std, the wider the band). CCCDIR: paths explicit,
  # no implicit name->path mapping. ARCH-01: all values from config.
  parameters:
    - name: project.capacity_factor   # base 0.292997, rel_std 0.05 -> +/-10% (#529 re-baseline)
      low: 0.2637
      high: 0.3223
      distribution: uniform
    - name: tariff.lkr_per_kwh        # base 20.3, rel_std 0.10 -> +/-20%
      low: 16.24
      high: 24.36
      distribution: uniform
    - name: opex.usd_per_year         # base 3.0e6, rel_std 0.15 -> +/-30%
      low: 2100000.0
      high: 3900000.0
      distribution: uniform
    - name: capex.usd_total           # base 224.6e6 (combined incl BESS), rel_std 0.08 -> +/-16%
      low: 188664000.0
      high: 260536000.0
      distribution: uniform
    - name: fx.start_lkr_per_usd      # base 333.79, rel_std 0.05 -> +/-10%
      low: 300.0
      high: 367.0
      distribution: uniform
    - name: project.curtailment_pct   # INCREMENTAL grid curtailment over the ~2% embedded
      low: 0.0                         # in CF; 0-13% incremental = 2-15% total grid curtailment.
      high: 0.13                       # Deliberately downside-weighted: the flat 2% is an
      distribution: uniform            # unvalidated optimistic placeholder for a constrained grid.
  
  # Output configuration
  var_confidence: 0.95
  cvar_confidence: 0.95
  percentiles: [10, 25, 50, 75, 90]
  min_dscr_covenant: 1.2
  min_llcr_covenant: 1.25
  output_path: "outputs/mc_hybrid_bess_dutchbay_100k.parquet"

# ═════════════════════════════════════════════════════════════════════════════
# PIPELINE CONFIGURATION
# ═════════════════════════════════════════════════════════════════════════════
pipeline:
  output_dir: "outputs/dutchbay_hybrid_bess_2025Q4"
  seed: 42
  export_scenarios: true
  export_provenance: true

timeline:
  ppa_to_fc_years: 1
  construction_years: 2
  ops_years: 20
  lifetime_years: 22

# ═════════════════════════════════════════════════════════════════════════════
# EXPECTED RESULTS (For Pipeline Validation)
# ═════════════════════════════════════════════════════════════════════════════
expected_results:
  # Combined bankable AEP for the 209.6 MW hybrid = wind 464.3 GWh (15 x IEA-10MW,
  # ERA5-fitted Weibull, PyWake 7.28% wake, 14.48% losses) + solar 73.8 GWh (50 MW
  # fixed-tilt, pvlib-modelled P50 CF 0.1685 on a frozen PVGIS TMY; #529 SOLAR-6/12
  # re-baseline from 0.179). The aep_reconciliation guard cross-checks this against
  # capacity_mw * capacity_factor (538.0 GWh), so a stale headline cannot creep in.
  net_aep_p50_gwh: 538.1   # wind 464.3 (post 2% over-prediction haircut) + solar 73.8 (pvlib P50)
  net_aep_p90_gwh: 471.0   # wind 404.4 (post haircut) + solar 66.6 (pvlib P90-1yr from solar_resource.exceedance, default IEA-PVPS Task 13 budget, sigma ~7.65%). BINDS debt (D4.6): with Financing_Terms.bind_downside true, the P90/P50 ratio (471.0/538.1 = 0.8753) rescales CFADS to size the gearing, so this P90 constrains debt/equity-IRR/DSCR (not reporting-only).
  capacity_factor: 0.292997
  # Financial KPIs for the hybrid are pinned by the regression test
  # tests/finance/test_hybrid_scenario.py (the engine output is the single source of
  # truth) rather than hand-maintained here — solar's distinct degradation makes them
  # materially different from the wind-only lendercase.

