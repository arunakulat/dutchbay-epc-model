# ═══════════════════════════════════════════════════════════════════════════════
# Blue Whale Wind project (Lot 5B, Kalpitiya): 1 x Envision EN-206/10.5 de-rated to 9.5 MW
# ═══════════════════════════════════════════════════════════════════════════════
# Version: 0.4 (SKELETON: screening placeholders, not a basis for any decision)
# Path: scenarios/blue_whale_wind_lot5b_2026.yaml
#
# A SEPARATE PROJECT, BUILT FIRST (owner, 2026-11-01, #1353 comment 6556854201): "We will
# therefore consider the 10mw turbine separately from the solar+bess. It will be a separate
# project that will preceed the solar+BESS. Maximize BESS now within the solar+BESS
# parameters in order to gain the maximum benefit from the PUCSL evening tariff band".
# Turbine: "Separate, risk flagged". The solar + BESS project is
# scenarios/blue_whale_solar_bess_lot5b_2026.yaml; the combined view
# scenarios/blue_whale_hybrid_lot5b_2026.yaml is superseded.
#
# The turbine and its position are #1530's: one EN-206/10.5 de-rated to 9.5 MW at 130 m hub
# on the placeholder lot, at the CZ&CRMP 2024-2029 coastal setback
# (docs/blue_whale/site_placeholder_lot5b.geojson, conf/blue_whale_wind_siting.yaml).
#
# WIND RESOURCE (v0.2, PR 5, work item #1353 comment 6556910250). The capacity factor and
# energy now rest on met-mast export 617725 (docs/source_materials/met_mast_617725_2025/),
# transferred to the turbine by sector-wise measure-correlate-predict against NASA POWER /
# MERRA-2 (2015-2025) and the reference's own mast-to-turbine relationship, then to 130 m on
# the mast's measured shear: scripts/run_blue_whale_met_mast_transfer_v14.py,
# conf/blue_whale_met_mast_transfer.yaml, analytics/wind/met_mast_transfer.py; results
# docs/blue_whale/met_mast_transfer_summary.json; method docs/blue_whale/MET_MAST_TRANSFER_METHODS.md.
# Owner direction, 2026-11-01, verbatim: "use the kalpitiya met-mast evidence from RAG repo and
# interpolate to obtain wind rose and more detailed wind evidence. the two locations are near
# to each other on the same coastline". The values are DERIVED results only, from the
# confidential OEM curve read at run time from outside this repository under handling note
# KALPITIYA60MW-WIND-HANDLING-2026-09-21; no curve value is published.
#
# HOLD: NOT LENDER-GRADE. The mast record is 232 days, monsoon-weighted, pre-filtered and
# undocumented (sensors, calibration, site identity, timezone); it lies 26.7 km from the
# turbine; the reference is reanalysis; the site is a placeholder. The met-mast package's HOLD
# on annual, P50/P90 and lender use stands. The P50 below is a screening value; its 1-sigma
# uncertainty is about 13.2% (P90 1-year 33.73 GWh, 20-year 33.92 GWh, in the summary).
#
# Tariff: PUCSL Annex 2 (effective 25 Aug 2026), wind 25.73 LKR/kWh (20.80 non-escalable +
# 4.93 escalable O&M), plants < 10 MW. The 2026 methodology's BESS tariff (s.5) covers solar
# PV only, so this project has no BESS and no solar.
#
# OPEN LEGAL RISK: THE 10 MW LIMIT. The Electricity Act No. 36 of 2024, s.11(3) proviso:
# "the maximum capacity of such renewable energy plants to be procured from a contiguous
# location using standard power purchase agreements on cumulative basis shall not exceed
# 10 MW". This 9.5 MW turbine is under 10 MW on its own, but the solar + BESS project stands
# on the same lot. If the two count cumulatively as one contiguous location, the turbine
# leaves 0.5 MW of the 10 MW for the solar + BESS project, and the pair exceeds the limit at
# any size the solar + BESS sizing considered. An open question for PUCSL, the NSO or counsel
# (sources frozen in conf/blue_whale_pucsl_fit_2026.yaml).
#
# CAPEX (v0.3, PR 6, work item #1353 comment 6556975196): the turbine capex is a BLEND of China
# export FOB pricing and internal anchors (conf/blue_whale_capex_solar_resource.yaml,
# scripts/run_blue_whale_capex_solar_resource_v14.py, method
# docs/blue_whale/CAPEX_AND_SOLAR_RESOURCE_METHODS.md). Owner decisions, verbatim: "in the next
# step, search for the latest CAPEX figures for Wind and BESS from RAG and EPC corpus (Mannar,
# Mullikulam, NSO BESS tender, and Kalpitiya) interpolate with China FOB pricing from a deep web
# search, indicate the solar efficacy and strength at the Blue Whale location (provide
# references for the pvlab or any other process through which these numbers are obtained) and
# update all YAML occasions in the Blue Whale Scenario"; "Derived blend may publish". The
# disclosure surface moves on the owner's authority: the private inputs can be recovered exactly
# from the published blend, which the owner accepted on 2026-11-07 (#1353 comment 6702419885).
#
# EVERY VALUE BELOW IS A PLACEHOLDER unless its comment says otherwise. The finance blocks are
# the hybrid's (v0.6), copied where they apply. The inputs register is
# docs/blue_whale/INPUTS_REQUIRED.md.
# ═══════════════════════════════════════════════════════════════════════════════

project:
  name: "Blue Whale Wind (Lot 5B)"
  location: "Lot 5B Plan 3641, Mutuwal, GN Dutch Bay 633, Kalpitiya DS, Puttalam District, North Western Province, Sri Lanka"
  capacity_mw: 9.5              # one turbine de-rated to 9.5 MW (owner, 2026-11-01)
  capacity_factor: 0.487560     # = the wind block's CF (the only technology)
  curtailment_pct: 0.0
  degradation: 0.5              # PLACEHOLDER (input B12)
  life_years: 20                # PLACEHOLDER (input F01): SPPA term
  cod_year: 2028                # PLACEHOLDER (input B30): built before the solar + BESS project
  developer: "Blue Whale Limited (project company to be confirmed)"   # input B01
  grid_poi: "TBD: CEB grid substation and voltage not yet identified"  # input B25
  boi_approved: false           # input F30
  jurisdiction: Sri Lanka

generation:
  technologies:
    wind:
      # Turbine (owner, 2026-11-01): Envision EN-206/10.5 de-rated to 9.5 MW, 130 m hub,
      # 206 m rotor, tip height 233 m. De-rate modelled as the power curve clipped at
      # 9,500 kW (an assumption; an OEM de-rate mode may differ).
      capacity_mw: 9.5
      capacity_factor: 0.487560   # Net P50 CF on 9.5 MW, DERIVED (v0.2, PR 5) by
                                  # scripts/run_blue_whale_met_mast_transfer_v14.py: met mast 617725 long-term
                                  # corrected (MCP, NASA POWER / MERRA-2 2015-2025) and transferred to the turbine,
                                  # 16 sector Weibulls at 130 m (mean 8.24 m/s); gross 43.99 GWh (CF 0.5287);
                                  # #1530's density (1.15 kg/m3) and losses 7.77% (availability 97%, electrical 2%,
                                  # curtailment 2%, other 1%, no wake). NOT LENDER-GRADE (HOLD above).
                                  # Was 0.374256 (#1530: DutchBay ERA5-fitted Weibull, 7.14 m/s at 130 m)
      degradation_pct: 0.6        # PLACEHOLDER: DutchBay turbine-ageing assumption
      aep_gwh: 40.57              # net P50: 9.5 MW x 8760 h x 0.487560 (reporting). Was 31.15
      capex_usd: 8899980          # BLENDED (v0.3, PR 6, input B09): USD 936.84/kW x 9.5 MW, the single-turbine
                                  # all-in mode of conf/blue_whale_capex_solar_resource.yaml (range 728.16-1,341.16
                                  # USD/kW; docs/blue_whale/capex_blend_summary.json): China export FOB blended
                                  # with internal anchors, landed (PAL 5% + SSCL 2.5%, VAT relieved), inland
                                  # transport, EPC wrap, BoP with a single-machine premium; excludes the B26 line.
                                  # This figure is a blend that includes private commercial inputs, and those
                                  # inputs can be recovered exactly from the published figures (owner accepted,
                                  # #1353 comment 6702419885). Published on the owner's decision of
                                  # 2026-11-01 (#1353 comment 6556975196). Was 12,350,000 ($1,300/kW placeholder)
      availability_pct: 97.0

tariff:
  # Input F03: PUCSL feed-in tariff effective 25 Aug 2026 for plants < 10 MW (Annex 2), wind
  # 25.73 (20.80 non-escalable + 4.93 escalable O&M). One technology, so no blend. The O&M
  # part's yearly indexation and the month-12 adjustment are not modelled.
  lkr_per_kwh: 25.73
  tariff_type: fixed            # input F04
  ppa_term_years: 20            # input F01: the hybrid's basis (the CEB standardised PPA draft, June 2025,
                                # 20 years from COD); the methodology's s.3.1 tariff rests on a 20-year cash flow

ppa:
  primary_currency: "LKR"
  ppa_term_years: 20
  tariff_type: "fixed"
  offtaker: "National System Operator (Private) Limited"   # input F02 (Gazette Extraordinary 2479/36)
  payment_terms_days: 30

fx:
  enabled: true
  mode: deterministic
  base_currency: USD
  quote_currency: LKR
  rates:
    lkr_per_usd: 333.79
  start_lkr_per_usd: 333.79     # 2026-Q2 pinned rate shared with the DutchBay cases (input F25 to refresh)
  annual_depr: 0.0              # held flat: fully LKR funded (owner, 2026-10-28), as the hybrid
  uncertainty_pct: 0.05

capex:
  cost_basis_year: 2026
  estimate_class: 5             # AACE Class 5 (concept screening)
  usd_total: 10899980           # wind 8,899,980 (blended, v0.3) + grid/civils/development 2.0M (PLACEHOLDER B26, the
                                # hybrid's whole line carried to each project: separate SPPAs, separate connections).
                                # Was 14,350,000
  capex_per_kw_usd: 1147        # 10,899,980 / 9.5 MW (was 1511)

opex:
  usd_per_year: 500000          # PLACEHOLDER (inputs B10, B28): wind O&M 0.35M + insurance, land lease and
                                # SPV overhead 0.15M (the hybrid's lines). Stated in USD at fx.start_lkr_per_usd;
                                # the components below must add up to it (a test checks)
  opex_per_kw_yr_usd: 52.6      # 500k / 9.5 MW; high because a single turbine carries full O&M overheads
  escalation_pct: 5.0           # = currency_split.lkr_escalation_pct (the engine refuses a mismatch); kept
                                # for the single-rate screening tools that read it
  # v0.4 (input B34): the owner's rule (2026-11-02): "all CAPEX is fixed at project start in LKR. The debt
  # will be in LKR. However, a percentage of OPEX will be in USD". Her decision of 2026-11-02: wind O&M
  # stays 0.35M, 70% USD / 30% LKR. The USD share is
  # 245,000 / 500,000 = 49% of the total; it escalates in USD and is translated on its own FX path, while
  # the model curve stays flat (fx block: constant-LKR reporting rate). The LKR share is fixed in LKR at
  # 333.79 and escalates at LKR inflation.
  currency_split:
    usd_escalation_pct: 2.5     # PLACEHOLDER (input B34): USD O&M inflation (no USD index is sourced in
                                # either corpus)
    lkr_escalation_pct: 5.0     # PLACEHOLDER (input B29): LKR O&M inflation at the CBSL 5% target
    usd_lkr_depreciation_pct: relative_ppp  # LKR depreciation for the USD share only, derived from the two
                                    # inflation inputs above: 1.05 / 1.025 - 1 = 2.44%/yr (the owner, 2026-11-07:
                                    # "fix for inflation"). Was 5.89%, the DutchBay cases' BIS 2005-2026 nominal
                                    # rate, which with these inflation inputs implied ~3.3%/yr real LKR
                                    # depreciation. Advanced through construction as the model curve would be
    components:
      - name: wind_om
        usd_per_year: 350000    # PLACEHOLDER (input B10): no OEM has priced a wind LTSA in either corpus;
                                # 3.9% of turbine capex, the top of the 3-4% benchmark band
        usd_share: 0.70         # parts and OEM service in USD; 30% local labour (a typical labour / plant
                                # split for wind O&M; the owner's decision of 2026-11-02)
      - name: insurance_land_spv
        usd_per_year: 150000    # PLACEHOLDER (inputs B02, B28)
        usd_share: 0.0          # LKR (the owner has not said otherwise)

tax:
  corporate_tax_rate: 0.30      # input F31
  tax_holiday_route: none       # input F30 (BOI)
  tax_holiday_years: 0
  tax_holiday_start_year: 1
  depreciation_method: straight_line
  depreciation_years: 5
  depreciation_start_year: 1
  plant_capex_share: 0.85
  plant_depreciation_years: 5   # SL Fourth Sched Class 2 (plant & machinery)
  civil_depreciation_years: 20  # SL Fourth Sched Class 4 (buildings/civils)
  enhanced_capital_allowance_multiple: 1.5
  enhanced_allowance_applies: false
  loss_carryforward_years: 6
  wht_on_interest_to_nonresidents: 0.1
  wht_on_interest_enabled: true
  wht_gross_up: false
  wht_on_dividends: 0.15
  wht_on_dividends_enabled: true
  capitalize_idc_in_depreciable_base: true
  interest_deductibility: true

statutory:
  success_fee_pct: 0.0          # non-statutory levy, not in the SL regime (#43)
  env_surcharge_pct: 0.0        # non-statutory levy, not in the SL regime (#43)
  social_services_levy_pct: 0.025

risk_adjustment:
  cfads_haircut_pct: 0.1

Financing_Terms:                # PLACEHOLDER pending the term sheet (inputs F11-F24); the 100% LKR mix is the owner's (F10)
  debt_ratio: 0.7
  debt_sizing: dual_dscr
  dscr_p99_downside_factor: 0.80
  balloon_treatment: cash_sweep
  tenor_years: 12
  interest_only_years: 1
  amortization_style: auto
  interest_rate_nominal: 0.08
  mix:                          # fully LKR funded (owner, 2026-10-28; input F10)
    lkr_max: 1.0
    dfi_max: 0.0
    usd_commercial_min: 0.0
  rates:
    lkr_nominal: 0.1339         # PLACEHOLDER (input F11): UIP-implied DutchBay rate, not a quoted LKR project loan
    lkr_min: 0.1339
    dfi_nominal: 0.065
    dfi_min: 0.065
    usd_nominal: 0.075
    usd_commercial_min: 0.075
  target_dscr: 1.3
  min_dscr: 1.2
  reserves:
    dsra_months: 6
  fees:
    upfront_pct: 0.01
  enforce_hard_covenants: false

returns:
  project_life_years: 20
  project_discount_rate: 0.1
  equity_discount_rate: 0.12    # input F27

constraints:
  max_debt_ratio: 0.8
  warn_debt_ratio: 0.75
  min_dscr_covenant: 1.3
  target_dscr: 1.35
  warn_dscr: 1.25
  max_balloon_pct: 0.1
  warn_balloon_pct: 0.05
  max_tenor_years: 15
  warn_tenor_years: 14
  max_interest_rate: 0.25
  min_interest_rate: 0.0
  lender_type: DFI
  jurisdiction: Sri Lanka
  fail_on_covenant_breach: false
  fail_on_large_balloon: false

timeline:
  ppa_to_fc_years: 1
  construction_years: 1         # PLACEHOLDER (input B30)
  ops_years: 20
  lifetime_years: 21

wacc:
  mode: build_up
  drives_discount_rate: true
  cost_of_equity: 0.12
  prudential_spread_bps: 100
  description: "Build-up WACC drives the project discount rate."

metadata:
  version: '0.4'
  last_updated: '2026-11-07'
  author: DutchBay V14 Financial Modeling Team
  review_status: SKELETON - screening placeholders pending owner inputs (docs/blue_whale/INPUTS_REQUIRED.md)
  assumptions_source: 'Split from blue_whale_hybrid_lot5b_2026 v0.6 (wind block and finance blocks)'
  changes:
    - 'v0.4 (2026-11-07): opex split by currency (input B34; owner rule and decision of 2026-11-02): wind O&M 0.35M 70% USD / 30% LKR, insurance, land and SPV 0.15M LKR; USD share 49% escalates at 2.5%/yr in USD on an LKR depreciation path of 2.44%/yr, derived by relative PPP from the inflation inputs (owner, 2026-11-07: "fix for inflation"; was 5.89%); LKR share at 5%/yr. Total unchanged at 500,000'
    - 'v0.3 (2026-11-01): wind capex BLENDED (PR 6, #1353 comment 6556975196): 12,350,000 ($1,300/kW placeholder) -> 8,899,980 (USD 936.84/kW, range 728.16-1,341.16, conf/blue_whale_capex_solar_resource.yaml); capex total 14,350,000 -> 10,899,980. A blend that includes private commercial inputs, published on the owner''s decision'
    - 'v0.2 (2026-11-01): wind resource from met mast 617725 (PR 5, #1353 comment 6556910250): sector-wise variance-ratio MCP at 120 m against NASA POWER / MERRA-2, long-term 2015-2025, transferred 26.7 km to the turbine through the reference, sheared to 130 m. Wind CF 0.374256 -> 0.487560, net AEP 31.15 -> 40.57 GWh (P90 1-year 33.73, 20-year 33.92). Not lender-grade; the met-mast HOLD stands'
    - 'v0.1 (2026-11-01): the turbine as its own project, built first (owner decision, #1353 comment 6556854201). Wind block unchanged from the hybrid v0.6 (#1530: 9.5 MW, CF 0.374256, 31.15 GWh, capex 12.35M placeholder); tariff 25.73 (PUCSL Annex 2 wind); capex 14.35M with the 2.0M grid/civils/development placeholder; O&M 0.5M; no solar, no BESS'
