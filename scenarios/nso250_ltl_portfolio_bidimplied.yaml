# ═══════════════════════════════════════════════════════════════════════════════
# NSO 250 MW BESS — LTL consolidated award, 24-project portfolio
# capex variant: BIDIMPLIED — equipment USD 48.88/kWh, all-in USD 78.75/kWh
# ═══════════════════════════════════════════════════════════════════════════════
# Tender TR/REP&PM/ICB/2026/001/C — 250 MW / 1,000 MWh standalone BESS, BOO, 15-year term.
#
# WHAT THIS MODELS. On the project owner's premise of 6 September 2026 that Ceylex
# Engineering and Lakdhanavi are one entity under LTL Holdings, that entity won 24 of the
# 25 projects (Aitken Spence took Kosgama). Nineteen substations carry 25 projects because
# Volume I cl. 1.3 permits two proposals at six named substations. This file models the
# 24-project portfolio.
#
# REVENUE. A flat Capacity Charge Rate in LKR/MW/month — "the procurement shall be in power
# (MW) terms" (Volume I cl. 2.8) — paid for 15 years with NO indexation and NO energy
# payment anywhere in the ESA. R = 1,752,500 is the capacity-weighted average of the 24
# LTL-controlled winning bids (range 1,695,000 to 1,850,000).
#
# FX. One-off: LTL funds the imported equipment from USD its overseas operations already
# earn, so there is no rolling exposure. `annual_depr` is 0.0 deliberately — the tender's
# 0.15*Y + 0.85*Y*(P2/P1) adjustment covers roughly one MONTH between bid closing and ESA
# signing, not the term. The Monte Carlo varies the spot over that window only.
#
# CAPEX. Built UP from the equipment price, not back-solved from an assumed total. Equipment
# is USD 48.88/kWh of CONTRACTED capacity; adding balance of plant USD 14.00/kWh and an
# augmentation reserve USD 8.00/kWh, then land and auxiliaries at 10% of total capex per
# the owner's direction of 5 September 2026, gives USD 78.75/kWh all-in.
# NOT a cost estimate — the equipment cost the winning bids can carry at a 14% return,
# carried as a scenario so the bid-implied ceiling sits alongside the quoted OEM prices.
# Roughly half of them.
# Only the equipment line is sourced; balance of plant, augmentation and the land percentage
# remain judgement, exactly as section 2 of the reverse-engineering evaluation records them.
# Quotes priced per kWh of DC INSTALLED energy are restated onto the contracted denominator —
# the offers install 9-19% more DC than they contract, and the two bases rank differently.
#
# MDSC. The ESA pays the full charge whenever ADSC >= MDSC, so a project augmented to hold
# the floor earns a FLAT charge: `mdsc_fade_pct_annual` is 0.0 and the cost of holding the
# floor sits in the augmentation reserve inside capex. `mdsc_floor_soh` records the tender's
# own year-15 floor of 68%. Setting a fade here as well would double-count.
# ═══════════════════════════════════════════════════════════════════════════════

project:
  name: "NSO 250MW BESS — LTL portfolio (bidimplied capex)"
  location: "Sri Lanka — 19 grid substations, 24 projects"
  capacity_mw: 264.0
  capacity_factor: 0.0
  degradation: 0.0
  life_years: 15
  cod_year: 2027          # RFP Vol I cl. 1.4: COD 06-May-2027
  developer: "LTL-controlled entity (Ceylex / Lakdhanavi), per owner premise"
  jurisdiction: Sri Lanka
  boi_approved: false

generation:
  technologies:
    bess_unit:
      type: bess
      power_mw: 264.0
      energy_mwh: 1056.0
      duration_h: 4.0
      capex_usd: 83162464
      availability_pct: 97.0
      revenue:
        model: capacity_charge
        capacity_charge_lkr_per_mw_month: 1752500
        contract_years: 15
        availability_factor: 1.0
        dispatchable_ratio: 1.0
        mdsc_fade_pct_annual: 0.0
        mdsc_floor_soh: 0.68

tariff:
  lkr_per_kwh: 0.0
  tariff_type: fixed
  ppa_term_years: 15

capex:
  cost_basis_year: 2026
  estimate_class: 4
  usd_total: 83162464
  capex_per_kw_usd: 315.0

opex:
  usd_per_year: 2114026
  opex_per_kw_yr_usd: 8.01
  escalation_pct: 0.0

tax:
  corporate_tax_rate: 0.30
  tax_holiday_route: none
  tax_holiday_years: 0
  tax_holiday_start_year: 1
  depreciation_method: straight_line
  depreciation_years: 5
  depreciation_start_year: 1
  plant_capex_share: 0.90
  plant_depreciation_years: 5
  civil_depreciation_years: 20
  # ENHANCED CAPITAL ALLOWANCE. The Second Schedule grants an allowance equal to 100% of the
  # investment in depreciable assets IN ADDITION TO the normal capital allowance, for a total
  # investment between USD 250,000 and USD 3,000,000 in a new undertaking, with effect from
  # 01-Apr-2026 and subject to BOI approval; 150% where the assets are used in the NORTHERN
  # PROVINCE (of the 24 awarded sites, Kilinochchi and Chunnakam 1 & 2 qualify). The multiple
  # is the TOTAL write-off factor on the depreciable base, so 2.0 = 1.0 normal + 1.0 enhanced.
  # Each site is a separate undertaking and its depreciable base sits inside the band; the band
  # is a CEILING, so a negotiated price high enough to push the plant base past USD 3m forfeits
  # the allowance that justified it. Northern-Province sites would carry 2.5.
  enhanced_capital_allowance_multiple: 2.0
  enhanced_allowance_applies: true
  loss_carryforward_years: 6
  wht_on_interest_to_nonresidents: 0.1
  wht_on_interest_enabled: true
  wht_gross_up: false
  wht_on_dividends: 0.15
  wht_on_dividends_enabled: true
  capitalize_idc_in_depreciable_base: true
  interest_deductibility: true

statutory:
  success_fee_pct: 0.0
  env_surcharge_pct: 0.0
  # SSCL is NOT borne by the project. ESA Volume III Article 5(o): "Any applicable Value Added
  # Tax or similar Sales Taxes that is payable will then be added to such payments." The
  # Section 4 bid form (Addendum 01 item 13) matches — the Capacity Charge Rate is quoted
  # EXCLUDING VAT, with "SSCL (if applicable)" and "VAT - 18%" as separate lines added on top
  # and recovered from NSO. Deducting it from revenue, as this file did until 2026-09-06,
  # double-charged the project ~LKR 139m/yr. Import-side SSCL is a different levy and is
  # carried in `taxes_indirect` below.
  social_services_levy_pct: 0.0

risk_adjustment:
  cfads_haircut_pct: 0.1

# Import levies and unrecoverable input VAT. Until 2026-09-06 this block was ABSENT, which
# finance/import_levies.py treats as every line zero — silently the most favourable tax corner
# available. It is now stated explicitly so the assumption is reviewable.
#
# BONDED WAREHOUSING SCHEME. Established under the Customs Ordinance by the Regulations of the
# Minister of Finance of 10-Aug-2018 (Gazette Extraordinary 2083/33), as amended with effect
# from 15-Oct-2025 (Gazette Extraordinary 2458/38) to add RENEWABLE ENERGY STORAGE FACILITIES
# of at least 1 MWh as an eligible sector. At 44 MWh contracted per site the facility qualifies
# comfortably. The scheme relieves Customs Import Duty, PAL, CESS and VAT on approved capital
# goods DURING THE CONSTRUCTION PERIOD. Obtaining it is the BIDDER's responsibility (RFP
# Clarifications 2026-08-21 cl. 47); it covers only equipment forming part of the BESS facility,
# and transmission-line materials and external grid interconnection works are expressly NOT
# eligible (cl. 48); approval takes 6-8 weeks and can only be applied for after Financial Close.
#
# ESA Article 6A(a)(i) names this scheme as "the basis upon which the bid of the Company was
# made and accepted": amending, withdrawing or negating its benefits is a Change in Law Event
# carrying an equitable Capacity Charge adjustment once the effect exceeds LKR 20,000,000. The
# relief is therefore contractually protected, and symmetrically so - a benefit that becomes
# MORE generous is clawed back above the same threshold.
#
# SSCL IS NOT RELIEVED. Only raw materials imported for processing and re-export are exempt from
# the Social Security Contribution Levy; capital goods pay. Until 2026-09-06 these files set
# `relief.bonded_scheme: true`, and `finance/import_levies.py` zeroes CID, PAL AND SSCL together
# behind that one flag - so the SSCL line was being relieved by a scheme that does not relieve
# it. The flag is now false on every variant and the relief is expressed on the lines the scheme
# actually reaches: CID is 0.0 because HS 8502.31 is Free in its own right, PAL is 0.0 where the
# facility is obtained, and SSCL stands at 2.5%.
#
# NOT EVIDENCED: the two-month SCOD extension these headers attributed to "Addendum 01 cl. 8"
# until 2026-09-06. No such addendum is held in the corpus; RFP Vol I cl. 1.4 as held carries
# the unextended schedule, which is what the timeline block below now models. Separately, ESA
# Art 6A(b)(i) refers to "the bid closing (i.e. 14th October 2025)" against Volume I's
# 14-Aug-2026 - a template carry-over that should be resolved against the issued originals. This variant assumes it is OBTAINED.
#
# VAT is relieved on both lines because it is passed through, not absorbed: the project charges
# output VAT on the capacity charge under ESA Article 5(o), so input VAT is recoverable. This is
# a recovery position, not a concession, and it does not depend on the bonded approval.
#
# NOT modelled: the cl. 48 carve-out. Relief here applies to the whole imported share, whereas
# the tender restricts it to BESS-facility equipment. Splitting interconnection scope out of
# capex would reduce `import_share_pct` for the relieved portion and make the base slightly
# worse; it needs a capex split these files do not yet carry.
taxes_indirect:
  import_share_pct: 0.69      # imported (CIF) share of the pre-levy capex base
  cid_pct: 0.0                # Customs Import Duty — HS 8502.31 is Free in its own right
  pal_pct: 0.0                # Ports & Airports Levy — relieved by the bonded scheme
  sscl_import_pct: 0.025      # SSCL — NOT relieved by the bonded scheme; capital goods pay
  vat_capex_pct: 0.18
  vat_on_full_capex: false
  vat_on_duties: true         # SL cascade: VAT base includes CIF + duties
  vat_opex_pct: 0.18
  relief:
    # false on EVERY variant: the flag zeroes CID+PAL+SSCL as one line in
    # finance/import_levies.py, and the scheme does not reach SSCL. Relief is
    # expressed on the individual rates above instead.
    bonded_scheme: false
    vat_capex_relieved: true
    vat_opex_relieved: true

fx:
  enabled: true
  mode: deterministic
  base_currency: USD
  quote_currency: LKR
  rates:
    lkr_per_usd: 327.0
  start_lkr_per_usd: 327.0
  annual_depr: 0.0
  uncertainty_pct: 0.02

Financing_Terms:
  debt_ratio: 0.7
  debt_sizing: dual_dscr
  dscr_p99_downside_factor: 0.80
  balloon_treatment: cash_sweep
  construction_years: 1   # RFP cl. 1.4: FC 06-Jan-2027 to COD 06-May-2027
  tenor_years: 12
  interest_only_years: 1
  amortization_style: auto
  interest_rate_nominal: 0.1180
  mix:
    lkr_max: 1.0
    dfi_max: 0.0
    usd_commercial_min: 0.0
  rates:
    lkr_nominal: 0.1180   # 10y LKR govt bond, 01.07.2037 quoted 11.75/85 on 2026-08-31
    lkr_min: 0.1180
    dfi_nominal: 0.1180
    dfi_min: 0.1180
    usd_nominal: 0.1180
    usd_commercial_min: 0.1180
  target_dscr: 1.3
  min_dscr: 1.2
  reserves:
    dsra_months: 6
  fees:
    upfront_pct: 0.01
  enforce_hard_covenants: false

returns:
  project_life_years: 15
  project_discount_rate: 0.12
  equity_discount_rate: 0.15

constraints:
  max_debt_ratio: 0.8
  warn_debt_ratio: 0.75
  min_dscr_covenant: 1.3
  target_dscr: 1.35
  warn_dscr: 1.25
  max_balloon_pct: 0.1
  warn_balloon_pct: 0.05
  max_tenor_years: 15
  warn_tenor_years: 14
  max_interest_rate: 0.25
  min_interest_rate: 0.0
  lender_type: Commercial
  jurisdiction: Sri Lanka
  fail_on_covenant_breach: false
  fail_on_large_balloon: false

# DELIVERY TIMELINE. RFP Vol I cl. 1.4 Project Milestones Schedule, not an assumption:
# Letter of Award 29-Sep-2026, acceptance 06-Oct-2026, ESA signing 06-Nov-2026, Financial
# Closure 06-Jan-2027 (within 2 months of ESA signing) and Commissioning, Testing & COD
# 06-May-2027 (within 6 months of ESA signing). Financial close to COD is FOUR MONTHS.
# `Financing_Terms.construction_years` is the binding key — finance/debt_v14.py reads it
# there and DEFAULTS TO 2 when absent, which is what these files were silently running,
# and finance/equity_distribution_v14_hydra.py prepends that many zero years to the equity
# return vector. The `timeline` block below does not feed the debt engine.
timeline:
  ppa_to_fc_years: 0
  construction_years: 1
  ops_years: 15
  lifetime_years: 16

wacc:
  mode: build_up
  drives_discount_rate: true
  cost_of_equity: 0.15
  prudential_spread_bps: 100
  description: "Build-up WACC drives the project discount rate."

# ═════════════════════════════════════════════════════════════════════════════
# MONTE CARLO — 5,000 trials. Engine contract is a LIST of {name, low, high, distribution}
# with dotted config paths; every name below resolves in this file.
# ═════════════════════════════════════════════════════════════════════════════
monte_carlo:
  n_scenarios: 5000
  seed: 42
  parameters:
    # Equipment price is the dominant uncertainty — the bid data fixes revenue, not cost.
    - name: capex.usd_total
      low: 66529971
      high: 99794957
      distribution: triangular
    - name: opex.usd_per_year
      low: 1585519
      high: 2748233
      distribution: triangular
    # Spot over the bid-closing-to-ESA-signing window only (about one month), not the term.
    - name: fx.start_lkr_per_usd
      low: 318.0
      high: 338.0
      distribution: normal
    # Availability below 97% is penalised at TWICE the shortfall and sits outside the 20%
    # monthly LD cap, so the downside tail here is real revenue loss.
    - name: generation.technologies.bess_unit.revenue.availability_factor
      low: 0.90
      high: 1.00
      distribution: triangular
    # Rupee credit spread over the sovereign benchmark.
    - name: Financing_Terms.rates.lkr_nominal
      low: 0.1180
      high: 0.1450
      distribution: uniform
  var_confidence: 0.95
  cvar_confidence: 0.95
  percentiles: [5, 10, 25, 50, 75, 90, 95]
  min_dscr_covenant: 1.2
  min_llcr_covenant: 1.25

metadata:
  version: '1.0'
  last_updated: '2026-09-06'
  author: DutchBay analysis
  review_status: >-
    Derived from opened bid prices in a live, unawarded tender. Revenue is bid data.
    The equipment cost line is sourced — a quoted OEM price on the `upside`, `base` and
    `stress` variants, and the bid-implied ceiling on `bidimplied`, which is a ceiling
    and not a cost estimate. Balance of plant, augmentation and the land percentage
    remain judgement. Bid opening only — no award has been made.
  sprint: 'NSO 250MW LTL consolidated case'
