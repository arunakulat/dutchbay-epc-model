# ═══════════════════════════════════════════════════════════════════════════════
# DutchBay 150 MW Solar-only — Lender Case (tech-comparison column, #821)
# ═══════════════════════════════════════════════════════════════════════════════
# Version: 1.0 (a solar-only lender column for the #745/#821 cross-technology table)
# Path: scenarios/dutchbay_solar_only_2025Q4.yaml
#
# A 150 MWac utility-scale fixed-tilt PV plant at the same Kalpitiya site, on the
# SAME lender debt/tax/FX/WACC stack as the wind lendercase and the hybrid case, so
# the tech-comparison table compares like-for-like project structures across the
# technology axis only. This is a COMPARISON scenario (a bankable-input column for the
# #821 4-way table), NOT the committed 5th-gen canon — it does not touch the wind
# lendercase pins.
#
# GENERATION (single tech, M3 per-tech finance): one `solar` technology at 150 MWac,
# CF 0.1685 (the same pvlib-modelled P50 on the frozen PVGIS TMY that the hybrid's
# 50 MW solar split uses; #529 SOLAR-6/12 re-baseline). project.capacity_mw ×
# capacity_factor reconciles to the per-tech sum (engine-enforced, ±1%):
#   solar 150 MW × 0.1685 = 25.275 ; project 150 MW × 0.1685 = 25.275  ✓
#
# CAPEX: $1,000/kW → $150M ($800/kW module/BOS PV stack + inverters/grid/land, SL
# utility-scale; benchmark IRENA 2024 SL utility PV ~$800/kW, plus interconnection).
# TARIFF: 20.3 LKR/kWh flat (the CEB standardized-PPA basis the wind/hybrid cases use).
#
# Usage:
#   python run_full_pipeline_v14.py config=scenarios/dutchbay_solar_only_2025Q4
# ═══════════════════════════════════════════════════════════════════════════════

project:
  name: "DutchBay Solar-only 150 MW"
  location: "Dutch Bay, Kalpitiya, Puttalam District, North Western Province, Sri Lanka"
  # Single-tech solar plant. Per-technology generation (its own CF and degradation) is
  # declared in `generation:` below, summed by the cashflow (M3). capacity_mw /
  # capacity_factor are the reconciling headline (engine cross-checks vs the per-tech
  # sum within 1%): 0.1685 = (150 * 0.1685) / 150.
  capacity_mw: 150.0
  capacity_factor: 0.1685  # net P50 fixed-tilt CF (pvlib-modelled on the frozen PVGIS TMY; #529)
  # INCREMENTAL financed grid-curtailment haircut (default 0.0 -> byte-identical). PV has
  # no wind wake/availability decay; the physical PV loss stack is in resource.solar.
  curtailment_pct: 0.0
  degradation: 0.4  # annual production degradation (0.4%/yr module aging)
  life_years: 20
  cod_year: 2027
  developer: "DutchBay Wind Power Pvt Ltd"
  grid_poi: "Puttalam 220kV Substation"

  boi_approved: false
  boi_agreement_date: '2025-01-15'
  jurisdiction: Sri Lanka

# ═════════════════════════════════════════════════════════════════════════════
# MULTI-TECHNOLOGY GENERATION (M3 — true per-tech finance; single solar tech)
# ═════════════════════════════════════════════════════════════════════════════
# The cashflow sums per-tech generation. Single solar tech: its own CF (0.1685) and
# degradation (0.4%/yr). aep_gwh / capex_usd / availability_pct drive the lender
# per-tech reporting split. Year-1 generation reconciles with project.capacity_mw *
# capacity_factor (engine-enforced, ±1%): 150 * 0.1685 = 25.275 = 150 * 0.1685 ✓.
generation:
  technologies:
    solar:
      capacity_mw: 150.0
      capacity_factor: 0.1685     # net P50 fixed-tilt, Kalpitiya (pvlib-modelled P50 on frozen PVGIS TMY; #529)
      degradation_pct: 0.4        # 0.4%/yr module aging (percent, /100 by the engine)
      aep_gwh: 221.4              # 150 MW * 8760 * 0.1685 (net P50 AEP, reporting)
      capex_usd: 150000000        # $1,000/kW x 150 MW (module/BOS + inverters/grid/land)
      availability_pct: 99.0

# ═════════════════════════════════════════════════════════════════════════════
# RESOURCE ASSESSMENT & LOSSES (solar)
# ═════════════════════════════════════════════════════════════════════════════
resource:
  uncertainty:
    p50_haircut_pct: 0.0  # the solar P50 already carries its TMY-modelled loss stack (no wind over-prediction haircut)

  # OPTIONAL pvlib solar producer (the [solar] extra). The financed run uses the declared
  # P50 generation.technologies.solar.capacity_factor (0.1685); this block lets the
  # solar_resource.pv_producer compute a physics-grounded CF to VALIDATE that P50 (never
  # overwrite it). On the FROZEN PVGIS TMY (tmy_path) the pvlib model yields CF 0.1685 —
  # the declared P50 (#529 SOLAR-6/12 re-baseline).
  solar:
    latitude: 8.27               # PV array centroid, Kalpitiya
    longitude: 79.75
    timezone: "Asia/Colombo"
    altitude_m: 5.0
    annual_ghi_kwh_m2: 2000.0    # informational when tmy_path is set (TMY GHI ~1871 governs)
    dc_capacity_mw: 180.0        # DC nameplate (MWp) at 1.2 DC/AC ratio over 150 MWac
    tilt_deg: 8.0                # fixed tilt near site latitude (low-latitude tropics)
    azimuth_deg: 180.0           # equator-facing (N hemisphere)
    dc_ac_ratio: 1.2             # inverter loading ratio
    system_loss_pct: 14.0        # soiling/wiring/mismatch/availability stack
    # SOLAR-6/12 (#529): FROZEN PVGIS TMY (lat 8.27, lon 79.75) — hourly GHI/DNI/DHI +
    # hourly ambient temp/wind for Faiman. Drives the re-baselined 0.1685 P50.
    tmy_path: "inputs/solar_tmy/kalpitiya_pvgis_tmy_8.27N_79.75E.csv"

# ═════════════════════════════════════════════════════════════════════════════
# PPA / TARIFF (flat LKR CEB standardized PPA — same basis as wind/hybrid)
# ═════════════════════════════════════════════════════════════════════════════
ppa:
  primary_currency: "LKR"  # informational only; must equal "LKR"
  ppa_term_years: 20
  tariff_type: "fixed"
  indexation_start_year: 2
  cpi_annual_pct: 2.0
  offtaker: "Ceylon Electricity Board (CEB)"
  offtaker_credit_rating: "B+ (S&P)"
  payment_terms_days: 30
  revenue_guarantee:
    enabled: false
    guarantee_pct: 0.75
    penalty_rate_same_currency: 5.0

tariff:
  lkr_per_kwh: 20.3
  tariff_type: fixed
  ppa_term_years: 20

# ═════════════════════════════════════════════════════════════════════════════
# FX INTEGRATION (USD debt + LKR revenue — inherited lender stack)
# ═════════════════════════════════════════════════════════════════════════════
fx:
  enabled: true
  mode: "deterministic"
  base_currency: "USD"
  quote_currency: "LKR"
  rates:
    lkr_per_usd: 333.79
    lkr_per_eur: 330.0
    lkr_per_cny: 41.7
    usd_per_eur: 1.10
  source:
    mode: "fixed"
    provider: "open_er_api"
    endpoint: "https://open.er-api.com/v6/latest/USD"
    reference_url: "https://www.cbsl.gov.lk/en/rates-and-indicators/exchange-rates/daily-indicative-usd-spot-exchange-rates"
    pinned_rate: 333.79
    pinned_as_of: "2026-06-20T00:02:31Z"
    drift_tolerance_pct: 5.0
  start_lkr_per_usd: 333.79
  annual_depr: 0.0589
  uncertainty_pct: 0.05
  exposure_summary:
    usd_debt_principal: 60000000
    lkr_revenue_pct: 100.0
    fx_mismatch: "Material - requires hedging or sculpted debt service"

# ═════════════════════════════════════════════════════════════════════════════
# CAPEX & OPEX
# ═════════════════════════════════════════════════════════════════════════════
capex:
  cost_basis_year: 2026
  estimate_class: 3
  usd_total: 150000000  # $1,000/kW x 150 MWac (module/BOS + inverters/grid/land)
  capex_per_kw_usd: 1000

opex:
  usd_per_year: 1500000  # ~$10/kW-yr x 150 MW (PV O&M is lighter than wind)
  opex_per_kw_yr_usd: 10.0
  breakdown:
    om_contract_usd: 900000   # inverter/panel O&M + cleaning
    insurance_usd: 300000     # property + BI
    land_lease_usd: 200000    # PV footprint lease
    admin_usd: 100000         # SPV overhead

# ═════════════════════════════════════════════════════════════════════════════
# TAX & STATUTORY (inherited SL regime)
# ═════════════════════════════════════════════════════════════════════════════
tax:
  corporate_tax_rate: 0.30
  tax_holiday_route: none
  tax_holiday_years: 0
  tax_holiday_start_year: 1
  depreciation_method: straight_line
  depreciation_years: 5
  depreciation_start_year: 1
  plant_capex_share: 0.80
  plant_depreciation_years: 5
  civil_depreciation_years: 20
  enhanced_capital_allowance_multiple: 1.5
  enhanced_allowance_applies: false
  loss_carryforward_years: 6
  wht_on_interest_to_nonresidents: 0.1
  wht_on_interest_enabled: true
  wht_gross_up: false
  wht_on_dividends: 0.15
  wht_on_dividends_enabled: true
  capitalize_idc_in_depreciable_base: true
  interest_deductibility: true

statutory:
  success_fee_pct: 0.0
  env_surcharge_pct: 0.0
  social_services_levy_pct: 0.025

risk_adjustment:
  cfads_haircut_pct: 0.1

# ═════════════════════════════════════════════════════════════════════════════
# DEBT STRUCTURE (inherited lender multi-currency stack)
# ═════════════════════════════════════════════════════════════════════════════
Financing_Terms:
  debt_ratio: 0.7
  debt_sizing: dual_dscr
  dscr_p99_downside_factor: 0.80
  bind_downside: true
  downside_aep_source: p90
  balloon_treatment: cash_sweep
  tenor_years: 15
  interest_only_years: 2
  amortization_style: auto
  interest_rate_nominal: 0.08
  mix:
    lkr_max: 0.45
    dfi_max: 0.1
    usd_commercial_min: 0.45
  rates:
    lkr_nominal: 0.1339
    lkr_min: 0.1339
    dfi_nominal: 0.065
    dfi_min: 0.065
    usd_nominal: 0.075
    usd_commercial_min: 0.075
  target_dscr: 1.3
  min_dscr: 1.2
  reserves:
    dsra_months: 6
    receivables_guarantee_months: 9
  use_revenue_guarantee: false
  guarantee_revenue_pct: 0.0075
  fees:
    upfront_pct: 0.01
  enforce_hard_covenants: false

# ═════════════════════════════════════════════════════════════════════════════
# RETURNS / COVENANTS
# ═════════════════════════════════════════════════════════════════════════════
returns:
  project_life_years: 20
  project_discount_rate: 0.1
  equity_discount_rate: 0.12

constraints:
  max_debt_ratio: 0.8
  warn_debt_ratio: 0.75
  min_dscr_covenant: 1.3
  target_dscr: 1.35
  warn_dscr: 1.25
  max_balloon_pct: 0.1
  warn_balloon_pct: 0.05
  refinancing:
    enabled: true
    max_refinance_pct: 0.1
    refinance_rate_premium: 0.02
    refinance_tenor_years: 3
    requires_documentation: true
  max_tenor_years: 20
  warn_tenor_years: 18
  max_interest_rate: 0.25
  min_interest_rate: 0.0
  lender_type: DFI
  jurisdiction: Sri Lanka
  fail_on_covenant_breach: false
  fail_on_large_balloon: false

# ═════════════════════════════════════════════════════════════════════════════
# MONTE CARLO & SENSITIVITY
# ═════════════════════════════════════════════════════════════════════════════
monte_carlo:
  enabled: true
  n_scenarios: 100000
  sampler: lhs
  seed: 42
  parameters:
    - name: project.capacity_factor   # base 0.1685, rel_std 0.05 -> +/-10%
      low: 0.15165
      high: 0.18535
      distribution: uniform
    - name: tariff.lkr_per_kwh        # base 20.3, rel_std 0.10 -> +/-20%
      low: 16.24
      high: 24.36
      distribution: uniform
    - name: opex.usd_per_year         # base 1.5e6, rel_std 0.15 -> +/-30%
      low: 1050000.0
      high: 1950000.0
      distribution: uniform
    - name: capex.usd_total           # base 150e6, rel_std 0.08 -> +/-16%
      low: 126000000.0
      high: 174000000.0
      distribution: uniform
    - name: fx.start_lkr_per_usd      # base 333.79, rel_std 0.05 -> +/-10%
      low: 300.0
      high: 367.0
      distribution: uniform
  var_confidence: 0.95
  cvar_confidence: 0.95
  percentiles: [10, 25, 50, 75, 90]
  min_dscr_covenant: 1.2
  min_llcr_covenant: 1.25
  output_path: "outputs/mc_solar_dutchbay_100k.parquet"

# ═════════════════════════════════════════════════════════════════════════════
# PIPELINE / TIMELINE
# ═════════════════════════════════════════════════════════════════════════════
pipeline:
  output_dir: "outputs/dutchbay_solar_only_2025Q4"
  seed: 42
  export_scenarios: true
  export_provenance: true

timeline:
  ppa_to_fc_years: 1
  construction_years: 2
  ops_years: 20
  lifetime_years: 22

# ═════════════════════════════════════════════════════════════════════════════
# EXPECTED RESULTS (for pipeline validation)
# ═════════════════════════════════════════════════════════════════════════════
expected_results:
  # Solar-only bankable AEP for the 150 MWac plant = 150 MW * 8760 * 0.1685 = 221.4 GWh
  # (net P50, pvlib-modelled on the frozen PVGIS TMY; #529). The aep_reconciliation guard
  # cross-checks this against capacity_mw * capacity_factor so a stale headline cannot creep in.
  net_aep_p50_gwh: 221.4   # 150 MW * 8760 * 0.1685
  net_aep_p90_gwh: 199.0   # P90-1yr (IEA-PVPS Task 13 budget, sigma ~7.65%); binds debt (bind_downside)
  capacity_factor: 0.1685

# ═════════════════════════════════════════════════════════════════════════════
# METADATA
# ═════════════════════════════════════════════════════════════════════════════
metadata:
  version: '1.0'
  last_updated: '2026-07-06'
  author: DutchBay V14 Financial Modeling Team
  review_status: Draft - tech-comparison column (#821)
  assumptions_source: 'Derived from the hybrid lendercase solar split (#529 re-baseline)'
  sprint: 'Tech-comparison 4-way (#821 / #745 follow-up)'

# ═════════════════════════════════════════════════════════════════════════════
# WACC (build-up — same basis as wind/hybrid)
# ═════════════════════════════════════════════════════════════════════════════
wacc:
  mode: build_up
  drives_discount_rate: true
  cost_of_equity: 0.12
  prudential_spread_bps: 100
  description: "Build-up WACC drives the discount rate (solar-only comparison column)."
