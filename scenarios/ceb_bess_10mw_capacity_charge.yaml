# ═══════════════════════════════════════════════════════════════════════════════
# CEB Standalone BESS — 10 MW / 40 MWh unit (capacity-charge tender)
# ═══════════════════════════════════════════════════════════════════════════════
# Models ONE 10 MW / 40 MWh AC-capacity unit of the CEB distributed standalone-BESS
# tender (TR/REP&PM/ICB/2025/003/C: 16 units = 160 MW / 640 MWh, 0.25C / 4-hour, one
# per 33 kV grid substation, Build-Own-Operate, 15-year term).
#
# REVENUE MODEL — CAPACITY CHARGE (availability tolling), NOT energy sales.
#   A BESS is not a generation source (no capacity factor / AEP). Under this tender the
#   Seller is paid a flat Capacity Charge R (LKR/MW/month), fixed for 15 years with NO
#   escalation, and CEB dispatches the asset. There is no per-kWh energy revenue. The
#   engine's `type: bess` path (finance/bess_revenue.py) books this as:
#     annual_lkr = R x power_mw x 12 x availability_factor x dispatchable_ratio
#   This is DISTINCT from two other CEB BESS structures: (1) a BESS charged by an
#   existing solar PV plant, paid an energy tariff for night-peak export (an energy /
#   time-shift model); and (2) the Kolonnawa 100 MW single-site project, which is a
#   CEB-OWNED night-peak supply procured via an EPC contract for the batteries +
#   ancillaries — a construction-margin deal (EPC price - build cost), NOT an operational
#   tolling/tariff stream, so it does not belong on this operational cashflow path.
#
# STORAGE-ONLY: there is no generation, so `tariff.lkr_per_kwh` is 0.0 and the nominal
# `project.capacity_factor` is a validation placeholder only (it earns nothing). All
# revenue is the BESS capacity charge.
# ═══════════════════════════════════════════════════════════════════════════════

project:
  name: "CEB Standalone BESS 10MW/40MWh (capacity charge)"
  location: "Designated CEB 33 kV grid substation, Sri Lanka (one of 16 tender sites)"
  capacity_mw: 10.0           # BESS contracted power (MW)
  capacity_factor: 0.0         # storage-only: no generation CF (revenue is the BESS capacity charge)
  degradation: 0.0            # generation degradation N/A (storage; see BESS dispatchable_ratio)
  life_years: 15             # matches the 15-year tender operational term
  cod_year: 2027
  developer: "DutchBay Storage SPV (illustrative)"
  jurisdiction: Sri Lanka
  boi_approved: false

# ═════════════════════════════════════════════════════════════════════════════
# MULTI-TECHNOLOGY — a single BESS (type: bess) earning a capacity charge
# ═════════════════════════════════════════════════════════════════════════════
generation:
  technologies:
    bess_unit:
      type: bess               # explicit class discriminator (storage, not generation)
      power_mw: 10.0           # contracted power rating (MW)
      energy_mwh: 40.0         # 4-hour duration (40 MWh / 10 MW = 0.25C)
      duration_h: 4.0
      capex_usd: 5000000       # reporting split; the financed capex is capex.usd_total below
      availability_pct: 97.0   # contractual availability target (reporting)
      revenue:
        model: capacity_charge
        # R = bid Capacity Charge Rate (LKR/MW/month). ILLUSTRATIVE: the real R is the
        # competitive bid variable; the CEB Addendum-A calculator's worked example used
        # 20,000,000 LKR/MW/month. 2,500,000 here gives a marginal/illustrative deal.
        capacity_charge_lkr_per_mw_month: 2500000
        contract_years: 15      # paid flat for the 15-year term, no escalation
        availability_factor: 1.0   # 1.0 = meets the >=97% monthly availability guarantee
        dispatchable_ratio: 1.0    # ADSC/MDSC (<=1); 1.0 = BESS augmented/sized to hold MDSC
        # MDSC state-of-health fade (#470d): the BESS loses usable capacity over the tender
        # life, so the capacity charge it can hold declines year-over-year (revenue is
        # R x power x 12 x ... x soh(t)). 0.011/yr (~1.1%) is a conservative-LOW LFP estimate
        # for a 1-cycle/day, moderate-DoD, thermally-managed system — field LFP averages
        # 2-3%/yr, so carry a 2-3%/yr downside sensitivity. The fade is NET of the static MDSC
        # reservation, which dispatchable_ratio carries separately (no double-count).
        mdsc_fade_pct_annual: 0.011
        # Year-10 cell augmentation restoring SoH to nameplate (restore_to_soh: 1.0). HONEST
        # SoH-gap cost, NOT a full replacement: by operating year 10 SoH has faded to
        # (1-0.011)^9 = 0.9052, a 9.475% shortfall = 3.79 MWh of the 40 MWh pack. Replacing only
        # the lost cells at a year-10 LFP unit price (~$120/kWh; NREL ATB 2024 / Lazard LCOS):
        #   0.09475 x 40,000 kWh x $120/kWh = ~$455,000.
        # (The directional unit test injects $5M = a full-replacement stress amplitude, ~11x the
        # honest top-up; the committed scenario uses the marginal cell-replacement cost.)
        augmentation_schedule:
          - year: 10
            capex_usd: 455000
            restore_to_soh: 1.0

# ═════════════════════════════════════════════════════════════════════════════
# TARIFF — storage-only: zero generation revenue (all revenue is the capacity charge)
# ═════════════════════════════════════════════════════════════════════════════
tariff:
  lkr_per_kwh: 0.0            # storage-only: no energy sales
  tariff_type: fixed
  ppa_term_years: 15

# ═════════════════════════════════════════════════════════════════════════════
# CAPEX & OPEX (LFP, 2026 ex-China/US benchmark ~ $125/kWh turnkey; ~2%/yr opex)
# ═════════════════════════════════════════════════════════════════════════════
capex:
  cost_basis_year: 2026
  estimate_class: 3
  usd_total: 5000000          # 40,000 kWh x ~$125/kWh (Ember ex-China/US turnkey benchmark)
  capex_per_kw_usd: 500       # 5,000,000 / 10,000 kW

opex:
  usd_per_year: 100000        # ~2% of capex (~$2.5/kWh/yr, Ember; excl. augmentation)
  opex_per_kw_yr_usd: 10.0
  escalation_pct: 0.0

# ═════════════════════════════════════════════════════════════════════════════
# TAX & STATUTORY (current SL regime — same stack as the wind/hybrid lender case)
# ═════════════════════════════════════════════════════════════════════════════
tax:
  corporate_tax_rate: 0.30
  tax_holiday_route: none
  tax_holiday_years: 0
  tax_holiday_start_year: 1
  depreciation_method: straight_line
  depreciation_years: 5
  depreciation_start_year: 1
  plant_capex_share: 0.90        # BESS is overwhelmingly plant & machinery (5-yr class)
  plant_depreciation_years: 5
  civil_depreciation_years: 20
  enhanced_capital_allowance_multiple: 1.5
  enhanced_allowance_applies: false
  loss_carryforward_years: 6
  wht_on_interest_to_nonresidents: 0.1
  wht_on_interest_enabled: true
  wht_gross_up: false
  # SL statutory dividend WHT 15% (#81) + capitalize debt IDC into the
  # depreciable tax base (#36/#75). Both bite the equity path only.
  wht_on_dividends: 0.15
  wht_on_dividends_enabled: true
  capitalize_idc_in_depreciable_base: true
  interest_deductibility: true

statutory:
  success_fee_pct: 0.0  # non-statutory levy — not in the SL regime; zeroed (#43)
  env_surcharge_pct: 0.0  # non-statutory levy — not in the SL regime; zeroed (#43)
  social_services_levy_pct: 0.025    # SSCL on revenue (here, on the capacity charge)

risk_adjustment:
  cfads_haircut_pct: 0.1

# ═════════════════════════════════════════════════════════════════════════════
# FX (LKR-primary; capacity charge is LKR-denominated, matching the tender)
# ═════════════════════════════════════════════════════════════════════════════
fx:
  enabled: true
  mode: deterministic
  base_currency: USD
  quote_currency: LKR
  rates:
    lkr_per_usd: 333.79
  start_lkr_per_usd: 333.79
  annual_depr: 0.0589  # data-derived LKR depreciation (BIS 2005-2026 long-run, analytics.fx.fx_calibration; was hand-set 3%)
  uncertainty_pct: 0.05

# ═════════════════════════════════════════════════════════════════════════════
# DEBT (same multi-currency dual-DSCR stack as the lender case)
# ═════════════════════════════════════════════════════════════════════════════
Financing_Terms:
  debt_ratio: 0.7
  debt_sizing: dual_dscr
  dscr_p99_downside_factor: 0.80
  balloon_treatment: cash_sweep
  tenor_years: 12
  interest_only_years: 1
  amortization_style: auto
  interest_rate_nominal: 0.08
  mix:
    lkr_max: 0.45
    dfi_max: 0.1
    usd_commercial_min: 0.45
  rates:
    lkr_nominal: 0.1339  # UIP-implied: USD 7.5% + 5.89% LKR drift (#3, PR B)
    lkr_min: 0.1339
    dfi_nominal: 0.065
    dfi_min: 0.065
    usd_nominal: 0.075
    usd_commercial_min: 0.075
  target_dscr: 1.3
  min_dscr: 1.2
  reserves:
    dsra_months: 6
  fees:
    upfront_pct: 0.01
  enforce_hard_covenants: false

returns:
  project_life_years: 15
  project_discount_rate: 0.1
  equity_discount_rate: 0.12

constraints:
  max_debt_ratio: 0.8
  warn_debt_ratio: 0.75
  min_dscr_covenant: 1.3
  target_dscr: 1.35
  warn_dscr: 1.25
  max_balloon_pct: 0.1
  warn_balloon_pct: 0.05
  max_tenor_years: 15
  warn_tenor_years: 14
  max_interest_rate: 0.25
  min_interest_rate: 0.0
  lender_type: DFI
  jurisdiction: Sri Lanka
  fail_on_covenant_breach: false
  fail_on_large_balloon: false

timeline:
  ppa_to_fc_years: 1
  construction_years: 1
  ops_years: 15
  lifetime_years: 16

wacc:
  mode: build_up
  drives_discount_rate: true
  cost_of_equity: 0.12
  prudential_spread_bps: 100
  description: "Build-up WACC drives the project discount rate."

metadata:
  version: '1.0'
  last_updated: '2026-06-24'
  author: DutchBay V14 Financial Modeling Team
  review_status: Illustrative — capacity charge rate is a placeholder bid value
  sprint: 'BESS capacity-charge model'
