# ═══════════════════════════════════════════════════════════════════════════════
# Blue Whale Solar + BESS project (Lot 5B, Kalpitiya): 5.66552 MWp / 5.0 MW AC PV with a 5.0 MW / 20.0 MWh BESS
# ═══════════════════════════════════════════════════════════════════════════════
# Version: 0.3 (SKELETON: screening placeholders, not a basis for any decision)
# Path: scenarios/blue_whale_solar_bess_lot5b_2026.yaml
#
# A SEPARATE PROJECT (owner, 2026-11-01, #1353 comment 6556854201): "We will therefore
# consider the 10mw turbine separately from the solar+bess. It will be a separate project that
# will preceed the solar+BESS. Maximize BESS now within the solar+BESS parameters in order to
# gain the maximum benefit from the PUCSL evening tariff band". Objective "Max value, MC
# decides (Recommended)"; 10 MW reading "Model both, flag it"; turbine "Separate, risk
# flagged". The turbine is scenarios/blue_whale_wind_lot5b_2026.yaml, built first. The
# combined view scenarios/blue_whale_hybrid_lot5b_2026.yaml is superseded.
#
# PUCSL 2026 RULES (frozen with sources in conf/blue_whale_pucsl_fit_2026.yaml):
#   - the BESS discharges for 4 h at its nominal capacity, so energy = 4 x power, read as the
#     energy a full battery delivers (methodology s.5.1.1, s.5.2.1.1, s.5.2.1.2, s.5.1.2);
#   - it charges only from the co-located PV (s.5.1) and discharges only in the Prioritized
#     Feed-in Time, 17:30-21:30 (consultation July 2026, Table 3 note), at 50.10 LKR/kWh for
#     15 years; every other kWh earns 20.72 (Annex 2, effective 25 Aug 2026).
#   - The 05:30-07:30 window of v0.5 of the hybrid drops out. The earlier owner decision
#     ("Use the 17:30 - 21:30 window and add another 05:30 to 07:30 window for the remaining
#     2 hours. The priority rate will only apply to the evening window") gave it the remaining
#     2 hours of a 6 h battery; a 4 h battery has none. Superseded by the decisions above.
#
# THE BATTERY IS THE OWNER'S STRATEGIC CHOICE, NOT THE VALUE-BASED SIZE (v0.3, PR 7). Owner
# decisions of 2026-11-01 (#1353 comment 6563070978), verbatim: committed size "Fix 5 MW / 20 MWh";
# objective "After-tax project NPV (Recommended)". The project commits BESS 5.0 MW / 20.0 MWh
# (4 h) with PV AC 5.0 MW, so reading A of the 10 MW limit sits AT its limit (5.0 + 5.0 = 10.0).
# The PV DC is chosen for that battery on the P50 after-tax project NPV (the engine's, through
# analytics.evaluation_v14.evaluate_with_overrides) by conf/blue_whale_solar_bess_fixed_bess_sizing.yaml
# (seed 20261101, 256 trials, every table count from 134 to the lot's 191; result
# docs/blue_whale/solar_bess_fixed_bess_sizing_summary.json): 151 tables, 5.66552 MWp, DC/AC 1.1331.
# After-tax project NPV P50 USD -5,326,884, P90 -5,911,801; no project IRR in any trial; unit
# pre-tax NPV P50 -829,383, P90 -1,421,478.
# COST OF THE CHOICE: the value-based size under the same objective (full grid, the same seed
# and trials) is 107 tables, 3.5 MW AC and 1.0 MW / 4.0 MWh, at P50 USD -4,079,718 and P90
# -4,321,796. Committing 5 MW / 20 MWh gives up USD 1,247,165 of after-tax project NPV at P50
# and USD 1,590,005 at P90 (unit pre-tax NPV: 516,754 and 850,165). Recorded in
# conf/blue_whale_solar_bess_fixed_bess_sizing.yaml (strategic_cost_usd) and checked by a test.
# Every eligible size on both grids has a negative after-tax project NPV at P50.
#
# RE-SIZED IN v0.2 (PR 6, #1353 comment 6556975196) on the BLENDED prices of
# conf/blue_whale_pv_bess_pricing.yaml (BESS all-in 129.13 / 140.74 / 202.51 USD per kWh
# contracted, from conf/blue_whale_capex_solar_resource.yaml; PV unchanged). The same run (seed
# 20261101, 325 points x 256 trials) now chooses 107 tables (4.01464 MWp), 3.5 MW AC and a
# 1.0 MW / 4.0 MWh BESS under BOTH readings: the smallest PV and the smallest battery on the grid.
# Every eligible size has a negative P50 unit NPV (this size: USD -312,629; P90 -571,313). The
# BESS capex is a blend that includes private commercial inputs; a reader may be able to back out
# a private input. Published on the owner's decision of 2026-11-01 (#1353 comment 6556975196).
# v0.1 (PR 4, NSO 250 price 135.00) chose 160 tables, 5.0 MW AC and 4.5 MW / 18 MWh. v0.3 (PR 7)
# replaces v0.2's size with the owner's battery above.
#
# SIZED by a seeded Monte Carlo (PR 4; scripts/run_blue_whale_pv_bess_sizing_v14.py
# --config-name blue_whale_solar_bess_project_sizing, conf/blue_whale_solar_bess_project_sizing.yaml,
# result docs/blue_whale/solar_bess_project_sizing_summary.json): 325 sizes of PV DC
# (up to the placeholder lot's maximum with the turbine kept), PV AC and BESS power, each with
# PR 3's 256 LHS trials (seed 20261101), under reading A of the 10 MW limit (PV AC + BESS
# power <= 10 MW), the conservative reading. From PR 7 that full grid ranks on the P50 after-tax
# project NPV and gives the value-based size above; the committed size is the owner's. Reading B's choice
# (export <= 10 MW) is reported in docs/blue_whale/STATUS.md, not committed. The fields below
# are that size's base case (every price at its mode, yield 1, RTE 0.85, no residual fade).
#
# OPEN LEGAL RISK: THE 10 MW LIMIT. The Electricity Act No. 36 of 2024, s.11(3) proviso:
# "the maximum capacity of such renewable energy plants to be procured from a contiguous
# location using standard power purchase agreements on cumulative basis shall not exceed
# 10 MW". The 9.5 MW turbine of the wind project stands on the same lot. If the two projects
# count cumulatively as one contiguous location, this project's capacity is added to the
# turbine's 9.5 MW and the pair exceeds 10 MW under either reading. Which of readings A and B
# is right, and whether the turbine counts, are open questions for PUCSL, the NSO or counsel.
#
# PLACEHOLDER SITE. No survey of the lot exists (input B03); the land fit rests on PR 1's
# assumed square lot with the turbine at the coastal setback.
#
# EVERY VALUE BELOW IS A PLACEHOLDER unless its comment says otherwise. The finance blocks are
# the hybrid's (scenarios/blue_whale_hybrid_lot5b_2026.yaml v0.6), copied where they apply.
# The inputs register is docs/blue_whale/INPUTS_REQUIRED.md.
# ═══════════════════════════════════════════════════════════════════════════════

project:
  name: "Blue Whale Solar + BESS (Lot 5B)"
  location: "Lot 5B Plan 3641, Mutuwal, GN Dutch Bay 633, Kalpitiya DS, Puttalam District, North Western Province, Sri Lanka"
  capacity_mw: 5.0            # generation nameplate: the PV AC (the BESS power is not in it, as in the hybrid)
  capacity_factor: 0.169929     # = the solar block's CF (the only generation block); v0.2 0.191179, v0.1 0.182870
  curtailment_pct: 0.0
  degradation: 0.5                  # PLACEHOLDER (input B12)
  life_years: 20                    # PLACEHOLDER (input F01): SPPA term
  cod_year: 2029                    # PLACEHOLDER (input B30): after the wind project (owner: the turbine "will preceed the solar+BESS")
  developer: "Blue Whale Limited (project company to be confirmed)"   # input B01
  grid_poi: "TBD: CEB grid substation and voltage not yet identified"  # input B25
  boi_approved: false               # input F30
  jurisdiction: Sri Lanka

generation:
  technologies:
    # The engine has one generation tariff and per-BESS revenue, so the unit is carried in two
    # blocks (no engine code; solar_resource.pv_bess_dispatch):
    #   solar  = EVERYTHING the project exports (PV direct plus battery discharge), billed at
    #            the generation tariff, the 20.72 other-period rate;
    #   bess_1 = the priority PREMIUM (50.10 - 20.72 = 29.38) on the energy exported in the
    #            17:30-21:30 window, for the 15-year priority term.
    # Year 1 (base case, v0.3), hourly over the frozen TMY with PV at the warranted 99%: PV
    # 8,637.52 MWh; charge 7,964.25; discharge 6,769.61 (17:30-21:30 only); PV direct
    # 673.28 (33.68 in the window, 639.60 outside); curtailed 0.00;
    # export 7,442.89 MWh, of which 6,803.29 in the priority window; 338.5
    # equivalent full cycles; revenue LKR 354,097,246. (v0.2, 107 tables and 4 MWh: export
    # 5,861.53 MWh, 1,481.23 priority, revenue LKR 164,969,416; v0.1, 160 tables and 18 MWh:
    # export 8,009.72 MWh, 6,385.37 priority, revenue LKR 353,563,620.)
    solar:
      capacity_mw: 5.0        # AC: the PV inverters' active-power limit (v0.3, PR 7; v0.2 3.5). DC 5.66552 MWp
                                    # (151 tables of JinkoSolar Tiger Neo 3.0 670 W, DC/AC 1.133104); 17 x Huawei
                                    # SUN2000-330KTL-H1
      capacity_factor: 0.169929 # DERIVED: export 7,442.89 MWh / (5.0 MW x 8760 h), year 1 (v0.2 0.191179).
                                    # PV alone (frozen PVGIS-ERA5 TMY, 8 deg tilt, 14% losses, inverter 98.8%):
                                    # 8.7248 GWh before the warranted year-1 1%. Bifacial gain and
                                    # turbine shading (#1520) NOT modelled. Resource and cross-checks:
                                    # docs/blue_whale/CAPEX_AND_SOLAR_RESOURCE_METHODS.md
      degradation_pct: 0.392075  # DERIVED: geometric rate whose 20-year sum equals the dispatched export
                                      # under the Jinko warranty path (1% year 1, then 0.35%/yr linear); v0.2 0.377386
      aep_gwh: 7.44        # export, year 1 (reporting); v0.2 5.86
      capex_usd: 3455943       # CITED (input B15), PR 3's price modes of conf/blue_whale_pv_bess_pricing.yaml:
                                    # modules 0.110 FOB + 0.010 delivery, BoP/EPC 0.462 per Wp on 5.66552 MWp,
                                    # inverters 0.0311 per W on 17 x 300 kW (v0.2 2,448,480 on 4.01464 MWp)
      availability_pct: 99.0
    bess_1:
      type: bess
      power_mw: 5.0               # OWNER'S STRATEGIC CHOICE (v0.3, PR 7: "Fix 5 MW / 20 MWh"); v0.2 1.0 (PR 6's
                                    # value-based size, still the value-based size under the after-tax objective)
      energy_mwh: 20.0            # 4 x power: PUCSL 4 h at nominal capacity, the energy a full battery delivers
      duration_h: 4.0
      capex_usd: 2814800     # BLENDED (PR 6, input B19): USD 140.74/kWh all-in mode on 20.0 MWh (v0.3)
                                    # (conf/blue_whale_pv_bess_pricing.yaml, from conf/blue_whale_capex_solar_resource.yaml).
                                    # v0.2 562,960 on 4.0 MWh; v0.1 2,430,000 (USD 135.00/kWh, NSO 250 base, on 18.0 MWh)
      availability_pct: 97.0
      revenue:
        model: energy_tariff        # input F05: the PUCSL 2026 ground solar + BESS FiT, dispatched hourly
        tariff_lkr_per_kwh: 29.38   # 50.10 - 20.72 (Annex 2): the premium over the generation tariff
        cycles_per_year: 400.1935 # DERIVED (v0.3): priority-window export 6,803.29 MWh / (20.0 MWh x 0.85), year 1
                                    # (an engine mapping, not a cycle count: 338.5 true cycles). v0.2 435.6547
        round_trip_efficiency: 0.85 # repository value (NREL ATB 2024 basis, #588); the whole loss on charge.
                                    # PUCSL's 0.90 reference case is a sensitivity in the sizing summary
        availability_factor: 1.0
        contract_years: 15          # PUCSL methodology s.5.1, Annex 2 s.3 note [2]
        mdsc_fade_pct_annual: 0.0016798  # DERIVED (v0.3; v0.2 0.0000718): decline of the priority-window export as the PV degrades
                                        # (geometric rate matching its 15-year sum); no cell fade in the base
                                        # case (the price carries the NSO 250 augmentation reserve)

tariff:
  # Input F03: the PUCSL feed-in tariffs effective 25 Aug 2026 for plants < 10 MW (Annex 2),
  # ground solar + BESS: 20.72 (18.00 + 2.72) at other periods, which every exported kWh earns
  # here; bess_1 adds the 29.38 priority premium in 17:30-21:30 for 15 years. No wind, so no
  # blend. The O&M part's yearly indexation and the month-12 adjustment are not modelled.
  lkr_per_kwh: 20.72
  tariff_type: fixed            # input F04
  ppa_term_years: 20            # input F01: the hybrid's basis (the CEB standardised PPA draft, June 2025,
                                # 20 years from COD); the methodology's s.3.1 tariff rests on a 20-year cash flow

ppa:
  primary_currency: "LKR"
  ppa_term_years: 20
  tariff_type: "fixed"
  offtaker: "National System Operator (Private) Limited"   # input F02 (Gazette Extraordinary 2479/36)
  payment_terms_days: 30

fx:
  enabled: true
  mode: deterministic
  base_currency: USD
  quote_currency: LKR
  rates:
    lkr_per_usd: 333.79
  start_lkr_per_usd: 333.79     # 2026-Q2 pinned rate shared with the DutchBay cases (input F25 to refresh)
  annual_depr: 0.0              # held flat: fully LKR funded (owner, 2026-10-28), as the hybrid
  uncertainty_pct: 0.05

capex:
  cost_basis_year: 2026
  estimate_class: 5             # AACE Class 5 (concept screening)
  usd_total: 8270743    # solar 3455943 + BESS 2814800 + grid/civils/development 2.0M (PLACEHOLDER B26,
                                # the hybrid's whole line carried to each project: separate SPPAs, separate connections).
                                # v0.3; v0.2 5,011,440
  capex_per_kw_usd: 1654   # usd_total / 5.0 MW AC (BESS power not in the denominator); v0.2 1432

opex:
  usd_per_year: 256655        # PLACEHOLDER (inputs B16, B20, B28): solar USD 10/kWp-yr on 5.66552 MWp
                                # + BESS USD 2.5/kWh-yr on 20.0 MWh (PR 3's rates, not sourced)
                                # + insurance, land lease and SPV overhead 0.15M (the hybrid's line). v0.3; v0.2 200,146
  opex_per_kw_yr_usd: 51.3      # 256,655 / 5,000 kW (v0.2 57.2)
  escalation_pct: 5.0           # PLACEHOLDER (input B29): LKR O&M inflation at the CBSL 5% target

tax:
  corporate_tax_rate: 0.30      # input F31
  tax_holiday_route: none       # input F30 (BOI)
  tax_holiday_years: 0
  tax_holiday_start_year: 1
  depreciation_method: straight_line
  depreciation_years: 5
  depreciation_start_year: 1
  plant_capex_share: 0.85
  plant_depreciation_years: 5   # SL Fourth Sched Class 2 (plant & machinery)
  civil_depreciation_years: 20  # SL Fourth Sched Class 4 (buildings/civils)
  enhanced_capital_allowance_multiple: 1.5
  enhanced_allowance_applies: false
  loss_carryforward_years: 6
  wht_on_interest_to_nonresidents: 0.1
  wht_on_interest_enabled: true
  wht_gross_up: false
  wht_on_dividends: 0.15
  wht_on_dividends_enabled: true
  capitalize_idc_in_depreciable_base: true
  interest_deductibility: true

statutory:
  success_fee_pct: 0.0          # non-statutory levy, not in the SL regime (#43)
  env_surcharge_pct: 0.0        # non-statutory levy, not in the SL regime (#43)
  social_services_levy_pct: 0.025

risk_adjustment:
  cfads_haircut_pct: 0.1

Financing_Terms:                # PLACEHOLDER pending the term sheet (inputs F11-F24); the 100% LKR mix is the owner's (F10)
  debt_ratio: 0.7
  debt_sizing: dual_dscr
  dscr_p99_downside_factor: 0.80
  balloon_treatment: cash_sweep
  tenor_years: 12
  interest_only_years: 1
  amortization_style: auto
  interest_rate_nominal: 0.08
  mix:                          # fully LKR funded (owner, 2026-10-28; input F10)
    lkr_max: 1.0
    dfi_max: 0.0
    usd_commercial_min: 0.0
  rates:
    lkr_nominal: 0.1339         # PLACEHOLDER (input F11): UIP-implied DutchBay rate, not a quoted LKR project loan
    lkr_min: 0.1339
    dfi_nominal: 0.065
    dfi_min: 0.065
    usd_nominal: 0.075
    usd_commercial_min: 0.075
  target_dscr: 1.3
  min_dscr: 1.2
  reserves:
    dsra_months: 6
  fees:
    upfront_pct: 0.01
  enforce_hard_covenants: false

returns:
  project_life_years: 20
  project_discount_rate: 0.1
  equity_discount_rate: 0.12    # input F27

constraints:
  max_debt_ratio: 0.8
  warn_debt_ratio: 0.75
  min_dscr_covenant: 1.3
  target_dscr: 1.35
  warn_dscr: 1.25
  max_balloon_pct: 0.1
  warn_balloon_pct: 0.05
  max_tenor_years: 15
  warn_tenor_years: 14
  max_interest_rate: 0.25
  min_interest_rate: 0.0
  lender_type: DFI
  jurisdiction: Sri Lanka
  fail_on_covenant_breach: false
  fail_on_large_balloon: false

timeline:
  ppa_to_fc_years: 1
  construction_years: 1         # PLACEHOLDER (input B30)
  ops_years: 20
  lifetime_years: 21

wacc:
  mode: build_up
  drives_discount_rate: true
  cost_of_equity: 0.12
  prudential_spread_bps: 100
  description: "Build-up WACC drives the project discount rate."

metadata:
  version: '0.3'
  last_updated: '2026-11-01'
  author: DutchBay V14 Financial Modeling Team
  review_status: SKELETON - screening placeholders pending owner inputs (docs/blue_whale/INPUTS_REQUIRED.md)
  assumptions_source: 'Split from blue_whale_hybrid_lot5b_2026 v0.6 (finance blocks); battery fixed by the owner (5 MW / 20 MWh), PV sized by conf/blue_whale_solar_bess_fixed_bess_sizing.yaml'
  changes:
    - 'v0.3 (2026-11-01): the OWNER''S STRATEGIC BATTERY, 5.0 MW / 20.0 MWh (PR 7, #1353 comment 6563070978: "Fix 5 MW / 20 MWh"; objective "After-tax project NPV (Recommended)"). PV AC 5.0 MW (reading A at its 10 MW limit); PV DC chosen on the P50 after-tax project NPV by conf/blue_whale_solar_bess_fixed_bess_sizing.yaml (seed 20261101, 256 trials): 151 tables (5.66552 MWp), P50 USD -5,326,884, P90 -5,911,801. The value-based size (107 tables, 3.5 MW AC, 1.0 MW / 4.0 MWh) is better by USD 1,247,165 at P50 and 1,590,005 at P90. Solar CF 0.169929, degradation 0.392075, capex 3,455,943; bess_1 capex 2,814,800, 400.1935 cycles, fade 0.0016798; capex total 8,270,743; O&M 256,655'
