# ═══════════════════════════════════════════════════════════════════════════════
# Blue Whale Solar + BESS project (Lot 5B, Kalpitiya): 4.01464 MWp / 3.5 MW AC PV with a 0.1 MW / 0.4 MWh BESS
# ═══════════════════════════════════════════════════════════════════════════════
# Version: 0.10 (SKELETON: screening placeholders, not a basis for any decision)
# Path: scenarios/blue_whale_solar_bess_lot5b_2026.yaml
#
# A SEPARATE PROJECT (owner, 2026-11-01, #1353 comment 6556854201): "We will therefore
# consider the 10mw turbine separately from the solar+bess. It will be a separate project that
# will preceed the solar+BESS. Maximize BESS now within the solar+BESS parameters in order to
# gain the maximum benefit from the PUCSL evening tariff band". Objective "Max value, MC
# decides (Recommended)"; 10 MW reading "Model both, flag it"; turbine "Separate, risk
# flagged". The turbine is scenarios/blue_whale_wind_lot5b_2026.yaml, built first. The
# combined view scenarios/blue_whale_hybrid_lot5b_2026.yaml is superseded.
#
# PUCSL 2026 RULES (frozen with sources in conf/blue_whale_pucsl_fit_2026.yaml):
#   - the BESS discharges for 4 h at its nominal capacity, so energy = 4 x power, read as the
#     energy a full battery delivers (methodology s.5.1.1, s.5.2.1.1, s.5.2.1.2, s.5.1.2);
#   - it charges only from the co-located PV (s.5.1) and discharges only in the Prioritized
#     Feed-in Time, 17:30-21:30 (consultation July 2026, Table 3 note), at 50.10 LKR/kWh for
#     15 years; every other kWh earns 20.72 (Annex 2, effective 25 Aug 2026).
#   - The 05:30-07:30 window of v0.5 of the hybrid drops out. The earlier owner decision
#     ("Use the 17:30 - 21:30 window and add another 05:30 to 07:30 window for the remaining
#     2 hours. The priority rate will only apply to the evening window") gave it the remaining
#     2 hours of a 6 h battery; a 4 h battery has none. Superseded by the decisions above.
#
# THE SIZE IS THE SEARCH GRID'S FLOOR, NOT AN OPTIMUM (v0.9). The owner (2026-11-07), on PR 7's
# fixed 5 MW / 20 MWh: "This should not be a fixed choice. It needs an MC run and a sensitivity
# analyze to optimize"; and on which size to commit: "Whatever the optimiser picks". The battery
# power is a decision variable (energy = 4 x power, PUCSL), searched with the PV DC and AC in one
# seeded Monte Carlo (conf/blue_whale_solar_bess_project_sizing.yaml; seed 20261101, 256 LHS
# trials, 514 points: PV tables 107-174 and the lot's maximum, PV AC 3.5-7.0 MW, BESS 0.1-10 MW)
# ranked on the P50 after-tax project NPV (the engine's, through
# analytics.evaluation_v14.evaluate_with_overrides), on this scenario's own basis (O&M from the
# components below, #1646; the 2026 price dates, #1569). Result
# docs/blue_whale/solar_bess_project_sizing_summary.json. Under BOTH readings of the 10 MW limit
# it chooses 107 tables (4.01464 MWp), 3.5 MW AC and 0.1 MW / 0.4 MWh: the LOWEST value of all
# three decision variables on the grid (the summary flags each in at_grid_edge). v0.10 re-runs
# the search with the battery's fade and augmentation (L-11, below), and the choice is the same.
# The run's figures (P50, P90, the paired comparisons, the one-at-a-time cases and the
# break-even values) are in the summary and in docs/blue_whale/STATUS.md, "Latest run"; this
# header does not repeat them, because the summary pins this file's bytes.
# - THE FLOOR. Every component loses value at the margin: each extra 0.1 MW of battery lowers the
#   P50, and in a reduced probe below this grid each table fewer and each step down in PV AC also
#   raises the NPV. So the run picks whatever floor the grid sets, and a smaller battery, or none,
#   would lose less.
#   The #1691 domain lane showed 0.25 MW beating v0.9's first floor of 0.5 MW; the owner then
#   chose (2026-11-14, decision card): "Battery floor 0.1 MW, PV unchanged". 0.1 MW is that
#   choice, not a regulatory or technical minimum: the frozen PUCSL excerpts set the 4 h duration
#   but no minimum size for a "Power Plant with BESS" (input B18 asks for one). A zero battery is
#   outside the model (the dispatcher needs energy > 0) and outside that tariff category.
# - The comparisons are against LARGER sizes only: the paired trials, the one-at-a-time cases
#   and the break-even values (BESS price, priority rate, BESS O&M) all ask when a larger
#   battery would overtake this one.
# - Every eligible point has a negative P50. That level comes mostly from the fixed lines (the
#   USD 2.0M grid, civils and development capex and USD 150,000 a year of insurance, land and
#   SPV overhead); the corner comes from the negative marginal value above, not from the level.
#   The size is not evidence that the project is viable at any size. 152 tables at 5.0 MW AC
#   (v0.7-v0.8) was the best PV for the owner's 5 MW battery only.
# - L-10 (#1578): the BESS price is a per-kWh blend for a utility-scale product, applied unchanged
#   at 0.4 MWh. A battery this small is likely to cost more per kWh (fixed PCS, container,
#   controls and integration costs), and no small-size quote is in the corpus. A dearer small
#   battery lowers every KPI here. If the extra cost is fixed per battery, it leaves the gap
#   between battery sizes unchanged; if the per-kWh price falls with size, it narrows the gap to
#   larger batteries. Neither shape is modelled; a supplier's price at this size is the first
#   input to obtain (B19).
# - L-11 (#1578), MODELLED from v0.10 (owner, 2026-11-14: the fade from the OEM's performance
#   curve in the private corpus; augment "when capacity falls below 80%"; the augmentation cost:
#   "use an assumption"). The battery loses 1.5533% of its nameplate energy a year, linearly (one
#   rate derived from the OEM curve; only that rate is committed; it applies in every year).
#   Year 13 starts at 81.4% and year 14 would start below 80%, so cells are added
#   before year 14 to restore the nameplate: 20.2% of 0.4 MWh at USD 103.55/kWh (ASSUMPTION: the
#   pricing config's BESS equipment line, paid as stated), USD 8,363.90 in year 14 (bess_1.revenue.
#   augmentation_schedule). It replaces NSO 250's augmentation reserve in the price (USD 8.00/kWh,
#   8.89 in the all-in), so the BESS capex is on USD 131.85/kWh. The sizing dispatches every year
#   on the faded energy (conf/blue_whale_solar_bess_project_sizing.yaml, battery_health). Still
#   not modelled: the RTE's decline with age, the curve's duty scaled to this battery's cycling
#   (a residual fade of 0-0.5%/yr in the trials stands for both), and O&M on the added cells.
#   After the 15-year priority term the battery keeps cycling with its round-trip loss; the
#   20-year-term sensitivity bounds that.
# Superseded: v0.3-v0.8 carried the owner's PR 7 battery, 5.0 MW / 20.0 MWh, at 5.0 MW AC
# (151-152 tables); v0.2 (PR 6) 107 tables, 3.5 MW AC and 1.0 MW / 4.0 MWh; v0.1 (PR 4) 160
# tables, 5.0 MW AC and 4.5 MW / 18 MWh. The BESS capex is a blend that includes private
# commercial inputs, and those inputs can be recovered exactly from the published figures
# (owner accepted on 2026-11-07, #1353 comment 6702419885). Published on the owner's decision
# of 2026-11-01 (#1353 comment 6556975196). The fields below are that size's base case (every
# price at its mode, yield 1, RTE 0.85, the base fade and no residual fade).
#
# OPEN LEGAL RISK: THE 10 MW LIMIT. The Electricity Act No. 36 of 2024, s.11(3) proviso:
# "the maximum capacity of such renewable energy plants to be procured from a contiguous
# location using standard power purchase agreements on cumulative basis shall not exceed
# 10 MW". The 9.5 MW turbine of the wind project stands on the same lot. If the two projects
# count cumulatively as one contiguous location, this project's capacity is added to the
# turbine's 9.5 MW and the pair exceeds 10 MW under either reading. Which of readings A and B
# is right, and whether the turbine counts, are open questions for PUCSL, the NSO or counsel.
#
# PLACEHOLDER SITE. No survey of the lot exists (input B03); the land fit rests on PR 1's
# assumed square lot, with the turbine on DutchBay T2 in its north-east corner (owner,
# 2026-11-07; until then at the coastal setback) and its crane hardstand to the west.
#
# EVERY VALUE BELOW IS A PLACEHOLDER unless its comment says otherwise. The finance blocks are
# the hybrid's (scenarios/blue_whale_hybrid_lot5b_2026.yaml v0.6), copied where they apply.
# The inputs register is docs/blue_whale/INPUTS_REQUIRED.md.
# ═══════════════════════════════════════════════════════════════════════════════

project:
  name: "Blue Whale Solar + BESS (Lot 5B)"
  location: "Lot 5B Plan 3641, Mutuwal, GN Dutch Bay 633, Kalpitiya DS, Puttalam District, North Western Province, Sri Lanka"
  capacity_mw: 3.5            # generation nameplate: the PV AC (the BESS power is not in it, as in the hybrid)
  capacity_factor: 0.198586     # = the solar block's CF (the only generation block); v0.7-v0.8 0.170766, v0.4-v0.6 0.169675, v0.3 0.169929, v0.2 0.191179, v0.1 0.182870
  curtailment_pct: 0.0
  degradation: 0.5                  # PLACEHOLDER (input B12)
  life_years: 20                    # PLACEHOLDER (input F01): SPPA term
  cod_year: 2029                    # PLACEHOLDER (input B30): after the wind project (owner: the turbine "will preceed the solar+BESS")
  developer: "Blue Whale Limited (project company to be confirmed)"   # input B01
  grid_poi: "TBD: CEB grid substation and voltage not yet identified"  # input B25
  boi_approved: false               # input F30
  jurisdiction: Sri Lanka

generation:
  technologies:
    # The engine has one generation tariff and per-BESS revenue, so the unit is carried in two
    # blocks (no engine code; solar_resource.pv_bess_dispatch):
    #   solar  = EVERYTHING the project exports (PV direct plus battery discharge), billed at
    #            the generation tariff, the 20.72 other-period rate;
    #   bess_1 = the priority PREMIUM (50.10 - 20.72 = 29.38) on the energy exported in the
    #            17:30-21:30 window, for the 15-year priority term.
    # Year 1 (base case, v0.9), hourly over the frozen TMY with PV at the warranted 99% and the
    # shadow of the turbine on DutchBay T2 on this size's tables (input B33): PV 6,114.41 MWh;
    # charge 171.76; discharge 146.00 (17:30-21:30 only); PV direct 5,942.65 (23.93 in the window,
    # 5,918.71 outside); curtailed 0.00; export 6,088.65 MWh, of which 169.93 in the priority
    # window; 365.0 equivalent full cycles; revenue LKR 131,149,387 at the flat rates. (v0.7-v0.8,
    # 152 tables and 20 MWh: export 7,479.55 MWh, 6,817.18 priority, revenue LKR 355,265,093.
    # v0.2, 107 tables and 4 MWh: export 5,861.53 MWh, 1,481.23 priority; v0.1, 160 tables and
    # 18 MWh: export 8,009.72 MWh, 6,385.37 priority.)
    solar:
      capacity_mw: 3.5        # AC: the PV inverters' active-power limit (v0.9, the optimiser's; v0.3-v0.8 5.0,
                                    # v0.2 3.5). DC 4.01464 MWp (107 tables of JinkoSolar Tiger Neo 3.0 670 W,
                                    # DC/AC 1.14704; v0.7-v0.8 152 tables, 5.70304 MWp); 12 x Huawei SUN2000-330KTL-H1
      capacity_factor: 0.198586 # DERIVED: export 6,088.65 MWh / (3.5 MW x 8760 h), year 1 (v0.7-v0.8 0.170766,
                                    # v0.4-v0.6 0.169675, v0.2 0.191179). PV alone (frozen PVGIS-ERA5 TMY,
                                    # 8 deg tilt, 14% losses, inverter 98.8%): 6.1762 GWh before the warranted
                                    # year-1 1%. Turbine shading MODELLED (input B33; the turbine on DutchBay T2
                                    # from v0.7): optical floor,
                                    # no electrical-mismatch uplift (conf/blue_whale_solar_bess.yaml). Bifacial
                                    # gain NOT modelled. Resource and cross-checks:
                                    # docs/blue_whale/CAPEX_AND_SOLAR_RESOURCE_METHODS.md
      degradation_pct: 0.359233  # DERIVED: geometric rate whose 20-year sum equals the dispatched export
                                      # under the Jinko warranty path (1% year 1, then 0.35%/yr linear) and the
                                      # battery's fade and augmentation (v0.10, L-11); v0.9 0.362809, v0.7-v0.8
                                      # 0.392594, v0.4-v0.6 0.391957, v0.2 0.377386
      aep_gwh: 6.09        # export, year 1 (reporting); v0.7-v0.8 7.48, v0.2 5.86
      capex_usd: 2448480       # CITED (input B15), PR 3's price modes of conf/blue_whale_pv_bess_pricing.yaml:
                                    # modules 0.110 FOB + 0.010 delivery, BoP/EPC 0.462 per Wp on 4.01464 MWp,
                                    # inverters 0.0311 per W on 12 x 300 kW, 2026 prices (v0.7-v0.8 3,477,779 on
                                    # 5.70304 MWp; v0.2 2,448,480 on the same 4.01464 MWp)
      availability_pct: 99.0
    bess_1:
      type: bess
      power_mw: 0.1               # THE GRID FLOOR (v0.9; owner, 2026-11-14: "Battery floor 0.1 MW, PV
                                    # unchanged"), not an optimum: a smaller battery would lose less (header).
                                    # v0.3-v0.8 5.0 (the owner's PR 7
                                    # "Fix 5 MW / 20 MWh", withdrawn); v0.2 1.0
      energy_mwh: 0.4             # 4 x power: PUCSL 4 h at nominal capacity, the energy a full battery delivers
      duration_h: 4.0
      capex_usd: 52740      # BLENDED (PR 6, input B19): USD 140.74/kWh all-in mode less the 8.89 augmentation
                                    # reserve (v0.10, L-11: the explicit augmentation below replaces it), 131.85
                                    # on 0.4 MWh, 2026 prices (conf/blue_whale_pv_bess_pricing.yaml, from
                                    # conf/blue_whale_capex_solar_resource.yaml). A utility-scale per-kWh price
                                    # applied at 0.4 MWh (L-10, header). v0.9 56,296 (140.74); v0.3-v0.8
                                    # 2,814,800 on 20.0 MWh; v0.2 562,960 on 4.0 MWh; v0.1 2,430,000 (USD 135.00/kWh)
      availability_pct: 97.0
      revenue:
        model: energy_tariff        # input F05: the PUCSL 2026 ground solar + BESS FiT, dispatched hourly
        tariff_lkr_per_kwh: 29.38   # 50.10 - 20.72 (Annex 2): the premium over the generation tariff
        escalable_om_lkr_per_kwh: 0.30  # L-9: 3.02 - 2.72, the premium's share of the indexed O&M. The priority
                                    # rate's 3.02 is the standalone 2.72 / 0.90 RTE (methodology s.5.1.2:
                                    # R_charging / RTE); the BESS component itself is constant (s.5.1.2)
        cycles_per_year: 499.80169 # DERIVED (v0.9): priority-window export 169.93 MWh / (0.4 MWh x 0.85), year 1
                                    # (an engine mapping, not a cycle count: 365.0 true cycles). v0.7-v0.8 401.0106,
                                    # v0.4-v0.6 399.9815, v0.2 435.6547
        round_trip_efficiency: 0.85 # repository value (NREL ATB 2024 basis, #588); the whole loss on charge.
                                    # PUCSL's 0.90 reference case is a sensitivity in the sizing summary
        availability_factor: 1.0
        contract_years: 15          # PUCSL methodology s.5.1, Annex 2 s.3 note [2]
        mdsc_fade_pct_annual: 0.0110508  # DERIVED (v0.10; v0.9 0.0004990, v0.7-v0.8 0.0016403, v0.2 0.0000718): decline of the
                                        # priority-window export as the battery fades and the PV degrades, augmented
                                        # in year 14 (geometric rate matching its 15-year sum; L-11, header)
        augmentation_schedule:          # v0.10, L-11 (header): the cells added before operating year 14
          - year: 14
            capex_usd: 8363.90          # 20.19% of 0.4 MWh x USD 103.55/kWh (ASSUMPTION), paid as stated in year 14
            restore_to_soh: 0.8654896   # the engine's own SoH that year, (1 - 0.0110508)^13: the dispatched export
                                        # that mdsc_fade_pct_annual matches already carries the restored energy, so
                                        # the event moves the cash only (solar_resource.pv_bess_sizing.engine_overrides)

tariff:
  # Input F03: the PUCSL feed-in tariffs effective 25 Aug 2026 for plants < 10 MW (Annex 2),
  # ground solar + BESS: 20.72 (18.00 + 2.72) at other periods, which every exported kWh earns
  # here; bess_1 adds the 29.38 priority premium in 17:30-21:30 for 15 years. No wind, so no
  # blend. The month-12 FX/CCPI adjustment of the non-escalable parts is not modelled.
  lkr_per_kwh: 20.72
  om_indexation:                # L-9 (owner, 2026-11-07: index it): only the escalable O&M parts move
    escalable_om_lkr_per_kwh: 2.72  # Annex 2, ground solar other-period base O&M; the 18.00 stays flat.
                                    # bess_1's premium carries its own 0.30 on this same index
    basis: ccpi_fx_weighted     # PUCSL 2026 methodology s.3.1 item 2: the Commission publishes the yearly
                                # rate "considering CCPI and LKR/USD exchange rate variations"
    ccpi_weight: 0.30           # PLACEHOLDER (input B35): the methodology states no weights for the O&M
    lkr_usd_weight: 0.70        # rate; these are its own s.3.1 item 1 weights for the non-escalable
                                # adjustment (70% LKR/USD, 30% CCPI)
    ccpi_inflation_pct: 5.0     # PLACEHOLDER (input B29): the CBSL 5% target, as the O&M's LKR inflation
    lkr_usd_depreciation_pct: relative_ppp  # (1 + CCPI) / (1 + USD inflation) - 1 = 2.44%/yr
    usd_inflation_pct: 2.5      # PLACEHOLDER (input B34): as the O&M's USD inflation
                                # -> 0.30 x 5.0% + 0.70 x 2.44% = 3.21%/yr (PUCSL's consultation assumed
                                #    3.85%/yr O&M escalation in its BESS case)
    pre_operation_years: 3      # #1569: index 1.0 at the PUCSL component's 2026 base year, which is also
                                # opex.price_year, so revenue and cost escalate from the same date:
                                # 2029 COD - 2026 = 3 steps before operating year 1 (a test checks the two agree)
    source: "PUCSL Methodology for RE Feed-in Tariffs 2026 (Approved), s.3.1 item 2; conf/blue_whale_pucsl_fit_2026.yaml PUCSL-METHOD-2026"
  tariff_type: fixed            # input F04
  ppa_term_years: 20            # input F01: the hybrid's basis (the CEB standardised PPA draft, June 2025,
                                # 20 years from COD); the methodology's s.3.1 tariff rests on a 20-year cash flow

ppa:
  primary_currency: "LKR"
  ppa_term_years: 20
  tariff_type: "fixed"
  offtaker: "National System Operator (Private) Limited"   # input F02 (Gazette Extraordinary 2479/36)
  payment_terms_days: 30

fx:
  enabled: true
  mode: deterministic
  base_currency: USD
  quote_currency: LKR
  rates:
    lkr_per_usd: 333.79
  start_lkr_per_usd: 333.79     # 2026-Q2 pinned rate shared with the DutchBay cases (input F25 to refresh)
  annual_depr: 0.0              # held flat: fully LKR funded (owner, 2026-10-28), as the hybrid
  uncertainty_pct: 0.05

capex:
  cost_basis_year: 2026
  price_basis:                  # #1569 (input B36): the capex is priced in 2026 and spent at financial close
    price_year: 2026            # PLACEHOLDER (input B36): the year the blended capex quotes are priced in
    escalation_pct: 5.0         # PLACEHOLDER (input B29): LKR inflation at the CBSL 5% target; the owner's rule
                                # of 2026-11-02 fixes all capex in LKR at project start. The engine escalates
                                # usd_total from 2026 to each construction draw (close = cod_year - 1)
    source: "capex quotes and blends of 2026 (conf/blue_whale_capex_solar_resource.yaml); #1569"
  estimate_class: 5             # AACE Class 5 (concept screening)
  usd_total: 4501220    # solar 2448480 + BESS 52740 + grid/civils/development 2.0M (PLACEHOLDER B26,
                                # the hybrid's whole line carried to each project: separate SPPAs, separate connections).
                                # 2026 prices (price_basis above). v0.10 (the year-14 augmentation is
                                # bess_1's, not in usd_total); v0.9 4,504,776; v0.7-v0.8 8,292,579;
                                # v0.3-v0.6 8,270,743; v0.2 5,011,440
  capex_per_kw_usd: 1286   # usd_total / 3.5 MW AC (BESS power not in the denominator); v0.9 1287, v0.7-v0.8 1659, v0.2 1432

opex:
  usd_per_year: 190938.4        # inputs B16, B20, B28: solar O&M 40,146.4 + BESS O&M 792 + insurance, land
                                # lease and SPV overhead 150,000 (the components below; a test checks the sum).
                                # Stated in USD at fx.start_lkr_per_usd. v0.9 (107 tables, 0.4 MWh); v0.7-v0.8
                                # 246,630.4; v0.5-v0.6 246,255.2; v0.4 and v0.3 256,655 (BESS at the unsourced
                                # USD 2.5/kWh-yr); v0.2 200,146
  opex_per_kw_yr_usd: 54.6      # 190,938 / 3,500 kW (v0.7-v0.8 49.3, v0.3 51.3)
  price_year: 2026              # PLACEHOLDER (input B36): the opex amounts are priced in 2026 (the LTSA and O&M
                                # benchmarks of 2026, at the 2026-Q2 FX); every line escalates from 2026, so
                                # operating year 1 carries cod_year - 2026 years of escalation (#1569)
  escalation_pct: 5.0           # = currency_split.lkr_escalation_pct (the engine refuses a mismatch); kept
                                # for the single-rate screening tools that read it
  # v0.5 (input B34): the owner's rule (2026-11-02): "all CAPEX is fixed at project start in LKR. The debt
  # will be in LKR. However, a percentage of OPEX will be in USD". Her decision of 2026-11-02: BESS O&M at
  # USD 1.80/kWh-yr of DC installed. Her direction of 2026-11-07: convert it to LKR at the same value date
  # as the wind project (fx.start_lkr_per_usd 333.79, the 2026-Q2 pinned rate both projects share), so
  # 792 x 333.79 = LKR 264,362 a year on v0.9's 0.4 MWh (v0.5-v0.8: 39,600, LKR 13,218,084). Every line of this project is now in LKR: the USD share is 0%,
  # and the whole total is fixed in LKR at 333.79 and escalates at LKR inflation. The split block is kept
  # so that a USD line can be added without a code change.
  # RE-SIZED ON THIS BASIS (v0.9): the project sizing prices its O&M from these components at each size
  # (#1646; conf/blue_whale_solar_bess_project_sizing.yaml plant.bess_dc_per_nominal 1.1), with the price
  # dates and the indexed tariff parts, so its base case reproduces this scenario.
  currency_split:
    usd_escalation_pct: 2.5     # PLACEHOLDER (input B34): USD O&M inflation (no USD index is sourced in
                                # either corpus)
    lkr_escalation_pct: 5.0     # PLACEHOLDER (input B29): LKR O&M inflation at the CBSL 5% target
    usd_lkr_depreciation_pct: relative_ppp  # LKR depreciation for the USD share only, derived from the two
                                    # inflation inputs above: 1.05 / 1.025 - 1 = 2.44%/yr (the owner, 2026-11-07:
                                    # "fix for inflation"). Was 5.89%, the DutchBay cases' BIS 2005-2026 nominal
                                    # rate, which with these inflation inputs implied ~3.3%/yr real LKR
                                    # depreciation. Advanced through construction as the model curve would be
    components:
      - name: solar_om
        usd_per_unit_year: 10.0 # PLACEHOLDER (input B16): USD/kWp-yr, PR 3's rate, not sourced
        units: 4014.64          # kWp DC (107 tables x 37.52 kWp; v0.7-v0.8 5,703.04 on 152 tables)
        usd_share: 0.0          # LKR: local labour and site services
      - name: bess_om
        usd_per_unit_year: 1.80 # input B20: USD/kWh-yr of DC installed, a vendor LTSA benchmark (source not
                                # named), on the owner's decision of 2026-11-02. Held for all 20 years
        units: 440              # PLACEHOLDER (input B20): kWh DC installed = 0.4 MWh nominal plus an assumed
                                # 10% DC oversize, until the BESS supplier states the DC capacity
        usd_share: 0.0          # LKR 264,362/yr at 333.79 (the owner's direction of 2026-11-07: converted
                                # to LKR at the wind project's value date); was 1.0 (all USD) on 2026-11-02
      - name: insurance_land_spv
        usd_per_year: 150000    # PLACEHOLDER (inputs B02, B28)
        usd_share: 0.0          # LKR (the owner has not said otherwise)

tax:
  corporate_tax_rate: 0.30      # input F31
  tax_holiday_route: none       # input F30 (BOI)
  tax_holiday_years: 0
  tax_holiday_start_year: 1
