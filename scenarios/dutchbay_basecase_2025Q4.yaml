wacc:
  # ---------------------------------------------------------------------------
  # CAPM / WACC calculation (ILLUSTRATIVE — NOT the discount rate the engine uses)
  #
  # ⚠️ DOC-HONESTY NOTE (2026-06-28): the evaluation path (evaluate_with_overrides)
  # discounts this scenario's project NPV at the FLAT returns.project_discount_rate
  # (0.10 -> discount_rate_used = 0.1000), NOT the build-up below. The `mode: capm`
  # block is retained only as a cost-of-capital illustration; the
  # Step 3/4/5 figures (Ke 0.2567 / WACC 0.1162 / prudential 0.1262) are that
  # illustration, not the base discount actually applied. (On THIS base case the
  # prudential overlay does use WACC+100bps = 0.1262 -> prudential_rate_used 0.12624 /
  # project_npv_prudential ~ -$56.3M, but the headline project NPV uses the flat 10%.)
  #
  # Inputs:
  # - Target capital structure: D/V = 0.70, E/V = 0.30  =>  D/E = 0.70/0.30 = 2.3333
  # - Tax rate (Tc): 0.30
  # - Comparable levered beta (Bl_comp): 1.30
  # - Comparable D/E: 0.50
  # - Risk-free rate (Rf): 0.13
  # - Market risk premium (MRP): 0.05
  # - Pre-tax cost of debt (Kd): 0.08
  #
  # Step 1) Unlever comparable beta to asset beta (Bu):
  #   Bu = Bl_comp / [1 + (1 - Tc) * (D/E)_comp]
  #      = 1.30 / [1 + (1 - 0.30) * 0.50]
  #      = 1.30 / [1 + 0.70 * 0.50]
  #      = 1.30 / 1.35
  #      = 0.962963...
  #
  # Step 2) Relever asset beta to project equity beta (Be):
  #   Be = Bu * [1 + (1 - Tc) * (D/E)_proj]
  #      = 0.962963 * [1 + 0.70 * 2.333333]
  #      = 0.962963 * 2.633333
  #      = 2.534...
  #
  # Step 3) CAPM cost of equity (Ke):
  #   Ke = Rf + Be * MRP
  #      = 0.13 + 2.534 * 0.05
  #      = 0.2567  (~25.7%)
  #
  # Step 4) After-tax WACC (nominal):
  #   WACC = (E/V * Ke) + (D/V * Kd * (1 - Tc))
  #        = (0.30 * 0.2567) + (0.70 * 0.08 * 0.70)
  #        = 0.0770 + 0.0392
  #        = 0.1162 (~11.6%)
  #
  # Step 5) Prudential WACC (nominal):
  #   WACC_prudential = WACC + 100 bps = 0.1162 + 0.0100 = 0.1262 (~12.6%)
  # ---------------------------------------------------------------------------

  mode: capm

  # CAPM inputs (nominal decimals)
  risk_free_rate: 0.13
  market_risk_premium: 0.05

  # Use asset_beta so the engine can compute/reporter equity_beta_levered
  asset_beta: 0.962963

  # Capital structure (choose D/E or gearing; D/E is explicit here)
  target_debt_to_equity: 2.333333

  # Cost of debt (pre-tax nominal)
  cost_of_debt: 0.08

  # Tax (explicit; otherwise engine may fall back to tax paths)
  tax_rate: 0.30

  # Optional (only matters if you also want real WACC reported)
  inflation_rate: 0.03

  # Prudential overlay
  prudential_spread_bps: 100

  # NOTE (#45): the discount basis is controlled by `wacc.drives_discount_rate` (unset here,
  # so NPV uses the flat returns.project_discount_rate per the DOC-HONESTY NOTE above). The
  # former `apply_to_npv` key was a no-op (zero Python readers) and was removed so config
  # does not imply a WACC-driven NPV the engine never applies.

  description: CAPM WACC (Sri Lanka) with beta unlever/relever from comparable and 70:30 D/V; includes 100 bps prudential uplift

