project:
  name: Dutch Bay Wind Project (Base Case 2025Q4)
  capacity_mw: 150
  capacity_factor: 0.4
  degradation: 0.6  # percent; 0.6 => 0.006/yr
  grid_loss_pct: 0.02  # decimal; 2% grid loss
  life_years: 20
  boi_approved: false
  boi_agreement_date: '2025-01-15'
  location: Puttlam District, North Western Province
  jurisdiction: Sri Lanka
  # Tax inputs are the single source of truth in the `tax:` block below (CESSPIT).

tax:
  # Single source of truth for tax inputs (CESSPIT). Current SL regime (post-2025):
  # CIT 30%, no renewable holiday for new IPPs, TLCF 6yr, split straight-line
  # depreciation (plant&machinery 5yr / civils 20yr), interest WHT 10%.
  enable_pipeline_overlay: true
  corporate_tax_rate: 0.30
  depreciation_method: "straight_line"
  depreciation_start_year: 1
  depreciation_years: 5  # placeholder; the split fields below drive the calc
  plant_capex_share: 0.80
  plant_depreciation_years: 5  # SL Fourth Sched Class 2 (plant & machinery)
  civil_depreciation_years: 20  # SL Fourth Sched Class 4 (buildings/civils)
  enhanced_allowance_applies: false
  enhanced_capital_allowance_multiple: 1.5
  loss_carryforward_years: 6
  tax_holiday_route: none
  tax_holiday_start_year: 1
  tax_holiday_years: 0
  wht_on_interest_to_nonresidents: 0.10
  wht_on_interest_enabled: true
  wht_gross_up: false
  # SL statutory dividend WHT 15% (#81) + capitalize debt IDC into the
  # depreciable tax base (#36/#75). Both bite the equity path only.
  wht_on_dividends: 0.15
  wht_on_dividends_enabled: true
  capitalize_idc_in_depreciable_base: true

statutory:
  env_surcharge_pct: 0.0  # non-statutory levy — not in the SL regime; zeroed (#43)
  success_fee_pct: 0.0  # non-statutory levy — not in the SL regime; zeroed (#43)
  social_services_levy_pct: 0.025
  sscl_enabled: true
  sscl_pct: 0.025
  sscl_base: "gross_revenue"    # or "net_revenue_after_grid_loss"

returns:
  project_life_years: 20
  project_discount_rate: 0.1
  equity_discount_rate: 0.12

# KPI switches (GWTF: explicit opt-in only)
kpis:
  use_posttax_cfads: true

timeline:
  ppa_to_fc_years: 1
  construction_years: 2
  ops_years: 20
  lifetime_years: 22
tariff:
  lkr_per_kwh: 20.3
  tariff_type: fixed
  ppa_term_years: 20
fx:
  start_lkr_per_usd: 300.0
  annual_depr: 0.0589  # data-derived LKR depreciation (BIS 2005-2026 long-run, analytics.fx.fx_calibration; was hand-set 3%)
capex:
  usd_total: 150000000
  breakdown:
    epc_usd: 140000000
    development_usd: 5000000
    financing_fees_usd: 3000000
    contingency_usd: 2000000
opex:
  usd_per_year: 3000000
  breakdown:
    om_contract_usd: 2000000
    insurance_usd: 500000
    land_lease_usd: 300000
    admin_usd: 200000

risk_adjustment:
  cfads_haircut_pct: 0.1


Financing_Terms:
  debt_ratio: 0.7
  tenor_years: 15
  interest_only_years: 2
  amortization_style: auto
  interest_rate_nominal: 0.08
  mix:
    lkr_max: 0.45
    dfi_max: 0.1
    usd_commercial_min: 0.45
  rates:
    lkr_nominal: 0.1339  # UIP-implied: USD 7.5% + 5.89% LKR drift (#3, PR B)
    lkr_min: 0.1339
    dfi_nominal: 0.065
    dfi_min: 0.065
    usd_nominal: 0.075
    usd_commercial_min: 0.075
  target_dscr: 1.3
  min_dscr: 1.2
  min_dscr_covenant: 1.2
  reserves:
    dsra_months: 6
    # receivables_guarantee_months removed (#1399): nothing in the engine reads it, and
    # v14 pre-flight refuses it. Receivables support awaits the term sheet (#920).
  use_revenue_guarantee: false
  guarantee_revenue_pct: 0.0075
  fees:
    upfront_pct: 0.01
  enforce_hard_covenants: false
constraints:
  max_debt_ratio: 0.8
  warn_debt_ratio: 0.75
  min_dscr_covenant: 1.3
  target_dscr: 1.35
  warn_dscr: 1.25
  max_balloon_pct: 0.1
  warn_balloon_pct: 0.05
  refinancing:
    enabled: true
    max_refinance_pct: 0.1
    refinance_rate_premium: 0.02
    refinance_tenor_years: 3
    requires_documentation: true
  max_tenor_years: 20
  warn_tenor_years: 18
  max_interest_rate: 0.25
  min_interest_rate: 0.0
  lender_type: DFI
  jurisdiction: Sri Lanka
  fail_on_covenant_breach: false
  fail_on_large_balloon: false
monte_carlo:
  n_scenarios: 100000
  seed: 42
  parameters:
    capacity_factor_std: 0.05
    tariff_lkr_std: 0.1
    opex_usd_std: 0.15
    capex_usd_std: 0.08
  var_confidence: 0.95
  cvar_confidence: 0.95
  percentiles:
  - 10
  - 25
  - 50
  - 75
  - 90
  min_dscr_covenant: 1.2
  min_llcr_covenant: 1.25
sensitivity:
  ranges:
    capacity_factor:
      low_pct: -0.05
      high_pct: 0.05
    tariff_lkr_per_kwh:
      low_pct: -0.1
      high_pct: 0.1
    opex_usd_per_year:
      low_pct: -0.15
      high_pct: 0.15
    capex_usd_total:
      low_pct: -0.08
      high_pct: 0.08
    grid_loss_pct:
      low_pct: -0.01
      high_pct: 0.03
  analysis:
    tornado_chart_title: DutchBay 150MW - Parameter Sensitivity (Equity IRR)
    dpi: 300
