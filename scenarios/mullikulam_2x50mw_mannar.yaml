expected_results:
  # Regenerated from THIS scenario (one 50 MW Mannar lot, 10x Vestas V150-5.6, fitted
  # Weibull A=7.97/k=2.506) — was a copy-paste of the lender's 483.6 GWh block.
  net_aep_p50_gwh: 133.1
  net_aep_p90_gwh: 116.0   # P90/P50 ~0.871 (IEC 61400-15-2 build-up)
  capacity_factor: 0.2713
  annual_revenue_p50_m_lkr: 1759.6  # 133.1 GWh x 13.22 LKR/kWh (3.96 USDc bid @ FX 333.79)
  annual_revenue_p50_m_eur: 5.3     # reference: 1759.6 M LKR / 330 LKR/EUR
  revenue_20yr_undiscounted_m_lkr: 33566.3  # with 0.5%/yr degradation (M3e)
  # HONEST re-baseline (2026-06-21). The prior +9.63M / 10.84% headline was fiction:
  # capacity_mw carried a stale lender 159.6 (3x the real 56 MW Lot 1), and the engine
  # drives revenue from capacity_mw x capacity_factor x 8760, so it booked ~3x the real
  # generation. With capacity_mw corrected to 56 (now consistent with aep_summary 133.1
  # GWh) AND opex corrected to the benchmark 1.12M, Lot 1 is uneconomic: LCOE ~5.5 USc
  # exceeds the aggressive 3.96 USc WindForce bid. The dual-DSCR sizer holds min DSCR
  # 1.30 by sizing debt down to ~14.7M (gearing ~0.23), pushing the loss onto equity.
  # Regenerated from the live engine 2026-06-26 (round-7 stale-pin fix) and now bound by
  # tests/integration/test_mullikulam_mannar_smoke.py so it cannot drift again. project_irr/
  # npv/moic/llcr/plcr had gone stale — the LLCR/PLCR pins predated PR #389 (operating-year
  # CFADS window) and were never re-propagated because no test read this block.
  # project_irr / equity_irr / project_npv_m_usd / equity_npv_m_usd / equity_moic / min_dscr /
  # avg_dscr / llcr / plcr moved to tests/fixtures/finance/mullikulam_expected_kpis.json (#996 D3b:
  # a runtime-input scenario must not double as its own regression oracle); still bound to the live
  # pipeline by tests/integration/test_mullikulam_mannar_smoke.py. The narrative above documents it.
metadata:
  version: '3.0'
  last_updated: '2025-12-23'
  author: DutchBay V14 Financial Modeling Team
  review_status: Draft - Pending Board Approval
  assumptions_source: 'BOI Agreement Ref: BOI/2025/REN/001234'
  sprint: Sprint 17 - Multi-Currency PPA + Wind Resource Integration
  gwtf_compliance: All 51 rules audited + wind energy calculator integration
  changes:
  - 'v3.0: Added multi-currency PPA structure (LKR/USD/EUR/CNY)'
  - 'v3.0: Integrated wind resource parameters (Weibull, air density, ERA5)'
  - 'v3.0: Added turbine technical specs for energy calculator'
  - 'v3.0: Added layout parameters for wake loss validation'
  - 'v3.0: Unified losses structure across resource + statutory'
  - 'v3.0: Added expected_results for end-to-end validation'
  - 'v2.7: Enabled FX integration for multi-currency debt'
  - 'v2.7: Added debt_tranches structure'
  - 'v3.1: Removed decorative Financing_Terms.debt_tranches (never an engine input);
    mix + rates are canonical (plan_debt warns if re-added)'
wacc:
  mode: build_up
  drives_discount_rate: true
  cost_of_equity: 0.12
  prudential_spread_bps: 100
  description: Build-up WACC drives the discount rate (replaces a decorative fixed
    12%).
