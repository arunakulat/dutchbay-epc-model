# Mullikulam 2x50 MW Wind Farm (Lot 1), Musali DS, Mannar, Northern Province.
# Config-driven NEW PROJECT: location 8.82N/79.96E, Vestas V150-5.6 proxy (EN-156/5.0 spec),
# hub 125m (tip 200<=220, clearance 50>=25), Weibull FITTED from live ERA5 2020-2024 @125m,
# USD 3.96 c/kWh tariff (=13.22 LKR at the corrected 2026-Q2 FX 333.79). 10 WTGs/lot,
# 50 MW metering @ 220 kV.
project:
  name: Mullikulam Mannar
  location: Musali DS, Mannar District, Northern Province, Sri Lanka
  capacity_mw: 56.0
  capacity_factor: 0.2713
  degradation: 0.5  # percent; 0.5 => 0.5%/yr turbine aging (engine reads as % and /100s)
  life_years: 20
  cod_year: 2027
  developer: DutchBay Wind Power Pvt Ltd
  grid_poi: Mannar 220kV Grid Substation
  boi_approved: false
  boi_agreement_date: '2025-01-15'
  jurisdiction: Sri Lanka
turbine:
  model: Vestas V150-5.6 (proxy for EN-156/5.0)
  n_turbines: 10
  rated_power_mw: 5.6
  rated_power_kw: 5600
  total_capacity_mw: 56.0
  rotor_diameter_m: 150
  hub_height_m: 125
  cut_in_ms: 3.0
  cut_out_ms: 22.5
  rated_wind_speed_ms: 12.0
  certification_status: OEM_CERTIFIED
  notes: Vestas V150-5.6, proxy for the OEM-certified EN-156/5.0 machine at Mullikulam
    (Musali DS, Mannar). 10 x 5.6 MW = 56 MW (Lot 1), 220 kV metering. Hub 125 m =>
    tip 200 m <= 220 m cap, clearance 50 m >= 25 m. Distinct from the 15 x IEA-10MW
    Kalpitiya lender case; this is a separate Mannar site.
wind_resource:
  weibull_a: 7.97
  weibull_k: 2.506
  mean_wind_speed_ms: 7.07
  shear_exponent: 0.14
  air_density_kgm3: 1.15
  air_density_ref_kgm3: 1.225
  data_source: ECMWF ERA5 Reanalysis
  data_years: 2020-2024
  data_confidence: Medium (5-year ERA5 validated against 1-year met mast)
layout:
  turbine_spacing_avg_m: 650
  turbine_spacing_avg_D: 3.8
  iec_compliant_pairs: 6
  iec_marginal_pairs: 3
  iec_violation_pairs: 6
  layout_orientation: linear_north_south_coastal
  coordinates_reference: WGS84_EPSG4326
  utm_zone: 44N
resource:
  turbines:
    count: 10
    rated_power_mw: 5.6
    total_capacity_mw: 56.0
    model: Vestas V150-5.6 (proxy for EN-156/5.0)
    rotor_diameter_m: 150
    hub_height_m: 125
  power_curve:
    source_id: OEM_VESTAS_V150_56_PC
    source_type: OEM
    curve_key: vestas_v150_5p6
    iec_standard: IEC 61400-12-1:2022
    certificate_ref: Vestas V150-5.6 (proxy)
    air_density_site_kgm3: 1.15
    air_density_ref_kgm3: 1.225
    alt_curve_key: ge_cypress_5p5
  aep_summary_path: scenarios/aep_summary_mullikulam.json
  # No-EYA illustrative fixture: its frozen AEP artifact was built at 0% haircut, so pin 0.0 EXPLICITLY
  # (#587) to keep an AEP regen reproducible and opt out of the recommended no-EYA default (not bankable).
  uncertainty:
    p50_haircut_pct: 0.0
  losses:
    wake_loss_pct: 7.28
    availability_pct: 97.0
    electrical_loss_pct: 2.0
    curtailment_pct: 2.0
    other_pct: 1.0
  wind_resource:
    # ERA5-fitted at the Mannar site (matches the top-level wind_resource block);
    # was a copy-pasted Kalpitiya declared 8.32/2.1/7.85 — wrong for this site.
    mean_wind_speed_ms: 7.07
    weibull_a: 7.97
    weibull_k: 2.506
    shear_exponent: 0.14
    data_years: 2020-2024
    data_source: ECMWF_ERA5_2020_2024_DUTCHBAY
  wind:
    ws150_mean_ms: 7.07
    ws150_std_ms: 3.02        # Weibull-derived (A=7.97, k=2.506)
    capacity_factor: 0.2713
    aep_gwh: 133.1
    source_id: OEM_VESTAS_V150_56_PC
    source_type: OEM
  era5:
    latitude: 8.82
    longitude: 79.96
    hub_height_m: 125
    reference:
      mode: fixed
      start_year: 2005
      end_year: 2024
    strict_coverage: true
    output_dir: outputs/era5_cache
    weibull_fit:
      drift_tolerance_pct: 5.0
ppa:
  # INFORMATIONAL ONLY (not read by code). The model is structurally LKR-primary; no
  # Python reads primary_currency. Must equal "LKR" (tests/finance/test_currency_lkr_primary.py).
  # The former tariff_per_kwh/tariff_per_mwh were unread duplicates (and carried the stale
  # lender 20.3, not Mullikulam's tariff) — removed; the tariff lives only in `tariff:`.
  primary_currency: LKR
  ppa_term_years: 20
  tariff_type: fixed
  indexation_start_year: 2
  cpi_annual_pct: 2.0
  equivalent_tariffs_reference:
    usd_per_mwh: 67.7
    eur_per_mwh: 61.5
    cny_per_mwh: 487.0
  offtaker: Ceylon Electricity Board (CEB)
  offtaker_credit_rating: B+ (S&P)
  payment_terms_days: 30
  revenue_guarantee:
    enabled: false
    guarantee_pct: 0.75
    penalty_rate_same_currency: 5.0
tariff:
  # USD bid 3.96 c/kWh (WindForce) carried in LKR at the corrected 2026-Q2 FX:
  # 0.0396 USD/kWh x 333.79 = 13.22 LKR/kWh (was 11.88 = 0.0396 x the stale 300).
  lkr_per_kwh: 13.22
  tariff_type: fixed
  ppa_term_years: 20
fx:
  enabled: true
  mode: deterministic
  base_currency: "USD"
  quote_currency: "LKR"
  rates:
    lkr_per_usd: 333.79
    lkr_per_eur: 330.0    # EUR/LKR not refreshed (USD/LKR is the fetched vintage)
    lkr_per_cny: 41.7     # CNY/LKR not refreshed
    usd_per_eur: 1.1
  # Config-driven FX source (analytics.fx.fx_fetch); FIXED vintage = reproducible.
  source:
    mode: "fixed"
    provider: "open_er_api"
    endpoint: "https://open.er-api.com/v6/latest/USD"
    reference_url: "https://www.cbsl.gov.lk/en/rates-and-indicators/exchange-rates/daily-indicative-usd-spot-exchange-rates"
    pinned_rate: 333.79            # MUST equal start_lkr_per_usd (cross-asserted)
    pinned_as_of: "2026-06-20T00:02:31Z"
    drift_tolerance_pct: 5.0
  start_lkr_per_usd: 333.79  # 2026-Q2 pinned (was a stale 300.0)
  annual_depr: 0.0589  # data-derived LKR depreciation (BIS 2005-2026 long-run, analytics.fx.fx_calibration; was hand-set 3%)
  uncertainty_pct: 0.05
  exposure_summary:
    usd_debt_principal: 82500000
    lkr_revenue_pct: 100.0
    fx_mismatch: Material - requires hedging or sculpted debt service
capex:
  usd_total: 63100000
  capex_per_kw_usd: 1126.79   # 63.1M / 56 MW (was a stale lender 1000)
  # LandBOSSE-decomposed WBS (sums to usd_total 63.1M for this 56 MW lot); was a stale
  # lender 4-line block summing to 150M (!= usd_total). derive_from_breakdown is off.
  breakdown:
    wtg_supply_usd: 43539000
    foundation_usd: 3028800
    erection_usd: 2019200
    collection_system_usd: 2019200
    site_preparation_usd: 1211520
    site_development_usd: 807680
    project_management_usd: 1009600
    grid_connection_usd: 3028800
    substation_usd: 2019200
    development_owners_usd: 2208500
    financing_fees_usd: 1262000
    contingency_usd: 946500
opex:
  # $20/kW-yr x 56 MW = 1.12M. Was a stale lender 3.0M ($54/kW-yr for 56 MW) that
  # contradicted this scenario's own opex_per_kw_yr_usd: 20.0 — re-baselined to the
  # consistent, benchmark-aligned figure (see expected_results below).
  usd_per_year: 1120000
  opex_per_kw_yr_usd: 20.0
  breakdown:
    om_contract_usd: 746666
    insurance_usd: 186667
    land_lease_usd: 112000
    admin_usd: 74667
tax:
  corporate_tax_rate: 0.3
  tax_holiday_route: none
  tax_holiday_years: 0
  tax_holiday_start_year: 1
  depreciation_method: straight_line
  depreciation_years: 5
  depreciation_start_year: 1
  plant_capex_share: 0.8
  plant_depreciation_years: 5
  civil_depreciation_years: 20
  enhanced_capital_allowance_multiple: 1.5
  enhanced_allowance_applies: false
  loss_carryforward_years: 6
  wht_on_interest_to_nonresidents: 0.1
  wht_on_interest_enabled: true
  wht_gross_up: false
  # SL statutory dividend WHT 15% (#81) + capitalize debt IDC into the
  # depreciable tax base (#36/#75). Both bite the equity path only.
  wht_on_dividends: 0.15
  wht_on_dividends_enabled: true
  capitalize_idc_in_depreciable_base: true
  interest_deductibility: true
statutory:
  success_fee_pct: 0.0  # non-statutory levy — not in the SL regime; zeroed (#43)
  env_surcharge_pct: 0.0  # non-statutory levy — not in the SL regime; zeroed (#43)
  social_services_levy_pct: 0.025
risk_adjustment:
  cfads_haircut_pct: 0.1
Financing_Terms:
  debt_ratio: 0.7
  debt_sizing: dual_dscr
  dscr_p99_downside_factor: 0.8
  balloon_treatment: cash_sweep
  tenor_years: 15
  interest_only_years: 2
  amortization_style: auto
  interest_rate_nominal: 0.08
  mix:
    lkr_max: 0.45
    dfi_max: 0.1
    usd_commercial_min: 0.45
  rates:
    lkr_nominal: 0.1339  # UIP-implied: USD 7.5% + 5.89% LKR drift (#3, PR B)
    lkr_min: 0.1339
    dfi_nominal: 0.065
    dfi_min: 0.065
    usd_nominal: 0.075
    usd_commercial_min: 0.075
  target_dscr: 1.3
  min_dscr: 1.2
  min_dscr_covenant: 1.2
  reserves:
    dsra_months: 6
    receivables_guarantee_months: 9
  use_revenue_guarantee: false
  guarantee_revenue_pct: 0.0075
  fees:
    upfront_pct: 0.01
  enforce_hard_covenants: false
returns:
  project_life_years: 20
  project_discount_rate: 0.1
  equity_discount_rate: 0.12
constraints:
  max_debt_ratio: 0.8
  warn_debt_ratio: 0.75
  min_dscr_covenant: 1.3
  target_dscr: 1.35
  warn_dscr: 1.25
  max_balloon_pct: 0.1
  warn_balloon_pct: 0.05
  refinancing:
    enabled: true
    max_refinance_pct: 0.1
    refinance_rate_premium: 0.02
    refinance_tenor_years: 3
    requires_documentation: true
  max_tenor_years: 20
  warn_tenor_years: 18
  max_interest_rate: 0.25
  min_interest_rate: 0.0
  lender_type: DFI
  jurisdiction: Sri Lanka
  fail_on_covenant_breach: false
  fail_on_large_balloon: false
monte_carlo:
  enabled: true
  n_scenarios: 100000
  sampler: lhs
  seed: 42
  weibull_uncertainty_pct: 10.0
  wake_loss_std_pct: 2.0
  availability_std_pct: 1.0
  electrical_loss_std_pct: 0.5
  discount_rate_pct: 8.0
  capex_total_usd: 63100000   # Mullikulam 56 MW lot (was a stale lender 150M)
  revenue_mean_usd: 5271578   # 1759.6M LKR / 333.79 (was a stale lender 50M)
  revenue_std_pct: 10
  cost_mean_usd: 1120000      # = opex.usd_per_year (was a stale lender 3M)
  cost_std_pct: 8
  fx_mean_rate: 333.79  # 2026-Q2 pinned (was 300.0)
  fx_std_pct: 3
  project_life_years: 20
  parameters:
  - name: project.capacity_factor
    low: 0.2442
    high: 0.2984
    distribution: uniform
  - name: tariff.lkr_per_kwh
    low: 10.58
    high: 15.86
    distribution: uniform
  - name: opex.usd_per_year
    low: 784000.0
    high: 1456000.0
    distribution: uniform
  - name: capex.usd_total
    low: 56790000.0
    high: 69410000.0
    distribution: uniform
  - name: fx.start_lkr_per_usd  # centered on the 333.79 pinned vintage (was 300)
    low: 300.0
    high: 367.0
    distribution: uniform
  var_confidence: 0.95
  cvar_confidence: 0.95
  percentiles:
  - 10
  - 25
  - 50
  - 75
  - 90
  min_dscr_covenant: 1.2
  min_llcr_covenant: 1.25
  output_path: outputs/mc_aep_dutchbay_100k.parquet
