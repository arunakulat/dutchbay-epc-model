# ═══════════════════════════════════════════════════════════════════════════════
# DutchBay 150 MW Wind Farm - Canonical Lender Case Configuration
# ═══════════════════════════════════════════════════════════════════════════════
# Version: 3.0 (Sprint 17 - Multi-Currency PPA + Wind Resource Integration)
# Path: scenarios/dutchbay_lendercase_2025Q4.yaml
#
# Usage:
#   python run_full_pipeline_v14.py config=scenarios/dutchbay_lendercase_2025Q4
#
# Changes from v2.7:
#   - Added wind_resource section (Weibull params, air density, ERA5 data)
#   - Added turbine technical specs (cut-in/out, hub height, rotor diameter)
#   - Replaced single tariff with multi-currency PPA structure
#   - Added layout parameters for wake loss validation
#   - Added expected_results for pipeline validation
#   - Unified losses structure (resource.losses + statutory.grid_loss_pct)
# ═══════════════════════════════════════════════════════════════════════════════

project:
  name: "DutchBay Wind Farm"
  location: "Dutch Bay, Kalpitiya, Puttalam District, North Western Province, Sri Lanka"
  capacity_mw: 159.6  # 15 x IEA 10MW (10.638 MW rated)
  capacity_factor: 0.346  # Net P50 CF, 15 x IEA-10MW-198 via wind_resource.bankable_aep (was 0.307 @ 23x6.5)
  degradation: 0.005  # Annual production degradation (0.5%/year for turbine aging)
  life_years: 20  # Project operational life
  cod_year: 2027  # Commercial Operation Date
  developer: "DutchBay Wind Power Pvt Ltd"
  grid_poi: "Puttalam 220kV Substation"
  
  # Tax & regulatory (Sri Lanka BOI)
  boi_approved: false
  boi_agreement_date: '2025-01-15'
  jurisdiction: Sri Lanka
  # Tax inputs are the single source of truth in the `tax:` block (CESSPIT).

# ═════════════════════════════════════════════════════════════════════════════
# TURBINE & WIND RESOURCE (Wind Energy Calculator Inputs)
# ═════════════════════════════════════════════════════════════════════════════
turbine:
  model: "IEA Reference 10MW (198m)"
  n_turbines: 15
  rated_power_mw: 10.6383
  rated_power_kw: 10638
  total_capacity_mw: 159.6
  rotor_diameter_m: 198
  hub_height_m: 150
  cut_in_ms: 3.0
  cut_out_ms: 25.0
  rated_wind_speed_ms: 11.0
  certification_status: "OPEN_REFERENCE"  # IEA Wind Task 37 reference design (not OEM-certified)
  notes: "IEA Wind Task 37 10 MW reference (198 m, 345 W/m2), low-specific-power machine for the 7.85 m/s site. 15 x 10.638 MW = 159.6 MW. Representative open reference (Ct curve), substitutes for a future low-wind 10 MW OEM machine. Supersedes the 23 x EN-171/6.5 (149.5 MW) base; EN-171 kept as a characterization/sensitivity case."

wind_resource:
  # Weibull distribution parameters (for AEP calculation)
  weibull_a: 8.32  # Scale parameter (m/s) - conservative baseline
  weibull_k: 2.1   # Shape parameter
  mean_wind_speed_ms: 7.85  # At hub height (150m)
  shear_exponent: 0.14
  air_density_kgm3: 1.15  # kg/m³ at ~15°C, sea level (tropical)
  air_density_ref_kgm3: 1.225  # Standard air density for power curve
  
  # Data provenance
  data_source: "ECMWF ERA5 Reanalysis"
  data_years: "2020-2024"
  data_confidence: "Medium (5-year ERA5 validated against 1-year met mast)"

layout:
  turbine_spacing_avg_m: 650
  turbine_spacing_avg_D: 3.8  # In rotor diameters (650m / 171m)
  iec_compliant_pairs: 6
  iec_marginal_pairs: 3
  iec_violation_pairs: 6
  layout_orientation: "linear_north_south_coastal"
  coordinates_reference: "WGS84_EPSG4326"
  utm_zone: "44N"

# ═════════════════════════════════════════════════════════════════════════════
# RESOURCE ASSESSMENT & LOSSES
# ═════════════════════════════════════════════════════════════════════════════
resource:
  # Turbine specifications (for backward compatibility)
  turbines:
    count: 15
    rated_power_mw: 10.6383
    total_capacity_mw: 159.6
    model: "IEA Reference 10MW (198m)"
    rotor_diameter_m: 198
    hub_height_m: 150

  # Power curve & AEP calculation
  power_curve:
    source_id: "IEA_REFERENCE_10MW_198_PC"
    source_type: "REFERENCE"
    curve_key: "iea_reference_10mw"   # power_curves.yaml store slug; must match the manifest's curve_key (asserted)
    iec_standard: "IEC 61400-12-1:2022"
    certificate_ref: "IEA Wind Task 37 reference design (open, not OEM-certified)"
    air_density_site_kgm3: 1.15
    air_density_ref_kgm3: 1.225

  aep_summary_path: "tests/mocks/aep_summary_dutchbay_10mw.json"

  # Technical losses (pre-grid). Wake is now MODELLED (PyWake Bastankhah 7.28%),
  # not the old flat placeholder; the stack totals 14.48% (see the AEP summary).
  losses:
    wake_loss_pct: 7.28  # PyWake Bastankhah-Porte-Agel granular wake (15-turbine layout); TurbOPark bound 8.93%
    availability_pct: 97.0  # Contractual availability target
    electrical_loss_pct: 2.0  # Cable + transformer + auxiliary consumption
    curtailment_pct: 2.0  # Grid curtailment (ERA5 stack)
    other_pct: 1.0  # Environmental / icing / blade degradation
  
  # Wind resource (for backward compatibility)
  wind_resource:
    mean_wind_speed_ms: 7.85
    weibull_a: 8.32
    weibull_k: 2.1
    shear_exponent: 0.14
    data_years: "2020-2024"
    data_source: "ECMWF_ERA5_2020_2024_DUTCHBAY"

  # Normalized GIS -> EPC wind interface (#22). Stable handoff contract validated
  # by analytics.wind.wind_interface_schema; consumed by cashflow/metrics.
  wind:
    ws150_mean_ms: 7.85       # Mean hub-height (150 m) wind speed
    ws150_std_ms: 3.69        # Weibull-derived (A=8.32, k=2.1)
    capacity_factor: 0.346    # Net P50 CF (canonical; matches aep_summary)
    aep_gwh: 483.6            # Net P50 AEP, GWh (canonical; matches aep_summary)
    source_id: "IEA_REFERENCE_10MW_198_PC"
    source_type: "REFERENCE"

# ═════════════════════════════════════════════════════════════════════════════
# MULTI-CURRENCY PPA STRUCTURE (NEW: Sprint 17)
# ═════════════════════════════════════════════════════════════════════════════
ppa:
  # Base tariff (PRIMARY revenue currency - drives all wind revenue calculations)
  primary_currency: "LKR"  # Wind revenue calculator reads this field
  tariff_per_kwh: 20.3  # LKR/kWh (primary contract rate)
  tariff_per_mwh: 20300.0  # LKR/MWh (= 20.3 × 1000)
  
  # PPA terms
  ppa_term_years: 20
  tariff_type: "fixed"  # vs "indexed" (CPI-linked) or "merchant"
  indexation_start_year: 2  # Year when CPI indexation begins (if indexed)
  cpi_annual_pct: 2.0  # Annual CPI escalation (if tariff_type=indexed)
  
  # Multi-currency reporting equivalents (REFERENCE ONLY - not used in calculations)
  # FX rates at 2025Q4: 1 USD = 300 LKR, 1 EUR = 330 LKR, 1 CNY = 41.7 LKR
  equivalent_tariffs_reference:
    usd_per_mwh: 67.7   # 20300 ÷ 300 (for lender reports)
    eur_per_mwh: 61.5   # 20300 ÷ 330 (for European sponsors)
    cny_per_mwh: 487.0  # 20300 ÷ 41.7 (for Chinese EPC contractors)
  
  # Off-taker details
  offtaker: "Ceylon Electricity Board (CEB)"
  offtaker_credit_rating: "B+ (S&P)"
  payment_terms_days: 30
  
  # Revenue guarantee (optional)
  revenue_guarantee:
    enabled: false
    guarantee_pct: 0.75  # % of P50 AEP guaranteed
    penalty_rate_same_currency: 5.0  # Penalty in same currency as tariff

# Legacy tariff field (for backward compatibility with old pipeline code)
tariff:
  lkr_per_kwh: 20.3
  tariff_type: fixed
  ppa_term_years: 20

# ═════════════════════════════════════════════════════════════════════════════
# FX INTEGRATION (Multi-Currency Debt + LKR Revenue)
# ═════════════════════════════════════════════════════════════════════════════
fx:
  enabled: true
  mode: "deterministic"  # Base case (vs "monte_carlo")
  
  # FX rates (2025Q4 baseline)
  rates:
    lkr_per_usd: 300.0
    lkr_per_eur: 330.0
    lkr_per_cny: 41.7
    usd_per_eur: 1.10
  
  # FX curve parameters
  start_lkr_per_usd: 300.0
  annual_depr: 0.03  # 3% annual LKR depreciation vs USD
  uncertainty_pct: 0.05  # ±5% FX volatility (for Monte Carlo)
  
  # FX exposure analysis
  exposure_summary:
    usd_debt_principal: 82500000  # USD DFI + Commercial
    lkr_revenue_pct: 100.0  # All revenue in LKR
    fx_mismatch: "Material - requires hedging or sculpted debt service"

# ═════════════════════════════════════════════════════════════════════════════
# CAPEX & OPEX
# ═════════════════════════════════════════════════════════════════════════════
capex:
  usd_total: 159600000  # Base case (all-in EPC + soft costs); 159.6 MW @ $1000/kW
  capex_per_kw_usd: 1000  # 159.6M / 159.6MW (15 x IEA-10MW)
  
  breakdown:
    epc_usd: 140000000  # Turbines + BoP + grid connection
    development_usd: 5000000  # Pre-FID costs
    financing_fees_usd: 3000000  # Commitment + legal + advisory
    contingency_usd: 2000000  # 1.3% contingency

opex:
  usd_per_year: 3000000  # Fixed O&M contract
  opex_per_kw_yr_usd: 20.0  # 3M / 150MW
  
  breakdown:
    om_contract_usd: 2000000  # Full-service O&M
    insurance_usd: 500000  # Property + BI
    land_lease_usd: 300000  # 15 turbine sites
    admin_usd: 200000  # SPV overhead

# ═════════════════════════════════════════════════════════════════════════════
# TAX & STATUTORY
# ═════════════════════════════════════════════════════════════════════════════
tax:
  # Single source of truth for tax inputs (CESSPIT). Current SL regime (post-2025):
  # CIT 30%, no renewable holiday for new IPPs, TLCF 6yr, split straight-line
  # depreciation (plant&machinery 5yr / civils 20yr), interest WHT 10%.
  corporate_tax_rate: 0.30
  tax_holiday_route: none
  tax_holiday_years: 0
  tax_holiday_start_year: 1
  depreciation_method: straight_line
  depreciation_years: 5  # placeholder; the split fields below drive the calc
  depreciation_start_year: 1
  plant_capex_share: 0.80
  plant_depreciation_years: 5  # SL Fourth Sched Class 2 (plant & machinery)
  civil_depreciation_years: 20  # SL Fourth Sched Class 4 (buildings/civils)
  enhanced_capital_allowance_pct: 1.5
  enhanced_allowance_applies: false
  loss_carryforward_years: 6
  wht_on_interest_to_nonresidents: 0.1
  wht_on_interest_enabled: true
  wht_gross_up: false
  interest_deductibility: true

statutory:
  success_fee_pct: 0.01  # PUCSL approval fee
  env_surcharge_pct: 0.005  # Environmental levy
  social_services_levy_pct: 0.025  # SSL on revenue
  grid_loss_pct: 0.02  # Transmission losses (post-meter)

risk_adjustment:
  cfads_haircut_pct: 0.1

# ═════════════════════════════════════════════════════════════════════════════
# MULTI-CURRENCY DEBT STRUCTURE
# ═════════════════════════════════════════════════════════════════════════════
Financing_Terms:
  debt_ratio: 0.7                  # MAX gearing cap; actual gearing auto-solved to target_dscr
  debt_sizing: dual_dscr           # auto-size debt on the real schedule to target_dscr (capped at debt_ratio); robust to AEP (#180)
  dscr_p99_downside_factor: 0.80   # P99 CFADS = 80% of P50 (~P90 AEP) for the dual-DSCR (P50/P99) capacity detail
  # The dual-DSCR sculpt over a fixed tenor leaves an unamortised BALLOON at
  # maturity. balloon_treatment governs how the equity waterfall resolves it
  # (cash_sweep | refinance | bullet | amortize | legacy_ignore). cash_sweep is
  # the prudent-lender default: post-maturity CFADS is trapped to retire the
  # balloon before any equity distribution. NB: this structure carries a ~36%
  # balloon (breaches constraints.max_balloon_pct 10%) — see optimisation work.
  balloon_treatment: cash_sweep
  tenor_years: 15
  interest_only_years: 2
  amortization_style: auto
  interest_rate_nominal: 0.08
  
  # ── Multi-currency debt structure (CANONICAL) ───────────────────────────
  # The engine (finance/debt_v14._solve_mix) sizes total debt via dual_dscr,
  # then splits it by these mix PROPORTIONS at the per-currency rates below.
  # Proportions (not absolute principals) are required because the debt amount
  # is AUTO-SIZED, not fixed. The realised per-tranche principal + IDC are
  # reported in debt_result.principal_by_tranche / idc_by_tranche.
  # NB: a `debt_tranches:` list (absolute principals/per-tranche tenors) is NOT
  # an engine input — plan_debt warns if one is present. Edit mix + rates here.
  mix:
    lkr_max: 0.45              # LKR_Local share (45%)
    dfi_max: 0.1               # USD_DFI concessional share (10%)
    usd_commercial_min: 0.45   # USD_Commercial share (45%)
  rates:
    lkr_nominal: 0.08          # LKR_Local rate (8.0%)
    lkr_min: 0.08
    dfi_nominal: 0.065         # USD_DFI rate (6.5%)
    dfi_min: 0.065
    usd_nominal: 0.075         # USD_Commercial rate (7.5%)
    usd_commercial_min: 0.075
  
  # DSCR targets
  target_dscr: 1.3
  min_dscr: 1.2
  min_dscr_covenant: 1.2
  
  # Reserves
  reserves:
    dsra_months: 6  # Debt Service Reserve Account
    receivables_guarantee_months: 9  # CEB payment risk
  
  use_revenue_guarantee: false
  guarantee_revenue_pct: 0.0075
  
  fees:
    upfront_pct: 0.01
    commitment_pct: 0.01
  
  enforce_hard_covenants: false

# ═════════════════════════════════════════════════════════════════════════════
# LENDER COVENANTS & METRICS
# ═════════════════════════════════════════════════════════════════════════════
metrics:
  llcr_min_covenant: 1.2  # Loan Life Coverage Ratio
  llcr_warn_threshold: 1.25
  llcr_discount_rate: 0.1
  plcr_min_covenant: 1.4  # Project Life Coverage Ratio
  plcr_target: 1.6
  plcr_discount_rate: 0.1
  dscr_min_covenant: 1.2  # Debt Service Coverage Ratio

returns:
  project_life_years: 20
  project_discount_rate: 0.1
  equity_discount_rate: 0.12

constraints:
  max_debt_ratio: 0.8
  warn_debt_ratio: 0.75
  min_dscr_covenant: 1.3
  target_dscr: 1.35
  warn_dscr: 1.25
  max_balloon_pct: 0.1
  warn_balloon_pct: 0.05
  refinancing:
    enabled: true
    max_refinance_pct: 0.1
    refinance_rate_premium: 0.02
    refinance_tenor_years: 3
    requires_documentation: true
  max_tenor_years: 20
  warn_tenor_years: 18
  max_interest_rate: 0.25
  min_interest_rate: 0.0
  lender_type: DFI
  jurisdiction: Sri Lanka
  fail_on_covenant_breach: false
  fail_on_large_balloon: false

# ═════════════════════════════════════════════════════════════════════════════
# MONTE CARLO & SENSITIVITY
# ═════════════════════════════════════════════════════════════════════════════
monte_carlo:
  enabled: true
  n_scenarios: 100000
  sampling_method: lhs  # Latin Hypercube Sampling
  seed: 42
  
  # Wind resource uncertainty (dominant risk driver)
  weibull_uncertainty_pct: 10.0  # ±10% on A and k
  wake_loss_std_pct: 2.0
  availability_std_pct: 1.0
  electrical_loss_std_pct: 0.5
  
  # Legacy scenario parameters (toy model - TO BE DEPRECATED)
  discount_rate_pct: 8.0
  capex_total_usd: 150000000
  revenue_mean_usd: 50000000
  revenue_std_pct: 10
  cost_mean_usd: 3000000
  cost_std_pct: 8
  fx_mean_rate: 300.0
  fx_std_pct: 3
  project_life_years: 20
  
  # Distribution parameters (for pipeline-backed MC).
  # Canonical engine contract (analytics.mc.engine): an explicit LIST of
  # {name, low, high, distribution} where `name` is a dotted config path the
  # pipeline understands. Bounds are the uniform LHS support, derived as
  # base * (1 +/- 2 * relative_std) from the per-driver spreads documented inline
  # (so the wider the declared std, the wider the band). CCCDIR: paths explicit,
  # no implicit name->path mapping. ARCH-01: all values from config.
  parameters:
    - name: project.capacity_factor   # base 0.307, rel_std 0.05 -> +/-10%
      low: 0.2763
      high: 0.3377
      distribution: uniform
    - name: tariff.lkr_per_kwh        # base 20.3, rel_std 0.10 -> +/-20%
      low: 16.24
      high: 24.36
      distribution: uniform
    - name: opex.usd_per_year         # base 3.0e6, rel_std 0.15 -> +/-30%
      low: 2100000.0
      high: 3900000.0
      distribution: uniform
    - name: capex.usd_total           # base 150e6, rel_std 0.08 -> +/-16%
      low: 126000000.0
      high: 174000000.0
      distribution: uniform
    - name: fx.start_lkr_per_usd      # base 300.0, rel_std 0.05 -> +/-10%
      low: 270.0
      high: 330.0
      distribution: uniform
  
  # Output configuration
  var_confidence: 0.95
  cvar_confidence: 0.95
  percentiles: [10, 25, 50, 75, 90]
  min_dscr_covenant: 1.2
  min_llcr_covenant: 1.25
  output_path: "outputs/mc_aep_dutchbay_100k.parquet"

sensitivity:
  ranges:
    capacity_factor:
      low_pct: -0.05
      high_pct: 0.05
    tariff_lkr_per_kwh:
      low_pct: -0.1
      high_pct: 0.1
    opex_usd_per_year:
      low_pct: -0.15
      high_pct: 0.15
    capex_usd_total:
      low_pct: -0.08
      high_pct: 0.08
    grid_loss_pct:
      low_pct: -0.01
      high_pct: 0.03
  analysis:
    tornado_chart_title: DutchBay 150MW - Parameter Sensitivity (Equity IRR)
    dpi: 300

# ═════════════════════════════════════════════════════════════════════════════
# PIPELINE CONFIGURATION
# ═════════════════════════════════════════════════════════════════════════════
pipeline:
  output_dir: "outputs/dutchbay_lendercase_2025Q4"
  seed: 42
  export_scenarios: true
  export_provenance: true

timeline:
  ppa_to_fc_years: 1
  construction_years: 2
  ops_years: 20
  lifetime_years: 22

# ═════════════════════════════════════════════════════════════════════════════
# EXPECTED RESULTS (For Pipeline Validation)
# ═════════════════════════════════════════════════════════════════════════════
expected_results:
  # Wind resource assessment — 15 x IEA Reference 10MW (198m) via
  # wind_resource.bankable_aep: IEC 61400-12-1 density correction (rho 1.15),
  # PyWake Bastankhah granular wake 7.28%, IEC 61400-15-2 P50/P75/P90 uncertainty.
  # Supersedes the 23 x EN-171/6.5 base (402.6 / 322.1 / 0.307).
  net_aep_p50_gwh: 483.6  # 14.48% total losses (modelled wake 7.28%)
  net_aep_p90_gwh: 421.2  # IEC 61400-15-2 build-up (1-yr; P90/P50 0.871), was crude 0.800 haircut
  capacity_factor: 0.346

  # Revenue (LKR-basis calculations, EUR-equivalent for reference)
  annual_revenue_p50_m_lkr: 9817.1  # 483.6 GWh × 20.3 LKR/kWh
  annual_revenue_p50_m_eur: 29.7  # Reference: 483.6 GWh × 61.5 EUR/MWh
  revenue_20yr_undiscounted_m_lkr: 196373.0  # With degradation + CPI (scaled by 483.6/402.6)
  
  # Financial metrics — the HONEST engine output (the canonical v14 pipeline,
  # build-up WACC driving the project discount) for the 15 x IEA-10MW re-model.
  # Binding validation targets: tests/finance/test_lendercase_expected_results.py
  # asserts the live pipeline matches them, so they cannot silently drift.
  # The +20% AEP (483.6 vs 402.6) at only +6.7% capacity turns the prior knife-edge,
  # equity-negative EN-171 base (0.0835/0.0131/$1.18M) into a comfortably bankable,
  # equity-positive case.
  project_irr: 0.1112       # clears WACC (~7.74%) comfortably
  equity_irr: 0.0621        # equity now positive (~6.2%)
  project_npv_m_usd: 27.36  # build-up WACC ~7.74% discount
  min_dscr: 1.30            # dual-DSCR sculpt pins min at the covenant target
  avg_dscr: 1.39
  llcr: 1.14
  plcr: 1.21

# ═════════════════════════════════════════════════════════════════════════════
# METADATA
# ═════════════════════════════════════════════════════════════════════════════
metadata:
  version: '3.0'
  last_updated: '2025-12-23'
  author: DutchBay V14 Financial Modeling Team
  review_status: Draft - Pending Board Approval
  assumptions_source: 'BOI Agreement Ref: BOI/2025/REN/001234'
  sprint: 'Sprint 17 - Multi-Currency PPA + Wind Resource Integration'
  gwtf_compliance: 'All 51 rules audited + wind energy calculator integration'
  
  changes:
    - 'v3.0: Added multi-currency PPA structure (LKR/USD/EUR/CNY)'
    - 'v3.0: Integrated wind resource parameters (Weibull, air density, ERA5)'
    - 'v3.0: Added turbine technical specs for energy calculator'
    - 'v3.0: Added layout parameters for wake loss validation'
    - 'v3.0: Unified losses structure across resource + statutory'
    - 'v3.0: Added expected_results for end-to-end validation'
    - 'v2.7: Enabled FX integration for multi-currency debt'
    - 'v2.7: Added debt_tranches structure'
    - 'v3.1: Removed decorative Financing_Terms.debt_tranches (never an engine input); mix + rates are canonical (plan_debt warns if re-added)'

discount_rate: 0.12

wacc:
  # The discount rate is DERIVED from a build-up WACC (no longer hardcoded/decorative):
  #   after-tax WACC = (1-g)*ke + g*(blended kd + fees)*(1-tax)
  # using the ACTUAL sized gearing (~62.5%) and blended rate (~7.63%) from the debt
  # engine (Financing_Terms.mix+rates). drives_discount_rate routes the WACC to the
  # project-NPV discount and cost_of_equity to the equity-NPV discount.
  mode: build_up
  drives_discount_rate: true
  cost_of_equity: 0.12   # USD house base (~ US rf 4.5% + Sri Lanka country risk 3.5% + equity 4.0%).
                         # Post-default Sri Lanka ke is contested — project NPV is on a knife-edge
                         # vs project IRR 8.35%; see the ke-band (12–20%) sensitivity.
  prudential_spread_bps: 100
  description: "Build-up WACC drives the discount rate (replaces a decorative fixed 12%)."
