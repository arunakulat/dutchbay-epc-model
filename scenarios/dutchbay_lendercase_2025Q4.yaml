# EXPECTED RESULTS (For Pipeline Validation)
# ═════════════════════════════════════════════════════════════════════════════
expected_results:
  # Wind resource assessment — 15 x IEA Reference 10MW (198m) via
  # wind_resource.bankable_aep: IEC 61400-12-1 density correction (rho 1.15),
  # PyWake Bastankhah granular wake 7.28%, IEC 61400-15-2 P50/P75/P90 uncertainty.
  # (IEC 61400-15-2 = the Energy Yield Assessment loss/uncertainty part, still DRAFT
  #  as of 2025 — NOT the published -15-1:2025, which is the separate site-suitability
  #  part. Knobs to vary it: resource.uncertainty.p50_haircut_pct / .correlation.)
  # Supersedes the 23 x EN-171/6.5 base (402.6 / 322.1 / 0.307).
  net_aep_p50_gwh: 464.3  # ERA5-fitted Weibull, post 2% over-prediction haircut (modelled 473.8); 14.48% total losses
  net_aep_p90_gwh: 404.4  # IEC 61400-15-2 build-up (1-yr; P90/P50 0.871), post haircut
  capacity_factor: 0.332

  # Revenue (LKR-basis calculations, EUR-equivalent for reference)
  annual_revenue_p50_m_lkr: 9618.1  # 473.8 GWh × 20.3 LKR/kWh
  annual_revenue_p50_m_eur: 29.1  # Reference: 473.8 GWh × 61.5 EUR/MWh
  revenue_20yr_undiscounted_m_lkr: 183553.8  # With 0.5%/yr degradation (M3e); flat-nominal LKR, NO CPI/tariff escalation (tariff_type=fixed)
  
  # Financial metrics — the HONEST engine output (the canonical v14 pipeline,
  # build-up WACC driving the project discount) for the 15 x IEA-10MW re-model.
  # Binding validation targets: tests/finance/test_lendercase_expected_results.py
  # asserts the live pipeline matches them, so they cannot silently drift.
  # HONEST after the 2026 correction sequence: (1) FX 300 -> 333.79; (2) the ERA5-fitted
  # Weibull re-baseline (declared A=8.32/k=2.1 -> fitted 8.199/2.665, AEP 483.6 -> 473.8 GWh);
  # (3) the 2026-06 project-discounting fix (audit finding 2.0): operating year 1 had been
  # discounted at t=0, ignoring the 2-year construction lag, pulling the operating stream
  # forward one period (fixed -> project IRR 5.43%); (4) the 2026-06 DEGRADATION re-baseline
  # (`project.degradation` 0.005 was read as 0.005%/yr ~ zero; corrected to honest 0.5%/yr
  # aging -> project IRR 5.43% -> 5.05%), and the interest-tax-shield re-baseline that lifted
  # equity IRR to +2.42%; (5) the 2026-06-28 FX-DRIFT re-baseline (fx.annual_depr 3% -> 5.89%,
  # data-derived BIS 2005-2026 long-run LKR depreciation): project IRR 5.05% -> 2.75%, equity
  # IRR +2.42% -> -0.46%, NPV -$32.3M -> -$53.3M; (6) the 2026-06-28 AEP OVER-PREDICTION
  # HAIRCUT (2.0%, resource.uncertainty.p50_haircut_pct): modelled net P50 473.8 -> bankable
  # 464.3 GWh (CF 0.339 -> 0.332), corroborated by the Envision EN220 EIA P50 464.5 (the OEM's
  # own pre-construction EYA — bounds model-vs-EYA drift, not EYA-vs-operations bias; #654);
  # and (7) the 2026-06-28 PR-A group-C #36 tax/levy re-baseline: remove the non-statutory
  # success-fee/env-surcharge levies (#43, +CFADS ~1.5% -> project IRR 2.50% -> 2.68%, NPV
  # -$56.1M -> -$54.0M), add the SL 15% dividend WHT (#81) and capitalize debt IDC into the
  # depreciable base (#36/#75) — both equity-path only, netting equity IRR -1.00% -> -1.93%
  # (the dividend WHT dominates the IDC shield gain); and (8) the 2026-06-28 PR-B group-C #3
  # UIP LKR DEBT RATE: Financing_Terms.rates.lkr 8% -> UIP-implied 13.39% (USD 7.5% + the same
  # 5.89% data-derived LKR drift) — the 8% implied a concessional facility; this is the
  # market-rate assumption (pending a real LKR term-sheet). projIRR UNCHANGED (unlevered); the
  # costlier LKR tranche lifts WACC 8.11% -> 9.83%, deepens NPV -$54.0M -> -$65.5M, takes equity
  # IRR -1.93% -> -4.86%, and de-levers the DSCR-solved gearing 0.588 -> ~0.45.
  # Net current canonical: project IRR 2.68% (BELOW the ~9.83% WACC), equity IRR -4.86% (NEGATIVE),
  # NPV -$65.5M, DSCR-solved gearing ~0.45. The project is value-destructive, honestly so.
  project_irr: 0.027       # UNLEVERED (shield-free) — unchanged by the debt-rate change; << WACC
  equity_irr: -0.049       # NEGATIVE. Chain: +0.0242 (interest shield) -> -0.0046 (FX-drift) ->
                            # -0.0100 (2% AEP haircut) -> -0.0193 (PR-A dividend WHT + IDC) ->
                            # -0.0486 (PR-B UIP LKR debt rate 13.39%). The flat-nominal-LKR tariff
                            # cannot clear equity. (Set tax.interest_deductibility: false to recover
                            # the unlevered case.) MOIC < 1.
  project_npv_m_usd: -65.5 # discount at build-up WACC ~9.83%. NPV -32.34M -> -53.29M (FX) -> -56.1M
                            # (AEP) -> -54.0M (PR-A levy removal) -> -65.5M (PR-B UIP LKR rate, WACC up).
  min_dscr: 1.30            # dual-DSCR sculpt pins min at the covenant target
  avg_dscr: 1.4
  llcr: 1.30
  plcr: 1.35

