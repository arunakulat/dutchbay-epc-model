# Assumption evidence register (#C5, RPT-2): where each MATERIAL assumption came from, as of when,
# and how strong the source is. Pure detector via analytics.evidence_register — declaring these
# changes NO computed number; it surfaces provenance for the report's Evidence Register section and
# the deepened Assumptions Register. Tiers (strongest->weakest): measured, contracted, vendor_quote,
# benchmark, derived, assumption, placeholder. enforce/require_complete/min_tier inherit from
# config/defaults.yaml (report-only, non-blocking). Honest by design: the flat 20.3 LKR tariff and
# the indicative debt terms are `assumption` tier (not yet executed), matching the development
# readiness register below.
evidence_register:
  entries:
    tariff:
      source: "CEB standardized PPA (BOO, 20-yr, flat LKR/kWh, no escalation/FX-index)"
      as_of: "2025"
      tier: assumption
      note: "20.3 LKR/kWh is the modelled flat rate; the standardized PPA template carries no filled tariff (PPA not yet executed)."
    capex:
      source: "Bottom-up WBS (NREL SAM/LandBOSSE), $/kW anchored to the IRENA 2024 onshore benchmark ($1,041/kW); AACE Class 3"
      as_of: "2026"
      tier: benchmark
      note: "$1,000/kW; cross-checked vs the SINOHYDRO Mannar EPC quote (~$889/kW) and the Envision Dutch Bay EIA (~$1,420/kW). Not derived from this project's EIA."
    opex:
      source: "Full-service O&M contract + insurance/land-lease/admin build-up ($20/kW-yr, IRENA RPGC 2024 / NREL ATB 2024-2025 onshore benchmark)"
      as_of: "2026"
      tier: benchmark
      note: "ATB vintage recorded 2026-07-02 (#620): the NREL side of the O&M benchmark refers to the ATB 2024/2025 land-based-wind releases; figure unchanged."
    capacity_factor:
      source: "ERA5-fitted Weibull -> PyWake wake -> power-curve -> AEP chain, post a 2% pre-construction over-prediction haircut (net P50 CF 0.332)"
      as_of: "2026"
      tier: derived
      note: "Corroborated by the Envision EN220/10.0 EYA (P50 464.5 GWh, within ~0.04%)."
    fx:
      source: "USD/LKR 333.79 spot, 2026-Q2 pinned vintage (CBSL anchor / FRED DEXSLUS backbone, BIS XRU cross-check)"
      as_of: "2026-06"
      tier: measured
    debt_terms:
      source: "Indicative lender terms: 15-yr tenor; per-tranche USD 7.5% commercial / 6.5% DFI + UIP-implied LKR 13.39% (blended kd ~7.63%); DSCR-sculpted gearing (~0.45 to the 1.30x floor)"
      as_of: "2025"
      tier: assumption
      note: "No executed term sheet (financing uncommitted). Financing_Terms.interest_rate_nominal 8% is capacity-metadata only; the schedule amortises on the per-tranche rates above. Cross-check (NREL ATB 2024 financial cases, recorded 2026-07-02): P50 DSCR ~1.25x contracted solar / ~1.3-1.4x contracted wind at a ~2.5% real rate — the modelled 1.30x floor sits within the contracted-wind band."
    degradation:
      source: "0.5%/yr turbine performance degradation (industry-standard onshore wind aging)"
      as_of: "2026"
      tier: benchmark
    inflation:
      source: "No explicit USD/CPI cost escalation applied — cost stack held at 2026 USD vintage (opex flat, tariff flat-nominal-LKR); LKR cost erosion enters only via fx.annual_depr (5.89%/yr)"
      as_of: "2026"
      tier: assumption
      note: "cpi_annual_pct 2.0 is declared but gated to tariff_type=indexed; this scenario is tariff_type=fixed, so it is inert (no escalation reaches the engine)."
    tax:
      source: "Sri Lanka Inland Revenue Act, IMF-reformed 2024-26: CIT 30%, dividend WHT 15%, renewable holiday removed, TLCF 6 yr"
      as_of: "2025"
      tier: benchmark
    discount_rate:
      source: "~9.83% build-up WACC from the modelled capital structure (project discount 10% / equity 12%)"
      as_of: "2026"
      tier: derived
    climate_risk:
      source: "Analyst climate-risk screen in the lender risk register (TCFD physical: resource/curtailment; transition: regulatory/tariff). No standalone EP4 Climate Change Risk Assessment (CCRA) commissioned yet."
      as_of: "2026"
      tier: assumption
      note: "Honest tier: this is documented analyst judgement, not a formal EP4-mandated CCRA. A financed run should retire this to a commissioned CCRA (contracted/vendor_quote tier)."

# Development-readiness / E&S status register (#C11). Per-workstream R/A/G to financial
# close; validated softly by analytics.development_readiness (no-op on the economics). An
# honest picture: ESIA is final, but the PPA/EPC/grid are mid-development and financing is
# unsecured at the value-destructive flat-LKR tariff — overall rolls up to RED.
development_readiness:
  items:
    environmental_social:
      status: green
      note: "Final EIA approved (Envision, Sep-2025); E&S management plan in place."
    land:
      status: amber
      note: "Site identified; acquisition / lease agreements in progress."
    permits:
      status: amber
      note: "Generation licence + construction approvals under application."
    grid_connection:
      status: amber
      note: "220kV evacuation line is a separate CEB-funded project, under development."
    ppa:
      status: amber
      note: "CEB standardized PPA template; tariff not yet executed."
    epc:
      status: amber
      note: "SINOHYDRO bottom-up EPC quote received; contract not yet awarded."
    financing:
      status: red
      note: "Blended-finance case; equity IRR negative at the flat-LKR tariff — debt+equity not committed."

wacc:
  # The discount rate is DERIVED from a build-up WACC (no longer hardcoded/decorative):
  #   after-tax WACC = (1-g)*ke + g*(blended kd + fees)*(1-tax)
  # using the ACTUAL sized gearing and blended rate (~7.63%) from the debt
  # engine (Financing_Terms.mix+rates). drives_discount_rate routes the WACC to the
  # project-NPV discount and cost_of_equity to the equity-NPV discount.
  mode: build_up
  drives_discount_rate: true
  cost_of_equity: 0.12   # USD house base (~ US rf 4.5% + Sri Lanka country risk 3.5% + equity 4.0%).
                         # Post-default Sri Lanka ke is contested, but it is not the binding issue:
                         # at the flat-LKR tariff the project IRR (~2.75%) sits well below BOTH the
                         # build-up WACC (~8.10%) and this 12% ke, so the deal is value-destructive
                         # (negative equity NPV), not on a knife-edge; the ke-band (12–20%)
                         # sensitivity only deepens the shortfall.
  prudential_spread_bps: 100
  description: "Build-up WACC drives the discount rate (replaces a decorative fixed 12%)."
