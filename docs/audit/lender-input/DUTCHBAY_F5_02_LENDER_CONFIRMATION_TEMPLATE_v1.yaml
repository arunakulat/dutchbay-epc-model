schema_version: dutchbay.f5_02_lender_confirmation.v1
document_control:
  document_id: DUTCHBAY-F5-02-LENDER-CONFIRMATION-v1
  project: DutchBay wind project
  purpose: transaction_evidence_questionnaire_only
  confidentiality: confidential_lender_and_transaction_team
  release_status: HOLD
  canonical_model_input_authorized: false
  prepared_date: "2026-08-24"
  evidence_cutoff: null
  supersedes: null
  related_finding: P2-F5-02
  related_issue: 1110
  requirements_register:
    title: F5-02 Transaction-Evidence, Legal-Currency and Repayment Requirements Register
    evidence_cutoff: "2026-08-18"
    sha256: 7f3199867ae6aaae2e7365b0cb15fe7ca81b3348060e9ac443622fbc231a9416
    requirement_count: 53
  instructions:
    - Duplicate the facility template for every facility and tranche; do not combine unlike tranches.
    - Use only unknown, provisional, confirmed, not_applicable, or conflicted as field status.
    - Confirmed and not_applicable require authenticated evidence IDs plus exact clause and page references.
    - Provisional must identify its non-binding source and expiry or confirmation condition.
    - Conflicted must identify every conflicting source and the required resolution owner.
    - Unknown is a valid disclosure and must never be replaced by an analyst default.
    - Do not infer currency from a lender class, tranche name, account location, tariff, or reporting currency.
    - This file is not a scenario YAML and must not be ingested as canonical model configuration.
    - Do not alter repository_owned_controls; the inbound validator rejects any change.
    - Completed returns and cited evidence are confidential and must never be committed to the public repository.
    - Complete document_control.evidence_cutoff before any closure-candidate review.
    - F5-01 and F5-02 remain separate; do not combine or net their financial effects.

field_status_protocol:
  allowed:
    - unknown
    - provisional
    - confirmed
    - not_applicable
    - conflicted
  confirmed_requires:
    - evidence_id
    - exact_clause
    - exact_page
    - respondent_authority
  not_applicable_requires:
    - evidence_id
    - exact_clause
    - exact_page
    - reason
  prohibited:
    - inferred_from_model_label
    - inferred_from_lender_nationality
    - inferred_from_tariff_currency
    - inferred_from_reporting_currency
    - analyst_default_promoted_to_fact
    - synthetic_term_sheet_promoted_to_transaction_evidence

response_contract:
  requirement_record_required_fields:
    - requirement_id
    - status
    - value
    - evidence_refs
    - claim_citation_ids
    - comment
  evidence_refs: list_of_evidence_catalog_ids
  claim_citation_ids: list_of_claim_citation_ids
  field_level_citation_required_fields:
    - citation_id
    - requirement_id
    - facility_id
    - evidence_id
    - exact_page
    - exact_section
    - exact_clause
    - extracted_value_or_text
    - respondent_name
    - respondent_role
    - respondent_authority_reference
    - not_applicable_reason
  date_format: quoted_yyyy_mm_dd_string
  currency_format: iso_4217_alpha_3
  currency_code_list:
    maintenance_agency: SIX Financial Information AG
    list: ISO-4217 List One Current Currency and Funds
    source_url: https://www.six-group.com/dam/download/financial-information/data-center/iso-currrency/lists/list-one.xml
    cutoff: "2026-08-24"
    retained_source_sha256: 838dfb991648cf36df939edd5fe3811737962b75a32252847d239cedd1e291c9
    prohibited_non_transactional_codes:
      - XTS
      - XXX
  monetary_value_format:
    amount_decimal_string: null
    currency: null
    unit_scale: base_units
  rate_value_formats:
    rate_pct_decimal_string: null
    margin_bps_decimal_string: null
  confirmed_evidence_eligibility:
    execution_status:
      - executed_and_effective
      - signed_and_current
      - certified_current
      - official_current
      - authenticated_current
    evidence_tier:
      - tier_1
      - tier_2
      - tier_3
      - tier_4
      - tier_5
      - tier_6
      - tier_7
    source_form:
      - verified_executed_original
      - authenticated_data_room_copy
      - certified_true_copy
      - official_publication_verified
      - issuer_confirmation
    authentication_method:
      - signature_and_effectiveness_verified
      - custodian_hash_and_original_verified
      - certified_copy_verified
      - official_source_verified
      - issuer_direct_confirmation
    reviewer_independence:
      - independent
    review_disposition:
      - accepted
      - accepted_with_qualifications
  closure_candidate_requires_private_ingress_manifest: true
  prohibition: Do not enter bare unlabeled monetary amounts or rates.

privacy_and_return_handling:
  completed_return_public_commit_allowed: false
  completed_return_storage: private_access_controlled_evidence_store_only
  public_repository_retention: blank_template_validator_and_redacted_receipt_only
  validator_private_path_transport: environment_only_not_hydra_override
  generated_hydra_logs_and_config_allowed: false
  blank_private_ingress_manifest_template_public_commit_allowed: true
  completed_private_ingress_manifest_public_commit_allowed: false
  permitted_public_receipt_fields:
